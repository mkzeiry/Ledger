function renderPieChart(slices, T, selectedLabel, centerLabel, centerValue, tapAction, tapDataKey) {
  var size = 240, rOuter = 104, rInner = rOuter*0.55, cx = size/2, cy = size/2;
  var total = slices.reduce(function(s,x){ return s+x.value; }, 0);
  if (total <= 0) return "";
  var angle = -Math.PI/2;
  var paths = "";
  slices.forEach(function(sl, i){
    var frac = sl.value/total;
    var sweep = frac * Math.PI * 2;
    var end = angle + sweep;
    var color = sl.color || PIE_COLORS[i % PIE_COLORS.length];
    var isSel = selectedLabel != null && sl.label === selectedLabel;
    var op = (selectedLabel != null && !isSel) ? ' opacity="0.3"' : '';
    var tap = (tapAction === "none") ? '' : (' class="chart-hit" data-action="'+(tapAction||"filter-analysis-category")+'" data-'+(tapDataKey||"cat")+'="'+esc(sl.label)+'"');
    var d;
    if (frac >= 0.9999) {
      // A single category holding 100%: draw the ring as outer circle minus
      // inner circle via evenodd, since there's no adjoining slice to arc against.
      d = 'M '+(cx+rOuter)+' '+cy+' A '+rOuter+' '+rOuter+' 0 1 1 '+(cx-rOuter)+' '+cy+' A '+rOuter+' '+rOuter+' 0 1 1 '+(cx+rOuter)+' '+cy+' Z'
        + ' M '+(cx+rInner)+' '+cy+' A '+rInner+' '+rInner+' 0 1 0 '+(cx-rInner)+' '+cy+' A '+rInner+' '+rInner+' 0 1 0 '+(cx+rInner)+' '+cy+' Z';
      paths += '<path d="'+d+'" fill="'+color+'" fill-rule="evenodd"'+op+tap+'/>';
    } else {
      var ox1 = cx + rOuter*Math.cos(angle), oy1 = cy + rOuter*Math.sin(angle);
      var ox2 = cx + rOuter*Math.cos(end),   oy2 = cy + rOuter*Math.sin(end);
      var ix1 = cx + rInner*Math.cos(end),   iy1 = cy + rInner*Math.sin(end);
      var ix2 = cx + rInner*Math.cos(angle), iy2 = cy + rInner*Math.sin(angle);
      var large = sweep > Math.PI ? 1 : 0;
      d = 'M '+ox1+' '+oy1+' A '+rOuter+' '+rOuter+' 0 '+large+' 1 '+ox2+' '+oy2+' L '+ix1+' '+iy1+' A '+rInner+' '+rInner+' 0 '+large+' 0 '+ix2+' '+iy2+' Z';
      paths += '<path d="'+d+'" fill="'+color+'" stroke="'+T.card+'" stroke-width="3.5" stroke-linejoin="round"'+op+tap+'/>';
    }
    angle = end;
  });
  var selSlice = selectedLabel != null ? slices.filter(function(s){ return s.label===selectedLabel; })[0] : null;
  var nameRaw = selSlice ? selSlice.label : (centerLabel || "All");
  var name = nameRaw.length > 16 ? nameRaw.slice(0,15)+"…" : nameRaw;
  var valueForCenter = selSlice ? selSlice.value : (centerValue || 0);
  var centerSvg = '<text x="'+cx+'" y="'+(cy-8)+'" font-size="15" fill="'+T.textMuted+'" text-anchor="middle">'+esc(name)+'</text>'
    + '<text x="'+cx+'" y="'+(cy+21)+'" font-size="22" font-weight="700" fill="'+T.text+'" text-anchor="middle" font-family="var(--f-num)">'+fmt(Math.round(valueForCenter),0)+' AED</text>';
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+paths+centerSvg+'</svg>';
}

function renderBarChart(items, T) {
  var w = 340, h = 140, padL = 30, padR = 8, padT = 10, padB = 20;
  var maxVal = Math.max.apply(null, items.map(function(i){ return Math.max(i.spent, i.target); }).concat([1]));
  var plotW = w-padL-padR, plotH = h-padT-padB;
  var n = items.length;
  var slot = plotW/n;
  var barW = Math.min(24, slot*0.55);
  function y(v){ return padT + plotH - (Math.min(v,maxVal)/maxVal)*plotH; }
  var bars = items.map(function(it,i){
    var cx = padL + slot*i + slot/2;
    var barTopY = y(it.spent);
    var barH = Math.max(0, plotH - (barTopY-padT));
    var color = it.spent <= it.target ? T.positive : T.rust;
    var targetY = y(it.target);
    return '<rect x="'+(cx-barW/2)+'" y="'+barTopY+'" width="'+barW+'" height="'+barH+'" fill="'+color+'" rx="2"/>'
      + '<line x1="'+(cx-barW/2-2)+'" x2="'+(cx+barW/2+2)+'" y1="'+targetY+'" y2="'+targetY+'" stroke="'+T.textMuted+'" stroke-dasharray="2,2"/>'
      + '<text x="'+cx+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'" text-anchor="middle">'+esc(it.label)+'</text>';
  }).join("");
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'">'
    + '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="'+T.hairline+'"/>'
    + bars + '</svg>';
}

/* Generic bucketed bar chart: one bar per bucket, value from getValue(), color
   from getColor(bucket, value). Bars can go negative (drawn below a zero line)
   which the saved-per-period chart needs. Value labels are drawn above/below
   each bar (rounded, no decimals) as long as bars are wide enough to fit them
   without overlapping; refLine (optional) draws a labelled dashed marker, e.g.
   the daily budget. Buckets carry their own `label`, so the same chart works
   whether they're days or months. */
function renderDailyBarChart(buckets, getValue, getColor, T, refLine, selectedKey, chartId) {
  if (!buckets.length) return '<div class="muted" style="font-size:12px;">No data in this period.</div>';
  var w = 340, h = 156, padL = 30, padR = 8, padB = 20;
  var n = buckets.length;
  var plotW = w-padL-padR;
  var slot = plotW/n;
  var barW = Math.max(1, Math.min(20, slot*0.7));
  /* Horizontal labels need real width to read; below that, rotate them
     vertical so a value is still visible even at daily-for-a-month density —
     hiding it outright was the old behavior, but a label you have to tap to
     see isn't a label. Vertical labels get extra top padding so they don't
     clip against the chart's edge above a tall bar. */
  var labelMode = slot >= 20 ? "h" : (slot >= 7 ? "v" : "none");
  var padT = labelMode === "v" ? 40 : 18;
  var values = buckets.map(getValue);
  var maxVal = Math.max.apply(null, values.concat([0, refLine==null?0:refLine]));
  var minVal = Math.min.apply(null, values.concat([0]));
  var range = (maxVal - minVal) || 1;
  var plotH = h-padT-padB;
  function y(v){ return padT + plotH - ((v-minVal)/range)*plotH; }
  var zeroY = y(0);
  /* Each column gets a full-height transparent hit rect so thin bars are still
     an easy tap target — the bar itself is often only a few pixels wide. */
  var bars = buckets.map(function(b,i){
    var v = getValue(b);
    var cx = padL + slot*i + slot/2;
    var top = v>=0 ? y(v) : zeroY;
    var barH = Math.max(0.5, Math.abs(y(v)-zeroY));
    var hitKey = (chartId||"c")+"|"+b.key;
    var isSel = selectedKey != null && hitKey === selectedKey;
    var dim = (selectedKey != null && !isSel) ? ' opacity="0.38"' : '';
    var svg = '<rect x="'+(cx-barW/2)+'" y="'+top+'" width="'+barW+'" height="'+barH+'" fill="'+getColor(b,v)+'" rx="2"'+dim+'/>';
    if (isSel) {
      svg += '<rect x="'+(cx-barW/2-1.5)+'" y="'+(top-1.5)+'" width="'+(barW+3)+'" height="'+(barH+3)+'" fill="none" stroke="'+T.text+'" stroke-width="1.5" rx="3"/>';
    }
    if (labelMode !== "none" && Math.round(v) !== 0) {
      var roundedV = Math.round(v);
      var labelStr = roundedV < 0 ? ("−"+fmt(Math.abs(roundedV),0)) : fmt(roundedV,0);
      var labelFill = isSel ? T.text : T.textMuted;
      if (labelMode === "h") {
        var labelY = v>=0 ? Math.max(9, top-3) : (top+barH+9);
        svg += '<text x="'+cx+'" y="'+labelY+'" font-size="8" fill="'+labelFill+'" text-anchor="middle">'+labelStr+'</text>';
      } else {
        // Vertical label: reads bottom-to-top above a positive bar, or
        // top-to-bottom below a negative one, so it never overlaps the bar.
        if (v>=0) {
          svg += '<text x="0" y="0" font-size="7" fill="'+labelFill+'" text-anchor="start" transform="translate('+cx+','+Math.max(10,top-3)+') rotate(-90)">'+labelStr+'</text>';
        } else {
          svg += '<text x="0" y="0" font-size="7" fill="'+labelFill+'" text-anchor="start" transform="translate('+cx+','+(top+barH+3)+') rotate(90)">'+labelStr+'</text>';
        }
      }
    }
    svg += '<rect class="chart-hit" data-action="select-bucket" data-key="'+esc(hitKey)+'" x="'+(padL+slot*i)+'" y="'+padT+'" width="'+slot+'" height="'+plotH+'" fill="transparent"/>';
    return svg;
  }).join("");
  var refSvg = "";
  if (refLine != null) {
    var ry = y(refLine);
    refSvg = '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+ry+'" y2="'+ry+'" stroke="'+T.textMuted+'" stroke-dasharray="3,3"/>'
      + '<text x="2" y="'+(ry+3)+'" font-size="8" fill="'+T.textMuted+'">'+fmt(Math.round(refLine),0)+'</text>';
  }
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'">'
    + refSvg
    + '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+zeroY+'" y2="'+zeroY+'" stroke="'+T.hairline+'"/>'
    + bars
    + '<text x="'+padL+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'">'+esc(buckets[0].label)+'</text>'
    + '<text x="'+(w-padR)+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'" text-anchor="end">'+esc(buckets[buckets.length-1].label)+'</text>'
    + '</svg>';
}

/* Shared by renderForecastChart and wireForecastChart, mirroring
   balanceChartGeom's role for the Home page chart. */
function forecastChartGeom(rows, totalDays, target, projectedSpend, compareValues, pastDays) {
  var w=340, h=190, padL=44, padR=8, padT=24, padB=20;
  var plotW=w-padL-padR, plotH=h-padT-padB;
  var n = Math.max(totalDays, 2);
  function xAt(i){ return padL + (i/(n-1))*plotW; }
  var actualVals = []; var acc = 0;
  rows.forEach(function(r){ acc += r.spent; actualVals.push(acc); });
  var compareMax = (compareValues && compareValues.length) ? Math.max.apply(null, compareValues) : 0;
  var maxY = Math.max(target, projectedSpend, actualVals.length ? Math.max.apply(null, actualVals) : 0, compareMax, 1);
  function yAt(v){ return padT + plotH - (v/maxY)*plotH; }
  var lastIdx = actualVals.length - 1;
  var lastVal = actualVals.length ? actualVals[actualVals.length-1] : 0;
  /* knownIdx/knownVal mark the last FULLY COMPLETE day — where the dotted
     projection actually starts from, since today (if it's the last row)
     isn't complete yet and shouldn't be treated as a settled point. On a
     period's first day there is no complete day yet, so this anchors to
     the very start of the chart at 0. */
  var pd = pastDays || 0;
  var knownIdx = pd > 0 ? pd - 1 : 0;
  var knownVal = pd > 0 ? actualVals[pd-1] : 0;
  return { w:w, h:h, padL:padL, padR:padR, padT:padT, padB:padB, plotW:plotW, plotH:plotH,
           n:n, xAt:xAt, yAt:yAt, maxY:maxY, actualVals:actualVals, lastIdx:lastIdx, lastVal:lastVal,
           knownIdx:knownIdx, knownVal:knownVal };
}
/* Cumulative value at any index along the chart, actual portion or
   interpolated along the straight projected segment beyond it — lets the
   scrub tooltip report a sensible number no matter where on the axis the
   finger lands. */
function forecastValueAt(g, idx, projectedSpend) {
  if (idx <= g.lastIdx && g.actualVals.length) return g.actualVals[Math.max(0,idx)];
  if (g.n-1 === g.knownIdx) return g.knownVal;
  var frac = (idx - g.knownIdx) / ((g.n-1) - g.knownIdx);
  return g.knownVal + (projectedSpend - g.knownVal) * frac;
}

/* Cumulative spend for the elapsed portion of a period (smooth green curve),
   continuing as a straight projected line from today's actual total up to the
   forecasted end-of-period total — reusing the same avg-daily-pace math as
   the Home page's Forecast card, so the two numbers never disagree. A flat
   projection (as some budget apps show) would imply spending stops entirely;
   a straight line to the real forecast total is the honest version of the
   same picture. */
function renderForecastChart(rows, totalDays, target, projectedSpend, T, refLabel, compareValues, pastDays, hasForecast) {
  var g = forecastChartGeom(rows, totalDays, target, projectedSpend, compareValues, pastDays);
  var w=g.w, h=g.h, padL=g.padL, padR=g.padR, padT=g.padT, padB=g.padB, plotW=g.plotW, plotH=g.plotH, n=g.n;
  var xAt=g.xAt, yAt=g.yAt, maxY=g.maxY, actualVals=g.actualVals, lastIdx=g.lastIdx, lastVal=g.lastVal;

  var actualPts = actualVals.map(function(v,i){ return [xAt(i), yAt(v)]; });
  var curveD = actualPts.length >= 2 ? smoothPathD(actualPts) : (actualPts.length===1 ? ("M "+actualPts[0][0]+","+actualPts[0][1]) : "");
  var areaD = curveD ? (curveD+" L "+xAt(Math.max(0,lastIdx))+","+yAt(0)+" L "+xAt(0)+","+yAt(0)+" Z") : "";

  var forecastD = "";
  var todayMarker = "";
  var daysToEstimateLocal = totalDays - (pastDays||0);
  if (rows.length > 0 && daysToEstimateLocal > 0) {
    /* The dotted projection starts from the last FULLY COMPLETE day, not
       today — today is one of the days being estimated, since it isn't
       over yet, so its actual-so-far number shouldn't be mistaken for its
       final one. That's why the dotted line visibly diverges from the
       solid "actual" curve one step before "Today" rather than exactly at
       it — the gap between them at Today's x-position is precisely the
       difference between what's really happened today and what the pace
       expects for the day as a whole. */
    if (hasForecast) forecastD = 'M '+xAt(g.knownIdx)+','+yAt(g.knownVal)+' L '+xAt(n-1)+','+yAt(projectedSpend);
    todayMarker = '<line x1="'+xAt(lastIdx)+'" x2="'+xAt(lastIdx)+'" y1="'+padT+'" y2="'+(h-padB)+'" stroke="'+T.hairline+'" stroke-dasharray="2,2"/>'
      + '<text x="'+xAt(lastIdx)+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'" text-anchor="middle">Today</text>';
  }

  /* Compare line: a secondary, visually-muted reference curve (previous
     period's actual pace, or a flat "average pace" line) drawn UNDER the
     real actual/projected lines so it reads as background context rather
     than competing with the primary data. */
  var compareD = "";
  if (compareValues && compareValues.length >= 2) {
    var comparePts = compareValues.map(function(v,i){ return [xAt(i), yAt(v)]; });
    compareD = smoothPathD(comparePts);
  } else if (compareValues && compareValues.length === 1) {
    compareD = "M "+xAt(0)+","+yAt(compareValues[0]);
  }

  var budgetY = yAt(target);
  var ticksSet = {}; [0, Math.round(maxY/2), Math.round(maxY)].forEach(function(t){ ticksSet[t]=true; });
  var tickSvg = Object.keys(ticksSet).map(Number).map(function(t){
    return '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+yAt(t)+'" y2="'+yAt(t)+'" stroke="'+T.sep+'" stroke-dasharray="2,2"/>'
      + '<text x="2" y="'+(yAt(t)+3)+'" font-size="9" fill="'+T.textMuted+'">'+fmt(t,0)+'</text>';
  }).join("");

  return '<svg id="forecastChartSvg" viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'">'
    + tickSvg
    + '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+budgetY+'" y2="'+budgetY+'" stroke="'+T.text+'" stroke-width="1.5" stroke-dasharray="4,3"/>'
    + '<text x="'+padL+'" y="'+(budgetY-5)+'" font-size="9" font-weight="600" fill="'+T.text+'">'+esc(refLabel||"Budget")+' – '+fmt(target,0)+' AED</text>'
    + (compareD ? '<path d="'+compareD+'" fill="none" stroke="'+T.textMuted+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5,4"/>' : "")
    + (areaD ? '<path d="'+areaD+'" fill="'+T.positive+'" fill-opacity="0.16" stroke="none"/>' : "")
    + (curveD ? '<path d="'+curveD+'" fill="none" stroke="'+T.positive+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' : "")
    + (forecastD ? '<path d="'+forecastD+'" fill="none" stroke="'+T.accent+'" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1,5"/>' : "")
    + todayMarker
    + '<line id="forecastChartCrosshair" x1="0" x2="0" y1="'+padT+'" y2="'+(h-padB)+'" stroke="'+T.text+'" stroke-width="1" opacity="0"/>'
    + '<circle id="forecastChartDot" r="4.5" fill="'+T.accent+'" stroke="'+T.bg+'" stroke-width="2" opacity="0"/>'
    + '<rect id="forecastChartHit" x="0" y="0" width="'+w+'" height="'+h+'" fill="transparent" style="touch-action:none;"/>'
    + '</svg>';
}

/* Drives the crosshair/dot/tooltip during a touch or mouse drag across the
   forecast chart — same bypass-render() approach as wireBalanceChart, for
   the same reason: rebuilding the DOM on every pixel of movement would kill
   the smoothness of the drag. Reports whichever of the actual or projected
   value applies at the touched point, labelled accordingly. */
function wireForecastChart(data) {
  var svg = document.getElementById("forecastChartSvg");
  var hit = document.getElementById("forecastChartHit");
  var crosshair = document.getElementById("forecastChartCrosshair");
  var dot = document.getElementById("forecastChartDot");
  var tip = document.getElementById("forecastChartTip");
  if (!svg || !hit || !crosshair || !dot || !tip || !data) return;
  var g = forecastChartGeom(data.rows, data.totalDays, data.target, data.projectedSpend, data.compareValues, data.pastDays);
  if (g.n < 2) return;

  function indexAt(clientX) {
    var rect = svg.getBoundingClientRect();
    if (!rect.width) return 0;
    var frac = Math.max(0, Math.min(1, (clientX-rect.left)/rect.width));
    var vbX = frac * g.w;
    var idx = Math.round(((vbX-g.padL)/g.plotW) * (g.n-1));
    return Math.max(0, Math.min(g.n-1, idx));
  }
  function showAt(idx) {
    var val = forecastValueAt(g, idx, data.projectedSpend);
    var px = g.xAt(idx), py = g.yAt(val);
    crosshair.setAttribute("x1", px); crosshair.setAttribute("x2", px); crosshair.setAttribute("opacity", "1");
    dot.setAttribute("cx", px); dot.setAttribute("cy", py); dot.setAttribute("opacity", "1");
    var dateStr = shortLabel(toStr(addDays(parseD(data.start), idx)));
    var isProjected = idx > g.lastIdx;
    var lineStyle = 'white-space:nowrap; overflow:hidden; text-overflow:ellipsis;';
    var tipHtml = '<div style="'+lineStyle+'"><span class="muted">'+esc(dateStr)+(isProjected?" (projected)":"")+'</span> <span style="color:var(--text); font-weight:600;">'+fmt(Math.round(val),0)+' AED</span></div>';
    if (data.compareValues && data.compareValues.length > idx) {
      tipHtml += '<div style="'+lineStyle+' margin-top:2px;"><span class="muted">'+esc(data.compareLabel||"Compare")+' </span><span style="color:var(--text-muted); font-weight:600;">'+fmt(Math.round(data.compareValues[idx]),0)+' AED</span></div>';
    }
    tip.innerHTML = tipHtml;
    positionChartTooltip(tip, svg, px, g.w);
    tip.style.opacity = "1";
  }
  function hide() {
    crosshair.setAttribute("opacity", "0");
    dot.setAttribute("opacity", "0");
    tip.style.opacity = "0";
  }
  function move(clientX) { showAt(indexAt(clientX)); }

  hit.addEventListener("touchstart", function(e){ move(e.touches[0].clientX); }, {passive:true});
  hit.addEventListener("touchmove", function(e){ move(e.touches[0].clientX); e.preventDefault(); }, {passive:false});
  hit.addEventListener("touchend", hide);
  hit.addEventListener("touchcancel", hide);
  hit.addEventListener("mousedown", function(e){ move(e.clientX); });
  hit.addEventListener("mousemove", function(e){ if (e.buttons===1) move(e.clientX); });
  hit.addEventListener("mouseleave", hide);
  hit.addEventListener("mouseup", hide);
}

/* Single source of truth for the forecast's pace/projection math — shared
   by the Forecasted Spend card and the Spend Trend chart's current-period
   classification, so the two can never disagree about whether today is
   genuinely trending over budget. Today is treated as a day still being
   estimated, not a completed one: its spend-so-far isn't mistaken for its
   final number, so a period's first day (no completed local days yet) is
   projected purely from historical pace rather than a raw, unblended,
   small-sample average of whatever's happened so far this period. */
function computeForecastNumbers(rows, totalDays, periodStart) {
  if (!rows.length) return null;
  var today = todayStr();
  var todayIncluded = rows[rows.length-1].date === today;
  var todayRow = todayIncluded ? rows[rows.length-1] : null;
  var pastRows = todayIncluded ? rows.slice(0, rows.length-1) : rows.slice();
  var pastDays = pastRows.length;
  var pastSpent = pastRows.reduce(function(s,r){ return s+r.spent; }, 0);
  var pastDiscretionary = discretionarySpentInRows(pastRows);
  var todayScheduledSpent = todayRow ? (todayRow.items||[]).reduce(function(s,it){ return (it.recurringId && (state.basis === "income" || itemCountsTowardBudget(it))) ? s+it.amount : s; }, 0) : 0;
  var actualSpentSoFar = pastSpent + (todayRow ? todayRow.spent : 0);
  var knownSpent = pastSpent + todayScheduledSpent;
  var historicalAvg = overallAvgDailySpend();
  var BLEND_K = historicalAvg !== null ? 3 : 0;
  var blendDenom = pastDays + BLEND_K;
  var avgSpentPerDay = blendDenom > 0 ? ((pastDiscretionary + (historicalAvg !== null ? historicalAvg*BLEND_K : 0)) / blendDenom) : null;
  var stillBlending = historicalAvg !== null && pastDays < BLEND_K;
  var daysToEstimate = Math.max(0, totalDays - pastDays);
  var periodEnd = toStr(addDays(parseD(periodStart), totalDays-1));
  var scheduledUpcoming = daysToEstimate > 0 ? scheduledAmountInRange(toStr(addDays(parseD(today), -1)), periodEnd) : 0;
  var hasForecast = daysToEstimate > 0 && (avgSpentPerDay !== null || scheduledUpcoming > 0);
  var projectedSpend = hasForecast
    ? (knownSpent + (avgSpentPerDay || 0) * daysToEstimate + scheduledUpcoming)
    : actualSpentSoFar;
  return {
    todayIncluded: todayIncluded, pastDays: pastDays, pastSpent: pastSpent,
    pastDiscretionary: pastDiscretionary, actualSpentSoFar: actualSpentSoFar,
    knownSpent: knownSpent, avgSpentPerDay: avgSpentPerDay, stillBlending: stillBlending,
    daysToEstimate: daysToEstimate, scheduledUpcoming: scheduledUpcoming,
    hasForecast: hasForecast, projectedSpend: projectedSpend
  };
}

/* Builds the entire Forecasted Spend card — header, badge, chart, and any
   footnote — shared by Home and Analysis so the two can't drift apart or
   disagree on a number. Pace blends this period's own elapsed days with the
   overall historical daily average, weighted by a simple shrinkage estimator:
   avg = (local spend + historicalAvg*K) / (local days + K). On day 1 that's
   pure history (0 local days); as local days accumulate they count for more,
   and once local days reach K the historical average barely matters anymore.
   This avoids both a flat, useless day-1 projection AND an abrupt full
   switchover the moment a single local day exists. */
function buildForecastCard(rows, totalDays, target, periodStart, T, refLabel, periodWord, compareRows) {
  if (!rows.length) return "";
  var fc = computeForecastNumbers(rows, totalDays, periodStart);
  var todayIncluded = fc.todayIncluded, pastDays = fc.pastDays, pastDiscretionary = fc.pastDiscretionary,
      avgSpentPerDay = fc.avgSpentPerDay, stillBlending = fc.stillBlending, daysToEstimate = fc.daysToEstimate,
      scheduledUpcoming = fc.scheduledUpcoming, hasForecast = fc.hasForecast, projectedSpend = fc.projectedSpend;
  var projectedSaved = target - projectedSpend;
  var favorable = projectedSaved >= 0;
  var vsBudgetPct = target > 0 ? Math.round(((projectedSpend-target)/target)*100) : 0;

  /* Compare line: an optional second curve on the chart, toggled between
     the previous period's actual day-by-day pace and a flat "average pace"
     reference. "Average" reuses avgSpentPerDay as-is — the exact same pace
     already driving the projection above — so the reference line and the
     dotted projection can never imply two different averages. Indexed by
     day-offset (not calendar date) so it lines up with the current period's
     x-axis regardless of the two periods' actual dates. */
  var compareMode = state.forecastCompareMode === "average" ? "average" : "previous";
  var compareLabel = compareMode === "average" ? "Average pace" : (periodWord === "period" ? "Previous period" : ("Last "+periodWord));
  var compareValues = null;
  var compareUnavailableNote = null;
  if (compareMode === "previous") {
    if (compareRows && compareRows.length) {
      var cAcc = 0;
      compareValues = compareRows.slice(0, totalDays).map(function(r){ cAcc += r.spent; return cAcc; });
    } else {
      compareUnavailableNote = "No " + compareLabel.toLowerCase() + " logged yet to compare against.";
    }
  } else if (avgSpentPerDay !== null) {
    compareValues = [];
    for (var ci=0; ci<totalDays; ci++) compareValues.push(avgSpentPerDay * ci);
  } else {
    compareUnavailableNote = "Not enough history yet to show an average pace.";
  }

  var s = '<div class="card card-pad" style="margin-bottom:16px;">';
  s += '<div class="eyebrow" style="margin-bottom:10px;">Forecasted spend</div>';
  s += '<div class="row between" style="align-items:flex-start; margin-bottom:14px;">';
  s += '<div><div class="muted caption">THIS '+esc(periodWord.toUpperCase())+'</div><div class="mono" style="font-size:22px; font-weight:700; margin-top:2px;">'+fmt(projectedSpend,0)+' AED</div></div>';
  s += '<div style="text-align:right;"><div class="muted caption">VS '+esc(refLabel.toUpperCase())+'</div>';
  s += '<div class="chip" style="margin-top:4px; background:'+(favorable?"var(--positive)":"var(--rust)")+'; color:#fff; font-weight:700;">'+(vsBudgetPct>=0?"+":"")+vsBudgetPct+'%</div>';
  s += '<div class="mono footnote" style="margin-top:4px; color:'+(favorable?"var(--positive)":"var(--rust)")+';">'+(projectedSaved>=0?"+":"−")+fmt(Math.abs(projectedSaved),0)+' AED</div>';
  s += '</div></div>';
  s += '<div class="seg" style="margin-bottom:12px;">';
  [["previous", periodWord === "period" ? "vs Previous period" : ("vs Last "+periodWord)], ["average","vs Average pace"]].forEach(function(opt){
    var active = compareMode === opt[0];
    s += '<button class="seg-btn" role="tab" aria-selected="'+active+'" data-action="set-forecast-compare" data-mode="'+opt[0]+'">'+opt[1]+'</button>';
  });
  s += '</div>';
  s += '<div id="forecastChartWrap" style="position:relative;">';
  s += '<div id="forecastChartTip" class="mono footnote" style="position:absolute; top:0; left:0; background:var(--fill); border-radius:8px; padding:4px 9px; max-width:250px; opacity:0; pointer-events:none; transition:opacity .12s ease; z-index:2;"></div>';
  s += renderForecastChart(rows, totalDays, target, projectedSpend, T, refLabel, compareValues, pastDays, hasForecast);
  s += '</div>';
  if (compareValues) {
    s += '<div class="row gap2" style="margin-top:10px; flex-wrap:wrap;">';
    s += legendSwatch(T.positive, "Actual");
    s += legendSwatch(T.accent, "Projected");
    s += legendSwatch(T.textMuted, compareLabel);
    s += '</div>';
  }
  var notes = [];
  if (compareUnavailableNote) notes.push(compareUnavailableNote);
  if (!hasForecast) {
    notes.push(daysToEstimate<=0 ? "Period is complete — nothing left to forecast." : "Log a few days to start forecasting.");
  } else {
    if (todayIncluded) notes.push("Today isn't finished yet, so it's estimated from your pace rather than today's spend so far.");
    if (scheduledUpcoming > 0) notes.push("Includes "+fmt(scheduledUpcoming,0)+" AED of scheduled payments still to come.");
    if (stillBlending) notes.push(pastDiscretionary>0 ? "Day-to-day pace is blended with your overall average for now." : "No day-to-day spending logged yet this "+periodWord+" — pace blended from your overall average.");
  }
  notes.forEach(function(n){ s += '<div class="muted caption" style="margin-top:8px;">'+esc(n)+'</div>'; });
  s += '</div>';
  lastForecastChartData = { rows: rows, totalDays: totalDays, target: target, projectedSpend: projectedSpend, start: periodStart, compareValues: compareValues, compareLabel: compareLabel, pastDays: pastDays };
  return s;
}

/* Bar chart across several recent instances of the same period type, colored
   by a 3-tier status: on track (green), trending over (amber — only possible
   for the still-in-progress current period, based on its forecast), or over
   budget (red — either a finished period that ran over, or a current period
   forecast to run well over). One dashed line marks the most recent period's
   budget, since target can drift over time via rate changes. */
function renderTrendBarChart(items, refTarget, T, refLabel) {
  var w=340, h=150, padL=34, padR=8, padT=22, padB=20;
  var plotW=w-padL-padR, plotH=h-padT-padB;
  var maxVal = Math.max.apply(null, items.map(function(i){ return i.spent; }).concat([refTarget, 1]));
  var n = items.length;
  var slot = plotW/n;
  var barW = Math.min(30, slot*0.6);
  function y(v){ return padT + plotH - (Math.min(v,maxVal)/maxVal)*plotH; }
  var colorFor = { positive: T.positive, amber: T.amber, rust: T.rust };
  var bars = items.map(function(it,i){
    var cx = padL + slot*i + slot/2;
    var topY = y(it.spent);
    var barH = Math.max(0, plotH - (topY-padT));
    var labelSvg = it.spent > 0 ? '<text x="'+cx+'" y="'+Math.max(9,topY-4)+'" font-size="8" fill="'+T.textMuted+'" text-anchor="middle">'+fmt(Math.round(it.spent),0)+'</text>' : '';
    return '<rect x="'+(cx-barW/2)+'" y="'+topY+'" width="'+barW+'" height="'+barH+'" fill="'+(colorFor[it.status]||T.positive)+'" rx="3"/>'
      + labelSvg
      + '<text x="'+cx+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'" text-anchor="middle">'+esc(it.label)+'</text>';
  }).join("");
  var refY = y(refTarget);
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'">'
    + '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+refY+'" y2="'+refY+'" stroke="'+T.text+'" stroke-width="1.5" stroke-dasharray="4,3"/>'
    + '<text x="'+padL+'" y="'+(refY-5)+'" font-size="9" font-weight="600" fill="'+T.text+'">'+esc(refLabel||"Budget")+'</text>'
    + bars + '</svg>';
}

/* Resolves the Analysis page's selected period. week/month/year are navigable
   via analysisOffset (0 = current, -1 = previous, …), reusing getPeriodBounds so
   titles and bounds match the Home page exactly. custom uses explicit dates. */
/* Same shape as getAnalysisPeriodInfo, for the Transactions page's filter —
   kept separate since Transactions also offers "all time" (a real list of
   everything ever logged), which doesn't make sense for Analysis's charts. */
function getTxnPeriodInfo() {
  var today = todayStr();
  var mode = state.txnPeriodMode || "all";
  var off = state.txnOffset || 0;
  var entryDatesAll = Object.keys(state.entries).sort();
  var naturalStart = state.settings.trackingStartDate || (entryDatesAll.length ? entryDatesAll[0] : today);
  if (mode === "all") {
    /* "All time" must mean all of it: if any logged entry falls after today
       (e.g. a recurring/split plan that caught up while the device clock was
       ahead, or any other edge case), the upper bound has to stretch to
       cover it too — otherwise this view silently drops entries that Week/
       Month (which use real calendar bounds, not an artificial "up to
       today" cap) would still show, which is exactly the inconsistency that
       made deleted-but-orphaned split entries "disappear" from All while
       still appearing under Week. */
    var latestEntryDate = entryDatesAll.length ? entryDatesAll[entryDatesAll.length-1] : today;
    var endAll = latestEntryDate > today ? latestEntryDate : today;
    return { start: naturalStart, end: endAll, title: "All time", sub: "", isCurrent: true, mode: mode };
  }
  if (mode === "custom") {
    var from = state.txnPeriodFrom || naturalStart;
    var to = state.txnPeriodTo || today;
    if (from > to) { var swap = from; from = to; to = swap; }
    return { start: from, end: to, title: shortLabel(from)+" – "+shortLabel(to), sub: "Custom range", isCurrent: true, mode: mode };
  }
  var per = getPeriodBounds(mode, off, currentWeeklyTarget(), dailyReference());
  return { start: per.startStr, end: per.endStr, title: per.title, sub: per.sub, isCurrent: off === 0, mode: mode };
}

function getAnalysisPeriodInfo() {
  var today = todayStr();
  var mode = state.analysisPeriodMode || "month";
  var off = state.analysisOffset || 0;
  if (mode === "custom") {
    var entryDatesAll = Object.keys(state.entries).sort();
    var fallbackStart = state.settings.trackingStartDate || (entryDatesAll.length ? entryDatesAll[0] : today);
    var from = state.analysisPeriodFrom || fallbackStart;
    var to = state.analysisPeriodTo || today;
    if (from > to) { var swap = from; from = to; to = swap; }
    return { start: from, end: to, title: shortLabel(from)+" – "+shortLabel(to), sub: "Custom range", isCurrent: true, mode: mode, days: daysBetween(from,to)+1 };
  }
  var per = getPeriodBounds(mode, off, currentWeeklyTarget(), dailyReference());
  return { start: per.startStr, end: per.endStr, title: per.title, sub: per.sub, isCurrent: off === 0, mode: mode, days: per.days };
}

/* Week/month are short enough to read day-by-day; a year would be 365 bars, so
   it rolls up to months. Custom ranges switch over at roughly two months. */
function analysisGranularity(info) {
  if (info.mode === "year") return "month";
  if (info.mode === "custom") return daysBetween(info.start, info.end) > 62 ? "month" : "day";
  return "day";
}

/* Collapses periodStats rows into chart buckets at the chosen granularity.
   Monthly buckets sum both spend and allowance, so a bucket's own target stays
   correct even when months differ in length. */
/* Whether a transaction item counts as belonging to a given person filter
   value — matches either the single-person field or, for a percentage
   split, anyone included in it (even at a partial share). Shared by the
   Transactions page filter and Analysis's person breakdown so the two
   pages can't define "belongs to this person" differently. Accepts either
   sentinel spelling for the "no one assigned" bucket, since Transactions'
   dropdown uses "__unassigned__" while Analysis's pie slice is labelled
   "Unassigned". */
function itemMatchesPersonFilter(it, filterValue) {
  if (!filterValue) return true;
  if (filterValue === "__unassigned__" || filterValue === "Unassigned") {
    return !it.person && (!it.personSplit || !it.personSplit.length);
  }
  if (it.personSplit && it.personSplit.length) return it.personSplit.some(function(ps){ return ps.person===filterValue; });
  return it.person === filterValue;
}

/* Whether an item falls within the current category-level scope: a specific
   leaf category filter wins if set (most specific); otherwise a drilled-into
   group applies (browsing "Food & Drinks" without having picked one of its
   categories yet still narrows to that group); otherwise unscoped. Shared by
   every section that reads the page's "current category scope" — the bar
   charts, day-of-week, biggest transactions, and the person breakdown's own
   aggregation — so drilling into a group filters the whole page the same
   way picking a specific category already does, not just the category
   section's own pie. */
function itemMatchesCategoryScope(it, catFilter, groupFilter) {
  if (catFilter) return (it.category || "Uncategorised") === catFilter;
  if (groupFilter) return categoryGroupOf(it.category) === groupFilter;
  return true;
}

/* The amount to attribute to the current person-filter scope for a given
   item. A person filter matching a split transaction only means that person
   holds SOME share of it — every sum built on top of that boolean match was
   adding the item's FULL amount regardless of share, so a 100 AED purchase
   split 30/70 was counted as a full 100 AED for BOTH people, inflating any
   person-filtered total by everyone else's share too. This returns the
   correct prorated amount: the person's own share when the item is split,
   the full amount for an unsplit item (nothing to prorate), and the full
   amount when there's no active person filter at all (nothing to scope by). */
function personScopedAmount(it, personFilter) {
  if (!personFilter || !it.personSplit || !it.personSplit.length) return it.amount;
  return it.personSplit
    .filter(function(ps){ return ps.person === personFilter; })
    .reduce(function(t,ps){ return t + round2(it.amount * ps.pct/100); }, 0);
}

function buildAnalysisBuckets(rows, granularity, catFilter, personFilter, groupFilter) {
  function keep(it){
    return itemMatchesCategoryScope(it, catFilter, groupFilter) && itemMatchesPersonFilter(it, personFilter);
  }
  function spentOf(r){
    if (!catFilter && !personFilter && !groupFilter) return r.spent;
    return (r.items||[]).reduce(function(t,it){ return keep(it) ? t+personScopedAmount(it, personFilter) : t; }, 0);
  }
  if (granularity !== "month") {
    return rows.map(function(r){
      return { key: r.date, label: shortLabel(r.date), title: dayLabel(r.date), date: r.date,
               dates: [r.date], spent: spentOf(r), allowance: r.allowance, days: 1 };
    });
  }
  var map = {}, order = [];
  rows.forEach(function(r){
    var key = r.date.slice(0,7);
    if (!map[key]) {
      map[key] = { key: key, label: parseD(r.date).toLocaleDateString("en-GB",{month:"short"}),
                   title: parseD(r.date).toLocaleDateString("en-GB",{month:"long",year:"numeric"}),
                   date: r.date, dates: [], spent: 0, allowance: 0, days: 0 };
      order.push(key);
    }
    map[key].spent += spentOf(r);
    map[key].allowance += r.allowance;
    map[key].days += 1;
    map[key].dates.push(r.date);
  });
  return order.map(function(k){ return map[k]; });
}


function renderAnalysisBody(T) {
  lastForecastChartData = null;
  lastChartData = null;
  var da = dailyReference();
  var today = todayStr();
  var periodMode = state.analysisPeriodMode || "month";
  var periodFrom = state.analysisPeriodFrom || "";
  var periodTo = state.analysisPeriodTo || "";
  var info = getAnalysisPeriodInfo();
  var cs = periodStats(info.start, info.end);
  var granularity = analysisGranularity(info);
  var perLabel = granularity === "month" ? "month" : "day";

  var h = "";
  h += '<div class="row between" style="align-items:center; margin-bottom:10px;">';
  h += '<div class="eyebrow">Analysis</div>';
  h += '<button data-action="toggle-analysis-reorder" class="btn-outline row gap2" style="padding:5px 10px; font-size:12px; align-items:center;">'+(state.analysisReorderMode?ICONS.check+" Done":ICONS.pencil+" Reorder")+'</button>';
  h += '</div>';

  h += '<div class="seg" style="margin-bottom:10px;">';
  [["budget","vs Budget"],["income","vs Income"]].forEach(function(opt){
    var activeB = state.basis === opt[0];
    h += '<button class="seg-btn" role="tab" aria-selected="'+activeB+'" data-action="set-basis" data-basis="'+opt[0]+'">'+opt[1]+'</button>';
  });
  h += '</div>';

  if (state.basis === "income" && !incomeIsSet()) {
    h += '<div class="card" style="padding:14px 16px; margin-bottom:12px; background:var(--rust-wash); border-color:var(--rust);">';
    h += '<div style="font-size:13px; margin-bottom:8px;">Set your income to use this view.</div>';
    h += '<button data-action="open-income-settings" class="btn-accent" style="width:100%;">Set income</button>';
    h += '</div>';
    return h;
  }

  h += '<div class="seg" style="margin-bottom:12px;">';
  [["week","Week"],["month","Month"],["year","Year"],["custom","Custom"]].forEach(function(opt){
    var active = periodMode === opt[0];
    h += '<button class="seg-btn" role="tab" aria-selected="'+active+'" data-action="set-analysis-period" data-mode="'+opt[0]+'">'+opt[1]+'</button>';
  });
  h += '</div>';

  if (periodMode === "custom") {
    h += '<div class="row gap2" style="margin-bottom:12px;">';
    h += '<input id="analysisPeriodFromInput" type="date" class="field mono" style="flex:1; font-size:13px;" value="'+esc(periodFrom)+'" max="'+today+'" />';
    h += '<input id="analysisPeriodToInput" type="date" class="field mono" style="flex:1; font-size:13px;" value="'+esc(periodTo)+'" max="'+today+'" />';
    h += '</div>';
  } else {
    h += '<div class="row between card" style="padding:8px 10px; margin-bottom:12px;">';
    h += '<button data-action="analysis-nav-offset" data-delta="-1" class="icon-btn" style="border-radius:10px;" aria-label="Previous">'+ICONS.chevronLeft+'</button>';
    h += '<div style="text-align:center; min-width:0;"><div style="font-size:13px; font-weight:500;">'+esc(info.title)+'</div>';
    h += '<div class="eyebrow" style="margin-top:2px;">'+esc(info.sub)+'</div></div>';
    h += '<button data-action="analysis-nav-offset" data-delta="1" class="icon-btn" style="border-radius:10px;'+(info.isCurrent?"opacity:0.3;pointer-events:none;":"")+'" aria-label="Next">'+ICONS.chevronRight+'</button>';
    h += '</div>';
  }

  var catFilter = state.analysisCategoryFilter || "";
  var personFilter = state.analysisPersonFilter || "";
  var groupFilter = state.analysisSelectedGroup || "";
  var selKey = state.analysisSelectedBucket;
  var buckets = buildAnalysisBuckets(cs.rows, granularity, catFilter, personFilter, groupFilter);
  function itemCatOf(it){ return it.category || "Uncategorised"; }
  /* Three variants because the category and person sections each control
     their OWN dimension and shouldn't filter themselves by it (the category
     pie should show all categories WITHIN the current person filter, not
     just the currently-selected category; symmetric for the person pie) —
     while every other section (bar charts, day-of-week, biggest
     transactions, summary) should respect both at once. Category scope
     includes a drilled-into group, not just a specific leaf category, so
     browsing "Food & Drinks" filters the rest of the page exactly like
     picking "Restaurants" would, not just the category pie's own display. */
  function keepItemPerson(it){ return itemMatchesPersonFilter(it, personFilter); }
  function keepItemCategoryOnly(it){ return itemMatchesCategoryScope(it, catFilter, groupFilter); }
  function keepItem(it){ return keepItemCategoryOnly(it) && keepItemPerson(it); }
  /* Spend restricted to the active filters — the whole page reads from this
     so tapping a pie slice (category or person) re-scopes every section at
     once. */
  function filteredSpent(){
    return cs.rows.reduce(function(t,r){
      return t + (r.items||[]).reduce(function(u,it){ return keepItem(it) ? u+personScopedAmount(it, personFilter) : u; }, 0);
    }, 0);
  }

  var showGroupChip = groupFilter && !catFilter;
  if (catFilter || personFilter || showGroupChip) {
    h += '<div class="row gap2" style="margin-bottom:12px; align-items:center; flex-wrap:wrap;">';
    if (showGroupChip) h += '<span class="chip chip-accent">'+esc(groupFilter)+'</span>';
    if (catFilter) h += '<span class="chip chip-accent">'+esc(catFilter)+'</span>';
    if (personFilter) h += '<span class="chip" style="background:'+(personFilter==="Unassigned"?"#8595B5":personColor(personFilter))+'; color:#fff; font-weight:600;">'+esc(personFilter)+'</span>';
    if (showGroupChip) h += '<button class="btn-plain" data-action="clear-analysis-group">Clear group</button>';
    if (catFilter) h += '<button class="btn-plain" data-action="clear-analysis-category">Clear category</button>';
    if (personFilter) h += '<button class="btn-plain" data-action="clear-analysis-person">Clear person</button>';
    h += '</div>';
  }

  var sectionHtml = {};

  sectionHtml.summary = function(){
    var s = '<div class="card card-pad" style="margin-bottom:16px;">';
    s += '<div class="stat-grid">';
    if (catFilter || personFilter) {
      var filterLabelParts = [];
      if (catFilter) filterLabelParts.push(catFilter);
      if (personFilter) filterLabelParts.push(personFilter);
      var filterLabel = filterLabelParts.join(" \u00b7 ");
      var catSpent = filteredSpent();
      var pctOfAll = cs.spent > 0 ? (catSpent/cs.spent*100) : 0;
      var txnCount = cs.rows.reduce(function(t,r){ return t + (r.items||[]).filter(keepItem).length; }, 0);
      s += statBlock("Spent on "+filterLabel, fmt(catSpent,0)+" AED", "var(--text)");
      s += statBlock("Share of all spend", pctOfAll.toFixed(0)+"%", "var(--text)");
      s += statBlock("Avg per day", fmt(cs.elapsedDays>0?catSpent/cs.elapsedDays:0,0)+" AED", "var(--text)");
      s += statBlock("Transactions", String(txnCount), "var(--text)");
    } else {
      s += statBlock("Total spent", fmt(cs.spent,0)+" AED", "var(--text)");
      s += statBlock("Total saved", (cs.net>=0?"+":"−")+fmt(Math.abs(cs.net),0)+" AED", cs.net>=0?"var(--positive)":"var(--rust)");
      s += statBlock("Avg daily spend", fmt(cs.elapsedDays>0?cs.spent/cs.elapsedDays:0,0)+" AED", (cs.elapsedDays>0 && cs.spent/cs.elapsedDays>da)?"var(--rust)":"var(--text)");
      s += statBlock("Days tracked", String(cs.elapsedDays), "var(--text)");
    }
    s += '</div></div>';
    return s;
  };

  /* Drill-down panel shown under a chart when one of its columns is tapped. */
  function bucketDetail(chartId) {
    if (selKey == null) return "";
    var prefix = chartId+"|";
    if (selKey.indexOf(prefix) !== 0) return "";
    var wantKey = selKey.slice(prefix.length);
    var b = null;
    for (var i=0;i<buckets.length;i++) if (buckets[i].key === wantKey) { b = buckets[i]; break; }
    if (!b) return "";
    var rowsIn = cs.rows.filter(function(r){ return b.dates.indexOf(r.date) !== -1; });
    var items = [];
    rowsIn.forEach(function(r){
      (r.items||[]).forEach(function(it){ if (keepItem(it)) items.push({ date: r.date, it: it }); });
    });
    items.sort(function(x,y){ return y.it.amount - x.it.amount; });
    var totalIn = items.reduce(function(t,x){ return t+personScopedAmount(x.it, personFilter); }, 0);
    var refIn = b.allowance;
    var net = refIn - b.spent;

    var s = '<div class="bucket-detail hairline-top" style="margin-top:12px; padding-top:12px;">';
    s += '<div class="row between" style="align-items:flex-start; margin-bottom:10px;">';
    s += '<div><div class="headline">'+esc(b.title)+'</div>';
    s += '<div class="muted footnote" style="margin-top:2px;">Spent '+fmt(b.spent,0)+' of '+fmt(refIn,0)+' AED · <span style="color:'+(net>=0?"var(--positive)":"var(--rust)")+';">'+(net>=0?"+":"−")+fmt(Math.abs(net),0)+'</span></div></div>';
    s += '<button class="icon-btn press" data-action="clear-bucket" aria-label="Close">'+ICONS.x+'</button>';
    s += '</div>';
    if (!items.length) {
      s += '<div class="muted subhead">'+(catFilter ? "Nothing in "+esc(catFilter)+" here." : "Nothing logged — full allowance saved.")+'</div>';
    } else {
      items.forEach(function(x,i){
        s += '<div class="row" style="align-items:center; gap:10px; padding:8px 0;'+(i>0?"border-top:1px solid var(--sep);":"")+'">';
        s += catIconCircle(x.it.category);
        s += '<div style="flex:1; min-width:0;"><div class="subhead" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">'+esc(x.it.note || x.it.category || "Spent")+'</div>';
        var sub = (b.dates.length > 1 ? dayLabel(x.date) : "") + ((b.dates.length > 1 && x.it.category) ? " · " : "") + (x.it.note && x.it.category ? x.it.category : (b.dates.length > 1 ? "" : (x.it.category||"")));
        s += '<div class="muted caption" style="margin-top:1px;">'+esc(sub)+'</div></div>';
        s += '<div class="mono subhead" style="flex-shrink:0;">'+fmt(personScopedAmount(x.it, personFilter),2)+'</div>';
        s += '</div>';
      });
      if (items.length > 1) {
        s += '<div class="row between hairline-top" style="padding-top:8px; margin-top:4px;">';
        s += '<span class="muted footnote">'+items.length+' transactions</span>';
        s += '<span class="mono footnote">'+fmt(totalIn,2)+' AED</span></div>';
      }
    }
    s += '</div>';
    return s;
  }

  sectionHtml.dailySpend = function(){
    var refSpend = granularity === "month"
      ? (buckets.length ? buckets.reduce(function(t,b){ return t+b.allowance; },0)/buckets.length : null)
      : da;
    if (catFilter || personFilter) refSpend = null;
    var s = '<div class="card card-pad" style="margin-bottom:16px;">';
    s += '<div class="row between" style="margin-bottom:8px; align-items:baseline;">';
    s += '<span class="eyebrow">Spend per '+perLabel+'</span>';
    s += '<span class="muted caption">Tap a column</span></div>';
    s += renderDailyBarChart(buckets, function(b){ return b.spent; }, function(b,v){ return (!catFilter && !personFilter && v>b.allowance) ? T.rust : T.positive; }, T, refSpend, selKey, "spend");
    s += bucketDetail("spend");
    s += '</div>';
    return s;
  };

  sectionHtml.dailySaving = function(){
    /* Saving is a whole-day, whole-household figure — the daily allowance
       it's compared against isn't per-category or per-person, so it can't
       be scoped to either filter. */
    if (catFilter || personFilter) return "";
    var s = '<div class="card card-pad" style="margin-bottom:16px;">';
    s += '<div class="row between" style="margin-bottom:8px; align-items:baseline;">';
    s += '<span class="eyebrow">Saved per '+perLabel+'</span>';
    s += '<span class="muted caption">Tap a column</span></div>';
    s += renderDailyBarChart(buckets, function(b){ return b.allowance - b.spent; }, function(b,v){ return v>=0 ? T.positive : T.rust; }, T, null, selKey, "saved");
    s += bucketDetail("saved");
    s += '</div>';
    return s;
  };

  /* Running balance from the period's start through today (or the period's
     end if it's already closed) — the same cumulative curve Home shows for
     the current week, but available for whichever period Analysis is
     browsing. Reuses Home's own chart component (renderChart/
     wireBalanceChart) rather than a separate implementation, so drag-scrub
     and visual style can never drift apart between the two pages. */
  sectionHtml.cumulativeSaving = function(){
    if (catFilter || personFilter || !cs.rows.length) return "";
    var acc = 0;
    var chartData = cs.rows.map(function(r){
      var delta = round2(r.allowance - r.spent);
      acc = round2(acc + delta);
      return { label: shortLabel(r.date), date: r.date, balance: acc, delta: delta };
    });
    var lastRowDate = cs.rows[cs.rows.length-1].date;
    var netColor = acc >= 0 ? "var(--positive)" : "var(--rust)";
    var s = '<div class="card card-pad" style="margin-bottom:16px;">';
    s += '<div class="row between" style="margin-bottom:2px; align-items:baseline;">';
    s += '<span class="eyebrow">Cumulative saving</span>';
    s += '<span class="mono footnote" style="color:'+netColor+'; font-weight:600;">'+(acc>=0?"+":"−")+fmt(Math.abs(acc),0)+' AED</span>';
    s += '</div>';
    s += '<div class="muted caption" style="margin-bottom:10px;">Running total from '+esc(shortLabel(info.start))+' through '+(lastRowDate===today?"today":esc(shortLabel(lastRowDate)))+'.</div>';
    s += '<div id="analysisSavingChartWrap" style="position:relative;">';
    s += '<div id="balanceChartTip" class="mono footnote" style="position:absolute; top:0; left:0; background:var(--fill); border-radius:8px; padding:4px 9px; max-width:250px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:0; pointer-events:none; transition:opacity .12s ease; z-index:2;"></div>';
    s += renderChart(chartData, T);
    s += '</div></div>';
    lastChartData = chartData;
    return s;
  };

  /* Cash flow answers a different question from the rest of the page: not
     "am I pacing against my allowance" but "did more money come in than went
     out". So it counts EVERY expense — including categories deliberately
     excluded from the budget, which are usually the big fixed ones (rent, a
     mortgage) that matter most to this question. Income-basis only, since
     without an income figure there's nothing to compare against. */
  sectionHtml.cashFlow = function(){
    if (state.basis !== "income" || !incomeIsSet()) return "";
    /* Income accrued over this period, clipped at the tracking start date —
       so a Year view shows income since you actually started tracking, not
       a full calendar year you weren't using the app for. */
    var incomeTotal = fullPeriodTarget(info.start, info.end);
    var expensesTotal = cs.spentAll;
    var netFlow = incomeTotal - expensesTotal;
    var maxSide = Math.max(incomeTotal, expensesTotal, 1);
    var incomePct = Math.round((incomeTotal/maxSide)*100);
    var expensePct = Math.round((expensesTotal/maxSide)*100);
    var positive = netFlow >= 0;
    /* Computed directly rather than as (spentAll - spent): under the income
       basis those two are equal by design, since income counts everything,
       so a subtraction would always come out to zero here. */
    var excludedTotal = cs.rows.reduce(function(t,r){
      return t + (r.items||[]).reduce(function(u,it){ return categoryExcludedFromBudget(it.category) ? u+it.amount : u; }, 0);
    }, 0);
    var periodLabelUpper = periodMode === "week" ? "THIS WEEK"
      : periodMode === "month" ? "THIS MONTH"
      : periodMode === "year" ? "THIS YEAR"
      : "THIS PERIOD";
    if (info.offset && info.offset !== 0) periodLabelUpper = String(info.title||"").toUpperCase();

    var s = '<div class="card card-pad" style="margin-bottom:16px;">';
    s += '<div class="eyebrow" style="margin-bottom:2px;">Cash flow</div>';
    s += '<div class="muted caption" style="margin-bottom:12px;">Am I spending less than I make?</div>';
    s += '<div class="hairline-top" style="padding-top:12px;">';
    s += '<div class="muted caption">'+esc(periodLabelUpper)+'</div>';
    s += '<div class="mono" style="font-size:26px; font-weight:700; margin-top:2px; color:'+(positive?"var(--positive)":"var(--rust)")+';">'+(positive?"":"\u2212")+fmt(Math.abs(netFlow),2)+' <span class="muted" style="font-size:15px;">AED</span></div>';
    s += '<div class="muted caption" style="margin-top:2px;">'+(positive?"left over after everything":"more spent than earned")+'</div>';
    s += '</div>';

    s += '<div style="margin-top:16px;">';
    s += '<div class="row between" style="align-items:baseline; margin-bottom:6px;"><span class="subhead" style="font-weight:600;">Income</span><span class="mono subhead" style="font-weight:600;">'+fmt(incomeTotal,2)+' AED</span></div>';
    s += '<div style="background:var(--fill); border-radius:6px; height:14px; overflow:hidden; margin-bottom:16px;"><div style="width:'+incomePct+'%; height:100%; border-radius:6px; background:var(--positive);"></div></div>';
    s += '<div class="row between" style="align-items:baseline; margin-bottom:6px;"><span class="subhead" style="font-weight:600;">Expenses</span><span class="mono subhead" style="font-weight:600;">'+fmt(expensesTotal,2)+' AED</span></div>';
    s += '<div style="background:var(--fill); border-radius:6px; height:14px; overflow:hidden;"><div style="width:'+expensePct+'%; height:100%; border-radius:6px; background:var(--rust);"></div></div>';
    s += '</div>';

    if (excludedTotal > 0) {
      s += '<div class="muted caption hairline-top" style="margin-top:14px; padding-top:10px;">Includes '+fmt(excludedTotal,0)+' AED from categories kept outside the budget.</div>';
    }
    s += '</div>';
    return s;
  };

  sectionHtml.forecastedSpend = function(){
    if (catFilter || personFilter || !cs.rows.length) return "";
    var periodTarget = fullPeriodTarget(info.start, info.end);
    var periodWord = info.mode === "week" ? "week" : info.mode === "month" ? "month" : info.mode === "year" ? "year" : "period";
    var chartStart = effectiveRangeStart(info.start);
    var chartDays = daysBetween(chartStart, info.end) + 1;
    var compareRowsA = previousPeriodRows(info.mode, state.analysisOffset, info.start, info.end);
    return buildForecastCard(cs.rows, chartDays, periodTarget, chartStart, T, basisWordCap(), periodWord, compareRowsA);
  };

  sectionHtml.spendTrend = function(){
    if (catFilter || personFilter || periodMode === "custom") return "";
    var N = 5;
    var bars = [];
    var currentElapsedDays = null, currentPeriodDays = null;
    for (var trendOff = -(N-1); trendOff <= 0; trendOff++) {
      var pb = getPeriodBounds(periodMode, trendOff, currentWeeklyTarget(), da);
      var ps = periodStats(pb.startStr, pb.endStr);
      var isCurBar = trendOff === 0;
      var targetB = pb.target;
      var spentB = ps.spent;
      var projB = spentB;
      if (isCurBar) {
        currentElapsedDays = ps.calendarElapsedDays;
        currentPeriodDays = pb.days;
        var fcB = computeForecastNumbers(ps.rows, pb.days, pb.startStr);
        if (fcB && fcB.hasForecast) projB = fcB.projectedSpend;
      }
      /* Red is reserved for money that has ACTUALLY already been spent past
         budget — a settled fact. A still-open period that merely paces
         toward going over gets amber ("trending over") instead, since a
         forecast is an estimate and could still change; only a closed
         period (or real spend-so-far, once it's genuinely over) earns red. */
      var status = "positive";
      if (targetB > 0) {
        if (isCurBar) {
          if (spentB > targetB) status = "rust";
          else if (projB > targetB) status = "amber";
        } else {
          status = spentB > targetB ? "rust" : "positive";
        }
      }
      var lbl = periodMode === "week" ? shortLabel(pb.startStr) : periodMode === "year" ? pb.title : parseD(pb.startStr).toLocaleDateString("en-GB",{month:"short"});
      bars.push({ label: lbl, spent: spentB, target: targetB, status: status });
    }
    var lastBar = bars[bars.length-1], prevBar = bars[bars.length-2];
    /* If the current period is still in progress, comparing its partial
       total against a fully-closed previous period is comparing a few days
       of spend to a whole period's worth — always looks artificially low.
       Instead compare like-for-like: the previous period's spend through
       that SAME number of elapsed days. A fully-closed lastBar (browsing a
       past period) needs no such adjustment — two complete periods are
       already comparable. */
    var vsPrevPct = null, comparedSameSpan = false;
    if (prevBar) {
      var prevComparisonSpend = prevBar.spent;
      if (currentElapsedDays != null && currentPeriodDays != null && currentElapsedDays > 0 && currentElapsedDays < currentPeriodDays) {
        var pbPrevSpan = getPeriodBounds(periodMode, -1, currentWeeklyTarget(), da);
        var prevSpanEnd = toStr(addDays(parseD(pbPrevSpan.startStr), currentElapsedDays-1));
        if (prevSpanEnd > pbPrevSpan.endStr) prevSpanEnd = pbPrevSpan.endStr;
        prevComparisonSpend = periodStats(pbPrevSpan.startStr, prevSpanEnd).spent;
        comparedSameSpan = true;
      }
      vsPrevPct = prevComparisonSpend > 0 ? Math.round(((lastBar.spent-prevComparisonSpend)/prevComparisonSpend)*100) : null;
    }
    var s = '<div class="card card-pad" style="margin-bottom:16px;">';
    s += '<div class="eyebrow" style="margin-bottom:10px;">Spend trend</div>';
    s += '<div class="row between" style="align-items:flex-start; margin-bottom:14px;">';
    s += '<div><div class="muted caption">THIS '+esc(periodMode.toUpperCase())+'</div><div class="mono" style="font-size:22px; font-weight:700; margin-top:2px;">'+fmt(lastBar.spent,0)+' AED</div></div>';
    s += '<div style="text-align:right;"><div class="muted caption">VS PREVIOUS PERIOD</div>';
    s += vsPrevPct===null
      ? '<div class="chip" style="margin-top:4px; background:var(--fill); color:var(--text-muted);">---</div>'
      : '<div class="chip" style="margin-top:4px; background:'+(vsPrevPct<=0?"var(--positive)":"var(--rust)")+'; color:#fff; font-weight:700;">'+(vsPrevPct>=0?"+":"")+vsPrevPct+'%</div>';
    s += '</div></div>';
    s += renderTrendBarChart(bars, lastBar.target, T, basisWordCap());
    s += '<div class="row gap2" style="margin-top:10px; flex-wrap:wrap;">';
    s += legendSwatch("var(--positive)", "On track");
    s += legendSwatch("var(--amber)", "Trending over");
    s += legendSwatch("var(--rust)", "Over budget");
    s += '</div>';
    if (comparedSameSpan) s += '<div class="muted caption" style="margin-top:8px;">Compared through the same number of days as this '+periodMode+' so far.</div>';
    s += '</div>';
    return s;
  };

  sectionHtml.category = function(){
    var catTotals = {};
    cs.rows.forEach(function(r){
      r.items.forEach(function(it){
        if (!keepItemPerson(it)) return;
        var key = itemCatOf(it);
        catTotals[key] = (catTotals[key] || 0) + personScopedAmount(it, personFilter);
      });
    });
    if (!Object.keys(catTotals).length) return "";

    var groupList = state.settings.categoryGroups||[];
    var selectedGroup = state.analysisSelectedGroup;
    var showingGroups = groupList.length > 0 && !selectedGroup && !catFilter;

    var s = '<div class="card card-pad" style="margin-bottom:16px;">';

    if (showingGroups) {
      var groupTotals = {};
      Object.keys(catTotals).forEach(function(catName){
        var g = categoryGroupOf(catName) || "Ungrouped";
        groupTotals[g] = (groupTotals[g]||0) + catTotals[catName];
      });
      var groupSlices = Object.keys(groupTotals).map(function(g){ return { label:g, value:groupTotals[g] }; })
        .sort(function(a,b){ return b.value - a.value; });
      var groupTotal = groupSlices.reduce(function(t,x){ return t+x.value; }, 0);
      s += '<div class="row between" style="margin-bottom:10px; align-items:baseline;">';
      s += '<span class="eyebrow">Spend by category</span>';
      s += '<span class="muted caption">Tap to drill in</span></div>';
      s += '<div style="display:flex; justify-content:center; margin-bottom:12px;">'+renderPieChart(groupSlices, T, null, "All", groupTotal, "drill-analysis-group", "group")+'</div>';
      groupSlices.forEach(function(sl,i){
        var pct = groupTotal>0 ? (sl.value/groupTotal*100) : 0;
        var swatch = sl.label === "Ungrouped" ? "var(--text-muted)" : PIE_COLORS[i % PIE_COLORS.length];
        s += '<button data-action="drill-analysis-group" data-group="'+esc(sl.label)+'" class="row between" style="width:100%; text-align:left; background:none; border:none; padding:8px 0;'+(i>0?"border-top:1px solid var(--sep);":"")+'">';
        s += '<span class="row" style="align-items:center; gap:9px; min-width:0;"><span style="width:11px;height:11px;border-radius:3px;flex-shrink:0;background:'+swatch+';"></span><span class="subhead">'+esc(sl.label)+'</span></span>';
        s += '<span class="row" style="align-items:baseline; gap:8px;"><span class="mono subhead">'+fmt(sl.value,0)+'</span><span class="muted mono caption" style="width:32px; text-align:right;">'+pct.toFixed(0)+'%</span><span class="muted" style="display:flex;">'+ICONS.chevronRight+'</span></span>';
        s += '</button>';
      });
    } else {
      var visibleCatNames = selectedGroup
        ? Object.keys(catTotals).filter(function(c){ return (categoryGroupOf(c)||"Ungrouped") === selectedGroup; })
        : Object.keys(catTotals);
      var catSlices = visibleCatNames.map(function(k){ return { label:k, value:catTotals[k] }; })
        .sort(function(a,b){ return b.value - a.value; });
      var catTotal = catSlices.reduce(function(t,x){ return t+x.value; }, 0);
      s += '<div class="row between" style="margin-bottom:10px; align-items:baseline;">';
      if (selectedGroup) {
        s += '<button data-action="clear-analysis-group" class="row gap2" style="background:none;border:none;padding:0;align-items:center;">'+ICONS.chevronLeft+'<span class="eyebrow">'+esc(selectedGroup)+'</span></button>';
      } else {
        s += '<span class="eyebrow">Spend by category</span>';
      }
      s += '<span class="muted caption">'+(catFilter?"Tap to clear":"Tap to filter")+'</span></div>';
      if (!catSlices.length) {
        s += '<div class="muted subhead">Nothing in '+esc(selectedGroup||"")+' this period.</div>';
      } else {
        s += '<div style="display:flex; justify-content:center; margin-bottom:12px;">'+renderPieChart(catSlices, T, catFilter||null, "All", catTotal)+'</div>';
        catSlices.forEach(function(sl,i){
          var pct = catTotal>0 ? (sl.value/catTotal*100) : 0;
          var isSel = catFilter === sl.label;
          s += '<button data-action="filter-analysis-category" data-cat="'+esc(sl.label)+'" class="row between" style="width:100%; text-align:left; background:none; border:none; padding:8px 0;'+(i>0?"border-top:1px solid var(--sep);":"")+(catFilter&&!isSel?"opacity:0.45;":"")+'">';
          s += '<span class="row" style="align-items:center; gap:9px; min-width:0;"><span style="width:11px;height:11px;border-radius:3px;flex-shrink:0;background:'+PIE_COLORS[i % PIE_COLORS.length]+';"></span><span class="subhead"'+(isSel?' style="font-weight:600;"':'')+'>'+esc(sl.label)+'</span></span>';
          s += '<span class="row" style="align-items:baseline; gap:10px;"><span class="mono subhead">'+fmt(sl.value,0)+'</span><span class="muted mono caption" style="width:36px; text-align:right;">'+pct.toFixed(0)+'%</span></span>';
          s += '</button>';
        });
      }
    }
    s += '</div>';
    return s;
  };

  /* Read-only for now — no tap-to-filter interaction, since combining a
     person filter with the existing category filter would need real thought
     about how the two should interact. Hidden entirely if no people have
     been configured, so nobody sees an empty "Unassigned: 100%" chart just
     for using the app without this feature. */
  sectionHtml.person = function(){
    if (!(state.settings.people||[]).length) return "";
    var personTotals = {};
    cs.rows.forEach(function(r){
      (r.items||[]).forEach(function(it){
        if (!keepItemCategoryOnly(it)) return;
        if (it.personSplit && it.personSplit.length) {
          it.personSplit.forEach(function(ps){
            var share = round2(it.amount * ps.pct / 100);
            personTotals[ps.person] = (personTotals[ps.person] || 0) + share;
          });
        } else {
          var key = it.person || "Unassigned";
          personTotals[key] = (personTotals[key] || 0) + it.amount;
        }
      });
    });
    var slices = Object.keys(personTotals).map(function(k){ return { label:k, value:personTotals[k] }; })
      .sort(function(a,b){ return b.value - a.value; });
    var total = slices.reduce(function(t,x){ return t+x.value; }, 0);
    if (!slices.length) return "";
    /* Each slice carries the person's own configured label color, so the pie,
       the list below it, the transaction rows, and Settings all show the
       same color for the same person. */
    slices.forEach(function(sl){
      sl.color = sl.label === "Unassigned" ? "#8595B5" : personColor(sl.label);
    });
    var s = '<div class="card card-pad" style="margin-bottom:16px;">';
    s += '<div class="row between" style="margin-bottom:10px; align-items:baseline;">';
    s += '<span class="eyebrow">Spend by person</span>';
    s += '<span class="muted caption">'+(personFilter?"Tap to clear":"Tap to filter")+'</span></div>';
    s += '<div style="display:flex; justify-content:center; margin-bottom:12px;">'+renderPieChart(slices, T, personFilter||null, "All", total, "filter-analysis-person", "person")+'</div>';
    slices.forEach(function(sl,i){
      var pct = total>0 ? (sl.value/total*100) : 0;
      var isSel = personFilter === sl.label;
      s += '<button data-action="filter-analysis-person" data-person="'+esc(sl.label)+'" class="row between" style="width:100%; text-align:left; background:none; border:none; padding:8px 0;'+(i>0?"border-top:1px solid var(--sep);":"")+(personFilter&&!isSel?"opacity:0.45;":"")+'">';
      s += '<span class="row" style="align-items:center; gap:9px; min-width:0;">'+(sl.label==="Unassigned"
        ? '<span style="width:11px;height:11px;border-radius:3px;flex-shrink:0;background:#8595B5;"></span><span class="subhead">Unassigned</span>'
        : personChip(sl.label))+'</span>';
      s += '<span class="row" style="align-items:baseline; gap:10px;"><span class="mono subhead">'+fmt(sl.value,0)+'</span><span class="muted mono caption" style="width:36px; text-align:right;">'+pct.toFixed(0)+'%</span></span>';
      s += '</button>';
    });
    s += '</div>';
    return s;
  };

  sectionHtml.dow = function(){
    var dowSums = [0,0,0,0,0,0,0], dowCounts = [0,0,0,0,0,0,0];
    cs.rows.forEach(function(r){
      var dow = parseD(r.date).getDay();
      var idx = dow===0?6:dow-1;
      dowSums[idx] += (r.items||[]).reduce(function(t,it){ return keepItem(it) ? t+personScopedAmount(it, personFilter) : t; }, 0);
      dowCounts[idx] += 1;
    });
    var dowLabels = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    var dowAvg = dowSums.map(function(s2,i){ return dowCounts[i]>0 ? s2/dowCounts[i] : 0; });
    var maxDow = Math.max.apply(null, dowAvg.concat([1]));
    var s = '<div class="card card-pad" style="margin-bottom:16px;">';
    s += '<div class="eyebrow" style="margin-bottom:12px;">Average spend by day of week</div>';
    dowLabels.forEach(function(lbl,i){
      var pct = maxDow>0 ? Math.round((dowAvg[i]/maxDow)*100) : 0;
      var over = !catFilter && !personFilter && dowAvg[i] > da;
      s += '<div class="row" style="align-items:center; gap:10px; margin-bottom:8px;">';
      s += '<span class="muted footnote" style="width:30px;">'+lbl+'</span>';
      s += '<div style="flex:1; background:var(--fill); border-radius:5px; height:9px; overflow:hidden;"><div style="width:'+pct+'%; height:100%; border-radius:5px; background:'+(over?"var(--rust)":"var(--positive)")+';"></div></div>';
      s += '<span class="mono muted footnote" style="width:44px; text-align:right;">'+fmt(dowAvg[i],0)+'</span>';
      s += '</div>';
    });
    s += '</div>';
    return s;
  };

  sectionHtml.topTransactions = function(){
    var allItems = [];
    cs.rows.forEach(function(r){
      r.items.forEach(function(it){ if (keepItem(it)) allItems.push({date:r.date, note:it.note, amount:personScopedAmount(it, personFilter), category:it.category}); });
    });
    allItems.sort(function(a,b){ return b.amount - a.amount; });
    var top5 = allItems.slice(0,5);
    var s = '<div class="card card-pad" style="margin-bottom:16px;">';
    s += '<div class="eyebrow" style="margin-bottom:10px;">Biggest transactions</div>';
    if (top5.length === 0) {
      s += '<div class="muted subhead">Nothing logged in this period.</div>';
    } else {
      top5.forEach(function(it,i){
        var titleText = it.note ? it.note : (it.category ? it.category : "Spent");
        var subtitleText = dayLabel(it.date) + (it.note && it.category ? " · "+it.category : "");
        s += '<div class="row" style="align-items:center; gap:10px; padding:8px 0;'+(i>0?"border-top:1px solid var(--sep);":"")+'">';
        s += catIconCircle(it.category);
        s += '<div style="flex:1; min-width:0;"><div class="subhead" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">'+esc(titleText)+'</div><div class="muted caption" style="margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">'+esc(subtitleText)+'</div></div>';
        s += '<div class="mono subhead" style="flex-shrink:0;">'+fmt(it.amount,2)+' AED</div>';
        s += '</div>';
      });
    }
    s += '</div>';
    return s;
  };

  var order = normalizeAnalysisOrder(state.settings.analysisSectionOrder);
  var hiddenSet = normalizeHiddenSections(state.settings.analysisHiddenSections);
  order.forEach(function(id, idx){
    var isHidden = hiddenSet.indexOf(id) !== -1;
    if (!state.analysisReorderMode) {
      if (isHidden) return;
      var content = sectionHtml[id] ? sectionHtml[id]() : "";
      if (!content) return;
      h += content;
      return;
    }
    h += '<div class="row between" style="padding:0 2px 6px; align-items:center;'+(isHidden?"opacity:0.55;":"")+'">';
    h += '<span class="muted" style="font-size:11px;">'+esc(ANALYSIS_SECTION_LABELS[id]||id)+(isHidden?" · hidden":"")+'</span>';
    h += '<div class="row gap2">';
    h += '<button data-action="toggle-analysis-hidden" data-section="'+id+'" style="background:none;border:none;padding:3px;color:var(--text-muted);" aria-label="'+(isHidden?"Show":"Hide")+' section">'+(isHidden?ICONS.eyeOff:ICONS.eye)+'</button>';
    h += '<button data-action="move-analysis-section" data-section="'+id+'" data-dir="-1" style="background:none;border:none;padding:3px;color:'+(idx===0?"var(--hairline)":"var(--text-muted)")+';" '+(idx===0?"disabled":"")+' aria-label="Move up">'+ICONS.chevronUp+'</button>';
    h += '<button data-action="move-analysis-section" data-section="'+id+'" data-dir="1" style="background:none;border:none;padding:3px;color:'+(idx===order.length-1?"var(--hairline)":"var(--text-muted)")+';" '+(idx===order.length-1?"disabled":"")+' aria-label="Move down">'+ICONS.chevronDown+'</button>';
    h += '</div></div>';
    if (!isHidden) {
      var contentR = sectionHtml[id] ? sectionHtml[id]() : "";
      h += contentR;
    }
  });

  return h;
}

/* Total already logged by a rule so far — summed per-occurrence rather than
   multiplied, since a split's final day carries a different (remainder)
   amount than the rest. */
function ruleLoggedAmount(rule) {
  var sum = 0;
  for (var i=0; i<(rule.occurrencesLogged||0); i++) sum += ruleOccurrenceAmount(rule, i);
  return round2(sum);
}

function renderPlansBody() {
  var rules = state.settings.recurringRules || [];
  var today = todayStr();
  var h = "";
  h += '<div class="eyebrow" style="margin-bottom:4px;">Plans</div>';
  h += '<div class="muted caption" style="margin-bottom:14px;">Recurring payments and spread-out costs. Each one logs itself when its day arrives \u2014 including catching up on anything missed while the app was closed.</div>';

  function ruleCard(rule) {
    var complete = ruleIsComplete(rule);
    var paused = !rule.active && !complete;
    var freqLabel = rule.frequency === "daily" ? "Daily" : rule.frequency === "weekly" ? "Every week" : "Every month";
    var logged = rule.occurrencesLogged || 0;
    var s = '<div class="card card-pad" style="margin-bottom:8px;'+(paused?" opacity:0.6;":"")+'">';
    s += '<div class="row between" style="align-items:flex-start;">';
    s += '<div class="row gap2" style="align-items:center; min-width:0;">';
    s += catIconCircle(rule.category);
    s += '<div style="min-width:0;">';
    s += '<div style="font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">'+esc(rule.note || rule.category || (rule.kind==="split"?"Spread":"Recurring payment"))+'</div>';
    var metaBits = [];
    if (rule.kind === "split") metaBits.push("Spread over "+rule.occurrencesTotal+" days");
    else metaBits.push(freqLabel);
    metaBits.push(fmt(rule.amount,2)+" AED"+(rule.kind==="split"?"/day":""));
    s += '<div class="muted caption" style="margin-top:2px;">'+esc(metaBits.join(" \u00b7 "))+'</div>';
    s += '</div></div>';
    s += '<div class="row gap2" style="flex-shrink:0;">';
    if (!complete) s += '<button data-action="toggle-recurring-active" data-id="'+esc(rule.id)+'" style="background:none;border:none;padding:5px;color:var(--text-muted);" aria-label="'+(rule.active?"Pause":"Resume")+'">'+(rule.active?ICONS.pause:ICONS.play)+'</button>';
    s += '<button data-action="delete-recurring" data-id="'+esc(rule.id)+'" style="background:none;border:none;padding:5px;color:var(--text-muted);" aria-label="Delete">'+ICONS.trash+'</button>';
    s += '</div></div>';

    s += '<div class="hairline-top" style="margin-top:10px; padding-top:10px;">';
    if (rule.occurrencesTotal != null) {
      var pct = Math.round((logged/rule.occurrencesTotal)*100);
      s += '<div class="row between" style="margin-bottom:6px;"><span class="muted caption">'+logged+' of '+rule.occurrencesTotal+' logged</span>';
      if (rule.kind === "split") {
        var remaining = round2(rule.splitTotal - ruleLoggedAmount(rule));
        s += '<span class="mono caption">'+fmt(remaining,2)+' AED left</span>';
      }
      s += '</div>';
      s += '<div style="background:var(--fill); border-radius:999px; height:6px; overflow:hidden;"><div style="width:'+pct+'%; height:100%; background:'+(complete?"var(--positive)":"var(--accent)")+';"></div></div>';
    } else {
      s += '<div class="muted caption">'+logged+' logged so far \u00b7 ongoing</div>';
    }
    var statusLine;
    if (complete) statusLine = rule.occurrencesTotal != null ? "Finished" : "Ended "+shortLabel(rule.endDate);
    else if (paused) statusLine = "Paused";
    else {
      var nextDue = recurringOccurrenceDate(rule, logged);
      statusLine = (nextDue <= today ? "Due now" : "Next on "+shortLabel(nextDue));
      if (rule.endDate) statusLine += " \u00b7 until "+shortLabel(rule.endDate);
    }
    s += '<div class="caption" style="margin-top:8px; color:'+(complete?"var(--positive)":(paused?"var(--text-muted)":"var(--accent)"))+';">'+esc(statusLine)+'</div>';
    s += '</div></div>';
    return s;
  }

  var activeRules = rules.filter(function(r){ return !ruleIsComplete(r); });
  var doneRules = rules.filter(function(r){ return ruleIsComplete(r); });

  if (!rules.length) {
    h += '<div class="card card-pad" style="margin-bottom:16px;"><div class="muted" style="font-size:13px;">Nothing scheduled yet. Add a recurring payment below, or use \u201cSplit across days\u201d when adding a transaction to spread one cost out.</div></div>';
  }
  if (activeRules.length) {
    h += '<div class="eyebrow" style="margin-bottom:8px;">Active</div>';
    activeRules.forEach(function(r){ h += ruleCard(r); });
  }
  if (doneRules.length) {
    h += '<div class="eyebrow" style="margin:16px 0 8px;">Finished</div>';
    doneRules.forEach(function(r){ h += ruleCard(r); });
  }

  h += '<div class="card card-pad" style="margin-top:16px; margin-bottom:16px;">';
  h += '<div class="eyebrow" style="margin-bottom:10px;">Add recurring payment</div>';
  h += '<div style="position:relative; margin-bottom:8px;"><span class="muted" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:14px;">AED</span>';
  h += '<input id="recurringAmountInput" type="number" inputmode="decimal" step="0.01" min="0" class="field mono" style="padding-left:44px;" placeholder="Amount" /></div>';
  h += '<select id="recurringCategoryInput" class="field" style="margin-bottom:8px;"><option value="">No category</option>';
  (state.settings.categories||[]).forEach(function(c){ h += '<option value="'+esc(c)+'">'+esc(c)+'</option>'; });
  h += '</select>';
  if ((state.settings.people||[]).length) {
    var recDefaultPerson = state.settings.defaultPerson||"";
    h += '<select id="recurringPersonInput" class="field" style="margin-bottom:8px;"><option value=""'+(recDefaultPerson===""?" selected":"")+'>Who\u2019s this for? (optional)</option>';
    (state.settings.people||[]).forEach(function(p){ h += '<option value="'+esc(p)+'"'+(recDefaultPerson===p?" selected":"")+'>'+esc(p)+'</option>'; });
    h += '</select>';
  }
  h += '<input id="recurringNoteInput" type="text" class="field" style="margin-bottom:8px;" placeholder="What\u2019s it for? (e.g. Rent)" />';
  h += '<div class="row gap2" style="margin-bottom:8px;">';
  h += '<select id="recurringFrequencyInput" class="field" style="flex:1;"><option value="weekly">Every week</option><option value="monthly">Every month</option></select>';
  h += '<input id="recurringStartDateInput" type="date" class="field mono" style="flex:1;" value="'+today+'" />';
  h += '</div>';
  h += '<div class="muted caption" style="margin-bottom:10px;">Starts on that date, then repeats on the same day each week or month.</div>';
  var limitMode = state.recurringLimitMode || "ongoing";
  h += '<div class="seg" style="margin-bottom:8px;">';
  [["ongoing","Ongoing"],["count","Set number"],["until","Until date"]].forEach(function(opt){
    h += '<button class="seg-btn" role="tab" aria-selected="'+(limitMode===opt[0])+'" data-action="set-recurring-limit-mode" data-mode="'+opt[0]+'">'+opt[1]+'</button>';
  });
  h += '</div>';
  if (limitMode === "count") {
    h += '<input id="recurringCountInput" type="number" inputmode="numeric" min="1" step="1" class="field" style="margin-bottom:8px;" placeholder="Number of times" />';
  } else if (limitMode === "until") {
    h += '<input id="recurringEndDateInput" type="date" class="field mono" style="margin-bottom:8px;" />';
    h += '<div class="muted caption" style="margin-bottom:8px;">Stops after this date.</div>';
  }
  h += '<button data-action="add-recurring" class="btn-accent" style="width:100%;">Add recurring payment</button>';
  h += '</div>';
  return h;
}
