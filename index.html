  if (txnSwipe.intent !== 'horizontal') { removeTxnNavOverlay(txnSwipe.parts); txnSwipe = null; return; }
  var threshold = Math.min(125, window.innerWidth * 0.30);
  var commit = txnSwipe.dx >= threshold || (txnSwipe.dx > 42 && txnSwipe.velocity > 0.55);
  finishTxnSwipe(commit);
}, { passive:true });

document.addEventListener('touchcancel', function(){ if (txnSwipe) finishTxnSwipe(false); }, { passive:true });

/* Keep an Analysis drill-down card visually anchored while its surrounding
   sections appear/disappear. Preserving raw window.scrollY is not enough: when
   a category filter hides the large charts above it, the old scroll position
   can exceed the new document height and iOS clamps straight to the bottom. */
function captureAnalysisAnchor(id) {
  var el = document.getElementById(id);
  state.analysisAnchorRestore = el ? { id:id, top:el.getBoundingClientRect().top } : null;
}
function restoreAnalysisAnchor() {
  var anchor = state.analysisAnchorRestore;
  if (!anchor) return;
  state.analysisAnchorRestore = null;
  requestAnimationFrame(function(){
    var el = document.getElementById(anchor.id);
    if (!el) return;
    var delta = el.getBoundingClientRect().top - anchor.top;
    if (Math.abs(delta) > 0.5) window.scrollBy(0, delta);
  });
}

function renderResetConfirmationOverlays() {
  var html = "";
  if (state.showResetConfirm) {
    html += '<div class="modal-backdrop" data-action="close-reset" style="padding:0 24px;">';
    html += '<div class="modal-card" style="border-radius:16px;" data-action="noop">';
    html += '<div class="sheet-title" style="margin-bottom:8px;">Clear all entries?</div>';
    html += '<div class="muted" style="font-size:14px; margin-bottom:12px;">Every logged transaction is removed. Your settings stay, but forecast-learning history is reset. This can\'t be undone.</div>';
    html += '<label class="eyebrow">Type CLEAR to confirm</label><input id="clearConfirmInput" class="field" autocomplete="off" autocapitalize="characters" placeholder="CLEAR" style="margin:6px 0 14px;" />';
    html += '<div class="row gap2">';
    html += '<button data-action="close-reset" class="btn-outline" style="flex:1;">Cancel</button>';
    html += '<button id="clearConfirmBtn" data-action="confirm-reset" class="btn-rust row gap2" style="flex:1; justify-content:center; align-items:center;opacity:.4;" disabled>'+ICONS.rotate+' Clear</button>';
    html += '</div></div></div>';
  }
  if (state.showFactoryResetConfirm) {
    html += '<div class="modal-backdrop" data-action="close-factory-reset" style="padding:0 24px;">';
    html += '<div class="modal-card" style="border-radius:16px;" data-action="noop">';
    html += '<div class="sheet-title" style="margin-bottom:8px;">Reset app to defaults?</div>';
    html += '<div class="muted" style="font-size:14px; margin-bottom:12px;">Everything in The Ledger on this device is erased, including local recovery snapshots. The app restarts with the current defaults and today as the tracking start date. This cannot be undone.</div>';
    html += '<label class="eyebrow">Type RESET to confirm</label><input id="factoryResetConfirmInput" class="field" autocomplete="off" autocapitalize="characters" placeholder="RESET" style="margin:6px 0 14px;" />';
    html += '<div class="row gap2">';
    html += '<button data-action="close-factory-reset" class="btn-outline" style="flex:1;">Cancel</button>';
    html += '<button id="factoryResetConfirmBtn" data-action="confirm-factory-reset" class="btn-rust row gap2" style="flex:1; justify-content:center; align-items:center;opacity:.4;" disabled>'+ICONS.rotate+' Reset</button>';
    html += '</div></div></div>';
  }
  return html;
}

function render() {
  var root = document.getElementById("root");
  var T = effectivePalette();
  applyTheme(T);
  document.documentElement.classList.toggle("simple-home", state.page === "home" && !!state.settings.homeSimpleView && !state.showAddTxn && !state.showSettings);

  var anyModalOpen = state.showBackup || state.showResetConfirm || state.showFactoryResetConfirm;
  if (anyModalOpen) lockBodyScroll(); else unlockBodyScroll();

  /* root.innerHTML = html below destroys and recreates every element on every
     render, including whichever scrollable container the person is currently
     scrolled through — so without this, expanding a category's icon editor
     (or any other in-place UI change) would silently snap them back to the
     top every single time. Captured here, before the rebuild; restored after
     it, onto the freshly-created element that takes its place. Modal scroll
     and page scroll are mutually exclusive: while a modal is open the body is
     pinned via lockBodyScroll, so only the modal's own scrollTop matters;
     with no modal open, the page's own scroll position is what matters. */
  var modalCardEl = document.querySelector(".modal-card");
  var txnEntryPageEl = document.querySelector(".txn-entry-page");
  var settingsPageEl = document.querySelector(".settings-page");
  var planEntryPageEl = document.querySelector(".plan-entry-page");
  var savedTxnEntryScrollY = txnEntryPageEl ? (window.scrollY || window.pageYOffset || 0) : 0;
  var savedPlanEntryScrollY = planEntryPageEl ? (window.scrollY || window.pageYOffset || 0) : 0;
  var savedSettingsScrollY = settingsPageEl ? (window.scrollY || window.pageYOffset || 0) : 0;
  var savedModalScrollTop = modalCardEl ? modalCardEl.scrollTop : 0;
  var savedPageScrollY = (modalCardEl || txnEntryPageEl || settingsPageEl || planEntryPageEl) ? 0 : (window.scrollY || window.pageYOffset || 0);

  if (state.loading) {
    root.innerHTML = '<div class="row" style="min-height:100vh; align-items:center; justify-content:center;"><div class="muted" style="font-size:14px;">Loading your ledger…</div></div>';
    return;
  }

  var da = dailyAllowance();

  /* Add/Edit transaction is its own screen. Keeping it outside the normal app
     shell prevents the bottom nav, FAB and underlying page from moving when
     iOS opens/closes the keyboard. */
  if (state.showAddTxn) {
    root.innerHTML = renderAddTxnPage();
    applyReportingCurrencyText(root);
    window.scrollTo(0, savedTxnEntryScrollY);
    return;
  }

  if (state.showSettings) {
    root.innerHTML = renderSettingsPage() + renderResetConfirmationOverlays();
    applyReportingCurrencyText(root);
    /* Keep the Settings page in place behind the confirmation sheet. The v80
       renderer returned before modal markup was added, so tapping either
       reset action from Settings changed state but displayed nothing. */
    if (!(state.showResetConfirm || state.showFactoryResetConfirm)) window.scrollTo(0, savedSettingsScrollY);
    return;
  }

  /* Creating a plan is also a dedicated screen. This keeps the fixed app tab
     bar out of the keyboard area and avoids the visual-viewport overlap that
     made the inline form look broken on iPhone. */
  if (state.page === "plans" && state.plansCreateOpen) {
    root.innerHTML = renderPlanEditorPage();
    applyReportingCurrencyText(root);
    window.scrollTo(0, savedPlanEntryScrollY);
    return;
  }

  var html = "";
  html += '<div class="wrap page-'+esc(state.page)+'">';

  // Sticky primary-app header. Editors and Settings have their own bars.
  html += '<div class="app-topbar">';
  html += '<div class="brand-lockup"><div class="brand-title">The Ledger</div><span class="version-badge">'+APP_VERSION+'</span></div>';
  html += '<div class="row gap2">';
  html += '<button class="icon-btn press" data-action="toggle-theme" aria-label="'+(state.settings.theme==="dark"?"Switch to light mode":"Switch to dark mode")+'">'+(state.settings.theme==="dark"?ICONS.sun:ICONS.moon)+'</button>';
  html += '<button class="icon-btn press" data-action="open-settings" aria-label="Settings">'+ICONS.settings+'</button>';
  html += '</div></div>';

  // storage warning
  if (state.storageOK === false) {
    html += '<div class="card" style="padding:12px 16px; margin-bottom:12px; display:flex; gap:10px; background:var(--rust-wash); border-color:var(--rust);">';
    html += '<div style="flex-shrink:0; margin-top:1px; color:var(--rust);">'+ICONS.alert+'</div>';
    html += '<div><div style="font-size:12px;">Your browser is blocking local storage (common in Private Browsing).</div>';
    html += '<button data-action="open-backup" style="background:none;border:none;padding:0;text-decoration:underline;color:var(--rust);font-size:12px;margin-top:4px;">Open backup as a safety net</button></div></div>';
  }

  if (state.page === "transactions") html += renderTransactionsBody();
  else if (state.page === "calendar") html += renderCalendarBody();
  else if (state.page === "budget") html += renderBudgetBody(T);
  else if (state.page === "plans") html += renderPlansBody();
  else if (state.page === "analysis") html += renderAnalysisBody(T);
  else html += renderHomeBody(T, da);

  if (state.saveError) {
    html += '<div style="text-align:center; margin-top:12px; font-size:12px; color:var(--rust);">Couldn\'t save '+esc(state.saveError.label)+' — <button data-action="retry-save" style="background:none;border:none;padding:0;text-decoration:underline;color:var(--rust);font-size:12px;">tap to retry</button>.</div>';
  }

  html += '</div>'; // end wrap
  if (state.page === "home" || state.page === "transactions" || state.page === "calendar" || state.page === "budget") html += renderFab();
  html += renderBottomNav();

  // modals
  if (state.showBackup) {
    var backupText = JSON.stringify({settings:state.settings, entries:state.entries}, null, 2);
    html += '<div class="modal-backdrop" data-action="close-backup">';
    html += '<div class="modal-card" data-action="noop">';
    html += '<div class="modal-sticky-header"><div class="grabber"></div>';
    html += '<div class="row between">'+'<div class="sheet-title">Backup & restore</div><button data-action="close-backup" style="background:none;border:none;color:var(--text-muted);">'+ICONS.x+'</button></div></div>';
    html += '<div class="muted" style="font-size:12px; margin-bottom:8px; margin-top:14px;">Use this to move data to another device, or as a safety net.</div>';
    html += '<textarea readonly class="field mono" style="height:120px; font-size:11px; margin-bottom:8px; resize:none;" onfocus="this.select()">'+esc(backupText)+'</textarea>';
    html += '<button id="copyBackupBtn" data-action="copy-backup" class="btn-accent" style="width:100%; margin-bottom:20px;">Copy backup</button>';
    html += '<div class="muted" style="font-size:12px; margin-bottom:8px;">Restore from a backup:</div>';
    html += '<textarea id="restoreInput" class="field mono" style="height:90px; font-size:11px; margin-bottom:8px; resize:none;" placeholder="Paste backup text here"></textarea>';
    if (state.restoreError) html += '<div style="color:var(--rust); font-size:12px; margin-bottom:8px;">'+esc(state.restoreError)+'</div>';
    html += '<button data-action="restore-backup" class="btn-outline" style="width:100%;">Restore this backup</button>';
    html += '</div></div>';
  }

  html += renderResetConfirmationOverlays();

  if (state.toastMessage) {
    html += '<div style="position:fixed; top:calc(env(safe-area-inset-top,0px) + 16px); left:50%; transform:translateX(-50%); background:var(--positive); color:#0C1322; font-size:13px; font-weight:600; padding:9px 18px; border-radius:999px; box-shadow:0 4px 14px rgba(0,0,0,0.35); z-index:60;">'+esc(state.toastMessage)+'</div>';
  }

  root.innerHTML = html;
  applyReportingCurrencyText(root);
  var newModalCardEl = document.querySelector(".modal-card");
  if (state.txnEntryRestoreScroll) {
    var restoreTxnY = state.txnEntryReturnScrollY || 0;
    state.txnEntryRestoreScroll = false;
    window.scrollTo(0, restoreTxnY);
  } else if (state.plansRestoreScroll) {
    var restorePlanY = state.plansReturnScrollY || 0;
    state.plansRestoreScroll = false;
    window.scrollTo(0, restorePlanY);
  } else if (newModalCardEl) {
    if (savedModalScrollTop) newModalCardEl.scrollTop = savedModalScrollTop;
  } else if (savedPageScrollY) {
    window.scrollTo(0, savedPageScrollY);
  }
  if ((state.page === "budget" || state.page === "analysis") && lastChartData) wireBalanceChart(lastChartData);
  if ((state.page === "analysis" || state.page === "budget") && lastForecastChartData) wireForecastChart(lastForecastChartData);
  if (state.page === "analysis" && lastCashBalanceChartData) wireCashBalanceChart(lastCashBalanceChartData);
  if (state.page === "analysis" && lastAnalysisForecastChartData) wireAnalysisForecastChart(lastAnalysisForecastChartData);
  if (state.page === "budget" && lastBudgetTrendChartData) wirePeriodTrendChart("budget", lastBudgetTrendChartData);
  if (state.page === "analysis" && lastOverallTrendChartData) wirePeriodTrendChart("overall", lastOverallTrendChartData);
  if (state.page === "home" && lastHomeBudgetPositionData) wireMiniBudgetPositionChart(lastHomeBudgetPositionData);
  if (state.page === "analysis") restoreAnalysisAnchor();
}


/* Forecast-aware live budget pacing — v40 hybrid daily + cadence model.

   The budget is split into two different kinds of spending because they should
   not hit today's allowance in the same way:

     ESSENTIAL CADENCE / PLANNED spending (e.g. Diapers or Health)
       -> reserve the expected event from the FULL remaining-period budget, then
          spread that effect across the remaining calendar days.
       -> when the event actually happens, the actual replaces its opening-day
          reserve. Only the difference between actual and reserved amount changes
          the daily allowance.

     FLEXIBLE FORECASTS (e.g. Baby Gear or Maid when marked Flexible)
       -> stay in the month-end forecast but are NOT hard-reserved, so a likely
          optional purchase cannot block today's essential food allowance.

     DAILY spending (including frequent essentials such as Restaurants/Groceries)
       -> stays available inside today's allowance and subtracts 1-for-1 when spent.

   Opening Safe Today for each horizon is therefore:

     (opening budget remaining
      - cadence reserves from today through period-end
      - scheduled commitments from today through period-end)
     / remaining days including today

   Then today's flexible spend is subtracted directly. Cadence actuals are
   compared with the amount that was already reserved at the opening of today;
   only the difference is spread across the remaining days.

   Week and Month are calculated independently and the lower result is shown. */
function liveBudgetPacing() {
  var today = todayStr();
  var yesterday = toStr(addDays(parseD(today), -1));
  var todayItems = state.entries[today] ? (state.entries[today].items || []) : [];
  var spentTodayBudget = state.entries[today] ? sumBudgetSpent(state.entries[today]) : 0;
  var spentTodayAll = state.entries[today] ? sumSpentAll(state.entries[today]) : 0;

  function todaySpendBuckets(openingProfiles, scope) {
    var flexible = 0, recurring = 0, cadence = 0, cadenceBySub = {}, recurringBySub = {};
    todayItems.forEach(function(it){
      if (!expenseCountsForScope(it, scope)) return;
      var amount = Number(it.amount) || 0;
      var key = subcategoryKey(it);
      if (it.recurringId) {
        if (subcategoryEssentialForSafeSpend(key)) {
          recurring += amount;
          recurringBySub[key] = round2((recurringBySub[key] || 0) + amount);
        } else flexible += amount;
        return;
      }
      var p = openingProfiles ? openingProfiles[key] : null;
      if (p && (p.mode === "cadence" || p.mode === "lumpy") && subcategoryEssentialForSafeSpend(key)) {
        cadence += amount;
        cadenceBySub[key] = round2((cadenceBySub[key] || 0) + amount);
      } else flexible += amount;
    });
    return { flexible:round2(flexible), recurring:round2(recurring), cadence:round2(cadence), cadenceBySub:cadenceBySub, recurringBySub:recurringBySub };
  }

  /* The same reserve→actual substitution model can pace either the controllable
     Budget scope or ALL spending. Savings target uses the latter, because the
     goal is a percentage of full income and therefore must account for rent,
     mortgage and every other real expense too. */
  function horizon(mode, scope, targetOverride) {
    scope = scope || "budget";
    var per = getPeriodBounds(mode, 0, currentWeeklyTarget(), dailyAllowance());
    if (today < per.startStr || today > per.endStr) return {mode:mode,scope:scope,avg:null,openingRemaining:null,currentRemaining:null,days:0,safe:null,rawSafe:null,openingSafe:null,adjustmentNeeded:null,futureReserve:null,flexiblePool:null,forecast:null,todayFlexibleSpent:0,todayCadenceSpent:0,cadenceAdjustment:0,spentTodayScope:0};

    var stats = scope === "budget" ? periodStatsBudget(per.startStr, per.endStr) : periodStatsOverall(per.startStr, per.endStr);
    var target = targetOverride != null ? Math.max(0,Number(targetOverride)||0) : per.target;
    var spentTodayScope = scope === "budget" ? spentTodayBudget : spentTodayAll;
    var currentRemaining = round2(target - stats.spent);
    var openingRemaining = round2(currentRemaining + spentTodayScope);
    var days = daysBetween(today, per.endStr) + 1;
    var avg = days > 0 ? currentRemaining / days : null;

    var openingProfiles = forecastCategoryProfiles(scope, yesterday);
    var openingBehavior = buildBehavioralForecast(scope, yesterday, today, per.endStr);
    var buckets = todaySpendBuckets(openingProfiles, scope);

    var cadenceReserveBySub = {}, openingCadenceReserve = 0, reserveBreakdownBySub = {}, flexibleForecastBySub = {};
    /* v64 keeps the forecast evidence next to the Safe-to-Spend decision instead
       of forcing the user to hunt for a second details panel under the chart.
       Each subcategory can carry one or more forecast-driver components so a
       scheduled plan and a learned cadence can coexist without losing context. */
    function addForecastDriver(target, meta) {
      if(!target || !meta) return;
      if(!target.details) target.details=[];
      target.details.push(meta);
    }
    function addReserveBreakdown(key, amount, kind, meta) {
      amount=round2(Math.max(0,Number(amount)||0)); if(amount<=0)return;
      var label=key==="__uncategorised__"?"Uncategorised":key;
      if(!reserveBreakdownBySub[label]) reserveBreakdownBySub[label]={category:label,amount:0,cadence:0,scheduled:0,frequent:0,details:[]};
      reserveBreakdownBySub[label].amount=round2(reserveBreakdownBySub[label].amount+amount);
      reserveBreakdownBySub[label][kind]=round2((reserveBreakdownBySub[label][kind]||0)+amount);
      addForecastDriver(reserveBreakdownBySub[label],meta);
    }
    function addFlexibleForecast(key, amount, kind, meta) {
      amount=round2(Math.max(0,Number(amount)||0)); if(amount<=0)return;
      var label=key==="__uncategorised__"?"Uncategorised":key;
      if(!flexibleForecastBySub[label]) flexibleForecastBySub[label]={category:label,amount:0,cadence:0,scheduled:0,frequent:0,details:[]};
      flexibleForecastBySub[label].amount=round2(flexibleForecastBySub[label].amount+amount);
      flexibleForecastBySub[label][kind]=round2((flexibleForecastBySub[label][kind]||0)+amount);
      addForecastDriver(flexibleForecastBySub[label],meta);
    }
    Object.keys(openingBehavior.bySubcategory||{}).forEach(function(k){
      var x=openingBehavior.bySubcategory[k]; if(!x)return;
      if(x.kind==="cadence"){
        var expected=round2(Math.max(0,x.amount||0));
        var r=round2(Math.max(0,x.safeReserve||x.amount||0));
        var cadenceMeta={kind:"cadence",expectedAmount:expected,protectedAmount:r,probability:x.probability==null?null:x.probability,expectedCount:x.expectedCount==null?null:x.expectedCount,likelyAmount:round2(x.likelyAmount||(x.profile&&x.profile.typicalAmount)||0),profile:x.profile||null,reason:x.reason||""};
        if(subcategoryEssentialForSafeSpend(k)){ cadenceReserveBySub[k]=r; openingCadenceReserve+=r; addReserveBreakdown(k,r,"cadence",cadenceMeta); }
        else addFlexibleForecast(k,expected,"cadence",cadenceMeta);
      } else if(x.kind==="lumpy") {
        var lExpected=round2(Math.max(0,x.amount||0)), lReserve=round2(Math.max(0,x.safeReserve||lExpected));
        var lMeta={kind:"lumpy",expectedAmount:lExpected,protectedAmount:lReserve,probability:x.probability==null?null:x.probability,likelyAmount:round2(x.likelyAmount||(x.profile&&x.profile.typicalAmount)||0),profile:x.profile||null,reason:x.reason||""};
        if(subcategoryEssentialForSafeSpend(k)){cadenceReserveBySub[k]=lReserve;openingCadenceReserve+=lReserve;addReserveBreakdown(k,lReserve,"lumpy",lMeta);}
        else addFlexibleForecast(k,lExpected,"lumpy",lMeta);
      } else if(x.kind==="frequent") {
        /* Frequent categories (including essential Restaurants/Groceries) are
           forecast drivers but are not hard-reserved; the daily allowance is
           what gives them room. Show their expected contribution here. */
        addFlexibleForecast(k,round2(Math.max(0,x.amount||0)),"frequent",{kind:"frequent",expectedAmount:round2(Math.max(0,x.amount||0)),likelyAmount:round2((x.profile&&x.profile.typicalAmount)||0),profile:x.profile||null});
      }
    });
    openingCadenceReserve=round2(openingCadenceReserve);

    var futureScheduledBySub=scheduledExpenseBreakdown(today,per.endStr,scope), futureScheduledAfterToday=0;
    Object.keys(futureScheduledBySub).forEach(function(k){
      var a=round2(futureScheduledBySub[k]||0), scheduledMeta={kind:"scheduled",expectedAmount:a,protectedAmount:a,probability:1,likelyAmount:a,profile:null};
      if(subcategoryEssentialForSafeSpend(k)){futureScheduledAfterToday+=a;addReserveBreakdown(k,a,"scheduled",scheduledMeta);}
      else addFlexibleForecast(k,a,"scheduled",scheduledMeta);
    });
    futureScheduledAfterToday=round2(futureScheduledAfterToday);
    var dueTodayBySub=scheduledExpenseBreakdown(yesterday,today,scope), dueTodayEssential=0, dueTodayEssentialBySub={};
    Object.keys(dueTodayBySub).forEach(function(k){
      var a=round2(dueTodayBySub[k]||0);
      if(subcategoryEssentialForSafeSpend(k)){dueTodayEssential+=a;dueTodayEssentialBySub[k]=a;}
      else addFlexibleForecast(k,a,"scheduled",{kind:"scheduled",expectedAmount:a,protectedAmount:a,probability:1,likelyAmount:a,profile:null});
    });
    dueTodayEssential=round2(dueTodayEssential);
    var openingScheduledToday=round2(Math.max(dueTodayEssential,buckets.recurring));
    var todayScheduledBreakdown=buckets.recurring>=dueTodayEssential?buckets.recurringBySub:dueTodayEssentialBySub;
    Object.keys(todayScheduledBreakdown||{}).forEach(function(k){var a=round2(todayScheduledBreakdown[k]||0);addReserveBreakdown(k,a,"scheduled",{kind:"scheduled",expectedAmount:a,protectedAmount:a,probability:1,likelyAmount:a,profile:null});});
    var openingScheduledReserve=round2(futureScheduledAfterToday+openingScheduledToday);

    var openingReserve=round2(openingCadenceReserve+openingScheduledReserve);
    var reserveBreakdown=Object.keys(reserveBreakdownBySub).map(function(k){return reserveBreakdownBySub[k];}).sort(function(a,b){return b.amount-a.amount;});
    var flexibleForecastBreakdown=Object.keys(flexibleForecastBySub).map(function(k){return flexibleForecastBySub[k];}).sort(function(a,b){return b.amount-a.amount;});
    var flexibleForecastTotal=round2(flexibleForecastBreakdown.reduce(function(s,x){return s+x.amount;},0));
    var openingFlexiblePool=round2(openingRemaining-openingReserve);
    var openingSafe=days>0?round2(openingFlexiblePool/days):openingFlexiblePool;

    var cadenceAdjustment=0;
    Object.keys(buckets.cadenceBySub||{}).forEach(function(k){cadenceAdjustment+=(buckets.cadenceBySub[k]||0)-(cadenceReserveBySub[k]||0);});
    cadenceAdjustment=round2(cadenceAdjustment);
    var scheduledAdjustment=buckets.recurring>0?round2(buckets.recurring-openingScheduledToday):0;

    var rawSafe=openingSafe;
    if(rawSafe!=null){ rawSafe=round2(rawSafe-buckets.flexible); if(days>0)rawSafe=round2(rawSafe-(cadenceAdjustment+scheduledAdjustment)/days); }
    var safe=rawSafe==null?null:round2(Math.max(0,rawSafe));
    var flexiblePool=round2(openingFlexiblePool-buckets.flexible-cadenceAdjustment-scheduledAdjustment);
    var adjustmentNeeded=round2(Math.max(0,-flexiblePool));
    var forecastStart=effectiveRangeStart(per.startStr), forecastDays=Math.max(1,daysBetween(forecastStart,per.endStr)+1);
    var fc=stats.rows.length?computeForecastNumbers(stats.rows,forecastDays,forecastStart,scope):null;

    return {mode:mode,scope:scope,target:target,avg:avg,openingRemaining:openingRemaining,currentRemaining:currentRemaining,days:days,safe:safe,rawSafe:rawSafe,openingSafe:openingSafe,adjustmentNeeded:adjustmentNeeded,futureReserve:openingReserve,reserveBreakdown:reserveBreakdown,flexibleForecastTotal:flexibleForecastTotal,flexibleForecastBreakdown:flexibleForecastBreakdown,openingCadenceReserve:openingCadenceReserve,openingScheduledReserve:openingScheduledReserve,flexiblePool:flexiblePool,todayFlexibleSpent:buckets.flexible,todayCadenceSpent:buckets.cadence,cadenceAdjustment:cadenceAdjustment,scheduledAdjustment:scheduledAdjustment,spentTodayScope:spentTodayScope,forecast:fc};
  }

  var effectiveInfo=currentEffectiveBudgetInfo();
  var weekPer=getPeriodBounds("week",0,currentWeeklyTarget(),dailyAllowance());
  var monthPer=getPeriodBounds("month",0,currentWeeklyTarget(),dailyAllowance());
  var weekTarget=effectiveBudgetTargetForRange(weekPer.startStr,weekPer.endStr,effectiveInfo);
  var monthTarget=effectiveInfo.effectiveBudget;
  var week=horizon("week","budget",weekTarget);
  var month=horizon("month","budget",monthTarget);

  /* Savings remains a separate goal/diagnostic, but it is no longer exposed as
     a competing day-to-day budget. Its effect is already folded into the one
     effective budget above through projected outside-budget spending. */
  var savings=null, savingsPct=savingsTargetPct();
  if(savingsPct>0){
    var monthOverall=periodStatsOverall(monthPer.startStr,monthPer.endStr);
    var projectedIncome=projectedIncomeForRange(monthPer.startStr,monthPer.endStr);
    if(projectedIncome>0){
      var spendCeiling=savingsSpendCeilingForIncome(projectedIncome);
      savings={mode:"savings",projectedIncome:projectedIncome,savingsTargetPct:savingsPct,savingsTargetAmount:savingsTargetAmountForIncome(projectedIncome),spendCeiling:spendCeiling};
    }
  }

  var avgVals=[week.avg,month.avg].filter(function(v){return v!=null;});
  var dailyAverage=avgVals.length?Math.min.apply(null,avgVals):null;
  var monthKey=effectiveInfo.savingsTight?"effective":"month";
  var candidates=[{key:"week",obj:week},{key:monthKey,obj:month}];
  var limiting=null;
  candidates.forEach(function(c){if(c.obj&&c.obj.rawSafe!=null&&(!limiting||c.obj.rawSafe<limiting.obj.rawSafe))limiting=c;});
  var rawSafeToday=limiting?round2(limiting.obj.rawSafe):null;
  var safeToday=rawSafeToday==null?null:round2(Math.max(0,rawSafeToday));
  var limitingHorizon=limiting?limiting.key:null, limitingObj=limiting?limiting.obj:null;
  var adjustmentNeeded=limitingObj&&limitingObj.adjustmentNeeded!=null?round2(limitingObj.adjustmentNeeded):null;
  var overSafeToday=rawSafeToday!=null?round2(Math.max(0,-rawSafeToday)):null;

  return {week:week,month:month,effective:month,effectiveInfo:effectiveInfo,savings:savings,dailyAverage:dailyAverage,spentToday:spentTodayBudget,spentTodayAll:spentTodayAll,spentTodayForLimit:limitingObj?limitingObj.spentTodayScope:spentTodayBudget,rawSafeToday:rawSafeToday,safeToday:safeToday,overSafeToday:overSafeToday,adjustmentNeeded:adjustmentNeeded,limitingHorizon:limitingHorizon};
}

  details.forEach(function(d){
    if(!d)return;
    var p=d.profile||{};
    if(d.kind==='cadence'||d.kind==='lumpy'){
      var pct=displayProbabilityPct(d.probability);
      var likely=round2(d.likelyAmount||0), expected=round2(d.expectedAmount||0), bits=[];
      var expectedCount=Number(d.expectedCount)||0;
      bits.push('<span style="font-weight:700;color:var(--text);">'+pct+'% chance'+(d.kind==='cadence'&&expectedCount>1.05?' of ≥1':'')+'</span>');

      if(expected>0) bits.push('≈ '+fmt(expected,0)+' AED expected');

    } else if(d.kind==='frequent'){

}

  }
  var formDate = state.entryDate || todayStr();
  var selectedTime = state.entryTimeDraft != null ? state.entryTimeDraft : (editingItem ? (editingItem.time||"") : currentTimeStr());
  var cats = state.settings.categories || [];
  var txnKind = state.txnKind != null ? state.txnKind : (editingItem && editingItem.kind === "income" ? "income" : "expense");
  var splitMode = state.txnSplitMode || "single";
  var selectedCat = state.entryCategoryDraft != null ? state.entryCategoryDraft : (editingItem ? (editingItem.category||"") : "");
  var people = state.settings.people || [];
  var txnTags = state.settings.transactionTags || [];
  var selectedTxnTags = state.entryTagsDraft != null ? normalizeItemTags(state.entryTagsDraft) : (editingItem ? normalizeItemTags(editingItem.tags) : []);
  var selectedPerson = state.entryPersonDraft != null ? state.entryPersonDraft : (editingItem ? (editingItem.person||"") : (state.settings.defaultPerson||""));
  var personSplitMode = people.length >= 2 ? (state.txnPersonSplitMode||"single") : "single";
  var selectedCurrency = state.entryCurrencyDraft != null ? state.entryCurrencyDraft : (editingItem && editingItem.currency ? editingItem.currency : reportingCurrency());
  var amountShown = state.entryAmountDraft != null ? state.entryAmountDraft : (editingItem ? ((editingItem.originalAmount!=null && editingItem.currency)?editingItem.originalAmount:editingItem.amount) : "");
  var fxRateShown = state.entryFxRateDraft != null ? state.entryFxRateDraft : (editingItem && editingItem.fxRate ? (Number(editingItem.fxRate)*reportingRate()) : (selectedCurrency===reportingCurrency()?1:""));
  var fxSourceShown = state.entryFxSourceDraft != null ? state.entryFxSourceDraft : (editingItem && editingItem.fxSource ? editingItem.fxSource : "");
  var parsedShown = parseFloat(amountShown);
  var advancedOpen = !!state.txnAdvancedOpen || !!editingItem || splitMode === "split";

  /* Most-used categories become one-tap choices. The full category hierarchy
     is still available behind More, but common entries no longer require a
     group dropdown followed by a category dropdown. */
  var usage = {};

    (state.entries[d].items||[]).forEach(function(it){ if (it.category) usage[it.category]=(usage[it.category]||0)+1; });
  });
  function sortedCats(list){
    var original = list.slice();
    return list.slice().sort(function(a,b){
      var diff=(usage[b]||0)-(usage[a]||0);
      return diff || (original.indexOf(a)-original.indexOf(b));
    });
  }
  var quickCats = sortedCats(cats).slice(0,8);
  if (selectedCat && quickCats.indexOf(selectedCat)===-1) {
    quickCats.unshift(selectedCat);
    quickCats = quickCats.slice(0,8);
  }

  var h = '<div class="txn-entry-page"><div class="txn-entry-shell">';
  h += '<div class="txn-entry-header">';
  h += '<button data-action="close-add-txn" class="txn-entry-back" aria-label="Back">'+ICONS.chevronLeft+'</button>';
  h += '<div class="txn-entry-header-title">'+(editingItem?"Edit transaction":"Add transaction")+'</div><span></span></div>';
  h += '<div class="txn-entry-content">';

  h += '<div class="seg" style="margin:14px 0 14px;">';
  h += '<button class="seg-btn" role="tab" aria-selected="'+(txnKind==="expense")+'" data-action="set-txn-kind" data-kind="expense">Expense</button>';
  h += '<button class="seg-btn" role="tab" aria-selected="'+(txnKind==="income")+'" data-action="set-txn-kind" data-kind="income">Income</button>';
  h += '</div>';

  h += '<div class="eyebrow" style="margin-bottom:6px;">Amount</div>';
  h += '<div class="field fx-amount-shell" style="margin-bottom:18px;border-radius:14px;">';
  h += '<select id="entryCurrencyInput" class="fx-currency-select" aria-label="Transaction currency">';
  TXN_CURRENCIES.forEach(function(c){ h += '<option value="'+c+'"'+(selectedCurrency===c?' selected':'')+'>'+c+'</option>'; });
  h += '</select>';
  h += '<input id="entryAmountInput" type="number" inputmode="decimal" step="0.01" min="0" class="mono fx-amount-input" placeholder="0.00" value="'+esc(amountShown)+'" />';
  h += '</div>';
  h += '<div id="entryFxPanel" class="fx-panel" style="display:'+(selectedCurrency===reportingCurrency()?'none':'block')+';">';
  h += '<div class="row between" style="gap:8px;"><span id="entryFxStatus" class="muted caption">'+(selectedCurrency===reportingCurrency()?'':(fxSourceShown?('Saved rate · '+esc(fxSourceShown)):'Rate for '+shortLabel(formDate)))+'</span><button data-action="refresh-fx-rate" class="btn-plain" style="font-size:12px;">Use reference rate</button></div>';
  h += '<div class="fx-rate-line"><span class="muted caption">1 <span id="entryFxFromLabel">'+selectedCurrency+'</span> =</span><input id="entryFxRateInput" class="fx-rate-input mono" type="number" inputmode="decimal" step="0.000001" min="0" value="'+esc(fxRateShown)+'" /><span class="muted caption">'+reportingCurrency()+'</span></div>';
  h += '<input id="entryFxSourceInput" type="hidden" value="'+esc(fxSourceShown)+'" />';
  h += '<div id="entryFxConverted" class="mono caption" style="margin-top:7px;font-weight:650;">'+((selectedCurrency!==reportingCurrency()&&!isNaN(parsedShown)&&Number(fxRateShown)>0)?(currencyAmountLabel(parsedShown,selectedCurrency,2)+' = '+currencyAmountLabel(round2(parsedShown*Number(fxRateShown)),reportingCurrency(),2)):'')+'</div>';
  h += '</div>';

  /* Date is part of the primary entry flow: most entries default to Today,
     but a backdated transaction should never require opening More options. */
  h += '<div class="row" style="margin-bottom:14px;align-items:flex-end;gap:10px;">';
  h += '<label style="flex:1;min-width:0;"><span class="eyebrow" style="display:block;margin-bottom:6px;">Date</span><input id="entryDateInput" type="date" class="field mono" style="width:100%;padding:9px 10px;font-size:14px;" value="'+formDate+'" max="'+todayStr()+'" /></label>';
  h += '<label style="width:122px;flex:0 0 122px;"><span class="eyebrow" style="display:block;margin-bottom:6px;">Time</span><input id="entryTimeInput" type="time" class="field mono" style="width:100%;padding:9px 10px;font-size:14px;" value="'+esc(selectedTime)+'" /></label>';
  h += '</div>';

  if (txnKind === "expense") {
    h += '<div class="row between" style="margin-bottom:8px;"><span class="eyebrow">Subcategory</span>'+(selectedCat?'<span class="muted caption">'+esc(categoryGroupOf(selectedCat)||"Ungrouped")+'</span>':'')+'</div>';
    h += '<div class="txn-hscroll" style="gap:8px;margin:0 -8px 10px;padding:2px 8px 5px;">';
    quickCats.forEach(function(c){
      var sel=selectedCat===c;
      h += '<button data-action="select-txn-category" data-cat="'+esc(c)+'" style="flex:0 0 auto;min-width:86px;max-width:116px;background:'+(sel?'var(--accent)':'var(--fill)')+';color:'+(sel?'var(--accent-ink)':'var(--text)')+';border:none;border-radius:12px;padding:9px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;">'+catIconCircle(c)+'<span style="font-size:11px;font-weight:'+(sel?'700':'500')+';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;">'+esc(c)+'</span></button>';
    });
    h += '<button data-action="toggle-all-categories" style="flex:0 0 auto;min-width:70px;background:var(--fill);border:none;border-radius:12px;padding:9px 10px;color:var(--text-muted);font-size:12px;">More</button>';
    h += '</div>';

    if (state.txnShowAllCategories) {
      var groups = state.settings.categoryGroups||[];
      var ungrouped = cats.filter(function(c){return !categoryGroupOf(c);});
      h += '<select id="entryCategoryInput" class="field" style="margin-bottom:14px;">';
      h += '<option value="">No category</option>';
      groups.forEach(function(g){
        var members=sortedCats(cats.filter(function(c){return categoryGroupOf(c)===g;}));
        if (!members.length) return;
        h += '<optgroup label="'+esc(g)+'">';
        members.forEach(function(c){h+='<option value="'+esc(c)+'"'+(selectedCat===c?' selected':'')+'>'+esc(c)+'</option>';});
        h += '</optgroup>';
      });
      if (ungrouped.length) {
        h += '<optgroup label="Ungrouped">';
        sortedCats(ungrouped).forEach(function(c){h+='<option value="'+esc(c)+'"'+(selectedCat===c?' selected':'')+'>'+esc(c)+'</option>';});
        h += '</optgroup>';
      }
      h += '</select>';
    } else {
      h += '<input id="entryCategoryInput" type="hidden" value="'+esc(selectedCat)+'" />';
    }
  } else {
    h += '<input id="entryCategoryInput" type="hidden" value="" />';
  }

  if (people.length) {
    h += '<div class="eyebrow" style="margin:2px 0 8px;">For</div>';
    h += '<div class="txn-hscroll" style="gap:8px;margin:0 -8px 12px;padding:0 8px 4px;">';
    people.forEach(function(p){
      var sel=personSplitMode==="single" && selectedPerson===p;
      h += '<button data-action="select-txn-person" data-person="'+esc(p)+'" style="flex:0 0 auto;border:none;border-radius:999px;padding:8px 12px;background:'+(sel?personColor(p):'var(--fill)')+';color:'+(sel?'#fff':'var(--text)')+';font-size:13px;font-weight:'+(sel?'600':'500')+';">'+esc(p)+(sel?' ✓':'')+'</button>';
    });
    if (people.length>=2) {
      var sharedSel=personSplitMode==="split";
      h += '<button data-action="set-txn-person-split-mode" data-mode="split" style="flex:0 0 auto;border:none;border-radius:999px;padding:8px 12px;background:'+(sharedSel?'var(--accent)':'var(--fill)')+';color:'+(sharedSel?'var(--accent-ink)':'var(--text)')+';font-size:13px;font-weight:'+(sharedSel?'600':'500')+';">Shared'+(sharedSel?' ✓':'')+'</button>';
    }
    h += '</div>';

    if (personSplitMode === "single") {
      h += '<input id="entryPersonInput" type="hidden" value="'+esc(selectedPerson)+'" />';
    } else {
      h += '<input id="entryPersonInput" type="hidden" value="" />';
      var existingSplit={};
      if (state.entryPersonSplitDraft) Object.keys(state.entryPersonSplitDraft).forEach(function(p){existingSplit[p]=parseInt(state.entryPersonSplitDraft[p],10)||0;});
      else if (editingItem && editingItem.personSplit) editingItem.personSplit.forEach(function(ps){existingSplit[ps.person]=ps.pct;});
      var splitTotal=0;
      h += '<div class="card" style="padding:10px 12px;margin-bottom:12px;">';
      people.forEach(function(p){
        var cur=existingSplit[p]||0; splitTotal+=cur;
        h += '<div class="row between" style="padding:5px 0;"><span style="font-size:13px;">'+esc(p)+'</span><select class="split-person-pct field mono" data-person="'+esc(p)+'" style="width:84px;padding:6px 8px;font-size:13px;">';
        var opts=[]; for(var q=0;q<=100;q+=10)opts.push(q); if(cur%10!==0&&opts.indexOf(cur)===-1)opts.push(cur); opts.sort(function(a,b){return a-b;});
        opts.forEach(function(q){h+='<option value="'+q+'"'+(q===cur?' selected':'')+'>'+q+'%</option>';});
        h += '</select></div>';
      });
      h += '<div class="row between hairline-top" style="padding-top:8px;margin-top:2px;"><span class="muted caption">Total</span><span id="splitPersonTotal" class="mono caption" style="font-weight:600;color:'+(splitTotal===100?'var(--positive)':splitTotal===0?'var(--text-muted)':'var(--rust)')+';">'+splitTotal+'%</span></div></div>';
    }
  } else {
    h += '<input id="entryPersonInput" type="hidden" value="" />';
  }

  if (txnTags.length) {
    h += '<div class="eyebrow" style="margin:2px 0 8px;">Tags</div><div class="txn-hscroll" style="gap:7px;margin:0 -8px 12px;padding:0 8px 4px;">';
    txnTags.forEach(function(tag){var sel=selectedTxnTags.indexOf(tag)!==-1;h+='<button data-action="toggle-txn-tag" data-tag="'+esc(tag)+'" style="flex:0 0 auto;border:none;border-radius:999px;padding:7px 10px;background:'+(sel?transactionTagColor(tag):'var(--fill)')+';color:'+(sel?'#fff':'var(--text)')+';font-size:12px;font-weight:'+(sel?'650':'500')+';">'+esc(tag)+(sel?' ✓':'')+'</button>';});
    h += '</div>';
  }

  h += '<div class="eyebrow" style="margin-bottom:6px;">Note</div>';
  h += '<input id="entryNoteInput" type="text" class="field" style="margin-bottom:10px;" placeholder="Merchant or what it was for" value="'+(state.entryNoteDraft!=null?esc(state.entryNoteDraft):(editingItem?esc(editingItem.note||""):""))+'" />';

  h += '<button data-action="toggle-txn-advanced" class="row between" style="width:100%;background:none;border:none;padding:8px 0 10px;color:var(--text-muted);font-size:13px;"><span>'+(advancedOpen?'Fewer options':'More options')+'</span><span style="display:flex;transform:rotate('+(advancedOpen?'90':'0')+'deg);">'+ICONS.chevronRight+'</span></button>';

  if (advancedOpen) {
    h += '<div class="card" style="padding:12px;margin-bottom:12px;">';
    if (!editingItem && txnKind === "expense") {
      h += '<div class="eyebrow" style="margin-bottom:6px;">Timing</div><div class="seg" style="margin-bottom:'+(splitMode==='split'?'8':'0')+'px;">';
      h += '<button class="seg-btn" role="tab" aria-selected="'+(splitMode==='single')+'" data-action="set-txn-split-mode" data-mode="single">Single day</button>';
      h += '<button class="seg-btn" role="tab" aria-selected="'+(splitMode==='split')+'" data-action="set-txn-split-mode" data-mode="split">Spread across days</button></div>';
      if (splitMode === "split") {
        h += '<input id="splitDaysInput" type="number" inputmode="numeric" min="2" step="1" class="field" style="margin-top:8px;" placeholder="Number of days" value="'+(state.entrySplitDaysDraft!=null?esc(state.entrySplitDaysDraft):"")+'" />';
        h += '<div class="muted caption" style="margin-top:7px;">The total is spread evenly from this date; future shares are added as their day arrives.</div>';
      }
    }
    h += '</div>';
  }

  var saveLabel;
  if (editingItem) saveLabel='Save changes';
  else if (!isNaN(parsedShown) && parsedShown>0) saveLabel='Add '+fmt(parsedShown,2)+' '+selectedCurrency+' '+(txnKind==='income'?'income':'expense');
  else saveLabel='Add '+(txnKind==='income'?'income':'expense');
  h += '<button id="addTxnBtn" data-action="add-transaction" class="btn-accent txn-entry-save" style="width:100%;justify-content:center;align-items:center;">'+saveLabel+'</button>';
  h += '</div>';
  if (state.toastMessage) h += '<div style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);background:var(--positive);color:#0C1322;font-size:13px;font-weight:650;padding:9px 16px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,0.35);z-index:80;white-space:nowrap;">'+esc(state.toastMessage)+'</div>';
  h += '</div></div>';
  return h;
}

function renderTransactionsBody() {
  var entryDates=Object.keys(state.entries).sort();
  var groupFilter=state.txnGroupFilter||"";
  var categoryFilter=state.txnCategoryFilter||"";
  var personFilter=state.txnPersonFilter||"";
  var tagFilter=state.txnTagFilter||"";
  var typeFilter=state.txnTypeFilter||"all";
  var search=(state.txnSearch||"").trim().toLowerCase();
  var periodMode=state.txnPeriodMode||"month";
  var periodFrom=state.txnPeriodFrom||"", periodTo=state.txnPeriodTo||"";
  var info=getTxnPeriodInfo();
  var people=state.settings.people||[];
  var groups=state.settings.categoryGroups||[];
  function itemCat(it){return it.category||"Uncategorised";}
  function inPeriod(d){return d>=info.start&&d<=info.end;}
  function matchesGroup(it){if(!groupFilter)return true;if(groupFilter==="__ungrouped__")return !categoryGroupOf(it.category);return categoryGroupOf(it.category)===groupFilter;}
  function matchesSearch(it){
    if(!search)return true;
    var persons=(it.personSplit&&it.personSplit.length)?it.personSplit.map(function(ps){return ps.person;}).join(" "):(it.person||"");
    var blob=[it.note||"",it.category||"",categoryGroupOf(it.category)||"",persons,(it.tags||[]).join(" "),isIncomeItem(it)?"income":"expense",String(it.amount||"")].join(" ").toLowerCase();
    return blob.indexOf(search)!==-1;
  }
  function matches(it){
    if(typeFilter==="expense"&&!isExpenseItem(it))return false;
    if(typeFilter==="income"&&!isIncomeItem(it))return false;
    if(isIncomeItem(it)&&(categoryFilter||groupFilter))return false;
    return (!categoryFilter||itemCat(it)===categoryFilter)&&matchesGroup(it)&&itemMatchesPersonFilter(it,personFilter)&&(!tagFilter||normalizeItemTags(it.tags).indexOf(tagFilter)!==-1)&&matchesSearch(it);
  }
  var itemFilterActive=!!categoryFilter||!!groupFilter||!!personFilter||!!tagFilter||typeFilter!=="all"||!!search;

  var allPeriodItems=[];
  entryDates.forEach(function(d){if(!inPeriod(d))return;(state.entries[d].items||[]).forEach(function(it){if(matches(it))allPeriodItems.push({date:d,it:it});});});
  var totalExpense=allPeriodItems.reduce(function(t,x){return t+(isExpenseItem(x.it)?personScopedAmount(x.it,personFilter):0);},0);
  var totalIncome=allPeriodItems.reduce(function(t,x){return t+(isIncomeItem(x.it)?x.it.amount:0);},0);
  var net=totalIncome-totalExpense;

  var h='';
  h+='<div class="row between page-heading-row"><div class="title2">Transactions</div><button data-action="go-page" data-page="calendar" class="icon-btn page-icon-action" aria-label="Calendar">'+ICONS.calendar+'</button></div>';

  h+='<div class="card card-pad" style="margin-bottom:12px;">';
  h+='<div><div class="eyebrow">Spent</div><div class="mono" style="font-size:30px;font-weight:700;margin-top:2px;">'+fmt(totalExpense,0)+' <span class="muted" style="font-size:15px;">AED</span></div></div>';
  if(periodMode!=="all"&&periodMode!=="custom") h+='<div class="row between hairline-top" style="margin-top:12px;padding-top:10px;"><button data-action="txn-nav-offset" data-delta="-1" class="icon-btn" style="padding:6px;">'+ICONS.chevronLeft+'</button><div style="text-align:center;"><div class="subhead" style="font-weight:600;">'+esc(info.title)+'</div><div class="muted caption">'+esc(info.sub)+'</div></div><button data-action="txn-nav-offset" data-delta="1" class="icon-btn" style="padding:6px;'+(info.isCurrent?'opacity:.3;pointer-events:none;':'')+'">'+ICONS.chevronRight+'</button></div>';
  h+='</div>';

  h+='<div class="card" style="padding:12px;margin-bottom:12px;">';
  h+='<div style="position:relative;margin-bottom:10px;"><span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);display:flex;">'+ICONS.search+'</span><input id="txnSearchInput" type="search" class="field" placeholder="Search merchant, category, person or tag" value="'+esc(state.txnSearch||"")+'" style="padding-left:40px;" /></div>';
  h+='<div style="display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;">';
  [["all","All"],["expense","Expenses"],["income","Income"]].forEach(function(opt){var sel=typeFilter===opt[0];h+='<button data-action="set-txn-type-filter" data-type="'+opt[0]+'" class="chip" style="flex:0 0 auto;background:'+(sel?'var(--accent)':'var(--fill)')+';color:'+(sel?'var(--accent-ink)':'var(--text)')+';font-weight:'+(sel?'600':'500')+';">'+opt[1]+'</button>';});
  var extraFilters=!!groupFilter||!!categoryFilter||!!personFilter||!!tagFilter||periodMode!=="month";
  h+='<button data-action="toggle-txn-filters" class="chip" style="flex:0 0 auto;'+(extraFilters?'background:var(--accent);color:var(--accent-ink);font-weight:600;':'')+'">Filters'+(extraFilters?' •':'')+'</button>';
  h+='</div>';

  if(state.txnFiltersOpen){
    h+='<div class="hairline-top" style="margin-top:12px;padding-top:12px;">';
    h+='<div class="eyebrow" style="margin-bottom:6px;">Period</div><div class="seg seg-scroll" style="margin-bottom:10px;">';
    [["week","Week"],["month","Month"],["year","Year"],["all","All time"],["custom","Custom"]].forEach(function(opt){h+='<button class="seg-btn" role="tab" aria-selected="'+(periodMode===opt[0])+'" data-action="set-txn-period" data-mode="'+opt[0]+'">'+opt[1]+'</button>';});h+='</div>';
    if(periodMode==='custom')h+='<div class="row gap2" style="margin-bottom:10px;"><input id="txnPeriodFromInput" type="date" class="field mono" style="flex:1;font-size:13px;" value="'+esc(periodFrom)+'" max="'+todayStr()+'"/><input id="txnPeriodToInput" type="date" class="field mono" style="flex:1;font-size:13px;" value="'+esc(periodTo)+'" max="'+todayStr()+'"/></div>';
    if(groups.length){h+='<select id="txnGroupFilterSelect" class="field" style="font-size:13px;margin-bottom:8px;"><option value="">All categories</option>';groups.forEach(function(g){h+='<option value="'+esc(g)+'"'+(groupFilter===g?' selected':'')+'>'+esc(g)+'</option>';});if((state.settings.categories||[]).some(function(c){return !categoryGroupOf(c);}))h+='<option value="__ungrouped__"'+(groupFilter==='__ungrouped__'?' selected':'')+'>Uncategorized</option>';h+='</select>';}
    var filterCats=!groupFilter?(state.settings.categories||[]).slice():(groupFilter==='__ungrouped__'?(state.settings.categories||[]).filter(function(c){return !categoryGroupOf(c);}):(state.settings.categories||[]).filter(function(c){return categoryGroupOf(c)===groupFilter;}));
    h+='<select id="txnCategoryFilterSelect" class="field" style="font-size:13px;margin-bottom:8px;"><option value="">All subcategories</option>';filterCats.forEach(function(c){h+='<option value="'+esc(c)+'"'+(categoryFilter===c?' selected':'')+'>'+esc(c)+'</option>';});h+='<option value="Uncategorised"'+(categoryFilter==='Uncategorised'?' selected':'')+'>Uncategorised</option></select>';
    if(people.length){h+='<select id="txnPersonFilterSelect" class="field" style="font-size:13px;margin-bottom:8px;"><option value="">All people</option>';people.forEach(function(p){h+='<option value="'+esc(p)+'"'+(personFilter===p?' selected':'')+'>'+esc(p)+'</option>';});h+='<option value="__unassigned__"'+(personFilter==='__unassigned__'?' selected':'')+'>Unassigned</option></select>';}
    var txnTagsForFilter=state.settings.transactionTags||[];
    if(txnTagsForFilter.length){h+='<select id="txnTagFilterSelect" class="field" style="font-size:13px;margin-bottom:8px;"><option value="">All tags</option>';txnTagsForFilter.forEach(function(tag){h+='<option value="'+esc(tag)+'"'+(tagFilter===tag?' selected':'')+'>'+esc(tag)+'</option>';});h+='</select>';}
    h+='<div style="text-align:right;"><button data-action="clear-txn-filters" class="btn-plain" style="font-size:13px;">Reset filters</button></div></div>';
  }
  h+='</div>';

  var dates=entryDates.slice().reverse().filter(function(d){if(!inPeriod(d))return false;return (state.entries[d].items||[]).some(matches);});
  h+='<div class="card" style="overflow:hidden;margin-bottom:16px;">';
  if(!dates.length)h+='<div class="muted subhead" style="padding:20px 16px;">'+(itemFilterActive?'No matching transactions.':'Nothing logged in this period.')+'</div>';
  else dates.forEach(function(date,di){
    var items=(state.entries[date].items||[]).filter(matches);
    var expense=items.reduce(function(t,it){return t+(isExpenseItem(it)?personScopedAmount(it,personFilter):0);},0);
    var income=items.reduce(function(t,it){return t+(isIncomeItem(it)?it.amount:0);},0);
    var yesterday=toStr(addDays(parseD(todayStr()),-1));
    var heading=date===todayStr()?"Today · "+shortLabel(date):(date===yesterday?"Yesterday · "+shortLabel(date):dayLabel(date));
    h+='<div style="padding:12px 16px;'+(di?'border-top:1px solid var(--hairline);':'')+'"><div class="row between" style="margin-bottom:5px;"><div class="subhead" style="font-weight:600;">'+esc(heading)+'</div><div style="text-align:right;">'+(expense>0?'<div class="mono subhead">'+fmt(expense,2)+' AED</div>':'')+(income>0?'<div class="mono caption" style="color:var(--positive);">+'+fmt(income,2)+' received</div>':'')+'</div></div>';
    txnNewestFirst(items).forEach(function(it){h+=renderTxnRow(date,it);});
    h+='</div>';
  });
  h+='</div>';
  return h;
}
function legendSwatch(bg, label, fg) {

/* Shared transaction-row renderer used by both the Transactions page and the
   Calendar day-detail panel, so the two never visually drift apart. */
function renderTxnRow(date, it) {
  var key=date+"|"+it.id;
  if(state.pendingDeleteKey===key){
    return '<div class="row between" style="background:var(--rust-wash);border-radius:8px;padding:8px 10px;margin-bottom:2px;"><span style="font-size:12px;">Delete this?</span><div class="row gap2"><button data-action="delete-txn" data-date="'+date+'" data-id="'+esc(it.id)+'" style="background:var(--rust);border:none;border-radius:5px;padding:4px;color:#fff;">'+ICONS.check+'</button><button data-action="cancel-delete-txn" style="background:none;border:1px solid var(--hairline);border-radius:5px;padding:4px;color:var(--text-muted);">'+ICONS.x+'</button></div></div>';
  }
  var income=isIncomeItem(it);
  var primary=it.note||(income?"Income":(it.category||"Expense"));
  var secondary=[];
  if(it.time) secondary.push(formatTxnTime(it.time));
  if(it.note&&it.category)secondary.push(it.category);
  if(!income&&it.category&&categoryGroupOf(it.category))secondary.push(categoryGroupOf(it.category));
  if(income&&!it.note)secondary.push("Money received");
  var personText="";
  if(it.personSplit&&it.personSplit.length)personText=it.personSplit.map(function(ps){return ps.person+" "+ps.pct+"%";}).join(" · ");
  else if(it.person)personText=it.person;
  if(personText)secondary.push(personText);
  if(it.currency && it.currency!==STORAGE_CURRENCY && it.originalAmount!=null && it.currency!==reportingCurrency()) secondary.push(currencyAmountLabel(it.originalAmount,it.currency,2)+" → "+currencyAmountLabel(toReporting(it.amount),reportingCurrency(),2));
  var seq="";
  if(it.recurringId)seq=(it.seq&&it.seqTotal)?(' · '+it.seq+'/'+it.seqTotal):' · Recurring';

  var h='<div class="row" style="align-items:center;gap:10px;padding:8px 0;margin-bottom:1px;">';
  h+='<button data-action="edit-txn" data-date="'+date+'" data-id="'+esc(it.id)+'" style="background:none;border:none;padding:0;flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;">';
  h+=income?'<span style="width:34px;height:34px;border-radius:50%;background:var(--positive);color:white;display:flex;align-items:center;justify-content:center;flex-shrink:0;">'+ICONS.plus+'</span>':catIconCircle(it.category);
  h+='<span style="min-width:0;flex:1;"><span style="display:block;font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(primary)+'</span>';
  if(secondary.length||seq)h+='<span class="muted" style="display:block;font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(secondary.join(" · "))+esc(seq)+'</span>';
  if(normalizeItemTags(it.tags).length)h+='<span style="display:flex;align-items:center;gap:4px;margin-top:4px;overflow:hidden;">'+transactionTagChipsHtml(it.tags,3)+'</span>';
  h+='</span></button>';
  h+='<div class="mono" style="font-size:14px;font-weight:650;color:'+(income?'var(--positive)':'var(--text)')+';flex-shrink:0;">'+(income?'+':'−')+fmt(toReporting(it.amount),2)+'</div>';
  h+='<button data-action="ask-delete-txn" data-date="'+date+'" data-id="'+esc(it.id)+'" style="background:none;border:none;padding:5px;color:var(--text-muted);flex-shrink:0;" aria-label="Delete">'+ICONS.trash+'</button></div>';
  return h;
}
function renderCalendarBody() {
  var base=addMonths(startOfMonth(new Date()),state.calendarOffset), monthStartStr=toStr(base), monthEndStr=toStr(endOfMonth(base));
  var title=base.toLocaleDateString("en-GB",{month:"long",year:"numeric"}), today=todayStr();
  var h='<div class="row between" style="margin-bottom:10px;"><div><div class="eyebrow">Calendar</div><div class="muted caption">Total spend shown; color reflects budget-counted spend vs that day’s budget</div></div><button data-action="go-page" data-page="transactions" class="btn-outline" style="padding:6px 10px;font-size:12px;">Back to Txns</button></div>';
  h+='<div class="card" style="padding:14px;margin-bottom:12px;"><div class="row between" style="margin-bottom:12px;"><button data-action="cal-nav" data-delta="-1" class="icon-btn">'+ICONS.chevronLeft+'</button><div class="subhead" style="font-weight:600;">'+esc(title)+'</div><button data-action="cal-nav" data-delta="1" class="icon-btn" style="'+(state.calendarOffset>=0?'opacity:.3;pointer-events:none;':'')+'">'+ICONS.chevronRight+'</button></div>';
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;">';["Mo","Tu","We","Th","Fr","Sa","Su"].forEach(function(x){h+='<div class="muted" style="text-align:center;font-size:10px;">'+x+'</div>';});h+='</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">';
  var firstDow=base.getDay(), blanks=firstDow===0?6:firstDow-1;for(var i=0;i<blanks;i++)h+='<div></div>';var cur=parseD(monthStartStr);
  while(toStr(cur)<=monthEndStr){var ds=toStr(cur),e=state.entries[ds],spent=e?sumSpent(e):0,income=e?sumIncome(e):0,budgetSpent=e?sumBudgetSpent(e):0,dailyBudget=allowanceForDate(ds),isFuture=ds>today,isToday=ds===today,isSelected=state.calendarSelectedDate===ds;var overBudget=budgetSpent>dailyBudget;var bg=e?(overBudget?'var(--rust-wash)':'var(--positive-wash)'):'var(--raised)';if(isFuture&&!e)bg='transparent';var border=isToday?'2px solid var(--accent)':(isSelected?'2px solid var(--text)':'1px solid transparent');h+='<button data-action="cal-select" data-date="'+ds+'" style="min-height:64px;border-radius:9px;border:'+border+';background:'+bg+';display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 1px;gap:4px;"><span style="font-size:14px;font-weight:500;">'+cur.getDate()+'</span><span class="mono" style="font-size:11px;">'+(e?fmt(toReporting(spent),0):' ')+'</span></button>';cur=addDays(cur,1);}
  h+='</div></div><div class="row" style="gap:14px;margin-bottom:16px;flex-wrap:wrap;">'+legendSwatch('var(--positive-wash)','Within daily budget')+legendSwatch('var(--rust-wash)','Over daily budget')+legendSwatch('var(--raised)','No transactions')+'</div>';
  if(state.calendarSelectedDate){var sd=state.calendarSelectedDate,sday=state.entries[sd];h+='<div class="card card-pad"><div class="eyebrow" style="margin-bottom:8px;">'+esc(dayLabel(sd))+'</div>';if(sday&&sday.items.length)txnNewestFirst(sday.items).forEach(function(it){h+=renderTxnRow(sd,it);});else h+='<div class="muted subhead">Nothing logged this day.</div>';h+='</div>';}
  return h;
}

/* Generic bucketed bar chart: one bar per bucket, value from getValue(), color

function forecastChartGeom(rows, totalDays, target, projectedSpend, compareValues, pastDays, forecastValues, goalTarget) {

/* Cumulative value at any index along the chart, actual portion or

function forecastValueAt(g, idx, projectedSpend, forecastValues) {

        s += '<div class="row between" style="padding:9px 0;gap:12px;'+(i?'border-top:1px solid var(--sep);':'')+'"><div style="min-width:0;flex:1;"><div class="subhead" style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(x.label)+'</div><div class="muted caption">'+tag+'</div>'+evidence+cadenceMetrics+'</div><div style="flex-shrink:0;"><div class="mono subhead" style="font-weight:650;text-align:right;">'+fmt(x.amount,0)+' AED</div>'+rightLabel+'</div></div>';
      });
      if(!detailRows.length && profileEvidence.length){
        profileEvidence.forEach(function(p,i){
          var bits=[];
          if(p.txnCount!=null) bits.push(p.txnCount+' txn'+(p.txnCount===1?'':'s'));
          if(p.gap!=null) bits.push(occurrenceFrequencyText(p.gap,true));
          if(p.lastDate) bits.push('last '+(p.lastDate===todayStr()?'Today':shortLabel(p.lastDate)));
          if(p.confidence) bits.push(p.confidence+' confidence');
          var chance=(p.mode==='cadence'||p.mode==='lumpy')?'<div class="caption" style="margin-top:4px;font-weight:650;">0% remaining-period chance · Likely event '+fmt(p.typicalAmount||0,0)+' AED</div>':'';
          s += '<div style="padding:9px 0;'+(i?'border-top:1px solid var(--sep);':'')+'"><div class="subhead" style="font-weight:600;">'+esc(p.label)+'</div><div class="muted caption" style="margin-top:2px;white-space:normal;">'+esc((p.mode==='frequent'?'Frequent':(p.mode==='lumpy'?'Lumpy':'Cadence'))+(bits.length?' · '+bits.join(' · '):''))+'</div>'+chance+'</div>';
        });
      }
      satisfiedRows.forEach(function(x){
        if ((x.amount||0) >= 5) return;
        var pPct=displayProbabilityPct(x.probability);
        var extra=(x.likelyAmount||0)>0?('<div class="row gap2" style="margin-top:5px;flex-wrap:wrap;"><span class="caption" style="font-weight:650;">'+pPct+'% chance</span><span class="muted caption">·</span><span class="caption">Likely txn '+fmt(x.likelyAmount,0)+' AED</span></div>'):'';
        s += '<div class="row between" style="padding:9px 0;gap:12px;border-top:1px solid var(--sep);"><div style="min-width:0;flex:1;"><div class="subhead" style="font-weight:600;">'+esc(x.label)+'</div><div class="muted caption" style="white-space:normal;">'+esc(x.metaText||('Recent event · typical repeat '+Number(x.gap||0).toFixed(1)+' days'))+'</div>'+extra+'</div><div><div class="mono subhead muted" style="text-align:right;">0 AED</div><div class="muted caption" style="text-align:right;">expected</div></div></div>';
      });
      s += '</div>';
    }
  }
  s += '</div>';
  lastForecastChartData = { rows:scopedRows, totalDays:totalDays, target:target, goalTarget:goalTarget, projectedSpend:projectedSpend, start:periodStart, compareValues:compareValues, compareLabel:compareLabel, pastDays:pastDays, forecastValues:forecastValues };
  return s;
}

/* Bar chart across several recent instances of the same period type, colored
   by a 3-tier status: on track (green), trending over (amber — only possible
   for the still-in-progress current period, based on its forecast), or over
   budget (red — either a finished period that ran over, or a current period
   forecast to run well over). One dashed line marks the most recent period's
   budget, since target can drift over time via rate changes. */


/* Budget trend: previous periods show actual closes; the live period extends
   from actual spend to its forecast. The dashed budget line uses each period's
   own target, so historical budget changes are represented correctly. */
function renderBudgetTrendChart(items, T) {
  var w=340,h=205,padL=42,padR=8,padT=14,padB=38,plotW=w-padL-padR,plotH=h-padT-padB;
  var rawMax=Math.max.apply(null,items.reduce(function(a,it){ a.push(it.actual||0,it.displayTotal||0,it.target||0); return a; },[1]));
  var maxVal=rawMax*1.12;
  function y(v){ return padT+plotH-(Math.max(0,v)/maxVal)*plotH; }
  function tick(v){ return v>=1000?(v/1000).toFixed(v>=10000?0:1)+'K':fmt(Math.round(v),0); }
  var grid='';
  [0,.33,.66,1].forEach(function(fr){ var v=maxVal*fr, yy=y(v); grid+='<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+yy+'" y2="'+yy+'" stroke="'+T.hairline+'" stroke-width="1" stroke-dasharray="3,3"/><text x="'+(padL-5)+'" y="'+(yy+3)+'" font-size="8" fill="'+T.textMuted+'" text-anchor="end">'+tick(v)+'</text>'; });
  var n=items.length,slot=plotW/n,barW=Math.min(38,slot*.62);
  function statusColor(st){ return st==='rust'?T.rust:st==='amber'?T.amber:T.positive; }
  var bars='',targetPts=[];
  items.forEach(function(it,i){
    var cx=padL+slot*i+slot/2, baseY=padT+plotH, color=statusColor(it.status);
    var total=Math.max(it.actual||0,it.displayTotal||0), totalY=y(total), actualY=y(it.actual||0);
    if (it.current && total>(it.actual||0)) {
      bars+='<rect x="'+(cx-barW/2)+'" y="'+totalY+'" width="'+barW+'" height="'+Math.max(0,baseY-totalY)+'" fill="'+color+'" opacity="0.32" rx="5"/>';
      bars+='<rect x="'+(cx-barW/2)+'" y="'+actualY+'" width="'+barW+'" height="'+Math.max(0,baseY-actualY)+'" fill="'+color+'" rx="5"/>';
    } else {
      bars+='<rect x="'+(cx-barW/2)+'" y="'+totalY+'" width="'+barW+'" height="'+Math.max(0,baseY-totalY)+'" fill="'+color+'" rx="5"/>';
    }
    bars+='<text x="'+cx+'" y="'+(h-13)+'" font-size="8" fill="'+T.textMuted+'" text-anchor="middle">'+esc(it.label)+'</text>';
    targetPts.push(cx+','+y(it.target||0));
  });
  var budgetLine='<polyline points="'+targetPts.join(' ')+'" fill="none" stroke="'+T.text+'" stroke-width="2" stroke-dasharray="4,3"/>';
  if(items.length){ var firstX=padL+slot/2, firstY=y(items[0].target||0); budgetLine+='<text x="'+Math.max(padL,firstX-barW/2)+'" y="'+Math.max(10,firstY-5)+'" font-size="8" font-weight="600" fill="'+T.text+'">Budget</text>'; }
  lastBudgetTrendChartData={items:items,w:w,h:h,padL:padL,padR:padR,padT:padT,padB:padB,slot:slot};
  return '<svg id="budgetTrendChartSvg" viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none">'+grid+budgetLine+bars
    +'<line id="budgetTrendCrosshair" x1="0" x2="0" y1="'+padT+'" y2="'+(h-padB)+'" stroke="'+T.text+'" stroke-width="1" stroke-dasharray="2,2" opacity="0"/>'
    +'<rect id="budgetTrendChartHit" x="0" y="0" width="'+w+'" height="'+h+'" fill="transparent" style="touch-action:none;"/>'
    +'</svg>';
}

function renderOverallTrendChart(items, T) {

  lastOverallTrendChartData={items:items,w:w,h:h,padL:padL,padR:padR,padT:padT,padB:padB,slot:slot};

function trendPeriodLabel(per, mode) {
  if (mode === 'week') {
    var a=parseD(per.startStr), b=parseD(per.endStr);
    if (a.getMonth()===b.getMonth()) return a.getDate()+'–'+b.getDate()+' '+b.toLocaleDateString('en-GB',{month:'short'});
    return a.getDate()+' '+a.toLocaleDateString('en-GB',{month:'short'})+'–'+b.getDate()+' '+b.toLocaleDateString('en-GB',{month:'short'});
  }
  if (mode === 'year') return per.title;
  return parseD(per.startStr).toLocaleDateString('en-GB',{month:'short'});
}

function buildBudgetTrendCard(view, baseOffset, T) {
  var N=5,items=[];
  for(var j=-(N-1);j<=0;j++){
    var off=(baseOffset||0)+j, per=getPeriodBounds(view,off,currentWeeklyTarget(),dailyAllowance()), st=periodStatsBudget(per.startStr,per.endStr);
    var isLive=off===0 && per.endStr>=todayStr(), projected=st.spent;
    var trendTarget=per.target;
    if(isLive){var ei=currentEffectiveBudgetInfo();trendTarget=effectiveBudgetTargetForRange(per.startStr,per.endStr,ei);}
    if(isLive&&st.rows.length){var start=effectiveRangeStart(per.startStr),days=daysBetween(start,per.endStr)+1,fc=computeForecastNumbers(st.rows,days,start,'budget');if(fc)projected=fc.projectedSpend;}
    var status=(st.spent>trendTarget)?'rust':(isLive&&projected>trendTarget?'amber':'positive');
    items.push({label:trendPeriodLabel(per,view),actual:st.spent,displayTotal:isLive?projected:st.spent,target:trendTarget,status:status,current:isLive});
  }

  s+='<div class="row between" style="margin-top:10px;"><span class="muted subhead">'+(cur.current?'Projected close':'Closed at')+'</span><span class="mono subhead" style="font-weight:600;">'+fmt(cur.displayTotal,0)+' AED</span></div>';
  s+='<div class="row between" style="margin-top:6px;"><span class="muted subhead">'+(cur.current?'Effective budget':'Budget')+'</span><span class="mono subhead">'+fmt(cur.target,0)+' AED</span></div>';
  s+='<div class="row between" style="margin-top:6px;"><span class="muted subhead">'+(diff>=0?'Projected saving':'Projected over')+'</span><span class="mono subhead" style="font-weight:600;color:'+(diff>=0?'var(--positive)':'var(--rust)')+';">'+fmt(Math.abs(diff),0)+' AED</span></div>';
  s+='<div id="budgetTrendChartWrap" style="position:relative;margin-top:10px;"><div id="budgetTrendChartTip" class="footnote" style="position:absolute;top:0;left:0;background:var(--fill);border-radius:9px;padding:6px 9px;max-width:260px;opacity:0;pointer-events:none;z-index:3;box-shadow:0 3px 10px rgba(0,0,0,.2);"></div>'+renderBudgetTrendChart(items,T)+'</div>';
  s+='<div class="row" style="gap:12px;justify-content:center;flex-wrap:wrap;margin-top:4px;"><span class="caption" style="color:var(--positive);">● On track</span><span class="caption" style="color:var(--amber);">● Trending over</span><span class="caption" style="color:var(--rust);">● Over budget</span></div></div>';
  return s;

/* Analysis cash-balance line: running net cash flow over the selected period.
   Starts from zero at the period boundary, adds actual income transactions on
   their logged dates and subtracts every expense. The x-axis spans the full
   selected period while the line stops at the latest elapsed date, matching
   the visual idea of a balance falling/rising through the month without
   inventing future values. */
function renderCashBalanceLineChart(rows, info, T, targetBalance) {
  if (!rows || !rows.length) return "";
  var w=340,h=205,padL=42,padR=8,padT=14,padB=24,plotW=w-padL-padR,plotH=h-padT-padB;
  var totalDays=Math.max(1, daysBetween(info.start, info.end)+1);
  var acc=0, pts=[];
  rows.forEach(function(r){
    var dayNet=round2((Number(r.income)||0)-(Number(r.spent)||0));
    acc=round2(acc + dayNet);
    var dayIndex=Math.max(0, daysBetween(info.start, r.date));
    pts.push({date:r.date,label:shortLabel(r.date),balance:acc,dayNet:dayNet,idx:dayIndex});
  });
  if (!pts.length) return "";
  var vals=pts.map(function(p){return p.balance;}).concat([0]); if(targetBalance!=null)vals.push(targetBalance);
  var min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
  if (max===min) { max+=1; min-=1; }
  var margin=(max-min)*0.08; max+=margin; min-=margin;
  function xIdx(i){ return padL + (totalDays<=1 ? plotW/2 : (i/(totalDays-1))*plotW); }
  function y(v){ return padT + plotH - ((v-min)/(max-min))*plotH; }
  function tick(v){ var a=Math.abs(v); return a>=1000 ? ((v/1000).toFixed(a>=10000?0:1)+"K") : fmt(Math.round(v),0); }
  var grid="";
  [0,.25,.5,.75,1].forEach(function(fr){
    var v=min+(max-min)*fr, yy=y(v);
    grid+='<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+yy+'" y2="'+yy+'" stroke="'+T.hairline+'" stroke-width="1" stroke-dasharray="3,3"/>';
    grid+='<text x="'+(padL-5)+'" y="'+(yy+3)+'" font-size="8" fill="'+T.textMuted+'" text-anchor="end">'+tick(v)+'</text>';
  });
  if (min<0 && max>0) grid+='<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="'+T.textMuted+'" stroke-width="1.2"/>';
  if(targetBalance!=null){ var ty=y(targetBalance); grid+='<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+ty+'" y2="'+ty+'" stroke="'+T.amber+'" stroke-width="1.5" stroke-dasharray="6,3"/><text x="'+padL+'" y="'+Math.max(10,ty-5)+'" font-size="8.5" font-weight="600" fill="'+T.amber+'">Savings target '+fmt(targetBalance,0)+' AED</text>'; }
  var xy=pts.map(function(p){return[xIdx(p.idx),y(p.balance)];});
  var curveD=xy.length>=2?smoothPathD(xy):"";
  var baselineY=y(Math.max(min,Math.min(max,0)));
  var areaD=xy.length>=2?(curveD+' L '+xy[xy.length-1][0]+','+baselineY+' L '+xy[0][0]+','+baselineY+' Z'):"";
  var lineColor=acc>=0?T.positive:T.rust;
  var line="";
  if (xy.length>=2) line='<path d="'+areaD+'" fill="'+lineColor+'" fill-opacity="0.13" stroke="none"/><path d="'+curveD+'" fill="none" stroke="'+lineColor+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';
  else line='<circle cx="'+xy[0][0]+'" cy="'+xy[0][1]+'" r="4" fill="'+lineColor+'"/>';
  var axis="",labelCount=Math.min(5,totalDays),seen={};
  for(var i=0;i<labelCount;i++){
    var idx=labelCount===1?0:Math.round((i/(labelCount-1))*(totalDays-1));
    if(seen[idx])continue;seen[idx]=true;
    var ds=toStr(addDays(parseD(info.start),idx));
    axis+='<text x="'+xIdx(idx)+'" y="'+(h-5)+'" font-size="8" fill="'+T.textMuted+'" text-anchor="'+(idx===0?'start':(idx===totalDays-1?'end':'middle'))+'">'+esc(shortLabel(ds))+'</text>';
  }
  var todayMark="";
  if(info.start<=todayStr() && todayStr()<=info.end){
    var ti=daysBetween(info.start,todayStr()),tx=xIdx(ti);
    todayMark='<line x1="'+tx+'" x2="'+tx+'" y1="'+padT+'" y2="'+(h-padB)+'" stroke="'+T.hairline+'" stroke-dasharray="2,3"/><text x="'+tx+'" y="'+(padT+9)+'" font-size="8" fill="'+T.textMuted+'" text-anchor="middle">Today</text>';
  }
  lastCashBalanceChartData={points:pts,w:w,h:h,padL:padL,padR:padR,padT:padT,padB:padB,plotW:plotW,plotH:plotH,totalDays:totalDays,min:min,max:max,lineColor:lineColor};
  return '<svg id="cashBalanceChartSvg" viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none">'+grid+todayMark+line+axis
    +'<line id="cashBalanceCrosshair" x1="0" x2="0" y1="'+padT+'" y2="'+(h-padB)+'" stroke="'+T.text+'" stroke-width="1" stroke-dasharray="2,2" opacity="0"/>'
    +'<circle id="cashBalanceDot" r="4.5" fill="'+lineColor+'" stroke="'+T.bg+'" stroke-width="2" opacity="0"/>'
    +'<rect id="cashBalanceChartHit" x="0" y="0" width="'+w+'" height="'+h+'" fill="transparent" style="touch-action:none;"/>'
    +'</svg>';
}

/* Hover/touch scrub for the Analysis cash-balance line. Desktop users can
