function categoryStyle(name) {
  if (!name) return { icon:"tag", color:"#8595B5" };
  if (CATEGORY_STYLES[name]) return CATEGORY_STYLES[name];
  var hash = 0;
  for (var i=0;i<name.length;i++) hash = (hash*31 + name.charCodeAt(i)) >>> 0;
  return { icon:"tag", color: PIE_COLORS[hash % PIE_COLORS.length] };
}
function catIconCircle(categoryName) {
  var st = categoryStyle(categoryName);
  return '<span style="width:32px; height:32px; border-radius:50%; background:'+st.color+'; display:flex; align-items:center; justify-content:center; flex-shrink:0;">'+CAT_ICON_SVGS[st.icon]+'</span>';
}

function renderPieChart(slices, T, selectedLabel) {
  var size = 180, r = 78, cx = size/2, cy = size/2;
  var total = slices.reduce(function(s,x){ return s+x.value; }, 0);
  if (total <= 0) return "";
  var angle = -Math.PI/2;
  var paths = "";
  slices.forEach(function(sl, i){
    var frac = sl.value/total;
    var sweep = frac * Math.PI * 2;
    var end = angle + sweep;
    var color = PIE_COLORS[i % PIE_COLORS.length];
    var isSel = selectedLabel != null && sl.label === selectedLabel;
    var op = (selectedLabel != null && !isSel) ? ' opacity="0.3"' : '';
    var tap = ' class="chart-hit" data-action="filter-analysis-category" data-cat="'+esc(sl.label)+'"';
    if (frac >= 0.9999) {
      paths += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+color+'"'+op+tap+'/>';
    } else {
      var x1 = cx + r*Math.cos(angle), y1 = cy + r*Math.sin(angle);
      var x2 = cx + r*Math.cos(end),   y2 = cy + r*Math.sin(end);
      var large = sweep > Math.PI ? 1 : 0;
      paths += '<path d="M '+cx+' '+cy+' L '+x1+' '+y1+' A '+r+' '+r+' 0 '+large+' 1 '+x2+' '+y2+' Z" fill="'+color+'"'+op+tap+'/>';
    }
    angle = end;
  });
  paths += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*0.55)+'" fill="'+T.card+'"/>';
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+paths+'</svg>';
}

function renderBarChart(items, T) {
  var w = 340, h = 140, padL = 30, padR = 8, padT = 10, padB = 20;
  var maxVal = Math.max.apply(null, items.map(function(i){ return Math.max(i.spent, i.target); }).concat([1]));
  var plotW = w-padL-padR, plotH = h-padT-padB;
  var n = items.length;
  var slot = plotW/n;
  var barW = Math.min(24, slot*0.55);
  function y(v){ return padT + plotH - (Math.min(v,maxVal)/maxVal)*plotH; }
  var bars = items.map(function(it,i){
    var cx = padL + slot*i + slot/2;
    var barTopY = y(it.spent);
    var barH = Math.max(0, plotH - (barTopY-padT));
    var color = it.spent <= it.target ? T.positive : T.rust;
    var targetY = y(it.target);
    return '<rect x="'+(cx-barW/2)+'" y="'+barTopY+'" width="'+barW+'" height="'+barH+'" fill="'+color+'" rx="2"/>'
      + '<line x1="'+(cx-barW/2-2)+'" x2="'+(cx+barW/2+2)+'" y1="'+targetY+'" y2="'+targetY+'" stroke="'+T.textMuted+'" stroke-dasharray="2,2"/>'
      + '<text x="'+cx+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'" text-anchor="middle">'+esc(it.label)+'</text>';
  }).join("");
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'">'
    + '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="'+T.hairline+'"/>'
    + bars + '</svg>';
}

/* Generic bucketed bar chart: one bar per bucket, value from getValue(), color
   from getColor(bucket, value). Bars can go negative (drawn below a zero line)
   which the saved-per-period chart needs. Value labels are drawn above/below
   each bar (rounded, no decimals) as long as bars are wide enough to fit them
   without overlapping; refLine (optional) draws a labelled dashed marker, e.g.
   the daily budget. Buckets carry their own `label`, so the same chart works
   whether they're days or months. */
function renderDailyBarChart(buckets, getValue, getColor, T, refLine, selectedKey, chartId) {
  if (!buckets.length) return '<div class="muted" style="font-size:12px;">No data in this period.</div>';
  var w = 340, h = 156, padL = 30, padR = 8, padT = 18, padB = 20;
  var values = buckets.map(getValue);
  var maxVal = Math.max.apply(null, values.concat([0, refLine==null?0:refLine]));
  var minVal = Math.min.apply(null, values.concat([0]));
  var range = (maxVal - minVal) || 1;
  var plotW = w-padL-padR, plotH = h-padT-padB;
  var n = buckets.length;
  var slot = plotW/n;
  var barW = Math.max(1, Math.min(20, slot*0.7));
  var showLabels = slot >= 20;
  function y(v){ return padT + plotH - ((v-minVal)/range)*plotH; }
  var zeroY = y(0);
  /* Each column gets a full-height transparent hit rect so thin bars are still
     an easy tap target — the bar itself is often only a few pixels wide. */
  var bars = buckets.map(function(b,i){
    var v = getValue(b);
    var cx = padL + slot*i + slot/2;
    var top = v>=0 ? y(v) : zeroY;
    var barH = Math.max(0.5, Math.abs(y(v)-zeroY));
    var hitKey = (chartId||"c")+"|"+b.key;
    var isSel = selectedKey != null && hitKey === selectedKey;
    var dim = (selectedKey != null && !isSel) ? ' opacity="0.38"' : '';
    var svg = '<rect x="'+(cx-barW/2)+'" y="'+top+'" width="'+barW+'" height="'+barH+'" fill="'+getColor(b,v)+'" rx="2"'+dim+'/>';
    if (isSel) {
      svg += '<rect x="'+(cx-barW/2-1.5)+'" y="'+(top-1.5)+'" width="'+(barW+3)+'" height="'+(barH+3)+'" fill="none" stroke="'+T.text+'" stroke-width="1.5" rx="3"/>';
    }
    if (showLabels && Math.round(v) !== 0) {
      var labelY = v>=0 ? Math.max(9, top-3) : (top+barH+9);
      var roundedV = Math.round(v);
      var labelStr = roundedV < 0 ? ("−"+fmt(Math.abs(roundedV),0)) : fmt(roundedV,0);
      svg += '<text x="'+cx+'" y="'+labelY+'" font-size="8" fill="'+(isSel?T.text:T.textMuted)+'" text-anchor="middle">'+labelStr+'</text>';
    }
    svg += '<rect class="chart-hit" data-action="select-bucket" data-key="'+esc(hitKey)+'" x="'+(padL+slot*i)+'" y="'+padT+'" width="'+slot+'" height="'+plotH+'" fill="transparent"/>';
    return svg;
  }).join("");
  var refSvg = "";
  if (refLine != null) {
    var ry = y(refLine);
    refSvg = '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+ry+'" y2="'+ry+'" stroke="'+T.textMuted+'" stroke-dasharray="3,3"/>'
      + '<text x="2" y="'+(ry+3)+'" font-size="8" fill="'+T.textMuted+'">'+fmt(Math.round(refLine),0)+'</text>';
  }
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'">'
    + refSvg
    + '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+zeroY+'" y2="'+zeroY+'" stroke="'+T.hairline+'"/>'
    + bars
    + '<text x="'+padL+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'">'+esc(buckets[0].label)+'</text>'
    + '<text x="'+(w-padR)+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'" text-anchor="end">'+esc(buckets[buckets.length-1].label)+'</text>'
    + '</svg>';
}

/* Cumulative spend for the elapsed portion of a period (smooth green curve),
   continuing as a straight projected line from today's actual total up to the
   forecasted end-of-period total — reusing the same avg-daily-pace math as
   the Home page's Forecast card, so the two numbers never disagree. A flat
   projection (as some budget apps show) would imply spending stops entirely;
   a straight line to the real forecast total is the honest version of the
   same picture. */
function renderForecastChart(rows, totalDays, target, projectedSpend, T, refLabel) {
  var w=340, h=190, padL=44, padR=8, padT=24, padB=20;
  var plotW=w-padL-padR, plotH=h-padT-padB;
  var n = Math.max(totalDays, 2);
  function xAt(i){ return padL + (i/(n-1))*plotW; }
  var actualVals = []; var acc = 0;
  rows.forEach(function(r){ acc += r.spent; actualVals.push(acc); });
  var maxY = Math.max(target, projectedSpend, actualVals.length ? Math.max.apply(null, actualVals) : 0, 1);
  function yAt(v){ return padT + plotH - (v/maxY)*plotH; }

  var actualPts = actualVals.map(function(v,i){ return [xAt(i), yAt(v)]; });
  var lastIdx = actualVals.length - 1;
  var lastVal = actualVals.length ? actualVals[actualVals.length-1] : 0;
  var curveD = actualPts.length >= 2 ? smoothPathD(actualPts) : (actualPts.length===1 ? ("M "+actualPts[0][0]+","+actualPts[0][1]) : "");
  var areaD = curveD ? (curveD+" L "+xAt(Math.max(0,lastIdx))+","+yAt(0)+" L "+xAt(0)+","+yAt(0)+" Z") : "";

  var forecastD = "";
  var todayMarker = "";
  if (rows.length > 0 && rows.length < totalDays) {
    forecastD = 'M '+xAt(lastIdx)+','+yAt(lastVal)+' L '+xAt(n-1)+','+yAt(projectedSpend);
    todayMarker = '<line x1="'+xAt(lastIdx)+'" x2="'+xAt(lastIdx)+'" y1="'+padT+'" y2="'+(h-padB)+'" stroke="'+T.hairline+'" stroke-dasharray="2,2"/>'
      + '<text x="'+xAt(lastIdx)+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'" text-anchor="middle">Today</text>';
  }

  var budgetY = yAt(target);
  var ticksSet = {}; [0, Math.round(maxY/2), Math.round(maxY)].forEach(function(t){ ticksSet[t]=true; });
  var tickSvg = Object.keys(ticksSet).map(Number).map(function(t){
    return '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+yAt(t)+'" y2="'+yAt(t)+'" stroke="'+T.sep+'" stroke-dasharray="2,2"/>'
      + '<text x="2" y="'+(yAt(t)+3)+'" font-size="9" fill="'+T.textMuted+'">'+fmt(t,0)+'</text>';
  }).join("");

  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'">'
    + tickSvg
    + '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+budgetY+'" y2="'+budgetY+'" stroke="'+T.text+'" stroke-width="1.5" stroke-dasharray="4,3"/>'
    + '<text x="'+padL+'" y="'+(budgetY-5)+'" font-size="9" font-weight="600" fill="'+T.text+'">'+esc(refLabel||"Budget")+'</text>'
    + (areaD ? '<path d="'+areaD+'" fill="'+T.positive+'" fill-opacity="0.16" stroke="none"/>' : "")
    + (curveD ? '<path d="'+curveD+'" fill="none" stroke="'+T.positive+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' : "")
    + (forecastD ? '<path d="'+forecastD+'" fill="none" stroke="'+T.accent+'" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1,5"/>' : "")
    + todayMarker
    + '</svg>';
}

/* Bar chart across several recent instances of the same period type, colored
   by a 3-tier status: on track (green), trending over (amber — only possible
   for the still-in-progress current period, based on its forecast), or over
   budget (red — either a finished period that ran over, or a current period
   forecast to run well over). One dashed line marks the most recent period's
   budget, since target can drift over time via rate changes. */
function renderTrendBarChart(items, refTarget, T, refLabel) {
  var w=340, h=150, padL=34, padR=8, padT=12, padB=20;
  var plotW=w-padL-padR, plotH=h-padT-padB;
  var maxVal = Math.max.apply(null, items.map(function(i){ return i.spent; }).concat([refTarget, 1]));
  var n = items.length;
  var slot = plotW/n;
  var barW = Math.min(30, slot*0.6);
  function y(v){ return padT + plotH - (Math.min(v,maxVal)/maxVal)*plotH; }
  var colorFor = { positive: T.positive, amber: T.amber, rust: T.rust };
  var bars = items.map(function(it,i){
    var cx = padL + slot*i + slot/2;
    var topY = y(it.spent);
    var barH = Math.max(0, plotH - (topY-padT));
    return '<rect x="'+(cx-barW/2)+'" y="'+topY+'" width="'+barW+'" height="'+barH+'" fill="'+(colorFor[it.status]||T.positive)+'" rx="3"/>'
      + '<text x="'+cx+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'" text-anchor="middle">'+esc(it.label)+'</text>';
  }).join("");
  var refY = y(refTarget);
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'">'
    + '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+refY+'" y2="'+refY+'" stroke="'+T.text+'" stroke-width="1.5" stroke-dasharray="4,3"/>'
    + '<text x="'+padL+'" y="'+(refY-5)+'" font-size="9" font-weight="600" fill="'+T.text+'">'+esc(refLabel||"Budget")+'</text>'
    + bars + '</svg>';
}

/* Resolves the Analysis page's selected period. week/month/year are navigable
   via analysisOffset (0 = current, -1 = previous, …), reusing getPeriodBounds so
   titles and bounds match the Home page exactly. custom uses explicit dates. */
function getAnalysisPeriodInfo() {
  var today = todayStr();
  var mode = state.analysisPeriodMode || "month";
  var off = state.analysisOffset || 0;
  if (mode === "custom") {
    var entryDatesAll = Object.keys(state.entries).sort();
    var fallbackStart = state.settings.trackingStartDate || (entryDatesAll.length ? entryDatesAll[0] : today);
    var from = state.analysisPeriodFrom || fallbackStart;
    var to = state.analysisPeriodTo || today;
    if (from > to) { var swap = from; from = to; to = swap; }
    return { start: from, end: to, title: shortLabel(from)+" – "+shortLabel(to), sub: "Custom range", isCurrent: true, mode: mode, days: daysBetween(from,to)+1 };
  }
  var per = getPeriodBounds(mode, off, currentWeeklyTarget(), dailyReference());
  return { start: per.startStr, end: per.endStr, title: per.title, sub: per.sub, isCurrent: off === 0, mode: mode, days: per.days };
}

/* Week/month are short enough to read day-by-day; a year would be 365 bars, so
   it rolls up to months. Custom ranges switch over at roughly two months. */
function analysisGranularity(info) {
  if (info.mode === "year") return "month";
  if (info.mode === "custom") return daysBetween(info.start, info.end) > 62 ? "month" : "day";
  return "day";
}

/* Collapses periodStats rows into chart buckets at the chosen granularity.
   Monthly buckets sum both spend and allowance, so a bucket's own target stays
   correct even when months differ in length. */
function buildAnalysisBuckets(rows, granularity, catFilter) {
  function keep(it){ return !catFilter || (it.category || "Uncategorised") === catFilter; }
  function spentOf(r){
    if (!catFilter) return r.spent;
    return (r.items||[]).reduce(function(t,it){ return keep(it) ? t+it.amount : t; }, 0);
  }
  if (granularity !== "month") {
    return rows.map(function(r){
      return { key: r.date, label: shortLabel(r.date), title: dayLabel(r.date), date: r.date,
               dates: [r.date], spent: spentOf(r), allowance: r.allowance, days: 1 };
    });
  }
  var map = {}, order = [];
  rows.forEach(function(r){
    var key = r.date.slice(0,7);
    if (!map[key]) {
      map[key] = { key: key, label: parseD(r.date).toLocaleDateString("en-GB",{month:"short"}),
                   title: parseD(r.date).toLocaleDateString("en-GB",{month:"long",year:"numeric"}),
                   date: r.date, dates: [], spent: 0, allowance: 0, days: 0 };
      order.push(key);
    }
    map[key].spent += spentOf(r);
    map[key].allowance += r.allowance;
    map[key].days += 1;
    map[key].dates.push(r.date);
  });
  return order.map(function(k){ return map[k]; });
}


function renderAnalysisBody(T) {
  var da = dailyReference();
  var today = todayStr();
  var periodMode = state.analysisPeriodMode || "month";
  var periodFrom = state.analysisPeriodFrom || "";
  var periodTo = state.analysisPeriodTo || "";
  var info = getAnalysisPeriodInfo();
  var cs = periodStats(info.start, info.end);
  var granularity = analysisGranularity(info);
  var perLabel = granularity === "month" ? "month" : "day";

  var h = "";
  h += '<div class="row between" style="align-items:center; margin-bottom:10px;">';
  h += '<div class="eyebrow">Analysis</div>';
  h += '<button data-action="toggle-analysis-reorder" class="btn-outline row gap2" style="padding:5px 10px; font-size:12px; align-items:center;">'+(state.analysisReorderMode?ICONS.check+" Done":ICONS.pencil+" Reorder")+'</button>';
  h += '</div>';

  h += '<div class="seg" style="margin-bottom:10px;">';
  [["budget","vs Budget"],["income","vs Income"]].forEach(function(opt){
    var activeB = state.basis === opt[0];
    h += '<button class="seg-btn" role="tab" aria-selected="'+activeB+'" data-action="set-basis" data-basis="'+opt[0]+'">'+opt[1]+'</button>';
  });
  h += '</div>';

  if (state.basis === "income" && !incomeIsSet()) {
    h += '<div class="card" style="padding:14px 16px; margin-bottom:12px; background:var(--rust-wash); border-color:var(--rust);">';
    h += '<div style="font-size:13px; margin-bottom:8px;">Set your income to use this view.</div>';
    h += '<button data-action="open-income-settings" class="btn-accent" style="width:100%;">Set income</button>';
    h += '</div>';
    return h;
  }

  h += '<div class="seg" style="margin-bottom:12px;">';
  [["week","Week"],["month","Month"],["year","Year"],["custom","Custom"]].forEach(function(opt){
    var active = periodMode === opt[0];
    h += '<button class="seg-btn" role="tab" aria-selected="'+active+'" data-action="set-analysis-period" data-mode="'+opt[0]+'">'+opt[1]+'</button>';
  });
  h += '</div>';

  if (periodMode === "custom") {
    h += '<div class="row gap2" style="margin-bottom:12px;">';
    h += '<input id="analysisPeriodFromInput" type="date" class="field mono" style="flex:1; font-size:13px;" value="'+esc(periodFrom)+'" max="'+today+'" />';
    h += '<input id="analysisPeriodToInput" type="date" class="field mono" style="flex:1; font-size:13px;" value="'+esc(periodTo)+'" max="'+today+'" />';
    h += '</div>';
  } else {
    h += '<div class="row between card" style="padding:8px 10px; margin-bottom:12px;">';
    h += '<button data-action="analysis-nav-offset" data-delta="-1" class="icon-btn" style="border-radius:10px;" aria-label="Previous">'+ICONS.chevronLeft+'</button>';
    h += '<div style="text-align:center; min-width:0;"><div style="font-size:13px; font-weight:500;">'+esc(info.title)+'</div>';
    h += '<div class="eyebrow" style="margin-top:2px;">'+esc(info.sub)+'</div></div>';
    h += '<button data-action="analysis-nav-offset" data-delta="1" class="icon-btn" style="border-radius:10px;'+(info.isCurrent?"opacity:0.3;pointer-events:none;":"")+'" aria-label="Next">'+ICONS.chevronRight+'</button>';
    h += '</div>';
  }

  var catFilter = state.analysisCategoryFilter || "";
  var selKey = state.analysisSelectedBucket;
  var buckets = buildAnalysisBuckets(cs.rows, granularity, catFilter);
  function itemCatOf(it){ return it.category || "Uncategorised"; }
  function keepItem(it){ return !catFilter || itemCatOf(it) === catFilter; }
  /* Spend restricted to the active category filter — the whole page reads from
     this so tapping a pie slice re-scopes every section at once. */
  function filteredSpent(){
    return cs.rows.reduce(function(t,r){
      return t + (r.items||[]).reduce(function(u,it){ return keepItem(it) ? u+it.amount : u; }, 0);
    }, 0);
  }

  if (catFilter) {
    h += '<div class="row between" style="margin-bottom:12px; align-items:center;">';
    h += '<span class="chip chip-accent">'+esc(catFilter)+'</span>';
    h += '<button class="btn-plain" data-action="clear-analysis-category">Clear filter</button>';
    h += '</div>';
  }

  var sectionHtml = {};

  sectionHtml.summary = function(){
    var s = '<div class="card card-pad" style="margin-bottom:16px;">';
    s += '<div class="stat-grid">';
    if (catFilter) {
      var catSpent = filteredSpent();
      var pctOfAll = cs.spent > 0 ? (catSpent/cs.spent*100) : 0;
      var txnCount = cs.rows.reduce(function(t,r){ return t + (r.items||[]).filter(keepItem).length; }, 0);
      s += statBlock("Spent on "+catFilter, fmt(catSpent,0)+" AED", "var(--text)");
      s += statBlock("Share of all spend", pctOfAll.toFixed(0)+"%", "var(--text)");
      s += statBlock("Avg per day", fmt(cs.elapsedDays>0?catSpent/cs.elapsedDays:0,0)+" AED", "var(--text)");
      s += statBlock("Transactions", String(txnCount), "var(--text)");
    } else {
      s += statBlock("Total spent", fmt(cs.spent,0)+" AED", "var(--text)");
      s += statBlock("Total saved", (cs.net>=0?"+":"−")+fmt(Math.abs(cs.net),0)+" AED", cs.net>=0?"var(--positive)":"var(--rust)");
      s += statBlock("Avg daily spend", fmt(cs.elapsedDays>0?cs.spent/cs.elapsedDays:0,0)+" AED", (cs.elapsedDays>0 && cs.spent/cs.elapsedDays>da)?"var(--rust)":"var(--text)");
      s += statBlock("Days tracked", String(cs.elapsedDays), "var(--text)");
    }
    s += '</div></div>';
    return s;
  };

  /* Drill-down panel shown under a chart when one of its columns is tapped. */
  function bucketDetail(chartId) {
    if (selKey == null) return "";
    var prefix = chartId+"|";
    if (selKey.indexOf(prefix) !== 0) return "";
    var wantKey = selKey.slice(prefix.length);
    var b = null;
    for (var i=0;i<buckets.length;i++) if (buckets[i].key === wantKey) { b = buckets[i]; break; }
    if (!b) return "";
    var rowsIn = cs.rows.filter(function(r){ return b.dates.indexOf(r.date) !== -1; });
    var items = [];
    rowsIn.forEach(function(r){
      (r.items||[]).forEach(function(it){ if (keepItem(it)) items.push({ date: r.date, it: it }); });
    });
    items.sort(function(x,y){ return y.it.amount - x.it.amount; });
    var totalIn = items.reduce(function(t,x){ return t+x.it.amount; }, 0);
    var refIn = b.allowance;
    var net = refIn - b.spent;

    var s = '<div class="bucket-detail hairline-top" style="margin-top:12px; padding-top:12px;">';
    s += '<div class="row between" style="align-items:flex-start; margin-bottom:10px;">';
    s += '<div><div class="headline">'+esc(b.title)+'</div>';
    s += '<div class="muted footnote" style="margin-top:2px;">Spent '+fmt(b.spent,0)+' of '+fmt(refIn,0)+' AED · <span style="color:'+(net>=0?"var(--positive)":"var(--rust)")+';">'+(net>=0?"+":"−")+fmt(Math.abs(net),0)+'</span></div></div>';
    s += '<button class="icon-btn press" data-action="clear-bucket" aria-label="Close">'+ICONS.x+'</button>';
    s += '</div>';
    if (!items.length) {
      s += '<div class="muted subhead">'+(catFilter ? "Nothing in "+esc(catFilter)+" here." : "Nothing logged — full allowance saved.")+'</div>';
    } else {

  sectionHtml.forecastedSpend = function(){
    if (catFilter || !cs.rows.length) return "";

    var pastDaysFC = todayIncludedFC ? cs.elapsedDays - 1 : cs.elapsedDays;
    var pastSpentFC = cs.spent - todaySpentFC;
    var avgSpentPerDayFC = pastDaysFC > 0 ? (pastSpentFC/pastDaysFC) : null;
    var daysLeftFC = Math.max(0, daysBetween(today, info.end));
    var hasForecast = daysLeftFC > 0 && avgSpentPerDayFC !== null;
    var projectedSpend = hasForecast ? (cs.spent + avgSpentPerDayFC * daysLeftFC) : cs.spent;
    var vsBudgetPct = periodTarget > 0 ? Math.round(((projectedSpend-periodTarget)/periodTarget)*100) : 0;

  sectionHtml.spendTrend = function(){
    if (catFilter || periodMode === "custom") return "";
    var N = 5;
    var bars = [];
    for (var trendOff = -(N-1); trendOff <= 0; trendOff++) {
      var pb = getPeriodBounds(periodMode, trendOff, currentWeeklyTarget(), da);
      var ps = periodStats(pb.startStr, pb.endStr);
      var isCurBar = trendOff === 0;
      var targetB = pb.target;
      var spentB = ps.spent;
      var projB = spentB;
      if (isCurBar) {
        var todayInclB = ps.rows.length>0 && ps.rows[ps.rows.length-1].date===today;
        var todaySpentB = todayInclB ? ps.rows[ps.rows.length-1].spent : 0;
        var pastDaysB = todayInclB ? ps.elapsedDays-1 : ps.elapsedDays;
        var pastSpentB = ps.spent - todaySpentB;
        var avgB = pastDaysB>0 ? pastSpentB/pastDaysB : null;
        var daysLeftB = Math.max(0, pb.days - ps.calendarElapsedDays);
        if (avgB!=null && daysLeftB>0) projB = ps.spent + avgB*daysLeftB;
      }
      var status = "positive";
      if (targetB > 0) {
        if (isCurBar) {
          if (projB > targetB*1.15) status = "rust";
          else if (projB > targetB) status = "amber";
        } else {
          status = spentB > targetB ? "rust" : "positive";
        }
      }
      var lbl = periodMode === "week" ? shortLabel(pb.startStr) : periodMode === "year" ? pb.title : parseD(pb.startStr).toLocaleDateString("en-GB",{month:"short"});
      bars.push({ label: lbl, spent: spentB, target: targetB, status: status });
    }
    var lastBar = bars[bars.length-1], prevBar = bars[bars.length-2];
    var vsPrevPct = (prevBar && prevBar.spent>0) ? Math.round(((lastBar.spent-prevBar.spent)/prevBar.spent)*100) : null;
    var s = '<div class="card card-pad" style="margin-bottom:16px;">';
    s += '<div class="eyebrow" style="margin-bottom:10px;">Spend trend</div>';
    s += '<div class="row between" style="align-items:flex-start; margin-bottom:14px;">';
    s += '<div><div class="muted caption">THIS '+esc(periodMode.toUpperCase())+'</div><div class="mono" style="font-size:22px; font-weight:700; margin-top:2px;">'+fmt(lastBar.spent,0)+' AED</div></div>';
    s += '<div style="text-align:right;"><div class="muted caption">VS PREVIOUS PERIOD</div>';
    s += vsPrevPct===null
      ? '<div class="chip" style="margin-top:4px; background:var(--fill); color:var(--text-muted);">---</div>'
      : '<div class="chip" style="margin-top:4px; background:'+(vsPrevPct<=0?"var(--positive)":"var(--rust)")+'; color:#fff; font-weight:700;">'+(vsPrevPct>=0?"+":"")+vsPrevPct+'%</div>';
    s += '</div></div>';
    s += renderTrendBarChart(bars, lastBar.target, T, basisWordCap());
    s += '<div class="row gap2" style="margin-top:10px; flex-wrap:wrap;">';
    s += legendSwatch("var(--positive)", "On track");
    s += legendSwatch("var(--amber)", "Trending over");
    s += legendSwatch("var(--rust)", "Over budget");
    s += '</div>';
    s += '</div>';
    return s;
  };

/* ---------------- actions ---------------- */
function handleAddTransaction() {
  var dateEl = document.getElementById("entryDateInput");
  var amtEl = document.getElementById("entryAmountInput");
  var noteEl = document.getElementById("entryNoteInput");
  var catEl = document.getElementById("entryCategoryInput");
  var date = dateEl ? dateEl.value : todayStr();
  var amt = parseFloat(amtEl ? amtEl.value : "");
  if (isNaN(amt) || amt < 0 || !date) return;
  var note = noteEl ? noteEl.value.trim() : "";
  var category = catEl ? catEl.value : "";
  var nextEntries = Object.assign({}, state.entries);
  var wasEditing = !!(state.editingItemId && state.editingOriginalDate);

  if (wasEditing) {
    var origDate = state.editingOriginalDate;
    var origDay = nextEntries[origDate];
    var carriedAllowance = origDay ? origDay.allowance : dailyAllowance();
    if (origDay) {
      var remaining = origDay.items.filter(function(i){ return i.id !== state.editingItemId; });
      if (remaining.length === 0) delete nextEntries[origDate];
      else nextEntries[origDate] = Object.assign({}, origDay, { items: remaining });
    }
    var updatedItem = { id: state.editingItemId, amount: amt, note: note, category: category };
    var destDay = nextEntries[date];
    var nextDest = destDay ? Object.assign({}, destDay, { items: destDay.items.concat([updatedItem]) }) : { allowance: carriedAllowance, items: [updatedItem] };
    nextEntries[date] = nextDest;
    state.editingItemId = null;
    state.editingOriginalDate = null;
    state.showAddTxn = false;
  } else {
    var existing = nextEntries[date];
    var newItem = { id: Date.now()+"-"+Math.random().toString(36).slice(2,7), amount: amt, note: note, category: category };
    nextEntries[date] = existing ? Object.assign({}, existing, { items: existing.items.concat([newItem]) }) : { allowance: dailyAllowance(), items: [newItem] };
    state.showAddTxn = false;
  }

  state.entryDate = date;
  persistAll(state.settings, nextEntries, "your entry");
  showToast(wasEditing ? "Record updated" : "Record added");
  render();
}

/* Mirrors handleApplyBudget: "future" appends a history entry from the start of
   this month so earlier months stay judged against what they actually had;
   "all" collapses history to a single entry. */
function handleApplyIncome(scope) {
  var el = document.getElementById("incomeDraftInput");
  var v = el ? parseFloat(el.value) : NaN;
  if (isNaN(v) || v < 0) return;
  var mode = state.incomeDraftMode || incomeForDate(todayStr()).mode || "monthly";
  var monthStart = toStr(startOfMonth(new Date()));
  var hist = (state.settings.incomeHistory || []).slice();
  var label;

  if (scope === "all") {
    hist = [{ from: "1900-01-01", mode: mode, amount: v }];
    label = "Income applied to all periods";
  } else {
    hist.push({ from: monthStart, mode: mode, amount: v });
    label = "Income applied from this month onward";
  }
  hist = normalizeIncomeHistory(hist);

  var nextSettings = Object.assign({}, state.settings, {
    incomeHistory: hist,
    incomeMode: mode,
    incomeAmount: v
  });
  persistAll(nextSettings, state.entries, "your income");
  state.incomeDraftMode = null;
  state.incomeDraftAmount = null;
  state.showSettings = false;
  showToast(label);
  render();
}

function handleApplyBudget(scope) {
  var wEl = document.getElementById("weeklyDraftInput");
  var v = wEl ? parseFloat(wEl.value) : NaN;
  if (isNaN(v) || v <= 0) return;
  var newDaily = v / 7;
  var wk = getPeriodBounds("week", 0, v, newDaily);
  var hist = (state.settings.rateHistory || []).slice();
  var nextEntries = Object.assign({}, state.entries);
  var label;

  function rewriteLoggedFrom(fromStr, toStr_) {
    Object.keys(nextEntries).forEach(function(d){
      if (d >= fromStr && (!toStr_ || d <= toStr_)) {
        nextEntries[d] = Object.assign({}, nextEntries[d], { allowance: newDaily });
      }
    });
  }

  if (scope === "all") {
    hist = [{ from: "1900-01-01", weeklyTarget: v }];
    rewriteLoggedFrom("1900-01-01", null);
    label = "Applied to all periods";
  } else if (scope === "future") {
    hist.push({ from: wk.startStr, weeklyTarget: v });
    rewriteLoggedFrom(wk.startStr, null);
    label = "Applied from this week onward";
  } else { // thisPeriod
    var prevRate = rateForDate(wk.startStr);
    var dayAfter = toStr(addDays(parseD(wk.endStr), 1));
    hist.push({ from: wk.startStr, weeklyTarget: v });
    hist.push({ from: dayAfter, weeklyTarget: prevRate });
    rewriteLoggedFrom(wk.startStr, wk.endStr);
    label = "Applied to this week only";
  }

  hist = normalizeRateHistory(hist);
  var nextSettings = Object.assign({}, state.settings, { rateHistory: hist });
  nextSettings.weeklyTarget = (function(){
    var r = hist[0].weeklyTarget, t = todayStr();
    for (var i=0;i<hist.length;i++){ if (hist[i].from <= t) r = hist[i].weeklyTarget; else break; }
    return r;
  })();
  persistAll(nextSettings, nextEntries, "your budget");
  state.showSettings = false;
  showToast(label);
  render();
}

/* Brings up the number pad the instant the Add/Edit sheet opens, so the
   person can start typing the amount without an extra tap. preventScroll
   stops iOS's own "scroll the focused field into view" behavior, which would
   otherwise fight the body scroll lock the moment the keyboard opens — the
   modal already handles its own scrolling via .modal-card. The extra
   updateVisualViewportOffset calls make sure --vvb (which the modal backdrop
   now uses to stay above the keyboard) catches up promptly, rather than
   waiting on the visualViewport "resize" event, which can lag the keyboard's
   slide-in animation by a beat on iOS. */
function focusAmountInput() {
  var el = document.getElementById("entryAmountInput");
  if (!el) return;
  try { el.focus({ preventScroll: true }); }
  catch(e) { try { el.focus(); } catch(e2) {} }
  if (typeof updateVisualViewportOffset === "function") {
    updateVisualViewportOffset();
    setTimeout(updateVisualViewportOffset, 60);
    setTimeout(updateVisualViewportOffset, 250);
    setTimeout(updateVisualViewportOffset, 400);
  }
}

function showToast(msg) {
  state.toastMessage = msg;

}

function handleQuickDate(date) {
  state.entryDate = date;
  var dateEl = document.getElementById("entryDateInput");
  if (dateEl) dateEl.value = date;
  var hintEl = document.getElementById("entryHint");
  if (hintEl) {
    var day = state.entries[date];
    hintEl.innerHTML = day ? (esc(dayLabel(date))+" so far: "+day.items.length+" transaction"+(day.items.length===1?"":"s")+", "+fmt(sumSpent(day),2)+" AED total.") : "";
  }
}

function handleCopyBackup() {
  var btn = document.getElementById("copyBackupBtn");
  var text = JSON.stringify({settings:state.settings, entries:state.entries}, null, 2);
  function done(msg) { if (btn) { btn.textContent = msg; setTimeout(function(){ if(btn) btn.textContent = "Copy backup"; }, 2500); } }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ done("Copied ✓"); }).catch(function(){ done("Select the text above to copy"); });
  } else {
    done("Select the text above to copy");
  }
}

function handleRestore() {
  var el = document.getElementById("restoreInput");
  var raw = el ? el.value : "";
  try {
    var parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object" || typeof parsed.entries !== "object") throw new Error("bad shape");
    var nextSettings = Object.assign({}, DEFAULT_SETTINGS, parsed.settings||{});
    nextSettings.analysisSectionOrder = normalizeAnalysisOrder(nextSettings.analysisSectionOrder);
    nextSettings.analysisHiddenSections = normalizeHiddenSections(nextSettings.analysisHiddenSections);
    nextSettings.incomeHistory = normalizeIncomeHistory(nextSettings.incomeHistory);
    var nextEntries = migrateEntries(parsed.entries||{}, nextSettings.weeklyTarget/7);
    persistAll(nextSettings, nextEntries, "restored data");
    state.restoreError = null;
    state.showBackup = false;
  } catch(e) {
    state.restoreError = "That doesn't look like a valid backup — paste the exact text you copied earlier.";
  }
  render();
}

/* ---------------- event delegation ---------------- */
document.addEventListener("click", function(e) {
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.dataset.action;
  switch(action) {
    case "open-backup": state.showBackup = true; render(); break;
    case "close-backup": state.showBackup = false; state.restoreError = null; render(); break;
    case "open-settings": state.showSettings = true; render(); break;
    case "close-settings": state.showSettings = false; render(); break;
    case "open-reset": state.showResetConfirm = true; render(); break;
    case "close-reset": state.showResetConfirm = false; render(); break;
    case "toggle-theme":
      persistAll(Object.assign({}, state.settings, { theme: state.settings.theme==="dark"?"light":"dark" }), state.entries, "your settings");
      render();
      break;
    case "switch-view": state.view = el.dataset.view; state.offset = 0; render(); break;
    case "nav-offset":
      var delta = parseInt(el.dataset.delta,10);
      var next = state.offset + delta;
      state.offset = Math.min(0, next);
      render();
      break;
    case "add-transaction": handleAddTransaction(); break;
    case "delete-txn":
      handleDeleteTxn(el.dataset.date, el.dataset.id);
      state.pendingDeleteKey = null;
      break;
    case "ask-delete-txn":
      state.pendingDeleteKey = el.dataset.date+"|"+el.dataset.id;
      render();
      break;
    case "cancel-delete-txn":
      state.pendingDeleteKey = null;
      render();
      break;
    case "edit-txn": handleEditTxn(el.dataset.date, el.dataset.id); break;
    case "cancel-edit": handleCancelEdit(); break;
    case "open-add-txn":
      state.editingItemId = null;
      state.editingOriginalDate = null;
      state.entryDate = todayStr();
      state.showAddTxn = true;
      state.pendingDeleteKey = null;
      render();
      focusAmountInput();
      break;
    case "close-add-txn":
      state.showAddTxn = false;
      state.editingItemId = null;
      state.editingOriginalDate = null;
      render();
      break;
    case "go-page":
      state.editingItemId = null;
      state.editingOriginalDate = null;
      state.showAddTxn = false;
      state.pendingDeleteKey = null;
      state.page = el.dataset.page;
      render();
      break;
    case "quick-date": handleQuickDate(el.dataset.date); break;
    case "cal-nav":
      state.calendarOffset += parseInt(el.dataset.delta,10);
      state.calendarSelectedDate = null;
      render();
      break;
    case "cal-select":
      state.calendarSelectedDate = (state.calendarSelectedDate === el.dataset.date) ? null : el.dataset.date;
      render();
      break;
    case "retry-save":
      if (state.saveError) { var se = state.saveError; state.saveError = null; persistAll(se.nextSettings, se.nextEntries, se.label); }
      render();
      break;
    case "settings-tab":
      state.settingsTab = el.dataset.tab;
      render();
      break;
    case "save-tracking":
      var tsEl = document.getElementById("trackingStartInput");
      var trackSettings = Object.assign({}, state.settings, { trackingStartDate: (tsEl && tsEl.value) ? tsEl.value : null });
      persistAll(trackSettings, state.entries, "your settings");
      showToast("Tracking date saved");
      render();
      break;
    case "apply-budget":
      handleApplyBudget(el.dataset.scope);
      break;
    case "add-category":
      var newCatEl = document.getElementById("newCategoryInput");
      var newCat = newCatEl ? newCatEl.value.trim() : "";
      if (newCat && (state.settings.categories||[]).indexOf(newCat) === -1) {
        var withCat = Object.assign({}, state.settings, { categories: (state.settings.categories||[]).concat([newCat]) });
        persistAll(withCat, state.entries, "your settings");
        render();
      }
      break;
    case "remove-category":
      var catToRemove = el.dataset.cat;
      var withoutCat = Object.assign({}, state.settings, { categories: (state.settings.categories||[]).filter(function(c){ return c !== catToRemove; }) });
      persistAll(withoutCat, state.entries, "your settings");
      render();
      break;
    case "move-category":
      var dir = parseInt(el.dataset.dir,10);
      var cats2 = (state.settings.categories||[]).slice();
      var idx = cats2.indexOf(el.dataset.cat);
      var swapIdx = idx + dir;
      if (idx >= 0 && swapIdx >= 0 && swapIdx < cats2.length) {
        var tmp = cats2[idx]; cats2[idx] = cats2[swapIdx]; cats2[swapIdx] = tmp;
        var movedSettings = Object.assign({}, state.settings, { categories: cats2 });
        persistAll(movedSettings, state.entries, "your settings");
        render();
      }
      break;
    case "toggle-analysis-reorder":
      state.analysisReorderMode = !state.analysisReorderMode;
      render();
      break;
    case "set-analysis-period":
      state.analysisPeriodMode = el.dataset.mode;
      state.analysisOffset = 0;
      state.analysisSelectedBucket = null;
      render();
      break;
    case "select-bucket":
      state.analysisSelectedBucket = (state.analysisSelectedBucket === el.dataset.key) ? null : el.dataset.key;
      render();
      break;
    case "clear-bucket":
      state.analysisSelectedBucket = null;
      render();
      break;
    case "filter-analysis-category":
      state.analysisCategoryFilter = (state.analysisCategoryFilter === el.dataset.cat) ? "" : el.dataset.cat;
      state.analysisSelectedBucket = null;
      render();
      break;
    case "clear-analysis-category":
      state.analysisCategoryFilter = "";
      state.analysisSelectedBucket = null;
      render();
      break;
    case "set-basis":
      state.basis = el.dataset.basis;
      state.analysisSelectedBucket = null;
      render();
      break;
    case "open-income-settings":
      state.settingsTab = "income";
      state.incomeDraftMode = null;
      state.incomeDraftAmount = null;
      state.showSettings = true;
      render();
      break;
    case "income-mode":
      var incEl = document.getElementById("incomeDraftInput");
      if (incEl) state.incomeDraftAmount = incEl.value;
      state.incomeDraftMode = el.dataset.mode;
      render();
      break;
    case "apply-income":
      handleApplyIncome(el.dataset.scope);
      break;
    case "apply-appearance":
      var bgEl = document.getElementById("customBgInput");
      var accEl = document.getElementById("customAccentInput");
      var nextAppearance = Object.assign({}, state.settings, {
        customDarkBg: bgEl ? bgEl.value : state.settings.customDarkBg,
        customAccent: accEl ? accEl.value : state.settings.customAccent
      });
      persistAll(nextAppearance, state.entries, "your settings");
      state.showSettings = false;
      showToast("Appearance updated");
      render();
      break;
    case "reset-appearance":
      var resetAppearance = Object.assign({}, state.settings, { customDarkBg: null, customAccent: null });
      persistAll(resetAppearance, state.entries, "your settings");
      showToast("Appearance reset");
      render();
      break;
    case "analysis-nav-offset":
      state.analysisOffset = Math.min(0, (state.analysisOffset||0) + parseInt(el.dataset.delta,10));
      state.analysisSelectedBucket = null;
      render();
      break;
    case "move-analysis-section":
      var dirA = parseInt(el.dataset.dir,10);
      var orderA = normalizeAnalysisOrder(state.settings.analysisSectionOrder);
      var idxA = orderA.indexOf(el.dataset.section);
      var swapA = idxA + dirA;
      if (idxA >= 0 && swapA >= 0 && swapA < orderA.length) {
        var tmpA = orderA[idxA]; orderA[idxA] = orderA[swapA]; orderA[swapA] = tmpA;
        persistAll(Object.assign({}, state.settings, { analysisSectionOrder: orderA }), state.entries, "your settings");
        render();
      }
      break;
    case "toggle-analysis-hidden":
      var hiddenH = normalizeHiddenSections(state.settings.analysisHiddenSections);
      var secH = el.dataset.section;
      var nextHidden = hiddenH.indexOf(secH) !== -1 ? hiddenH.filter(function(x){ return x!==secH; }) : hiddenH.concat([secH]);
      persistAll(Object.assign({}, state.settings, { analysisHiddenSections: nextHidden }), state.entries, "your settings");
      render();
      break;
    case "copy-backup": handleCopyBackup(); break;
    case "restore-backup": handleRestore(); break;
    case "confirm-reset":
      persistAll(state.settings, {}, "reset");
      state.showResetConfirm = false;
      render();
      break;
  }
});

/* Live preview for the theme color pickers: recolors the whole UI the instant
   a color is picked, without waiting for Apply or a full re-render (which
   would rebuild the sheet mid-pick and could interrupt the native picker). */
document.addEventListener("input", function(e) {
  if (e.target && e.target.id === "customBgInput") {
    var tones = deriveDarkTones(e.target.value);
    var r = document.documentElement.style;
    r.setProperty("--bg", tones.bg); r.setProperty("--card", tones.card); r.setProperty("--raised", tones.raised);
    r.setProperty("--fill", tones.fill); r.setProperty("--sep", tones.sep); r.setProperty("--hairline", tones.hairline);
    var metaBg = document.querySelector('meta[name="theme-color"]');
    if (metaBg) metaBg.setAttribute("content", tones.bg);
    var lbl = document.getElementById("customBgLabel");
    if (lbl) lbl.textContent = e.target.value.toUpperCase();
  }
  if (e.target && e.target.id === "customAccentInput") {
    var r2 = document.documentElement.style;
    r2.setProperty("--accent", e.target.value);
    r2.setProperty("--accent-ink", readableInk(e.target.value));
    var lbl2 = document.getElementById("customAccentLabel");
    if (lbl2) lbl2.textContent = e.target.value.toUpperCase();
  }
});

document.addEventListener("change", function(e) {
  if (e.target && e.target.id === "entryDateInput") handleQuickDate(e.target.value);
  if (e.target && e.target.id === "txnCategoryFilterSelect") { state.txnCategoryFilter = e.target.value; render(); }
  if (e.target && e.target.id === "txnPeriodModeSelect") {
    state.txnPeriodMode = e.target.value;
    if ((state.txnPeriodMode === "week" || state.txnPeriodMode === "month") && !state.txnPeriodDate) state.txnPeriodDate = todayStr();
    render();
  }
  if (e.target && e.target.id === "txnPeriodAnchorInput") { state.txnPeriodDate = e.target.value; render(); }
  if (e.target && e.target.id === "txnPeriodFromInput") { state.txnPeriodFrom = e.target.value; render(); }
  if (e.target && e.target.id === "txnPeriodToInput") { state.txnPeriodTo = e.target.value; render(); }
  if (e.target && e.target.id === "analysisPeriodFromInput") { state.analysisPeriodFrom = e.target.value; render(); }
  if (e.target && e.target.id === "analysisPeriodToInput") { state.analysisPeriodTo = e.target.value; render(); }
});

/* ---------------- init ---------------- */
function setViewportHeightVar() {
  document.documentElement.style.setProperty("--vh100", window.innerHeight + "px");
}
setViewportHeightVar();
window.addEventListener("resize", setViewportHeightVar);
window.addEventListener("orientationchange", setViewportHeightVar);

/* visualViewport tracking, for two different jobs that both need it:
   --vvb (bottom gap) is what the tab bar/FAB use, assuming the viewport's top
   stays put and only its bottom shrinks for the keyboard.
   --vvt/--vvh (top offset + height) pin the modal backdrop to the actual
   visible rectangle, top edge included — needed because iOS doesn't just
   shrink the visual viewport for the keyboard, it can also *pan* it (offsetTop
   != 0), which happens mid-gesture while scrolling inside a focused modal.
   A bottom-gap-only assumption goes wrong exactly then: as offsetTop grows,
   the --vvb formula understates the true gap, and a backdrop anchored with
   top:0 lets its bottom edge sink back down behind the keyboard even though
   the modal never closed. Anchoring top+height to the live rectangle instead
   means the backdrop tracks reality regardless of why the viewport moved. */
function updateVisualViewportOffset() {
  var vv = window.visualViewport;
  var r = document.documentElement.style;
  if (!vv) {
    r.setProperty("--vvb", "0px");
    r.setProperty("--vvt", "0px");
    r.setProperty("--vvh", "100dvh");
    return;
  }
  var gap = window.innerHeight - vv.height - vv.offsetTop;
  r.setProperty("--vvb", Math.max(0, Math.round(gap)) + "px");
  r.setProperty("--vvt", Math.round(vv.offsetTop) + "px");
  r.setProperty("--vvh", Math.round(vv.height) + "px");
}
updateVisualViewportOffset();
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", updateVisualViewportOffset);
  window.visualViewport.addEventListener("scroll", updateVisualViewportOffset);
}
window.addEventListener("resize", updateVisualViewportOffset);
window.addEventListener("orientationchange", updateVisualViewportOffset);
setTimeout(updateVisualViewportOffset, 300);
setTimeout(updateVisualViewportOffset, 1000);

loadInitial();
render();
</script>
