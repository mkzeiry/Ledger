  var maxVal = Math.max.apply(null, items.map(function(i){ return Math.max(i.spent, i.target); }).concat([1]));
  var plotW = w-padL-padR, plotH = h-padT-padB;
  var n = items.length;
  var slot = plotW/n;
  var barW = Math.min(24, slot*0.55);
  function y(v){ return padT + plotH - (Math.min(v,maxVal)/maxVal)*plotH; }
  var bars = items.map(function(it,i){
    var cx = padL + slot*i + slot/2;
    var barTopY = y(it.spent);
    var barH = Math.max(0, plotH - (barTopY-padT));
    var color = it.spent <= it.target ? T.positive : T.rust;
    var targetY = y(it.target);
    return '<rect x="'+(cx-barW/2)+'" y="'+barTopY+'" width="'+barW+'" height="'+barH+'" fill="'+color+'" rx="2"/>'
      + '<line x1="'+(cx-barW/2-2)+'" x2="'+(cx+barW/2+2)+'" y1="'+targetY+'" y2="'+targetY+'" stroke="'+T.textMuted+'" stroke-dasharray="2,2"/>'
      + '<text x="'+cx+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'" text-anchor="middle">'+esc(it.label)+'</text>';
  }).join("");
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'">'
    + '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="'+T.hairline+'"/>'
    + bars + '</svg>';
}

/* Generic bucketed bar chart: one bar per bucket, value from getValue(), color
   from getColor(bucket, value). Bars can go negative (drawn below a zero line)
   which the saved-per-period chart needs. Value labels are drawn above/below
   each bar (rounded, no decimals) as long as bars are wide enough to fit them
   without overlapping; refLine (optional) draws a labelled dashed marker, e.g.
   the daily budget. Buckets carry their own `label`, so the same chart works
   whether they're days or months. */
function renderDailyBarChart(buckets, getValue, getColor, T, refLine, selectedKey, chartId) {
  if (!buckets.length) return '<div class="muted" style="font-size:12px;">No data in this period.</div>';
  var w = 340, h = 156, padL = 30, padR = 8, padB = 20;
  var n = buckets.length;
  var plotW = w-padL-padR;
  var slot = plotW/n;
  var barW = Math.max(1, Math.min(20, slot*0.7));
  /* Horizontal labels need real width to read; below that, rotate them
     vertical so a value is still visible even at daily-for-a-month density —
     hiding it outright was the old behavior, but a label you have to tap to
     see isn't a label. Vertical labels get extra top padding so they don't
     clip against the chart's edge above a tall bar. */
  var labelMode = slot >= 20 ? "h" : (slot >= 7 ? "v" : "none");
  var padT = labelMode === "v" ? 40 : 18;
  var values = buckets.map(getValue);
  var maxVal = Math.max.apply(null, values.concat([0, refLine==null?0:refLine]));
  var minVal = Math.min.apply(null, values.concat([0]));
  var range = (maxVal - minVal) || 1;
  var plotH = h-padT-padB;
  function y(v){ return padT + plotH - ((v-minVal)/range)*plotH; }
  var zeroY = y(0);
  /* Each column gets a full-height transparent hit rect so thin bars are still
     an easy tap target — the bar itself is often only a few pixels wide. */
  var bars = buckets.map(function(b,i){
    var v = getValue(b);
    var cx = padL + slot*i + slot/2;
    var top = v>=0 ? y(v) : zeroY;
    var barH = Math.max(0.5, Math.abs(y(v)-zeroY));
    var hitKey = (chartId||"c")+"|"+b.key;
    var isSel = selectedKey != null && hitKey === selectedKey;
    var dim = (selectedKey != null && !isSel) ? ' opacity="0.38"' : '';
    var svg = '<rect x="'+(cx-barW/2)+'" y="'+top+'" width="'+barW+'" height="'+barH+'" fill="'+getColor(b,v)+'" rx="2"'+dim+'/>';
    if (isSel) {
      svg += '<rect x="'+(cx-barW/2-1.5)+'" y="'+(top-1.5)+'" width="'+(barW+3)+'" height="'+(barH+3)+'" fill="none" stroke="'+T.text+'" stroke-width="1.5" rx="3"/>';
    }
    if (labelMode !== "none" && Math.round(v) !== 0) {
      var roundedV = Math.round(v);
      var labelStr = roundedV < 0 ? ("−"+fmt(Math.abs(roundedV),0)) : fmt(roundedV,0);
      var labelFill = isSel ? T.text : T.textMuted;
      if (labelMode === "h") {
        var labelY = v>=0 ? Math.max(9, top-3) : (top+barH+9);
        svg += '<text x="'+cx+'" y="'+labelY+'" font-size="8" fill="'+labelFill+'" text-anchor="middle">'+labelStr+'</text>';
      } else {
        // Vertical label: reads bottom-to-top above a positive bar, or
        // top-to-bottom below a negative one, so it never overlaps the bar.
        if (v>=0) {
          svg += '<text x="0" y="0" font-size="7" fill="'+labelFill+'" text-anchor="start" transform="translate('+cx+','+Math.max(10,top-3)+') rotate(-90)">'+labelStr+'</text>';
        } else {
          svg += '<text x="0" y="0" font-size="7" fill="'+labelFill+'" text-anchor="start" transform="translate('+cx+','+(top+barH+3)+') rotate(90)">'+labelStr+'</text>';
        }
      }
    }
    svg += '<rect class="chart-hit" data-action="select-bucket" data-key="'+esc(hitKey)+'" x="'+(padL+slot*i)+'" y="'+padT+'" width="'+slot+'" height="'+plotH+'" fill="transparent"/>';
    return svg;
  }).join("");
  var refSvg = "";
  if (refLine != null) {
    var ry = y(refLine);
    refSvg = '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+ry+'" y2="'+ry+'" stroke="'+T.textMuted+'" stroke-dasharray="3,3"/>'
      + '<text x="2" y="'+(ry+3)+'" font-size="8" fill="'+T.textMuted+'">'+fmt(Math.round(refLine),0)+'</text>';
  }
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'">'
    + refSvg
    + '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+zeroY+'" y2="'+zeroY+'" stroke="'+T.hairline+'"/>'
    + bars
    + '<text x="'+padL+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'">'+esc(buckets[0].label)+'</text>'
    + '<text x="'+(w-padR)+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'" text-anchor="end">'+esc(buckets[buckets.length-1].label)+'</text>'
    + '</svg>';
}

/* Shared by renderForecastChart and wireForecastChart, mirroring
   balanceChartGeom's role for the Home page chart. */
function forecastChartGeom(rows, totalDays, target, projectedSpend, compareValues, pastDays, forecastValues) {
  var w=340, h=190, padL=44, padR=8, padT=24, padB=20;
  var plotW=w-padL-padR, plotH=h-padT-padB;
  var n = Math.max(totalDays, 2);
  function xAt(i){ return padL + (i/(n-1))*plotW; }
  var actualVals = []; var acc = 0;
  rows.forEach(function(r){ acc += r.spent; actualVals.push(acc); });
  var compareMax = (compareValues && compareValues.length) ? Math.max.apply(null, compareValues) : 0;
  var targetVal = target == null ? 0 : target;
  var forecastMax = (forecastValues && forecastValues.length) ? Math.max.apply(null, forecastValues.filter(function(v){return v!=null;})) : 0;
  var maxY = Math.max(targetVal, projectedSpend, actualVals.length ? Math.max.apply(null, actualVals) : 0, compareMax, forecastMax, 1);
  function yAt(v){ return padT + plotH - (v/maxY)*plotH; }
  var lastIdx = actualVals.length - 1;
  var lastVal = actualVals.length ? actualVals[actualVals.length-1] : 0;
  var pd = pastDays || 0;
  var knownIdx = pd > 0 ? pd - 1 : 0;
  var knownVal = pd > 0 ? actualVals[pd-1] : 0;
  return { w:w, h:h, padL:padL, padR:padR, padT:padT, padB:padB, plotW:plotW, plotH:plotH,
           n:n, xAt:xAt, yAt:yAt, maxY:maxY, actualVals:actualVals, lastIdx:lastIdx, lastVal:lastVal,
           knownIdx:knownIdx, knownVal:knownVal };
}

/* Cumulative value at any index along the chart, actual portion or
   interpolated along the straight projected segment beyond it — lets the
   scrub tooltip report a sensible number no matter where on the axis the
   finger lands. */
function forecastValueAt(g, idx, projectedSpend, forecastValues) {
  if (idx <= g.lastIdx && g.actualVals.length) return g.actualVals[Math.max(0,idx)];
  if (forecastValues && forecastValues[idx] != null) return forecastValues[idx];
  if (g.n-1 === g.knownIdx) return g.knownVal;
  var frac = (idx - g.knownIdx) / ((g.n-1) - g.knownIdx);
  return g.knownVal + (projectedSpend - g.knownVal) * frac;
}

/* Cumulative spend for the elapsed portion of a period (smooth green curve),
   continuing as a straight projected line from today's actual total up to the
   forecasted end-of-period total — reusing the same avg-daily-pace math as
   the Home page's Forecast card, so the two numbers never disagree. A flat
   projection (as some budget apps show) would imply spending stops entirely;
   a straight line to the real forecast total is the honest version of the
   same picture. */
function renderForecastChart(rows, totalDays, target, projectedSpend, T, refLabel, compareValues, pastDays, hasForecast, forecastValues) {
  var g = forecastChartGeom(rows, totalDays, target, projectedSpend, compareValues, pastDays, forecastValues);
  var w=g.w, h=g.h, padL=g.padL, padR=g.padR, padT=g.padT, padB=g.padB, n=g.n;
  var xAt=g.xAt, yAt=g.yAt, maxY=g.maxY, actualVals=g.actualVals, lastIdx=g.lastIdx;
  var actualPts = actualVals.map(function(v,i){ return [xAt(i), yAt(v)]; });
  var curveD = actualPts.length >= 2 ? smoothPathD(actualPts) : (actualPts.length===1 ? ("M "+actualPts[0][0]+","+actualPts[0][1]) : "");
  var areaD = curveD ? (curveD+" L "+xAt(Math.max(0,lastIdx))+","+yAt(0)+" L "+xAt(0)+","+yAt(0)+" Z") : "";
  var forecastD = "", todayMarker = "";
  var daysToEstimateLocal = totalDays - rows.length;
  if (rows.length > 0 && (daysToEstimateLocal > 0 || hasForecast)) {
    if (hasForecast) {
      var fp=[];
      if (lastIdx>=0) fp.push([xAt(lastIdx),yAt(actualVals[lastIdx]||0)]);
      for (var fpi=lastIdx+1; fpi<n; fpi++) {
        var fv=(forecastValues&&forecastValues[fpi]!=null)?forecastValues[fpi]:forecastValueAt(g,fpi,projectedSpend,forecastValues);
        fp.push([xAt(fpi),yAt(fv)]);
      }
      if (fp.length>=2) forecastD=fp.reduce(function(d,p,i){return d+(i===0?'M ':' L ')+p[0]+','+p[1];},'');
    }
    todayMarker = '<line x1="'+xAt(lastIdx)+'" x2="'+xAt(lastIdx)+'" y1="'+padT+'" y2="'+(h-padB)+'" stroke="'+T.hairline+'" stroke-dasharray="2,2"/>'
      + '<text x="'+xAt(lastIdx)+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'" text-anchor="middle">Today</text>';
  }
  var compareD = "";
  if (compareValues && compareValues.length >= 2) {
    compareD = smoothPathD(compareValues.map(function(v,i){ return [xAt(i), yAt(v)]; }));
  } else if (compareValues && compareValues.length === 1) compareD = "M "+xAt(0)+","+yAt(compareValues[0]);
  var ticksSet = {}; [0, Math.round(maxY/2), Math.round(maxY)].forEach(function(t){ ticksSet[t]=true; });
  var tickSvg = Object.keys(ticksSet).map(Number).map(function(t){
    return '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+yAt(t)+'" y2="'+yAt(t)+'" stroke="'+T.sep+'" stroke-dasharray="2,2"/>'
      + '<text x="2" y="'+(yAt(t)+3)+'" font-size="9" fill="'+T.textMuted+'">'+fmt(t,0)+'</text>';
  }).join("");
  var targetSvg = "";
  if (target != null) {
    var budgetY = yAt(target);
    targetSvg = '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+budgetY+'" y2="'+budgetY+'" stroke="'+T.text+'" stroke-width="1.5" stroke-dasharray="4,3"/>'
      + '<text x="'+padL+'" y="'+(budgetY-5)+'" font-size="9" font-weight="600" fill="'+T.text+'">'+esc(refLabel||"Budget")+' – '+fmt(target,0)+' AED</text>';
  }
  return '<svg id="forecastChartSvg" viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'">'
    + tickSvg + targetSvg
    + (compareD ? '<path d="'+compareD+'" fill="none" stroke="'+T.textMuted+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5,4"/>' : "")
    + (areaD ? '<path d="'+areaD+'" fill="'+T.positive+'" fill-opacity="0.16" stroke="none"/>' : "")
    + (curveD ? '<path d="'+curveD+'" fill="none" stroke="'+T.positive+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' : "")
    + (forecastD ? '<path d="'+forecastD+'" fill="none" stroke="'+T.accent+'" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1,5"/>' : "")
    + todayMarker
    + '<line id="forecastChartCrosshair" x1="0" x2="0" y1="'+padT+'" y2="'+(h-padB)+'" stroke="'+T.text+'" stroke-width="1" opacity="0"/>'
    + '<circle id="forecastChartDot" r="4.5" fill="'+T.accent+'" stroke="'+T.bg+'" stroke-width="2" opacity="0"/>'
    + '<rect id="forecastChartHit" x="0" y="0" width="'+w+'" height="'+h+'" fill="transparent" style="touch-action:none;"/>'
    + '</svg>';
}

/* Drives the crosshair/dot/tooltip during a touch or mouse drag across the
   forecast chart — same bypass-render() approach as wireBalanceChart, for
   the same reason: rebuilding the DOM on every pixel of movement would kill
   the smoothness of the drag. Reports whichever of the actual or projected
   value applies at the touched point, labelled accordingly. */
function wireForecastChart(data) {
  var svg = document.getElementById("forecastChartSvg");
  var hit = document.getElementById("forecastChartHit");
  var crosshair = document.getElementById("forecastChartCrosshair");
  var dot = document.getElementById("forecastChartDot");
  var tip = document.getElementById("forecastChartTip");
  if (!svg || !hit || !crosshair || !dot || !tip || !data) return;
  var g = forecastChartGeom(data.rows, data.totalDays, data.target, data.projectedSpend, data.compareValues, data.pastDays, data.forecastValues);
  if (g.n < 2) return;

  function indexAt(clientX) {
    var rect = svg.getBoundingClientRect();
    if (!rect.width) return 0;
    var frac = Math.max(0, Math.min(1, (clientX-rect.left)/rect.width));
    var vbX = frac * g.w;
    var idx = Math.round(((vbX-g.padL)/g.plotW) * (g.n-1));
    return Math.max(0, Math.min(g.n-1, idx));
  }
  function showAt(idx) {
    var val = forecastValueAt(g, idx, data.projectedSpend, data.forecastValues);
    var px = g.xAt(idx), py = g.yAt(val);
    crosshair.setAttribute("x1", px); crosshair.setAttribute("x2", px); crosshair.setAttribute("opacity", "1");
    dot.setAttribute("cx", px); dot.setAttribute("cy", py); dot.setAttribute("opacity", "1");
    var dateStr = shortLabel(toStr(addDays(parseD(data.start), idx)));
    var isProjected = idx > g.lastIdx;
    var lineStyle = 'white-space:nowrap; overflow:hidden; text-overflow:ellipsis;';
    var tipHtml = '<div style="'+lineStyle+'"><span class="muted">'+esc(dateStr)+(isProjected?" (projected)":"")+'</span> <span style="color:var(--text); font-weight:600;">'+fmt(Math.round(val),0)+' AED</span></div>';
    if (data.compareValues && data.compareValues.length > idx) {
      tipHtml += '<div style="'+lineStyle+' margin-top:2px;"><span class="muted">'+esc(data.compareLabel||"Compare")+' </span><span style="color:var(--text-muted); font-weight:600;">'+fmt(Math.round(data.compareValues[idx]),0)+' AED</span></div>';
    }
    tip.innerHTML = tipHtml;
    positionChartTooltip(tip, svg, px, g.w);
    tip.style.opacity = "1";
  }
  function hide() {
    crosshair.setAttribute("opacity", "0");
    dot.setAttribute("opacity", "0");
    tip.style.opacity = "0";
  }
  function move(clientX) { showAt(indexAt(clientX)); }

  hit.addEventListener("touchstart", function(e){ move(e.touches[0].clientX); }, {passive:true});
  hit.addEventListener("touchmove", function(e){ move(e.touches[0].clientX); e.preventDefault(); }, {passive:false});
  hit.addEventListener("touchend", hide);
  hit.addEventListener("touchcancel", hide);
  hit.addEventListener("mousedown", function(e){ move(e.clientX); });
  hit.addEventListener("mousemove", function(e){ if (e.buttons===1) move(e.clientX); });
  hit.addEventListener("mouseleave", hide);
  hit.addEventListener("mouseup", hide);
}


/* Future income is intentionally forecast only when it is explicitly scheduled
   as an active recurring income plan. We do not invent future salary/bonus
   amounts from past income transactions. */
function scheduledIncomeByDate(afterStr, throughStr) {
  var out = {};
  (state.settings.recurringRules||[]).forEach(function(rule){
    if (!rule.active || rule.entryKind !== "income") return;
    var n = rule.occurrencesLogged || 0, guard = 0;
    while (guard < 500) {
      if (rule.occurrencesTotal != null && n >= rule.occurrencesTotal) break;
      var due = recurringOccurrenceDate(rule,n);
      if (due > throughStr) break;
      if (rule.endDate && due > rule.endDate) break;
      if (due > afterStr) out[due] = round2((out[due]||0) + ruleOccurrenceAmount(rule,n));
      n++; guard++;
    }
  });
  return out;
}
function scheduledIncomeInRange(afterStr, throughStr) {
  var m=scheduledIncomeByDate(afterStr,throughStr), t=0;
  Object.keys(m).forEach(function(k){t+=m[k];});
  return round2(t);
}

function analysisForecastGeom(data) {
  var w=340,h=210,padL=44,padR=34,padT=24,padB=22;
  var plotW=w-padL-padR,plotH=h-padT-padB,n=Math.max(data.totalDays,2);
  function xAt(i){return padL+(i/(n-1))*plotW;}
  var maxY=Math.max(data.projectedSpend||0,data.projectedIncome||0,1);
  (data.spendActual||[]).forEach(function(v){maxY=Math.max(maxY,v);});
  (data.incomeValues||[]).forEach(function(v){maxY=Math.max(maxY,v);});
  maxY*=1.08;
  function yAt(v){return padT+plotH-(Math.max(0,v)/maxY)*plotH;}
  return {w:w,h:h,padL:padL,padR:padR,padT:padT,padB:padB,plotW:plotW,plotH:plotH,n:n,xAt:xAt,yAt:yAt,maxY:maxY};
}
function analysisForecastSpendAt(data, idx) {
  var actual=data.spendActual||[];
  if (actual.length && idx < actual.length) return actual[idx];
  var knownIdx=Math.max(0,(data.pastDays||0)-1), knownVal=(data.pastDays||0)>0 ? actual[knownIdx] : 0;
  if (data.totalDays-1===knownIdx) return knownVal;
  var frac=(idx-knownIdx)/((data.totalDays-1)-knownIdx);
  return knownVal+(data.projectedSpend-knownVal)*Math.max(0,Math.min(1,frac));
}
function renderAnalysisForecastChart(data,T) {
  var g=analysisForecastGeom(data),xAt=g.xAt,yAt=g.yAt,n=g.n;
  var ticks={};[0,Math.round(g.maxY/2),Math.round(g.maxY)].forEach(function(v){ticks[v]=true;});
  var grid=Object.keys(ticks).map(Number).map(function(v){return '<line x1="'+g.padL+'" x2="'+(g.w-g.padR)+'" y1="'+yAt(v)+'" y2="'+yAt(v)+'" stroke="'+T.sep+'" stroke-dasharray="2,2"/><text x="2" y="'+(yAt(v)+3)+'" font-size="9" fill="'+T.textMuted+'">'+fmt(v,0)+'</text>';}).join('');
  var spendPts=(data.spendActual||[]).map(function(v,i){return [xAt(i),yAt(v)];});
  var spendD=spendPts.length>=2?smoothPathD(spendPts):(spendPts.length?'M '+spendPts[0][0]+','+spendPts[0][1]:'');
  var knownIdx=Math.max(0,(data.pastDays||0)-1),knownVal=(data.pastDays||0)>0?(data.spendActual[knownIdx]||0):0;
  var forecastD=data.hasForecast?'M '+xAt(knownIdx)+','+yAt(knownVal)+' L '+xAt(n-1)+','+yAt(data.projectedSpend):'';
  var incomePts=(data.incomeValues||[]).map(function(v,i){return [xAt(i),yAt(v)];});
  /* Income is cumulative cash received, so render it as a step line: flat
     between dates and jumping only on the date income actually arrives. */
  var incomeD='';if(incomePts.length){incomeD='M '+incomePts[0][0]+','+incomePts[0][1];for(var ip=1;ip<incomePts.length;ip++)incomeD+=' H '+incomePts[ip][0]+' V '+incomePts[ip][1];}
  var todayIdx=Math.max(0,(data.rowsLength||1)-1),todayMarker='';
  if(data.isCurrent&&todayIdx<n-1) todayMarker='<line x1="'+xAt(todayIdx)+'" x2="'+xAt(todayIdx)+'" y1="'+g.padT+'" y2="'+(g.h-g.padB)+'" stroke="'+T.hairline+'" stroke-dasharray="2,2"/><text x="'+xAt(todayIdx)+'" y="'+(g.h-4)+'" font-size="9" fill="'+T.textMuted+'" text-anchor="middle">Today</text>';
  var gapColor=data.projectedSaving>=0?T.positive:T.rust, xEnd=xAt(n-1), ySpend=yAt(data.projectedSpend),yIncome=yAt(data.projectedIncome);
  var gap='<line x1="'+(xEnd+7)+'" x2="'+(xEnd+7)+'" y1="'+ySpend+'" y2="'+yIncome+'" stroke="'+gapColor+'" stroke-width="2"/><line x1="'+(xEnd+3)+'" x2="'+(xEnd+11)+'" y1="'+ySpend+'" y2="'+ySpend+'" stroke="'+gapColor+'" stroke-width="2"/><line x1="'+(xEnd+3)+'" x2="'+(xEnd+11)+'" y1="'+yIncome+'" y2="'+yIncome+'" stroke="'+gapColor+'" stroke-width="2"/>';
  return '<svg id="analysisForecastChartSvg" viewBox="0 0 '+g.w+' '+g.h+'" width="100%" height="'+g.h+'">'+grid
    +(spendD?'<path d="'+spendD+'" fill="none" stroke="'+T.accent+'" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>':'')
    +(forecastD?'<path d="'+forecastD+'" fill="none" stroke="'+T.accent+'" stroke-width="2.7" stroke-linecap="round" stroke-dasharray="1,5"/>':'')
    +(incomeD?'<path d="'+incomeD+'" fill="none" stroke="'+T.positive+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>':'')
    +todayMarker+gap
    +'<line id="analysisForecastCrosshair" x1="0" x2="0" y1="'+g.padT+'" y2="'+(g.h-g.padB)+'" stroke="'+T.text+'" stroke-width="1" opacity="0"/>'
    +'<circle id="analysisForecastSpendDot" r="4.2" fill="'+T.accent+'" stroke="'+T.bg+'" stroke-width="2" opacity="0"/>'
    +'<circle id="analysisForecastIncomeDot" r="4.2" fill="'+T.positive+'" stroke="'+T.bg+'" stroke-width="2" opacity="0"/>'
    +'<rect id="analysisForecastHit" x="0" y="0" width="'+g.w+'" height="'+g.h+'" fill="transparent" style="touch-action:none;"/></svg>';
}
function wireAnalysisForecastChart(data){
  var svg=document.getElementById('analysisForecastChartSvg'),hit=document.getElementById('analysisForecastHit'),cross=document.getElementById('analysisForecastCrosshair'),sd=document.getElementById('analysisForecastSpendDot'),id=document.getElementById('analysisForecastIncomeDot'),tip=document.getElementById('analysisForecastTip');

function buildAnalysisForecastCard(info, cs, T) {

  var incomeTarget = projectedIncome > 0 ? projectedIncome : null;

    : info.mode === "month" ? "month"

/* Single source of truth for the forecast. Actual spend remains exact;
   deterministic plans remain exact; variable spending is forecast primarily
   as likely subcategory EVENTS (learned repeat interval × typical amount).
   New/very-frequent subcategories fall back to the robust weekday-aware pace
   model, so the engine degrades gracefully when history is sparse. */
function computeForecastNumbers(rows, totalDays, periodStart, scope) {
  if (!rows.length) return null;
  scope = scope || "overall";
  var today = todayStr();
  var todayIncluded = rows[rows.length-1].date === today;
  var todayRow = todayIncluded ? rows[rows.length-1] : null;
  var pastRows = todayIncluded ? rows.slice(0, rows.length-1) : rows.slice();
  var completedDays = pastRows.length;
  var actualSpentSoFar = rows.reduce(function(s,r){ return s+rowSpentForScope(r,scope); },0);
  var pastSpent = pastRows.reduce(function(s,r){ return s+rowSpentForScope(r,scope); },0);
  var pastDiscretionary = discretionarySpentInRows(pastRows,scope);
  var periodEnd=toStr(addDays(parseD(periodStart),totalDays-1));

  /* Event model first, because it tells the daily fallback which established
     subcategories it should NOT smear into an average pace. */
  var eventModel=expectedEventSpendByDate(scope,today,periodEnd);
  var modeledSet=eventModel.modeledSet||{};

  var currentStats = robustWeightedStats(pastRows.map(function(r){
    return {value:discretionarySpentInRowExcluding(r,scope,modeledSet),weight:1};
  }));
  var currentWeight = currentStats ? completedDays/(completedDays+7) : 0;
  var historyProfile = historicalVariableProfile(scope,periodStart,modeledSet);

  var futureScheduledByDate = scheduledExpenseByDate(today,periodEnd,scope);
  var scheduledUpcoming=0;
  Object.keys(futureScheduledByDate).forEach(function(k){scheduledUpcoming+=futureScheduledByDate[k];});
  scheduledUpcoming=round2(scheduledUpcoming);

  var futureDays=Math.max(0,totalDays-rows.length);
  var todayFallbackActual=todayRow?discretionarySpentInRowExcluding(todayRow,scope,modeledSet):0;
  var todayFallbackExpected=todayIncluded?expectedVariableForDate(today,currentStats,currentWeight,historyProfile):null;
  var remainingFallbackToday=(todayFallbackExpected&&todayFallbackExpected.mean>todayFallbackActual)?todayFallbackExpected.mean-todayFallbackActual:0;
  var eventToday=todayIncluded?(eventModel.byDate[today]||0):0;
  var remainingVariableToday=remainingFallbackToday+eventToday;

  var projectedSpend=actualSpentSoFar+remainingVariableToday;
  var uncertaintySq=(eventModel.varianceByDate[today]||0), expectedFutureTotal=remainingVariableToday;
  if(todayFallbackExpected&&remainingFallbackToday>0) uncertaintySq+=todayFallbackExpected.dev*todayFallbackExpected.dev;

  var forecastValues=[], running=0;
  rows.forEach(function(r,i){ running+=rowSpentForScope(r,scope); forecastValues[i]=round2(running); });
  var futureRunning=actualSpentSoFar+remainingVariableToday;
  for (var fi=rows.length; fi<totalDays; fi++) {
    var ds=toStr(addDays(parseD(periodStart),fi));
    var fallback=expectedVariableForDate(ds,currentStats,currentWeight,historyProfile);
    var fallbackAmt=fallback?Math.max(0,fallback.mean):0;
    var eventAmt=eventModel.byDate[ds]||0;
    var scheduled=futureScheduledByDate[ds]||0;
    expectedFutureTotal+=fallbackAmt+eventAmt;
    futureRunning+=fallbackAmt+eventAmt+scheduled;
    if(fallback) uncertaintySq+=fallback.dev*fallback.dev;
    uncertaintySq+=(eventModel.varianceByDate[ds]||0);
    forecastValues[fi]=round2(futureRunning);
  }
  projectedSpend=round2(futureDays>0?futureRunning:(actualSpentSoFar+remainingVariableToday));

  var hasPace=!!(currentStats||historyProfile.overall||eventModel.modeledCount>0);
  var hasForecast=(todayIncluded||futureDays>0)&&(hasPace||scheduledUpcoming>0||remainingVariableToday>0);
  if(!hasForecast) projectedSpend=actualSpentSoFar;

  var uncertainty=Math.sqrt(Math.max(0,uncertaintySq));
  var historyEnough=(historyProfile.overall&&historyProfile.overall.count>=7)||(currentStats&&currentStats.count>=5)||eventModel.modeledCount>=2;
  var rangeReady=uncertainty>0&&historyEnough;
  var exactFloor=actualSpentSoFar+scheduledUpcoming;
  var rangeLow=rangeReady?Math.max(exactFloor,projectedSpend-1.25*uncertainty):null;
  var rangeHigh=rangeReady?projectedSpend+1.25*uncertainty:null;

  var remainingEstimateDays=futureDays+(todayIncluded?1:0);
  var avgSpentPerDay=remainingEstimateDays>0?expectedFutureTotal/remainingEstimateDays:(currentStats?currentStats.mean:(historyProfile.overall?historyProfile.overall.mean:null));

  return {
    todayIncluded:todayIncluded,pastDays:completedDays,pastSpent:pastSpent,pastDiscretionary:pastDiscretionary,
    actualSpentSoFar:round2(actualSpentSoFar),knownSpent:round2(actualSpentSoFar),avgSpentPerDay:avgSpentPerDay,
    stillBlending:stillBlending,currentWeight:currentWeight,historyDays:historyProfile.days,
    daysToEstimate:remainingEstimateDays,scheduledUpcoming:scheduledUpcoming,
    remainingVariableToday:round2(remainingVariableToday),hasForecast:hasForecast,projectedSpend:projectedSpend,
    forecastValues:forecastValues,rangeLow:rangeLow==null?null:round2(rangeLow),rangeHigh:rangeHigh==null?null:round2(rangeHigh),
    eventModeledCount:eventModel.modeledCount||0,personModeledCount:eventModel.personModeledCount||0,overallModeledCount:eventModel.overallModeledCount||0

}

/* Builds the shared forecast card. Variable spending is estimated with an

   Scheduled expenses remain exact and land on their real dates. */
function buildForecastCard(rows, totalDays, target, periodStart, T, refLabel, periodWord, compareRows, scope) {
  if (!rows.length) return "";
  scope = scope || "overall";
  /* Normalize row.spent to the requested scope so chart geometry and compare

  var scopedRows = rows.map(function(r){ return Object.assign({}, r, { spent: rowSpentForScope(r, scope) }); });
  var scopedCompareRows = (compareRows||[]).map(function(r){ return Object.assign({}, r, { spent: rowSpentForScope(r, scope) }); });

  var N=5,items=[];

    var off=(baseOffset||0)+j, per=getPeriodBounds(view,off,currentWeeklyTarget(),dailyAllowance()), st=periodStatsBudget(per.startStr,per.endStr);
    var isLive=off===0 && per.endStr>=todayStr(), projected=st.spent;
    if(isLive&&st.rows.length){var start=effectiveRangeStart(per.startStr),days=daysBetween(start,per.endStr)+1,fc=computeForecastNumbers(st.rows,days,start,'budget');if(fc)projected=fc.projectedSpend;}
    var status=(st.spent>per.target)?'rust':(isLive&&projected>per.target?'amber':'positive');
    items.push({label:trendPeriodLabel(per,view),actual:st.spent,displayTotal:isLive?projected:st.spent,target:per.target,status:status,current:isLive});
  }
  var cur=items[items.length-1], diff=round2(cur.target-cur.displayTotal), statusText=cur.status==='rust'?'Over budget':cur.status==='amber'?'Trending over':'On track';
  var statusBg=cur.status==='rust'?'var(--rust-wash)':cur.status==='amber'?'rgba(224,151,46,.16)':'var(--positive-wash)';
  var statusColor=cur.status==='rust'?'var(--rust)':cur.status==='amber'?'var(--amber)':'var(--positive)';
  var s='<div class="card card-pad" style="margin-bottom:16px;"><div class="row between" style="align-items:flex-start;"><div><div class="eyebrow">Spend trend</div><div class="mono" style="font-size:25px;font-weight:700;margin-top:4px;">'+fmt(cur.actual,0)+' AED</div></div><span class="chip" style="background:'+statusBg+';color:'+statusColor+';font-weight:600;">'+statusText+'</span></div>';
  s+='<div class="row between" style="margin-top:10px;"><span class="muted subhead">'+(cur.current?'Projected close':'Closed at')+'</span><span class="mono subhead" style="font-weight:600;">'+fmt(cur.displayTotal,0)+' AED</span></div>';
  s+='<div class="row between" style="margin-top:6px;"><span class="muted subhead">Budget</span><span class="mono subhead">'+fmt(cur.target,0)+' AED</span></div>';
  s+='<div class="row between" style="margin-top:6px;"><span class="muted subhead">'+(diff>=0?'Projected saving':'Projected over')+'</span><span class="mono subhead" style="font-weight:600;color:'+(diff>=0?'var(--positive)':'var(--rust)')+';">'+fmt(Math.abs(diff),0)+' AED</span></div>';
  s+='<div id="budgetTrendChartWrap" style="position:relative;margin-top:10px;"><div id="budgetTrendChartTip" class="footnote" style="position:absolute;top:0;left:0;background:var(--fill);border-radius:9px;padding:6px 9px;max-width:260px;opacity:0;pointer-events:none;z-index:3;box-shadow:0 3px 10px rgba(0,0,0,.2);"></div>'+renderBudgetTrendChart(items,T)+'</div>';
  s+='<div class="row" style="gap:12px;justify-content:center;flex-wrap:wrap;margin-top:4px;"><span class="caption" style="color:var(--positive);">● On track</span><span class="caption" style="color:var(--amber);">● Trending over</span><span class="caption" style="color:var(--rust);">● Over budget</span></div></div>';
  return s;
}


/* Analysis cash-balance line: running net cash flow over the selected period.
   Starts from zero at the period boundary, adds actual income transactions on
   their logged dates and subtracts every expense. The x-axis spans the full
   selected period while the line stops at the latest elapsed date, matching
   the visual idea of a balance falling/rising through the month without
   inventing future values. */
function renderCashBalanceLineChart(rows, info, T) {
  if (!rows || !rows.length) return "";
  var w=340,h=205,padL=42,padR=8,padT=14,padB=24,plotW=w-padL-padR,plotH=h-padT-padB;
  var totalDays=Math.max(1, daysBetween(info.start, info.end)+1);
  var acc=0, pts=[];
  rows.forEach(function(r){
    var dayNet=round2((Number(r.income)||0)-(Number(r.spent)||0));
    acc=round2(acc + dayNet);
    var dayIndex=Math.max(0, daysBetween(info.start, r.date));
    pts.push({date:r.date,label:shortLabel(r.date),balance:acc,dayNet:dayNet,idx:dayIndex});
  });
  if (!pts.length) return "";
  var vals=pts.map(function(p){return p.balance;}).concat([0]);
  var min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
  if (max===min) { max+=1; min-=1; }
  var margin=(max-min)*0.08; max+=margin; min-=margin;
  function xIdx(i){ return padL + (totalDays<=1 ? plotW/2 : (i/(totalDays-1))*plotW); }
  function y(v){ return padT + plotH - ((v-min)/(max-min))*plotH; }
  function tick(v){ var a=Math.abs(v); return a>=1000 ? ((v/1000).toFixed(a>=10000?0:1)+"K") : fmt(Math.round(v),0); }
  var grid="";
  [0,.25,.5,.75,1].forEach(function(fr){
    var v=min+(max-min)*fr, yy=y(v);
    grid+='<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+yy+'" y2="'+yy+'" stroke="'+T.hairline+'" stroke-width="1" stroke-dasharray="3,3"/>';
    grid+='<text x="'+(padL-5)+'" y="'+(yy+3)+'" font-size="8" fill="'+T.textMuted+'" text-anchor="end">'+tick(v)+'</text>';
  });
  if (min<0 && max>0) grid+='<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="'+T.textMuted+'" stroke-width="1.2"/>';
  var xy=pts.map(function(p){return[xIdx(p.idx),y(p.balance)];});
  var curveD=xy.length>=2?smoothPathD(xy):"";
  var baselineY=y(Math.max(min,Math.min(max,0)));
  var areaD=xy.length>=2?(curveD+' L '+xy[xy.length-1][0]+','+baselineY+' L '+xy[0][0]+','+baselineY+' Z'):"";
  var lineColor=acc>=0?T.positive:T.rust;
  var line="";
  if (xy.length>=2) line='<path d="'+areaD+'" fill="'+lineColor+'" fill-opacity="0.13" stroke="none"/><path d="'+curveD+'" fill="none" stroke="'+lineColor+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';
  else line='<circle cx="'+xy[0][0]+'" cy="'+xy[0][1]+'" r="4" fill="'+lineColor+'"/>';
  var axis="",labelCount=Math.min(5,totalDays),seen={};
  for(var i=0;i<labelCount;i++){
    var idx=labelCount===1?0:Math.round((i/(labelCount-1))*(totalDays-1));
    if(seen[idx])continue;seen[idx]=true;
    var ds=toStr(addDays(parseD(info.start),idx));
    axis+='<text x="'+xIdx(idx)+'" y="'+(h-5)+'" font-size="8" fill="'+T.textMuted+'" text-anchor="'+(idx===0?'start':(idx===totalDays-1?'end':'middle'))+'">'+esc(shortLabel(ds))+'</text>';
  }
  var todayMark="";
  if(info.start<=todayStr() && todayStr()<=info.end){
    var ti=daysBetween(info.start,todayStr()),tx=xIdx(ti);
    todayMark='<line x1="'+tx+'" x2="'+tx+'" y1="'+padT+'" y2="'+(h-padB)+'" stroke="'+T.hairline+'" stroke-dasharray="2,3"/><text x="'+tx+'" y="'+(padT+9)+'" font-size="8" fill="'+T.textMuted+'" text-anchor="middle">Today</text>';
  }
  lastCashBalanceChartData={points:pts,w:w,h:h,padL:padL,padR:padR,padT:padT,padB:padB,plotW:plotW,plotH:plotH,totalDays:totalDays,min:min,max:max,lineColor:lineColor};
  return '<svg id="cashBalanceChartSvg" viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none">'+grid+todayMark+line+axis
    +'<line id="cashBalanceCrosshair" x1="0" x2="0" y1="'+padT+'" y2="'+(h-padB)+'" stroke="'+T.text+'" stroke-width="1" stroke-dasharray="2,2" opacity="0"/>'
    +'<circle id="cashBalanceDot" r="4.5" fill="'+lineColor+'" stroke="'+T.bg+'" stroke-width="2" opacity="0"/>'
    +'<rect id="cashBalanceChartHit" x="0" y="0" width="'+w+'" height="'+h+'" fill="transparent" style="touch-action:none;"/>'
    +'</svg>';
}

/* Hover/touch scrub for the Analysis cash-balance line. Desktop users can
   simply hover; on touch screens a tap or drag selects the nearest day. */
function wireCashBalanceChart(data) {
  var svg=document.getElementById('cashBalanceChartSvg'),hit=document.getElementById('cashBalanceChartHit'),cross=document.getElementById('cashBalanceCrosshair'),dot=document.getElementById('cashBalanceDot'),tip=document.getElementById('cashBalanceChartTip');
  if(!svg||!hit||!cross||!dot||!tip||!data||!data.points||!data.points.length)return;
  function xFor(p){return data.padL+(data.totalDays<=1?data.plotW/2:(p.idx/(data.totalDays-1))*data.plotW);}
  function yFor(v){return data.padT+data.plotH-((v-data.min)/(data.max-data.min))*data.plotH;}
  function nearest(clientX){
    var r=svg.getBoundingClientRect(); if(!r.width)return 0;
    var frac=Math.max(0,Math.min(1,(clientX-r.left)/r.width)),vbX=frac*data.w,best=0,bestD=Infinity;
    data.points.forEach(function(p,i){var d=Math.abs(xFor(p)-vbX);if(d<bestD){bestD=d;best=i;}}); return best;
  }
  function show(i){
    var p=data.points[i],x=xFor(p),y=yFor(p.balance),date=parseD(p.date).toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'});
    cross.setAttribute('x1',x);cross.setAttribute('x2',x);cross.setAttribute('opacity','1');
    dot.setAttribute('cx',x);dot.setAttribute('cy',y);dot.setAttribute('opacity','1');
    tip.innerHTML='<span class="mono" style="font-weight:700;">'+(p.balance<0?'−':'')+fmt(Math.abs(p.balance),2)+' AED</span><span class="muted"> · '+esc(date)+'</span>';
    positionChartTooltip(tip,svg,x,data.w);tip.style.opacity='1';
  }
  function hide(){cross.setAttribute('opacity','0');dot.setAttribute('opacity','0');tip.style.opacity='0';}
  function move(x){show(nearest(x));}
  hit.addEventListener('mousemove',function(e){move(e.clientX);});
  hit.addEventListener('mouseenter',function(e){move(e.clientX);});
  hit.addEventListener('mouseleave',hide);
  hit.addEventListener('touchstart',function(e){move(e.touches[0].clientX);},{passive:true});
  hit.addEventListener('touchmove',function(e){move(e.touches[0].clientX);e.preventDefault();},{passive:false});
  hit.addEventListener('touchcancel',hide);
}

/* Resolves the Analysis page's selected period. week/month/year are navigable
   via analysisOffset (0 = current, -1 = previous, …), reusing getPeriodBounds so
   titles and bounds match the Home page exactly. custom uses explicit dates. */
/* Same shape as getAnalysisPeriodInfo, for the Transactions page's filter —
   kept separate since Transactions also offers "all time" (a real list of
   everything ever logged), which doesn't make sense for Analysis's charts. */
function getTxnPeriodInfo() {
  var today = todayStr();
  var mode = state.txnPeriodMode || "all";
  var off = state.txnOffset || 0;
  var entryDatesAll = Object.keys(state.entries).sort();
  var naturalStart = entryDatesAll.length ? entryDatesAll[0] : today;
  if (mode === "all") {
    /* "All time" must mean all of it: if any logged entry falls after today
       (e.g. a recurring/split plan that caught up while the device clock was
       ahead, or any other edge case), the upper bound has to stretch to
       cover it too — otherwise this view silently drops entries that Week/
       Month (which use real calendar bounds, not an artificial "up to
       today" cap) would still show, which is exactly the inconsistency that
       made deleted-but-orphaned split entries "disappear" from All while
       still appearing under Week. */
    var latestEntryDate = entryDatesAll.length ? entryDatesAll[entryDatesAll.length-1] : today;
    var endAll = latestEntryDate > today ? latestEntryDate : today;
    return { start: naturalStart, end: endAll, title: "All time", sub: "", isCurrent: true, mode: mode };
  }
  if (mode === "custom") {
    var from = state.txnPeriodFrom || naturalStart;
    var to = state.txnPeriodTo || today;
    if (from > to) { var swap = from; from = to; to = swap; }
    return { start: from, end: to, title: shortLabel(from)+" – "+shortLabel(to), sub: "Custom range", isCurrent: true, mode: mode };
  }
  var per = getPeriodBounds(mode, off, currentWeeklyTarget(), dailyAllowance());
  return { start: per.startStr, end: per.endStr, title: per.title, sub: per.sub, isCurrent: off === 0, mode: mode };
}

function getAnalysisPeriodInfo() {
  var today = todayStr();
  var mode = state.analysisPeriodMode || "month";
  var off = state.analysisOffset || 0;
  if (mode === "custom") {
    var entryDatesAll = Object.keys(state.entries).sort();
    var fallbackStart = entryDatesAll.length ? entryDatesAll[0] : today;
    var from = state.analysisPeriodFrom || fallbackStart;
    var to = state.analysisPeriodTo || today;
    if (from > to) { var swap = from; from = to; to = swap; }
    return { start: from, end: to, title: shortLabel(from)+" – "+shortLabel(to), sub: "Custom range", isCurrent: true, mode: mode, days: daysBetween(from,to)+1 };
  }
  var per = getPeriodBounds(mode, off, currentWeeklyTarget(), dailyAllowance());
  return { start: per.startStr, end: per.endStr, title: per.title, sub: per.sub, isCurrent: off === 0, mode: mode, days: per.days };
}

/* Week/month are short enough to read day-by-day; a year would be 365 bars, so
   it rolls up to months. Custom ranges switch over at roughly two months. */
function analysisGranularity(info) {
  if (info.mode === "year") return "month";
  if (info.mode === "custom") return daysBetween(info.start, info.end) > 62 ? "month" : "day";
  return "day";
}

/* Collapses periodStats rows into chart buckets at the chosen granularity.
   Monthly buckets sum both spend and allowance, so a bucket's own target stays
   correct even when months differ in length. */
/* Whether a transaction item counts as belonging to a given person filter
   value — matches either the single-person field or, for a percentage
   split, anyone included in it (even at a partial share). Shared by the
   Transactions page filter and Analysis's person breakdown so the two
   pages can't define "belongs to this person" differently. Accepts either
   sentinel spelling for the "no one assigned" bucket, since Transactions'
   dropdown uses "__unassigned__" while Analysis's pie slice is labelled
   "Unassigned". */
function itemMatchesPersonFilter(it, filterValue) {
  if (!filterValue) return true;
  if (filterValue === "__unassigned__" || filterValue === "Unassigned") {
    return !it.person && (!it.personSplit || !it.personSplit.length);
  }
  if (it.personSplit && it.personSplit.length) return it.personSplit.some(function(ps){ return ps.person===filterValue; });
  return it.person === filterValue;
}

/* Whether an item falls within the current category-level scope: a specific
   leaf category filter wins if set (most specific); otherwise a drilled-into
   group applies (browsing "Food & Drinks" without having picked one of its
   categories yet still narrows to that group); otherwise unscoped. Shared by
   every section that reads the page's "current category scope" — the bar
   charts, day-of-week, biggest transactions, and the person breakdown's own
   aggregation — so drilling into a group filters the whole page the same
   way picking a specific category already does, not just the category
   section's own pie. */
function itemMatchesCategoryScope(it, catFilter, groupFilter) {
  if (catFilter) return (it.category || "Uncategorised") === catFilter;
  if (groupFilter === "Ungrouped") return !categoryGroupOf(it.category);
  if (groupFilter) return categoryGroupOf(it.category) === groupFilter;
  return true;
}

/* One definition of an expense that belongs in Analysis for the active basis.
   Budget mode excludes categories explicitly marked outside the budget; income
   mode is cash-flow oriented and therefore includes every real expense. */
function itemCountsForAnalysis(it) { return isExpenseItem(it); }

/* The amount to attribute to the current person-filter scope for a given
   item. A person filter matching a split transaction only means that person
   holds SOME share of it — every sum built on top of that boolean match was
   adding the item's FULL amount regardless of share, so a 100 AED purchase
   split 30/70 was counted as a full 100 AED for BOTH people, inflating any
   person-filtered total by everyone else's share too. This returns the
   correct prorated amount: the person's own share when the item is split,
   the full amount for an unsplit item (nothing to prorate), and the full
   amount when there's no active person filter at all (nothing to scope by). */
function personScopedAmount(it, personFilter) {
  if (!personFilter || !it.personSplit || !it.personSplit.length) return it.amount;
  return it.personSplit
    .filter(function(ps){ return ps.person === personFilter; })
    .reduce(function(t,ps){ return t + round2(it.amount * ps.pct/100); }, 0);
}

function buildAnalysisBuckets(rows, granularity, catFilter, personFilter, groupFilter) {
  function keep(it){
    return itemCountsForAnalysis(it) && itemMatchesCategoryScope(it, catFilter, groupFilter) && itemMatchesPersonFilter(it, personFilter);
  }
  function spentOf(r){
    if (!catFilter && !personFilter && !groupFilter) return r.spent;
    return (r.items||[]).reduce(function(t,it){ return keep(it) ? t+personScopedAmount(it, personFilter) : t; }, 0);
  }
  if (granularity !== "month") {
    return rows.map(function(r){
      return { key: r.date, label: shortLabel(r.date), title: dayLabel(r.date), date: r.date,
               dates: [r.date], spent: spentOf(r), allowance: r.allowance, days: 1 };
    });
  }
  var map = {}, order = [];
  rows.forEach(function(r){
    var key = r.date.slice(0,7);
    if (!map[key]) {
      map[key] = { key: key, label: parseD(r.date).toLocaleDateString("en-GB",{month:"short"}),
                   title: parseD(r.date).toLocaleDateString("en-GB",{month:"long",year:"numeric"}),
                   date: r.date, dates: [], spent: 0, allowance: 0, days: 0 };
      order.push(key);
    }
    map[key].spent += spentOf(r);
    map[key].allowance += r.allowance;
    map[key].days += 1;
    map[key].dates.push(r.date);
  });
  return order.map(function(k){ return map[k]; });

/* Total already logged by a rule so far — summed per-occurrence rather than
   multiplied, since a split's final day carries a different (remainder)
   amount than the rest. */
function ruleLoggedAmount(rule) {

  return round2(sum);
}

  h += '<button data-action="add-recurring" class="btn-accent txn-entry-save" style="width:100%;">Create '+(recKind==='income'?'income':'expense')+' plan</button>';
  h += '</div></div></div>';
  return h;
}

function renderPlansBody() {
  var rules = state.settings.recurringRules || [];
  var today = todayStr();
  var horizon = toStr(addDays(parseD(today), 30));
  var activeRules = rules.filter(function(r){ return !ruleIsComplete(r) && r.active; });
  var pausedRules = rules.filter(function(r){ return !ruleIsComplete(r) && !r.active; });
  var doneRules = rules.filter(function(r){ return ruleIsComplete(r); });

  function nextOccurrence(rule) {
    if (!rule.active || ruleIsComplete(rule)) return null;
    var n = rule.occurrencesLogged || 0;
    if (rule.occurrencesTotal != null && n >= rule.occurrencesTotal) return null;
    var due = recurringOccurrenceDate(rule, n);
    if (rule.endDate && due > rule.endDate) return null;
    return { rule:rule, due:due, amount:ruleOccurrenceAmount(rule,n) };
  }
  function next30Totals() {
    var expense=0, income=0;
    activeRules.forEach(function(rule){
      var n=rule.occurrencesLogged||0, guard=0;
      while(guard<60) {
        if(rule.occurrencesTotal!=null && n>=rule.occurrencesTotal) break;
        var due=recurringOccurrenceDate(rule,n);
        if(due>horizon || (rule.endDate && due>rule.endDate)) break;
        if(due>=today) {
          var amt=ruleOccurrenceAmount(rule,n);
          if(rule.entryKind==='income') income+=amt; else expense+=amt;
        }
        n++; guard++;
      }
    });
    return {expense:round2(expense),income:round2(income)};
  }
  function relativeDue(ds) {
    var n=daysBetween(today,ds);
    if(n===0) return 'Today';
    if(n===1) return 'Tomorrow';
    if(n<7) return parseD(ds).toLocaleDateString('en-GB',{weekday:'long'});
    return shortLabel(ds);
  }
  function planName(rule) { return rule.note || rule.category || (rule.kind==='split'?'Spread cost':(rule.entryKind==='income'?'Recurring income':'Recurring expense')); }
  function planMeta(rule) {
    var bits=[];
    if(rule.kind==='split') bits.push('Spread over '+rule.occurrencesTotal+' days');
    else bits.push(rule.frequency==='daily'?'Daily':rule.frequency==='weekly'?'Weekly':'Monthly');
    if(rule.category) {
      var parent=categoryGroupOf(rule.category);
      bits.push(parent ? parent+' · '+rule.category : rule.category);
    }
    if(rule.person) bits.push(rule.person);
    return bits.join(' · ');
  }
  function planIcon(rule) {
    return rule.entryKind==='income'
      ? '<span style="width:38px;height:38px;border-radius:12px;background:var(--positive-wash);color:var(--positive);display:flex;align-items:center;justify-content:center;flex-shrink:0;">'+ICONS.plus+'</span>'
      : '<span style="transform:scale(1.12);display:flex;">'+catIconCircle(rule.category)+'</span>';
  }
  function planCard(rule) {
    var complete=ruleIsComplete(rule), paused=!rule.active&&!complete, logged=rule.occurrencesLogged||0, next=nextOccurrence(rule), isIncome=rule.entryKind==='income';
    var s='<div class="card card-pad" style="margin-bottom:8px;'+(paused?'opacity:.72;':'')+'">';
    s+='<div class="row" style="align-items:center;gap:11px;">'+planIcon(rule)+'<div style="flex:1;min-width:0;"><div style="font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(planName(rule))+'</div><div class="muted caption" style="margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(planMeta(rule))+'</div></div>';
    s+='<div style="text-align:right;flex-shrink:0;"><div class="mono" style="font-size:16px;font-weight:700;color:'+(isIncome?'var(--positive)':'var(--text)')+';">'+(isIncome?'+':'−')+fmt(rule.kind==='split'?(rule.splitTotal||rule.amount):rule.amount,2)+'</div><div class="caption" style="margin-top:2px;color:'+(complete?'var(--positive)':paused?'var(--text-muted)':'var(--accent)')+';">'+(complete?'Finished':paused?'Paused':(next?relativeDue(next.due):'No next date'))+'</div></div></div>';

      s+='</div><div style="height:5px;background:var(--fill);border-radius:999px;overflow:hidden;margin-top:6px;"><div style="height:100%;width:'+pct+'%;background:'+(complete?'var(--positive)':'var(--accent)')+';"></div></div></div>';

  if(upcoming.length) {

    upcoming.forEach(function(x,i){ var r=x.rule,isIncome=r.entryKind==='income'; h+='<div class="row" style="gap:10px;align-items:center;padding:9px 0;'+(i?'border-top:1px solid var(--sep);':'')+'">'+planIcon(r)+'<div style="flex:1;min-width:0;"><div class="subhead" style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(planName(r))+'</div><div class="muted caption">'+relativeDue(x.due)+' · '+shortLabel(x.due)+'</div></div><div class="mono subhead" style="font-weight:650;color:'+(isIncome?'var(--positive)':'var(--text)')+';">'+(isIncome?'+':'−')+fmt(x.amount,2)+'</div></div>'; });

  if(state.plansCreateOpen) {

    h+='<label class="eyebrow">Amount</label><div style="position:relative;margin:6px 0 10px;"><span class="muted" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;">AED</span><input id="recurringAmountInput" type="number" inputmode="decimal" step="0.01" min="0" class="field mono" style="padding-left:44px;" placeholder="0.00" value="'+(state.recurringAmountDraft!=null?esc(state.recurringAmountDraft):'')+'" /></div>';
    if(recKind==='expense') { h+='<label class="eyebrow">Subcategory</label><select id="recurringCategoryInput" class="field" style="margin:6px 0 10px;"><option value="">No subcategory</option>'; (state.settings.categories||[]).forEach(function(c){ var g=categoryGroupOf(c); h+='<option value="'+esc(c)+'"'+(state.recurringCategoryDraft===c?' selected':'')+'>'+esc(g?g+' — '+c:c)+'</option>'; }); h+='</select>'; }
    if((state.settings.people||[]).length) { var rp=state.recurringPersonDraft!=null?state.recurringPersonDraft:(state.settings.defaultPerson||''); h+='<label class="eyebrow">For</label><select id="recurringPersonInput" class="field" style="margin:6px 0 10px;"><option value="">Unassigned</option>'; (state.settings.people||[]).forEach(function(p){ h+='<option value="'+esc(p)+'"'+(rp===p?' selected':'')+'>'+esc(p)+'</option>'; }); h+='</select>'; }
    h+='<label class="eyebrow">Name</label><input id="recurringNoteInput" type="text" class="field" style="margin:6px 0 10px;" placeholder="'+(recKind==='income'?'Salary, freelance…':'Rent, subscription…')+'" value="'+(state.recurringNoteDraft!=null?esc(state.recurringNoteDraft):'')+'" />';
    h+='<div class="row gap2" style="margin-bottom:10px;"><div style="flex:1;"><label class="eyebrow">Repeats</label><select id="recurringFrequencyInput" class="field" style="margin-top:6px;"><option value="weekly"'+(state.recurringFrequencyDraft!=='monthly'?' selected':'')+'>Weekly</option><option value="monthly"'+(state.recurringFrequencyDraft==='monthly'?' selected':'')+'>Monthly</option></select></div><div style="flex:1;"><label class="eyebrow">Starts</label><input id="recurringStartDateInput" type="date" class="field mono" style="margin-top:6px;" value="'+(state.recurringStartDateDraft||today)+'" /></div></div>';
    h+='<label class="eyebrow">Ends</label><div class="seg" style="margin:6px 0 10px;">'; [['ongoing','Ongoing'],['count','After #'],['until','On date']].forEach(function(o){h+='<button class="seg-btn" role="tab" aria-selected="'+(limitMode===o[0])+'" data-action="set-recurring-limit-mode" data-mode="'+o[0]+'">'+o[1]+'</button>';}); h+='</div>';

    else if(limitMode==='until') h+='<input id="recurringEndDateInput" type="date" class="field mono" style="margin-bottom:10px;" value="'+(state.recurringEndDateDraft||'')+'" />';

/* ---------------- actions ---------------- */
function handleAddTransaction() {
  var dateEl = document.getElementById("entryDateInput");
  var amtEl = document.getElementById("entryAmountInput");
  var noteEl = document.getElementById("entryNoteInput");
  var catEl = document.getElementById("entryCategoryInput");
  var date = dateEl ? dateEl.value : todayStr();
  var amt = parseFloat(amtEl ? amtEl.value : "");
  if (isNaN(amt) || amt < 0 || !date) return;
  var note = noteEl ? noteEl.value.trim() : "";
  var category = catEl ? catEl.value : "";

  var person = "";
  var personSplit = null;
  var peopleForSave = state.settings.people||[];
  var personSplitModeActive = peopleForSave.length >= 2 && state.txnPersonSplitMode === "split";
  if (personSplitModeActive) {
    var pctSelects = document.querySelectorAll(".split-person-pct");
    var splitEntries = [];
    var totalPct = 0;
    pctSelects.forEach(function(s){
      var pct = parseInt(s.value,10)||0;
      totalPct += pct;
      if (pct > 0) splitEntries.push({ person: s.dataset.person, pct: pct });
    });
    if (totalPct !== 100) { showToast("Split must add up to 100%"); return; }
    personSplit = splitEntries;
  } else {
    var personEl = document.getElementById("entryPersonInput");
    person = personEl ? personEl.value : "";
  }
  var wasEditing = !!(state.editingItemId && state.editingOriginalDate);
  var origItemForKind = null;
  if (wasEditing) {
    var origDayForKind = state.entries[state.editingOriginalDate];
    if (origDayForKind) origItemForKind = origDayForKind.items.find(function(i){ return i.id === state.editingItemId; }) || null;
  }
  var kind = state.txnKind != null ? state.txnKind : (origItemForKind && origItemForKind.kind==="income" ? "income" : "expense");
  if (kind === "income") category = ""; // income doesn't use the expense category system

  if (!wasEditing && state.txnSplitMode === "split" && kind === "expense") {
    var splitDaysEl = document.getElementById("splitDaysInput");
    var splitDays = parseInt(splitDaysEl ? splitDaysEl.value : "", 10);
    if (isNaN(splitDays) || splitDays < 2) return;
    handleAddSplitTransaction(date, amt, category, note, splitDays, person, personSplit);
    return;
  }

  var nextEntries = Object.assign({}, state.entries);

  if (wasEditing) {
    var origDate = state.editingOriginalDate;
    var origDay = nextEntries[origDate];
    if (origDay) {
      var remaining = origDay.items.filter(function(i){ return i.id !== state.editingItemId; });
      if (remaining.length === 0) delete nextEntries[origDate];
      else nextEntries[origDate] = Object.assign({}, origDay, { items: remaining });
    }
    /* Preserve recurringId/seq metadata when editing an occurrence so deleting
       its plan later can still find and remove that occurrence. */
    var updatedItem = Object.assign({}, origItemForKind || {}, { id: state.editingItemId, amount: amt, note: note, category: category, person: person, personSplit: personSplit, kind: kind });
    var destDay = nextEntries[date];
    var nextDest = destDay ? Object.assign({}, destDay, { items: destDay.items.concat([updatedItem]) }) : { allowance: allowanceForDate(date), items: [updatedItem] };
    nextEntries[date] = nextDest;
    state.editingItemId = null;
    state.editingOriginalDate = null;
    state.showAddTxn = false;
    state.txnEntryRestoreScroll = true;
  } else {
    var existing = nextEntries[date];
    var newItem = { id: Date.now()+"-"+Math.random().toString(36).slice(2,7), amount: amt, note: note, category: category, person: person, personSplit: personSplit, kind: kind };
    nextEntries[date] = existing ? Object.assign({}, existing, { items: existing.items.concat([newItem]) }) : { allowance: allowanceForDate(date), items: [newItem] };
    state.showAddTxn = false;
    state.txnEntryRestoreScroll = true;
  }

  state.entryDate = date;
  persistAll(state.settings, nextEntries, "your entry");
  showToast(wasEditing ? "Record updated" : "Record added");
  render();
}

/* Spreads one total across N consecutive days running FORWARD from the chosen
   date, as a tracked plan rather than a pile of pre-written entries. Days that
   have already passed get logged immediately by the shared catch-up engine;
   days still to come are logged as each arrives — which is what makes "how
   much is left / what's coming up" answerable at all. Per-day share is
   floor-rounded with the final day absorbing the leftover cents, so the days
   read evenly while the total stays exact. */
function handleAddSplitTransaction(startDate, totalAmount, category, note, splitDays, person, personSplit) {
  var perDayFloor = Math.floor((totalAmount/splitDays)*100)/100;
  var newRule = {
    id: Date.now()+"-"+Math.random().toString(36).slice(2,7),
    kind: "split",
    amount: perDayFloor,
    splitTotal: totalAmount,
    category: category,
    note: note,
    person: person||"",
    personSplit: personSplit||null,
    frequency: "daily",
    startDate: startDate,
    endDate: null,
    occurrencesTotal: splitDays,
    occurrencesLogged: 0,
    active: true
  };
  state.settings = Object.assign({}, state.settings, { recurringRules: (state.settings.recurringRules||[]).concat([newRule]) });
  runRecurringCatchUp();
  state.entryDate = startDate;
  state.showAddTxn = false;
  state.txnEntryRestoreScroll = true;
  state.txnSplitMode = "single";
  state.txnKind = null;
  persistAll(state.settings, state.entries, "your entries");
  showToast("Spread across "+splitDays+" days");
  render();
}

/* Mirrors handleApplyBudget: "future" appends a history entry from the start of
   this month so earlier months stay judged against what they actually had;
   "all" collapses history to a single entry. */
function handleApplyIncome(scope) {
  var el = document.getElementById("incomeDraftInput");
  var v = el ? parseFloat(el.value) : NaN;
  if (isNaN(v) || v < 0) return;
  var mode = "monthly"; // income is entered monthly only; legacy daily-mode history still reads correctly
  var monthStart = toStr(startOfMonth(new Date()));
  var hist = (state.settings.incomeHistory || []).slice();
  var label;

  if (scope === "all") {
    hist = [{ from: "1900-01-01", mode: mode, amount: v }];
    label = "Income applied to all periods";
  } else {
    /* On the first forward-only change, preserve whatever income was configured
       before this month as a baseline. Without this, the new record becomes
       hist[0] and can be mistaken for historical income by older app versions. */
    if (!hist.length) {
      hist.push({
        from: "1900-01-01",
        mode: state.settings.incomeMode || "monthly",
        amount: Number(state.settings.incomeAmount) || 0
      });
    }
    hist.push({ from: monthStart, mode: mode, amount: v });
    label = "Income applied from this month onward";
  }
  hist = normalizeIncomeHistory(hist);

  var nextSettings = Object.assign({}, state.settings, {
    incomeHistory: hist,
    incomeMode: mode,
    incomeAmount: v
  });
  persistAll(nextSettings, state.entries, "your income");
  state.incomeDraftMode = null;
  state.incomeDraftAmount = null;
  state.showSettings = false;
  showToast(label);
  render();
}

function handleApplyBudget(scope) {
  var el = document.getElementById("monthlyDraftInput");
  var v = el ? parseFloat(el.value) : NaN;
  if (isNaN(v) || v <= 0) return;
  var month = getPeriodBounds("month", 0, currentWeeklyTarget(), dailyAllowance());
  var hist = (state.settings.monthlyBudgetHistory || []).slice();
  var nextEntries = Object.assign({}, state.entries);
  var label;

  function budgetFromHist(histArr, ds) {
    var found=null;
    for (var i=0;i<histArr.length;i++) { if (histArr[i].from<=ds) found=histArr[i]; else break; }
    return found ? Number(found.monthlyBudget)||0 : null;
  }
  function rewriteLoggedFrom(fromStr, toStr_) {
    Object.keys(nextEntries).forEach(function(d){
      if (d >= fromStr && (!toStr_ || d <= toStr_)) {
        nextEntries[d] = Object.assign({}, nextEntries[d], { allowance: v / daysInMonth(parseD(d)) });
      }
    });
  }

  if (scope === "all") {
    hist = [{ from:"1900-01-01", monthlyBudget:v }];
    rewriteLoggedFrom("1900-01-01", null);
    label = "Monthly budget applied to all periods";
  } else {
    hist.push({ from:month.startStr, monthlyBudget:v });
    hist = normalizeMonthlyBudgetHistory(hist);
    rewriteLoggedFrom(month.startStr, null);
    label = "Monthly budget applied from this month onward";
  }
  hist = normalizeMonthlyBudgetHistory(hist);
  var nextSettings = Object.assign({}, state.settings, {
    monthlyBudgetHistory: hist,
    monthlyBudget: v,
    /* Keep a compatible weekly equivalent for older versions/backups. */
    weeklyTarget: (v / daysInMonth(new Date())) * 7
  });
  persistAll(nextSettings, nextEntries, "your budget");
  showToast(label);
  render();
}

/* Brings up the number pad the instant the Add/Edit sheet opens, so the
   person can start typing the amount without an extra tap. preventScroll
   stops iOS's own "scroll the focused field into view" behavior, which would
   otherwise fight the body scroll lock the moment the keyboard opens — the
   modal already handles its own scrolling via .modal-card. The extra
   updateVisualViewportOffset calls make sure --vvb (which the modal backdrop
   now uses to stay above the keyboard) catches up promptly, rather than
   waiting on the visualViewport "resize" event, which can lag the keyboard's
   slide-in animation by a beat on iOS. */
function focusAmountInput() {
  var el = document.getElementById("entryAmountInput");
  if (!el) return;
  try { el.focus({ preventScroll: true }); }
  catch(e) { try { el.focus(); } catch(e2) {} }
  if (typeof updateVisualViewportOffset === "function") {
    updateVisualViewportOffset();
    setTimeout(updateVisualViewportOffset, 60);
    setTimeout(updateVisualViewportOffset, 250);
    setTimeout(updateVisualViewportOffset, 400);
  }
}

function handleCancelEdit() {

function handleDeleteTxn(date, id) {
  var day = state.entries[date];
  if (!day) return;
  var remaining = day.items.filter(function(i){ return i.id !== id; });
  var nextEntries = Object.assign({}, state.entries);
  if (remaining.length === 0) delete nextEntries[date]; else nextEntries[date] = Object.assign({}, day, { items: remaining });
  if (state.editingItemId === id) { state.editingItemId = null; state.editingOriginalDate = null; }
  persistAll(state.settings, nextEntries, "your entry");
  render();
}

/* render() rebuilds the whole DOM from scratch on every call, including
   whatever's currently on screen in the Add Transaction sheet — so any
   in-place toggle within that sheet (day-split mode, person-split mode,
   category group) needs to stash the sheet's current values into state
   first, or they'd silently reset the moment the toggle re-renders it.
   Called at the top of every such toggle handler, before it touches other
   state and calls render(). */
/* Same root cause as preserveTxnFormDraft, same fix: the Add Recurring
   Payment form's fields have no draft state of their own, so toggling the
   limit-mode segmented control (or pausing/deleting a DIFFERENT rule on the
   same page) rebuilds the DOM and silently erases whatever's been typed
   into this form. Called before any such action mutates state and renders. */
function preserveRecurringFormDraft() {
  var pairs = [
    ["recurringAmountInput","recurringAmountDraft"],
    ["recurringCategoryInput","recurringCategoryDraft"],
    ["recurringPersonInput","recurringPersonDraft"],
    ["recurringNoteInput","recurringNoteDraft"],
    ["recurringFrequencyInput","recurringFrequencyDraft"],
    ["recurringStartDateInput","recurringStartDateDraft"],
    ["recurringCountInput","recurringCountDraft"],
    ["recurringEndDateInput","recurringEndDateDraft"]
  ];
  pairs.forEach(function(p){
    var el = document.getElementById(p[0]);
    if (el) state[p[1]] = el.value;
  });
}

function preserveTxnFormDraft() {
  var amtEl = document.getElementById("entryAmountInput");
  var noteEl = document.getElementById("entryNoteInput");
  var daysEl = document.getElementById("splitDaysInput");
  var catEl = document.getElementById("entryCategoryInput");
  var personEl = document.getElementById("entryPersonInput");
  if (amtEl) state.entryAmountDraft = amtEl.value;
  if (noteEl) state.entryNoteDraft = noteEl.value;
  if (daysEl) state.entrySplitDaysDraft = daysEl.value;
  if (catEl) state.entryCategoryDraft = catEl.value;
  if (personEl) state.entryPersonDraft = personEl.value;
  var pctSelects = document.querySelectorAll(".split-person-pct");
  if (pctSelects.length) {
    var draft = {};
    pctSelects.forEach(function(s){ draft[s.dataset.person] = s.value; });
    state.entryPersonSplitDraft = draft;
  }
}

function handleCopyBackup() {
  var btn = document.getElementById("copyBackupBtn");
  var text = JSON.stringify({settings:state.settings, entries:state.entries}, null, 2);
  function done(msg) { if (btn) { btn.textContent = msg; setTimeout(function(){ if(btn) btn.textContent = "Copy backup"; }, 2500); } }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ done("Copied ✓"); }).catch(function(){ done("Select the text above to copy"); });
  } else {
    done("Select the text above to copy");
  }
}

function validateBackupEntries(entries) {
  if (!entries || typeof entries !== "object" || Array.isArray(entries)) return false;
  var dates = Object.keys(entries);
  for (var d=0; d<dates.length; d++) {
    var ds = dates[d];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(ds)) return false;
    var day = entries[ds];
    if (!day || typeof day !== "object" || Array.isArray(day)) return false;
    /* Legacy backups stored one numeric `spent` value instead of item rows. */
    if (!Array.isArray(day.items)) {
      if (typeof day.spent !== "number" || !isFinite(day.spent) || day.spent < 0) return false;
      continue;
    }
    for (var i=0; i<day.items.length; i++) {
      var it = day.items[i];
      if (!it || typeof it !== "object" || Array.isArray(it)) return false;
      if (typeof it.amount !== "number" || !isFinite(it.amount) || it.amount < 0) return false;
      if (it.personSplit != null) {
        if (!Array.isArray(it.personSplit)) return false;
        var pctTotal = 0;
        for (var j=0; j<it.personSplit.length; j++) {
          var ps = it.personSplit[j];
          if (!ps || typeof ps.person !== "string" || typeof ps.pct !== "number" || !isFinite(ps.pct) || ps.pct < 0 || ps.pct > 100) return false;
          pctTotal += ps.pct;
        }
        if (it.personSplit.length && Math.abs(pctTotal - 100) > 0.001) return false;
      }
    }
  }
  return true;
}

function handleRestore() {
  var el = document.getElementById("restoreInput");
  var raw = el ? el.value : "";
  try {
    var parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object" || !validateBackupEntries(parsed.entries)) throw new Error("bad shape");
    var nextSettings = Object.assign({}, DEFAULT_SETTINGS, parsed.settings||{});
    nextSettings.analysisSectionOrder = normalizeAnalysisOrder(nextSettings.analysisSectionOrder);
    nextSettings.analysisHiddenSections = normalizeHiddenSections(nextSettings.analysisHiddenSections);
    nextSettings.budgetSectionOrder = normalizeBudgetOrder(nextSettings.budgetSectionOrder);
    nextSettings.homeSectionOrder = normalizeHomeOrder(nextSettings.homeSectionOrder);
    nextSettings.incomeHistory = normalizeIncomeHistory(nextSettings.incomeHistory);
    nextSettings.monthlyBudgetHistory = normalizeMonthlyBudgetHistory(nextSettings.monthlyBudgetHistory);
    nextSettings.categoryStyles = normalizeCategoryStyles(nextSettings.categoryStyles, nextSettings.categories);
    nextSettings.categoryGroups = normalizeCategoryGroups(nextSettings.categoryGroups);
    nextSettings.categoryGroupStyles = normalizeCategoryGroupStyles(nextSettings.categoryGroupStyles, nextSettings.categoryGroups);
    nextSettings.categoryGroupOf = normalizeCategoryGroupOf(nextSettings.categoryGroupOf, nextSettings.categories, nextSettings.categoryGroups);
    nextSettings.people = normalizePeople(nextSettings.people);
    nextSettings.personColors = normalizePersonColors(nextSettings.personColors, nextSettings.people);
    nextSettings.categoryExcludeFromBudget = normalizeCategoryExcludeFromBudget(nextSettings.categoryExcludeFromBudget, nextSettings.categories);
    nextSettings.peopleAnalysisExcluded = normalizePeopleAnalysisExcluded(nextSettings.peopleAnalysisExcluded, nextSettings.categories);
    nextSettings.defaultPerson = normalizeDefaultPerson(nextSettings.defaultPerson, nextSettings.people);
    nextSettings.recurringRules = normalizeRecurringRules(nextSettings.recurringRules);
    var restoreFallback = nextSettings.monthlyBudget ? (Number(nextSettings.monthlyBudget)/daysInMonth(new Date())) : (nextSettings.weeklyTarget/7);
    var nextEntries = migrateEntries(parsed.entries||{}, restoreFallback);
    state.settings = nextSettings;
    state.entries = nextEntries;
    runRecurringCatchUp();
    persistAll(state.settings, state.entries, "restored data");
    state.restoreError = null;
    state.showBackup = false;
  } catch(e) {
    state.restoreError = "That doesn't look like a valid backup — paste the exact text you copied earlier.";
  }
  render();
}

/* ---------------- event delegation ---------------- */
document.addEventListener("click", function(e) {
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.dataset.action;
  switch(action) {
    case "open-backup": state.showBackup = true; render(); break;
    case "close-backup": state.showBackup = false; state.restoreError = null; render(); break;
    case "open-settings": settingsNavStack = []; state.settingsSection = null; state.showSettings = true; render(); break;
    case "open-budget-settings": settingsNavStack = []; state.settingsSection = "budget"; state.showSettings = true; render(); break;
    case "close-settings": settingsNavStack = []; state.settingsSection = null; state.showSettings = false; render(); break;
    case "open-reset": state.showResetConfirm = true; render(); break;
    case "close-reset": state.showResetConfirm = false; render(); break;
    case "toggle-theme":
      persistAll(Object.assign({}, state.settings, { theme: state.settings.theme==="dark"?"light":"dark" }), state.entries, "your settings");
      render();
      break;
    case "switch-view": state.view = el.dataset.view; state.offset = 0; render(); break;
    case "nav-offset":
      var delta = parseInt(el.dataset.delta,10);
      var next = state.offset + delta;
      state.offset = Math.min(0, next);
      render();
      break;
    case "add-transaction": handleAddTransaction(); break;
    case "delete-txn":
      handleDeleteTxn(el.dataset.date, el.dataset.id);
      state.pendingDeleteKey = null;
      break;
    case "ask-delete-txn":
      state.pendingDeleteKey = el.dataset.date+"|"+el.dataset.id;
      render();
      break;
    case "cancel-delete-txn":
      state.pendingDeleteKey = null;
      render();
      break;
    case "edit-txn": handleEditTxn(el.dataset.date, el.dataset.id); break;
    case "cancel-edit": handleCancelEdit(); break;
    case "set-txn-kind":

      break;
    case "set-txn-split-mode":

    case "set-txn-person-split-mode":

      state.txnKind = null;
      state.txnPersonSplitMode = "single";
      state.txnCategoryGroup = null;
      state.txnShowAllCategories = false;
      state.txnAdvancedOpen = false;
      state.entryAmountDraft = null;

    case "save-tracking":

      var trackSettings = Object.assign({}, state.settings, { trackingStartDate: (tsEl && tsEl.value) ? tsEl.value : null });
      persistAll(trackSettings, state.entries, "your settings");
      showToast("Tracking date saved");
      render();
      break;
    case "apply-budget":
      handleApplyBudget(el.dataset.scope);
      break;
    case "add-category-scoped":
      var scopedGroup = el.dataset.group || "";
      var scopedInput = document.querySelector('.new-category-input[data-group="'+scopedGroup.replace(/"/g,'\\"')+'"]');
      var scopedName = scopedInput ? scopedInput.value.trim() : "";
      if (scopedName && (state.settings.categories||[]).indexOf(scopedName) === -1) {
        var nextCatsScoped = (state.settings.categories||[]).concat([scopedName]);
        var nextGroupOfScoped = Object.assign({}, state.settings.categoryGroupOf||{});
        var nextStylesScoped = Object.assign({}, state.settings.categoryStyles||{});
        if (scopedGroup) {
          nextGroupOfScoped[scopedName] = scopedGroup;
          nextStylesScoped[scopedName] = { icon: "tag", color: groupThemeColor(scopedGroup) };
        }
        persistAll(Object.assign({}, state.settings, { categories: nextCatsScoped, categoryGroupOf: nextGroupOfScoped, categoryStyles: nextStylesScoped }), state.entries, "your settings");
        render();
      }

      var newCat = newCatEl ? newCatEl.value.trim() : "";
      if (newCat && (state.settings.categories||[]).indexOf(newCat) === -1) {

        persistAll(withCat, state.entries, "your settings");
