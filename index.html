  var maxVal = Math.max.apply(null, items.map(function(i){ return Math.max(i.spent, i.target); }).concat([1]));
  var plotW = w-padL-padR, plotH = h-padT-padB;
  var n = items.length;
  var slot = plotW/n;
  var barW = Math.min(24, slot*0.55);
  function y(v){ return padT + plotH - (Math.min(v,maxVal)/maxVal)*plotH; }
  var bars = items.map(function(it,i){
    var cx = padL + slot*i + slot/2;
    var barTopY = y(it.spent);
    var barH = Math.max(0, plotH - (barTopY-padT));
    var color = it.spent <= it.target ? T.positive : T.rust;
    var targetY = y(it.target);
    return '<rect x="'+(cx-barW/2)+'" y="'+barTopY+'" width="'+barW+'" height="'+barH+'" fill="'+color+'" rx="2"/>'
      + '<line x1="'+(cx-barW/2-2)+'" x2="'+(cx+barW/2+2)+'" y1="'+targetY+'" y2="'+targetY+'" stroke="'+T.textMuted+'" stroke-dasharray="2,2"/>'
      + '<text x="'+cx+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'" text-anchor="middle">'+esc(it.label)+'</text>';
  }).join("");
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'">'
    + '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="'+T.hairline+'"/>'
    + bars + '</svg>';
}

/* Generic bucketed bar chart: one bar per bucket, value from getValue(), color
   from getColor(bucket, value). Bars can go negative (drawn below a zero line)
   which the saved-per-period chart needs. Value labels are drawn above/below
   each bar (rounded, no decimals) as long as bars are wide enough to fit them
   without overlapping; refLine (optional) draws a labelled dashed marker, e.g.
   the daily budget. Buckets carry their own `label`, so the same chart works
   whether they're days or months. */
function renderDailyBarChart(buckets, getValue, getColor, T, refLine, selectedKey, chartId) {
  if (!buckets.length) return '<div class="muted" style="font-size:12px;">No data in this period.</div>';
  var w = 340, h = 156, padL = 30, padR = 8, padB = 20;
  var n = buckets.length;
  var plotW = w-padL-padR;
  var slot = plotW/n;
  var barW = Math.max(1, Math.min(20, slot*0.7));
  /* Horizontal labels need real width to read; below that, rotate them
     vertical so a value is still visible even at daily-for-a-month density —
     hiding it outright was the old behavior, but a label you have to tap to
     see isn't a label. Vertical labels get extra top padding so they don't
     clip against the chart's edge above a tall bar. */
  var labelMode = slot >= 20 ? "h" : (slot >= 7 ? "v" : "none");
  var padT = labelMode === "v" ? 40 : 18;
  var values = buckets.map(getValue);
  var maxVal = Math.max.apply(null, values.concat([0, refLine==null?0:refLine]));
  var minVal = Math.min.apply(null, values.concat([0]));
  var range = (maxVal - minVal) || 1;
  var plotH = h-padT-padB;
  function y(v){ return padT + plotH - ((v-minVal)/range)*plotH; }
  var zeroY = y(0);
  /* Each column gets a full-height transparent hit rect so thin bars are still
     an easy tap target — the bar itself is often only a few pixels wide. */
  var bars = buckets.map(function(b,i){
    var v = getValue(b);
    var cx = padL + slot*i + slot/2;
    var top = v>=0 ? y(v) : zeroY;
    var barH = Math.max(0.5, Math.abs(y(v)-zeroY));
    var hitKey = (chartId||"c")+"|"+b.key;
    var isSel = selectedKey != null && hitKey === selectedKey;
    var dim = (selectedKey != null && !isSel) ? ' opacity="0.38"' : '';
    var svg = '<rect x="'+(cx-barW/2)+'" y="'+top+'" width="'+barW+'" height="'+barH+'" fill="'+getColor(b,v)+'" rx="2"'+dim+'/>';
    if (isSel) {
      svg += '<rect x="'+(cx-barW/2-1.5)+'" y="'+(top-1.5)+'" width="'+(barW+3)+'" height="'+(barH+3)+'" fill="none" stroke="'+T.text+'" stroke-width="1.5" rx="3"/>';
    }
    if (labelMode !== "none" && Math.round(v) !== 0) {
      var roundedV = Math.round(v);
      var labelStr = roundedV < 0 ? ("−"+fmt(Math.abs(roundedV),0)) : fmt(roundedV,0);
      var labelFill = isSel ? T.text : T.textMuted;
      if (labelMode === "h") {
        var labelY = v>=0 ? Math.max(9, top-3) : (top+barH+9);
        svg += '<text x="'+cx+'" y="'+labelY+'" font-size="8" fill="'+labelFill+'" text-anchor="middle">'+labelStr+'</text>';
      } else {
        // Vertical label: reads bottom-to-top above a positive bar, or
        // top-to-bottom below a negative one, so it never overlaps the bar.
        if (v>=0) {
          svg += '<text x="0" y="0" font-size="7" fill="'+labelFill+'" text-anchor="start" transform="translate('+cx+','+Math.max(10,top-3)+') rotate(-90)">'+labelStr+'</text>';
        } else {
          svg += '<text x="0" y="0" font-size="7" fill="'+labelFill+'" text-anchor="start" transform="translate('+cx+','+(top+barH+3)+') rotate(90)">'+labelStr+'</text>';
        }
      }
    }
    svg += '<rect class="chart-hit" data-action="select-bucket" data-key="'+esc(hitKey)+'" x="'+(padL+slot*i)+'" y="'+padT+'" width="'+slot+'" height="'+plotH+'" fill="transparent"/>';
    return svg;
  }).join("");
  var refSvg = "";
  if (refLine != null) {
    var ry = y(refLine);
    refSvg = '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+ry+'" y2="'+ry+'" stroke="'+T.textMuted+'" stroke-dasharray="3,3"/>'
      + '<text x="2" y="'+(ry+3)+'" font-size="8" fill="'+T.textMuted+'">'+fmt(Math.round(refLine),0)+'</text>';
  }
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'">'
    + refSvg
    + '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+zeroY+'" y2="'+zeroY+'" stroke="'+T.hairline+'"/>'
    + bars
    + '<text x="'+padL+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'">'+esc(buckets[0].label)+'</text>'
    + '<text x="'+(w-padR)+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'" text-anchor="end">'+esc(buckets[buckets.length-1].label)+'</text>'
    + '</svg>';
}

/* Shared by renderForecastChart and wireForecastChart, mirroring
   balanceChartGeom's role for the Home page chart. */
function forecastChartGeom(rows, totalDays, target, projectedSpend, compareValues, pastDays) {
  var w=340, h=190, padL=44, padR=8, padT=24, padB=20;
  var plotW=w-padL-padR, plotH=h-padT-padB;
  var n = Math.max(totalDays, 2);
  function xAt(i){ return padL + (i/(n-1))*plotW; }
  var actualVals = []; var acc = 0;
  rows.forEach(function(r){ acc += r.spent; actualVals.push(acc); });
  var compareMax = (compareValues && compareValues.length) ? Math.max.apply(null, compareValues) : 0;
  var targetVal = target == null ? 0 : target;
  var maxY = Math.max(targetVal, projectedSpend, actualVals.length ? Math.max.apply(null, actualVals) : 0, compareMax, 1);
  function yAt(v){ return padT + plotH - (v/maxY)*plotH; }
  var lastIdx = actualVals.length - 1;
  var lastVal = actualVals.length ? actualVals[actualVals.length-1] : 0;
  var pd = pastDays || 0;
  var knownIdx = pd > 0 ? pd - 1 : 0;
  var knownVal = pd > 0 ? actualVals[pd-1] : 0;
  return { w:w, h:h, padL:padL, padR:padR, padT:padT, padB:padB, plotW:plotW, plotH:plotH,
           n:n, xAt:xAt, yAt:yAt, maxY:maxY, actualVals:actualVals, lastIdx:lastIdx, lastVal:lastVal,
           knownIdx:knownIdx, knownVal:knownVal };
}

/* Cumulative value at any index along the chart, actual portion or
   interpolated along the straight projected segment beyond it — lets the
   scrub tooltip report a sensible number no matter where on the axis the
   finger lands. */
function forecastValueAt(g, idx, projectedSpend) {
  if (idx <= g.lastIdx && g.actualVals.length) return g.actualVals[Math.max(0,idx)];
  if (g.n-1 === g.knownIdx) return g.knownVal;
  var frac = (idx - g.knownIdx) / ((g.n-1) - g.knownIdx);
  return g.knownVal + (projectedSpend - g.knownVal) * frac;
}

/* Cumulative spend for the elapsed portion of a period (smooth green curve),
   continuing as a straight projected line from today's actual total up to the
   forecasted end-of-period total — reusing the same avg-daily-pace math as
   the Home page's Forecast card, so the two numbers never disagree. A flat
   projection (as some budget apps show) would imply spending stops entirely;
   a straight line to the real forecast total is the honest version of the
   same picture. */
function renderForecastChart(rows, totalDays, target, projectedSpend, T, refLabel, compareValues, pastDays, hasForecast) {
  var g = forecastChartGeom(rows, totalDays, target, projectedSpend, compareValues, pastDays);
  var w=g.w, h=g.h, padL=g.padL, padR=g.padR, padT=g.padT, padB=g.padB, n=g.n;
  var xAt=g.xAt, yAt=g.yAt, maxY=g.maxY, actualVals=g.actualVals, lastIdx=g.lastIdx;
  var actualPts = actualVals.map(function(v,i){ return [xAt(i), yAt(v)]; });
  var curveD = actualPts.length >= 2 ? smoothPathD(actualPts) : (actualPts.length===1 ? ("M "+actualPts[0][0]+","+actualPts[0][1]) : "");
  var areaD = curveD ? (curveD+" L "+xAt(Math.max(0,lastIdx))+","+yAt(0)+" L "+xAt(0)+","+yAt(0)+" Z") : "";
  var forecastD = "", todayMarker = "";
  var daysToEstimateLocal = totalDays - (pastDays||0);
  if (rows.length > 0 && daysToEstimateLocal > 0) {
    if (hasForecast) forecastD = 'M '+xAt(g.knownIdx)+','+yAt(g.knownVal)+' L '+xAt(n-1)+','+yAt(projectedSpend);
    todayMarker = '<line x1="'+xAt(lastIdx)+'" x2="'+xAt(lastIdx)+'" y1="'+padT+'" y2="'+(h-padB)+'" stroke="'+T.hairline+'" stroke-dasharray="2,2"/>'
      + '<text x="'+xAt(lastIdx)+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'" text-anchor="middle">Today</text>';
  }
  var compareD = "";
  if (compareValues && compareValues.length >= 2) {
    compareD = smoothPathD(compareValues.map(function(v,i){ return [xAt(i), yAt(v)]; }));
  } else if (compareValues && compareValues.length === 1) compareD = "M "+xAt(0)+","+yAt(compareValues[0]);
  var ticksSet = {}; [0, Math.round(maxY/2), Math.round(maxY)].forEach(function(t){ ticksSet[t]=true; });
  var tickSvg = Object.keys(ticksSet).map(Number).map(function(t){
    return '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+yAt(t)+'" y2="'+yAt(t)+'" stroke="'+T.sep+'" stroke-dasharray="2,2"/>'
      + '<text x="2" y="'+(yAt(t)+3)+'" font-size="9" fill="'+T.textMuted+'">'+fmt(t,0)+'</text>';
  }).join("");
  var targetSvg = "";
  if (target != null) {
    var budgetY = yAt(target);
    targetSvg = '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+budgetY+'" y2="'+budgetY+'" stroke="'+T.text+'" stroke-width="1.5" stroke-dasharray="4,3"/>'
      + '<text x="'+padL+'" y="'+(budgetY-5)+'" font-size="9" font-weight="600" fill="'+T.text+'">'+esc(refLabel||"Budget")+' – '+fmt(target,0)+' AED</text>';
  }
  return '<svg id="forecastChartSvg" viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'">'
    + tickSvg + targetSvg
    + (compareD ? '<path d="'+compareD+'" fill="none" stroke="'+T.textMuted+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5,4"/>' : "")
    + (areaD ? '<path d="'+areaD+'" fill="'+T.positive+'" fill-opacity="0.16" stroke="none"/>' : "")
    + (curveD ? '<path d="'+curveD+'" fill="none" stroke="'+T.positive+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' : "")
    + (forecastD ? '<path d="'+forecastD+'" fill="none" stroke="'+T.accent+'" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1,5"/>' : "")
    + todayMarker
    + '<line id="forecastChartCrosshair" x1="0" x2="0" y1="'+padT+'" y2="'+(h-padB)+'" stroke="'+T.text+'" stroke-width="1" opacity="0"/>'
    + '<circle id="forecastChartDot" r="4.5" fill="'+T.accent+'" stroke="'+T.bg+'" stroke-width="2" opacity="0"/>'
    + '<rect id="forecastChartHit" x="0" y="0" width="'+w+'" height="'+h+'" fill="transparent" style="touch-action:none;"/>'
    + '</svg>';
}

/* Drives the crosshair/dot/tooltip during a touch or mouse drag across the
   forecast chart — same bypass-render() approach as wireBalanceChart, for
   the same reason: rebuilding the DOM on every pixel of movement would kill
   the smoothness of the drag. Reports whichever of the actual or projected
   value applies at the touched point, labelled accordingly. */
function wireForecastChart(data) {
  var svg = document.getElementById("forecastChartSvg");
  var hit = document.getElementById("forecastChartHit");
  var crosshair = document.getElementById("forecastChartCrosshair");
  var dot = document.getElementById("forecastChartDot");
  var tip = document.getElementById("forecastChartTip");
  if (!svg || !hit || !crosshair || !dot || !tip || !data) return;
  var g = forecastChartGeom(data.rows, data.totalDays, data.target, data.projectedSpend, data.compareValues, data.pastDays);
  if (g.n < 2) return;

  function indexAt(clientX) {
    var rect = svg.getBoundingClientRect();
    if (!rect.width) return 0;
    var frac = Math.max(0, Math.min(1, (clientX-rect.left)/rect.width));
    var vbX = frac * g.w;
    var idx = Math.round(((vbX-g.padL)/g.plotW) * (g.n-1));
    return Math.max(0, Math.min(g.n-1, idx));
  }
  function showAt(idx) {
    var val = forecastValueAt(g, idx, data.projectedSpend);
    var px = g.xAt(idx), py = g.yAt(val);
    crosshair.setAttribute("x1", px); crosshair.setAttribute("x2", px); crosshair.setAttribute("opacity", "1");
    dot.setAttribute("cx", px); dot.setAttribute("cy", py); dot.setAttribute("opacity", "1");
    var dateStr = shortLabel(toStr(addDays(parseD(data.start), idx)));
    var isProjected = idx > g.lastIdx;
    var lineStyle = 'white-space:nowrap; overflow:hidden; text-overflow:ellipsis;';
    var tipHtml = '<div style="'+lineStyle+'"><span class="muted">'+esc(dateStr)+(isProjected?" (projected)":"")+'</span> <span style="color:var(--text); font-weight:600;">'+fmt(Math.round(val),0)+' AED</span></div>';
    if (data.compareValues && data.compareValues.length > idx) {
      tipHtml += '<div style="'+lineStyle+' margin-top:2px;"><span class="muted">'+esc(data.compareLabel||"Compare")+' </span><span style="color:var(--text-muted); font-weight:600;">'+fmt(Math.round(data.compareValues[idx]),0)+' AED</span></div>';
    }
    tip.innerHTML = tipHtml;
    positionChartTooltip(tip, svg, px, g.w);
    tip.style.opacity = "1";
  }
  function hide() {
    crosshair.setAttribute("opacity", "0");
    dot.setAttribute("opacity", "0");
    tip.style.opacity = "0";
  }
  function move(clientX) { showAt(indexAt(clientX)); }

  hit.addEventListener("touchstart", function(e){ move(e.touches[0].clientX); }, {passive:true});
  hit.addEventListener("touchmove", function(e){ move(e.touches[0].clientX); e.preventDefault(); }, {passive:false});
  hit.addEventListener("touchend", hide);
  hit.addEventListener("touchcancel", hide);
  hit.addEventListener("mousedown", function(e){ move(e.clientX); });
  hit.addEventListener("mousemove", function(e){ if (e.buttons===1) move(e.clientX); });
  hit.addEventListener("mouseleave", hide);
  hit.addEventListener("mouseup", hide);
}

/* Single source of truth for the forecast's pace/projection math — shared
   by the Forecasted Spend card and the Spend Trend chart's current-period
   classification, so the two can never disagree about whether today is
   genuinely trending over budget. Today is treated as a day still being
   estimated, not a completed one: its spend-so-far isn't mistaken for its
   final number, so a period's first day (no completed local days yet) is
   projected purely from historical pace rather than a raw, unblended,
   small-sample average of whatever's happened so far this period. */
function computeForecastNumbers(rows, totalDays, periodStart, scope) {
  if (!rows.length) return null;
  scope = scope || "overall";
  var today = todayStr();
  var todayIncluded = rows[rows.length-1].date === today;
  var todayRow = todayIncluded ? rows[rows.length-1] : null;
  var pastRows = todayIncluded ? rows.slice(0, rows.length-1) : rows.slice();
  var pastDays = pastRows.length;
  var pastSpent = pastRows.reduce(function(s,r){ return s+rowSpentForScope(r,scope); }, 0);
  var pastDiscretionary = discretionarySpentInRows(pastRows, scope);
  var todayScheduledSpent = todayRow ? (todayRow.items||[]).reduce(function(s,it){
    return (expenseCountsForScope(it,scope) && it.recurringId) ? s+it.amount : s;
  }, 0) : 0;
  var actualSpentSoFar = pastSpent + (todayRow ? rowSpentForScope(todayRow,scope) : 0);
  var knownSpent = pastSpent + todayScheduledSpent;
  var historicalAvg = overallAvgDailySpend(scope);
  var BLEND_K = historicalAvg !== null ? 3 : 0;
  var blendDenom = pastDays + BLEND_K;
  var avgSpentPerDay = blendDenom > 0 ? ((pastDiscretionary + (historicalAvg !== null ? historicalAvg*BLEND_K : 0)) / blendDenom) : null;
  var stillBlending = historicalAvg !== null && pastDays < BLEND_K;
  var daysToEstimate = Math.max(0, totalDays - pastDays);
  var periodEnd = toStr(addDays(parseD(periodStart), totalDays-1));
  var scheduledUpcoming = daysToEstimate > 0 ? scheduledAmountInRange(toStr(addDays(parseD(today), -1)), periodEnd, scope) : 0;
  var hasForecast = daysToEstimate > 0 && (avgSpentPerDay !== null || scheduledUpcoming > 0);
  var projectedSpend = hasForecast ? (knownSpent + (avgSpentPerDay || 0) * daysToEstimate + scheduledUpcoming) : actualSpentSoFar;
  return {
    todayIncluded:todayIncluded, pastDays:pastDays, pastSpent:pastSpent,
    pastDiscretionary:pastDiscretionary, actualSpentSoFar:actualSpentSoFar,
    knownSpent:knownSpent, avgSpentPerDay:avgSpentPerDay, stillBlending:stillBlending,
    daysToEstimate:daysToEstimate, scheduledUpcoming:scheduledUpcoming,
    hasForecast:hasForecast, projectedSpend:projectedSpend
  };
}

/* Builds the entire Forecasted Spend card — header, badge, chart, and any
   footnote — shared by Home and Analysis so the two can't drift apart or
   disagree on a number. Pace blends this period's own elapsed days with the
   overall historical daily average, weighted by a simple shrinkage estimator:
   avg = (local spend + historicalAvg*K) / (local days + K). On day 1 that's
   pure history (0 local days); as local days accumulate they count for more,
   and once local days reach K the historical average barely matters anymore.
   This avoids both a flat, useless day-1 projection AND an abrupt full
   switchover the moment a single local day exists. */
function buildForecastCard(rows, totalDays, target, periodStart, T, refLabel, periodWord, compareRows, scope) {
  if (!rows.length) return "";
  scope = scope || "overall";
  /* Normalize row.spent to the requested scope so chart geometry and compare
     curves always represent the same definition of spend. */
  var scopedRows = rows.map(function(r){ return Object.assign({}, r, { spent: rowSpentForScope(r, scope) }); });
  var scopedCompareRows = (compareRows||[]).map(function(r){ return Object.assign({}, r, { spent: rowSpentForScope(r, scope) }); });
  var fc = computeForecastNumbers(rows, totalDays, periodStart, scope);
  var todayIncluded = fc.todayIncluded, pastDays = fc.pastDays, pastDiscretionary = fc.pastDiscretionary,
      avgSpentPerDay = fc.avgSpentPerDay, stillBlending = fc.stillBlending, daysToEstimate = fc.daysToEstimate,
      scheduledUpcoming = fc.scheduledUpcoming, hasForecast = fc.hasForecast, projectedSpend = fc.projectedSpend;
  var hasTarget = target != null;
  var projectedSaved = hasTarget ? target - projectedSpend : null;
  var favorable = hasTarget ? projectedSaved >= 0 : true;
  var vsBudgetPct = hasTarget && target > 0 ? Math.round(((projectedSpend-target)/target)*100) : null;
  var compareMode = state.forecastCompareMode === "average" ? "average" : "previous";
  var compareLabel = compareMode === "average" ? "Average pace" : (periodWord === "period" ? "Previous period" : ("Last "+periodWord));
  var compareValues = null, compareUnavailableNote = null;
  if (compareMode === "previous") {
    if (scopedCompareRows.length) {
      var cAcc = 0;
      compareValues = scopedCompareRows.slice(0,totalDays).map(function(r){ cAcc += r.spent; return cAcc; });
    } else compareUnavailableNote = "No " + compareLabel.toLowerCase() + " logged yet to compare against.";
  } else if (avgSpentPerDay !== null) {
    compareValues = [];
    for (var ci=0; ci<totalDays; ci++) compareValues.push(avgSpentPerDay * (ci+1));
  } else compareUnavailableNote = "Not enough history yet to show an average pace.";

  var s = '<div class="card card-pad" style="margin-bottom:16px;">';
  s += '<div class="eyebrow" style="margin-bottom:10px;">Forecasted '+(scope==="budget"?"budget spend":"total spend")+'</div>';
  s += '<div class="row between" style="align-items:flex-start; margin-bottom:14px;">';
  s += '<div><div class="muted caption">THIS '+esc(periodWord.toUpperCase())+'</div><div class="mono" style="font-size:22px; font-weight:700; margin-top:2px;">'+fmt(projectedSpend,0)+' AED</div></div>';
  if (hasTarget) {
    s += '<div style="text-align:right;"><div class="muted caption">VS '+esc((refLabel||"Budget").toUpperCase())+'</div>';
    s += '<div class="chip" style="margin-top:4px; background:'+(favorable?'var(--positive)':'var(--rust)')+'; color:#fff; font-weight:700;">'+(vsBudgetPct>=0?'+':'')+vsBudgetPct+'%</div>';
    s += '<div class="mono footnote" style="margin-top:4px; color:'+(favorable?'var(--positive)':'var(--rust)')+';">'+(projectedSaved>=0?'+':'−')+fmt(Math.abs(projectedSaved),0)+' AED</div></div>';
  }
  s += '</div>';
  s += '<div class="seg" style="margin-bottom:12px;">';
  [["previous", periodWord === "period" ? "vs Previous period" : ("vs Last "+periodWord)], ["average","vs Average pace"]].forEach(function(opt){
    s += '<button class="seg-btn" role="tab" aria-selected="'+(compareMode===opt[0])+'" data-action="set-forecast-compare" data-mode="'+opt[0]+'">'+opt[1]+'</button>';
  });
  s += '</div>';
  s += '<div id="forecastChartWrap" style="position:relative;">';
  s += '<div id="forecastChartTip" class="mono footnote" style="position:absolute; top:0; left:0; background:var(--fill); border-radius:8px; padding:4px 9px; max-width:250px; opacity:0; pointer-events:none; transition:opacity .12s ease; z-index:2;"></div>';
  s += renderForecastChart(scopedRows, totalDays, target, projectedSpend, T, refLabel, compareValues, pastDays, hasForecast);
  s += '</div>';
  if (compareValues) {
    s += '<div class="row gap2" style="margin-top:10px; flex-wrap:wrap;">'+legendSwatch(T.positive,"Actual")+legendSwatch(T.accent,"Projected")+legendSwatch(T.textMuted,compareLabel)+'</div>';
  }
  var notes = [];
  if (compareUnavailableNote) notes.push(compareUnavailableNote);
  if (!hasForecast) notes.push(daysToEstimate<=0 ? "Period is complete — nothing left to forecast." : "Log a few days to start forecasting.");
  else {
    if (todayIncluded) notes.push("Today isn't finished yet, so it is estimated from your pace rather than today's spend so far.");

/* Resolves the Analysis page's selected period. week/month/year are navigable
   via analysisOffset (0 = current, -1 = previous, …), reusing getPeriodBounds so
   titles and bounds match the Home page exactly. custom uses explicit dates. */
/* Same shape as getAnalysisPeriodInfo, for the Transactions page's filter —
   kept separate since Transactions also offers "all time" (a real list of
   everything ever logged), which doesn't make sense for Analysis's charts. */
function getTxnPeriodInfo() {
  var today = todayStr();
  var mode = state.txnPeriodMode || "all";
  var off = state.txnOffset || 0;
  var entryDatesAll = Object.keys(state.entries).sort();
  var naturalStart = entryDatesAll.length ? entryDatesAll[0] : today;
  if (mode === "all") {
    /* "All time" must mean all of it: if any logged entry falls after today
       (e.g. a recurring/split plan that caught up while the device clock was
       ahead, or any other edge case), the upper bound has to stretch to
       cover it too — otherwise this view silently drops entries that Week/
       Month (which use real calendar bounds, not an artificial "up to
       today" cap) would still show, which is exactly the inconsistency that
       made deleted-but-orphaned split entries "disappear" from All while
       still appearing under Week. */
    var latestEntryDate = entryDatesAll.length ? entryDatesAll[entryDatesAll.length-1] : today;
    var endAll = latestEntryDate > today ? latestEntryDate : today;
    return { start: naturalStart, end: endAll, title: "All time", sub: "", isCurrent: true, mode: mode };
  }
  if (mode === "custom") {
    var from = state.txnPeriodFrom || naturalStart;
    var to = state.txnPeriodTo || today;
    if (from > to) { var swap = from; from = to; to = swap; }
    return { start: from, end: to, title: shortLabel(from)+" – "+shortLabel(to), sub: "Custom range", isCurrent: true, mode: mode };
  }
  var per = getPeriodBounds(mode, off, currentWeeklyTarget(), dailyAllowance());
  return { start: per.startStr, end: per.endStr, title: per.title, sub: per.sub, isCurrent: off === 0, mode: mode };
}

function getAnalysisPeriodInfo() {
  var today = todayStr();
  var mode = state.analysisPeriodMode || "month";
  var off = state.analysisOffset || 0;
  if (mode === "custom") {
    var entryDatesAll = Object.keys(state.entries).sort();
    var fallbackStart = entryDatesAll.length ? entryDatesAll[0] : today;
    var from = state.analysisPeriodFrom || fallbackStart;
    var to = state.analysisPeriodTo || today;
    if (from > to) { var swap = from; from = to; to = swap; }
    return { start: from, end: to, title: shortLabel(from)+" – "+shortLabel(to), sub: "Custom range", isCurrent: true, mode: mode, days: daysBetween(from,to)+1 };
  }
  var per = getPeriodBounds(mode, off, currentWeeklyTarget(), dailyAllowance());
  return { start: per.startStr, end: per.endStr, title: per.title, sub: per.sub, isCurrent: off === 0, mode: mode, days: per.days };
}

/* Week/month are short enough to read day-by-day; a year would be 365 bars, so
   it rolls up to months. Custom ranges switch over at roughly two months. */
function analysisGranularity(info) {
  if (info.mode === "year") return "month";
  if (info.mode === "custom") return daysBetween(info.start, info.end) > 62 ? "month" : "day";
  return "day";
}

/* Collapses periodStats rows into chart buckets at the chosen granularity.
   Monthly buckets sum both spend and allowance, so a bucket's own target stays
   correct even when months differ in length. */
/* Whether a transaction item counts as belonging to a given person filter
   value — matches either the single-person field or, for a percentage
   split, anyone included in it (even at a partial share). Shared by the
   Transactions page filter and Analysis's person breakdown so the two
   pages can't define "belongs to this person" differently. Accepts either
   sentinel spelling for the "no one assigned" bucket, since Transactions'
   dropdown uses "__unassigned__" while Analysis's pie slice is labelled
   "Unassigned". */
function itemMatchesPersonFilter(it, filterValue) {
  if (!filterValue) return true;
  if (filterValue === "__unassigned__" || filterValue === "Unassigned") {
    return !it.person && (!it.personSplit || !it.personSplit.length);
  }
  if (it.personSplit && it.personSplit.length) return it.personSplit.some(function(ps){ return ps.person===filterValue; });
  return it.person === filterValue;
}

/* Whether an item falls within the current category-level scope: a specific
   leaf category filter wins if set (most specific); otherwise a drilled-into
   group applies (browsing "Food & Drinks" without having picked one of its
   categories yet still narrows to that group); otherwise unscoped. Shared by
   every section that reads the page's "current category scope" — the bar
   charts, day-of-week, biggest transactions, and the person breakdown's own
   aggregation — so drilling into a group filters the whole page the same
   way picking a specific category already does, not just the category
   section's own pie. */
function itemMatchesCategoryScope(it, catFilter, groupFilter) {
  if (catFilter) return (it.category || "Uncategorised") === catFilter;
  if (groupFilter === "Ungrouped") return !categoryGroupOf(it.category);
  if (groupFilter) return categoryGroupOf(it.category) === groupFilter;
  return true;
}

/* One definition of an expense that belongs in Analysis for the active basis.
   Budget mode excludes categories explicitly marked outside the budget; income
   mode is cash-flow oriented and therefore includes every real expense. */
function itemCountsForAnalysis(it) { return isExpenseItem(it); }

/* The amount to attribute to the current person-filter scope for a given
   item. A person filter matching a split transaction only means that person
   holds SOME share of it — every sum built on top of that boolean match was
   adding the item's FULL amount regardless of share, so a 100 AED purchase
   split 30/70 was counted as a full 100 AED for BOTH people, inflating any
   person-filtered total by everyone else's share too. This returns the
   correct prorated amount: the person's own share when the item is split,
   the full amount for an unsplit item (nothing to prorate), and the full
   amount when there's no active person filter at all (nothing to scope by). */
function personScopedAmount(it, personFilter) {
  if (!personFilter || !it.personSplit || !it.personSplit.length) return it.amount;
  return it.personSplit
    .filter(function(ps){ return ps.person === personFilter; })
    .reduce(function(t,ps){ return t + round2(it.amount * ps.pct/100); }, 0);
}

function buildAnalysisBuckets(rows, granularity, catFilter, personFilter, groupFilter) {
  function keep(it){
    return itemCountsForAnalysis(it) && itemMatchesCategoryScope(it, catFilter, groupFilter) && itemMatchesPersonFilter(it, personFilter);
  }
  function spentOf(r){
    if (!catFilter && !personFilter && !groupFilter) return r.spent;
    return (r.items||[]).reduce(function(t,it){ return keep(it) ? t+personScopedAmount(it, personFilter) : t; }, 0);
  }
  if (granularity !== "month") {
    return rows.map(function(r){
      return { key: r.date, label: shortLabel(r.date), title: dayLabel(r.date), date: r.date,
               dates: [r.date], spent: spentOf(r), allowance: r.allowance, days: 1 };
    });
  }
  var map = {}, order = [];
  rows.forEach(function(r){
    var key = r.date.slice(0,7);
    if (!map[key]) {
      map[key] = { key: key, label: parseD(r.date).toLocaleDateString("en-GB",{month:"short"}),
                   title: parseD(r.date).toLocaleDateString("en-GB",{month:"long",year:"numeric"}),
                   date: r.date, dates: [], spent: 0, allowance: 0, days: 0 };
      order.push(key);
    }
    map[key].spent += spentOf(r);
    map[key].allowance += r.allowance;
    map[key].days += 1;
    map[key].dates.push(r.date);
  });
  return order.map(function(k){ return map[k]; });
}

/* Total already logged by a rule so far — summed per-occurrence rather than
   multiplied, since a split's final day carries a different (remainder)
   amount than the rest. */
function ruleLoggedAmount(rule) {
  var sum = 0;
  for (var i=0; i<(rule.occurrencesLogged||0); i++) sum += ruleOccurrenceAmount(rule, i);
  return round2(sum);
}

/* ---------------- actions ---------------- */
function handleAddTransaction() {
  var dateEl = document.getElementById("entryDateInput");
  var amtEl = document.getElementById("entryAmountInput");
  var noteEl = document.getElementById("entryNoteInput");
  var catEl = document.getElementById("entryCategoryInput");
  var date = dateEl ? dateEl.value : todayStr();
  var amt = parseFloat(amtEl ? amtEl.value : "");
  if (isNaN(amt) || amt < 0 || !date) return;
  var note = noteEl ? noteEl.value.trim() : "";
  var category = catEl ? catEl.value : "";

  var person = "";
  var personSplit = null;
  var peopleForSave = state.settings.people||[];
  var personSplitModeActive = peopleForSave.length >= 2 && state.txnPersonSplitMode === "split";
  if (personSplitModeActive) {
    var pctSelects = document.querySelectorAll(".split-person-pct");
    var splitEntries = [];
    var totalPct = 0;
    pctSelects.forEach(function(s){
      var pct = parseInt(s.value,10)||0;
      totalPct += pct;
      if (pct > 0) splitEntries.push({ person: s.dataset.person, pct: pct });
    });
    if (totalPct !== 100) { showToast("Split must add up to 100%"); return; }
    personSplit = splitEntries;
  } else {
    var personEl = document.getElementById("entryPersonInput");
    person = personEl ? personEl.value : "";
  }
  var wasEditing = !!(state.editingItemId && state.editingOriginalDate);
  var origItemForKind = null;
  if (wasEditing) {
    var origDayForKind = state.entries[state.editingOriginalDate];
    if (origDayForKind) origItemForKind = origDayForKind.items.find(function(i){ return i.id === state.editingItemId; }) || null;
  }
  var kind = state.txnKind != null ? state.txnKind : (origItemForKind && origItemForKind.kind==="income" ? "income" : "expense");
  if (kind === "income") category = ""; // income doesn't use the expense category system

  if (!wasEditing && state.txnSplitMode === "split" && kind === "expense") {
    var splitDaysEl = document.getElementById("splitDaysInput");
    var splitDays = parseInt(splitDaysEl ? splitDaysEl.value : "", 10);
    if (isNaN(splitDays) || splitDays < 2) return;
    handleAddSplitTransaction(date, amt, category, note, splitDays, person, personSplit);
    return;
  }

  var nextEntries = Object.assign({}, state.entries);

  if (wasEditing) {
    var origDate = state.editingOriginalDate;
    var origDay = nextEntries[origDate];
    if (origDay) {
      var remaining = origDay.items.filter(function(i){ return i.id !== state.editingItemId; });
      if (remaining.length === 0) delete nextEntries[origDate];
      else nextEntries[origDate] = Object.assign({}, origDay, { items: remaining });
    }
    /* Preserve recurringId/seq metadata when editing an occurrence so deleting
       its plan later can still find and remove that occurrence. */
    var updatedItem = Object.assign({}, origItemForKind || {}, { id: state.editingItemId, amount: amt, note: note, category: category, person: person, personSplit: personSplit, kind: kind });
    var destDay = nextEntries[date];
    var nextDest = destDay ? Object.assign({}, destDay, { items: destDay.items.concat([updatedItem]) }) : { allowance: allowanceForDate(date), items: [updatedItem] };
    nextEntries[date] = nextDest;
    state.editingItemId = null;
    state.editingOriginalDate = null;
    state.showAddTxn = false;
  } else {
    var existing = nextEntries[date];
    var newItem = { id: Date.now()+"-"+Math.random().toString(36).slice(2,7), amount: amt, note: note, category: category, person: person, personSplit: personSplit, kind: kind };
    nextEntries[date] = existing ? Object.assign({}, existing, { items: existing.items.concat([newItem]) }) : { allowance: allowanceForDate(date), items: [newItem] };
    state.showAddTxn = false;
  }

  state.entryDate = date;
  persistAll(state.settings, nextEntries, "your entry");
  showToast(wasEditing ? "Record updated" : "Record added");
  render();
}

/* Spreads one total across N consecutive days running FORWARD from the chosen
   date, as a tracked plan rather than a pile of pre-written entries. Days that
   have already passed get logged immediately by the shared catch-up engine;
   days still to come are logged as each arrives — which is what makes "how
   much is left / what's coming up" answerable at all. Per-day share is
   floor-rounded with the final day absorbing the leftover cents, so the days
   read evenly while the total stays exact. */
function handleAddSplitTransaction(startDate, totalAmount, category, note, splitDays, person, personSplit) {
  var perDayFloor = Math.floor((totalAmount/splitDays)*100)/100;
  var newRule = {
    id: Date.now()+"-"+Math.random().toString(36).slice(2,7),
    kind: "split",
    amount: perDayFloor,
    splitTotal: totalAmount,
    category: category,
    note: note,
    person: person||"",
    personSplit: personSplit||null,
    frequency: "daily",
    startDate: startDate,
    endDate: null,
    occurrencesTotal: splitDays,
    occurrencesLogged: 0,
    active: true
  };
  state.settings = Object.assign({}, state.settings, { recurringRules: (state.settings.recurringRules||[]).concat([newRule]) });
  runRecurringCatchUp();
  state.entryDate = startDate;
  state.showAddTxn = false;
  state.txnSplitMode = "single";
  state.txnKind = null;
  persistAll(state.settings, state.entries, "your entries");
  showToast("Spread across "+splitDays+" days");
  render();
}

/* Mirrors handleApplyBudget: "future" appends a history entry from the start of
   this month so earlier months stay judged against what they actually had;
   "all" collapses history to a single entry. */
function handleApplyIncome(scope) {
  var el = document.getElementById("incomeDraftInput");
  var v = el ? parseFloat(el.value) : NaN;
  if (isNaN(v) || v < 0) return;
  var mode = "monthly"; // income is entered monthly only; legacy daily-mode history still reads correctly
  var monthStart = toStr(startOfMonth(new Date()));
  var hist = (state.settings.incomeHistory || []).slice();
  var label;

  if (scope === "all") {
    hist = [{ from: "1900-01-01", mode: mode, amount: v }];
    label = "Income applied to all periods";
  } else {
    /* On the first forward-only change, preserve whatever income was configured
       before this month as a baseline. Without this, the new record becomes
       hist[0] and can be mistaken for historical income by older app versions. */
    if (!hist.length) {
      hist.push({
        from: "1900-01-01",
        mode: state.settings.incomeMode || "monthly",
        amount: Number(state.settings.incomeAmount) || 0
      });
    }
    hist.push({ from: monthStart, mode: mode, amount: v });
    label = "Income applied from this month onward";
  }
  hist = normalizeIncomeHistory(hist);

  var nextSettings = Object.assign({}, state.settings, {
    incomeHistory: hist,
    incomeMode: mode,
    incomeAmount: v
  });
  persistAll(nextSettings, state.entries, "your income");
  state.incomeDraftMode = null;
  state.incomeDraftAmount = null;
  state.showSettings = false;
  showToast(label);
  render();
}

function handleApplyBudget(scope) {
  var wEl = document.getElementById("weeklyDraftInput");
  var v = wEl ? parseFloat(wEl.value) : NaN;
  if (isNaN(v) || v <= 0) return;
  var newDaily = v / 7;
  var wk = getPeriodBounds("week", 0, v, newDaily);
  var hist = (state.settings.rateHistory || []).slice();
  var nextEntries = Object.assign({}, state.entries);
  var label;

  function rewriteLoggedFrom(fromStr, toStr_) {
    Object.keys(nextEntries).forEach(function(d){
      if (d >= fromStr && (!toStr_ || d <= toStr_)) {
        nextEntries[d] = Object.assign({}, nextEntries[d], { allowance: newDaily });
      }
    });
  }

  if (scope === "all") {
    hist = [{ from: "1900-01-01", weeklyTarget: v }];
    rewriteLoggedFrom("1900-01-01", null);
    label = "Applied to all periods";
  } else if (scope === "future") {
    hist.push({ from: wk.startStr, weeklyTarget: v });
    rewriteLoggedFrom(wk.startStr, null);
    label = "Applied from this week onward";
  } else { // thisPeriod
    var prevRate = rateForDate(wk.startStr);
    var dayAfter = toStr(addDays(parseD(wk.endStr), 1));
    hist.push({ from: wk.startStr, weeklyTarget: v });
    hist.push({ from: dayAfter, weeklyTarget: prevRate });
    rewriteLoggedFrom(wk.startStr, wk.endStr);
    label = "Applied to this week only";
  }

  hist = normalizeRateHistory(hist);
  var nextSettings = Object.assign({}, state.settings, { rateHistory: hist });
  nextSettings.weeklyTarget = (function(){
    var r = hist[0].weeklyTarget, t = todayStr();
    for (var i=0;i<hist.length;i++){ if (hist[i].from <= t) r = hist[i].weeklyTarget; else break; }
    return r;
  })();
  persistAll(nextSettings, nextEntries, "your budget");
  state.showSettings = false;
  showToast(label);
  render();
}

/* Brings up the number pad the instant the Add/Edit sheet opens, so the
   person can start typing the amount without an extra tap. preventScroll
   stops iOS's own "scroll the focused field into view" behavior, which would
   otherwise fight the body scroll lock the moment the keyboard opens — the
   modal already handles its own scrolling via .modal-card. The extra
   updateVisualViewportOffset calls make sure --vvb (which the modal backdrop
   now uses to stay above the keyboard) catches up promptly, rather than
   waiting on the visualViewport "resize" event, which can lag the keyboard's
   slide-in animation by a beat on iOS. */
function focusAmountInput() {
  var el = document.getElementById("entryAmountInput");
  if (!el) return;
  try { el.focus({ preventScroll: true }); }
  catch(e) { try { el.focus(); } catch(e2) {} }
  if (typeof updateVisualViewportOffset === "function") {
    updateVisualViewportOffset();
    setTimeout(updateVisualViewportOffset, 60);
    setTimeout(updateVisualViewportOffset, 250);
    setTimeout(updateVisualViewportOffset, 400);
  }
}

function showToast(msg) {
  state.toastMessage = msg;
  setTimeout(function(){ state.toastMessage = null; render(); }, 2200);
}

function handleEditTxn(date, id) {
  state.entryDate = date;
  state.editingItemId = id;
  state.editingOriginalDate = date;
  state.showAddTxn = true;
  state.pendingDeleteKey = null;
  state.txnSplitMode = "single";
  state.txnKind = null;
  state.txnCategoryGroup = null;
  state.entryAmountDraft = null;
  state.entryNoteDraft = null;
  state.entrySplitDaysDraft = null;
  state.entryPersonSplitDraft = null;
  state.entryCategoryDraft = null;
  state.entryPersonDraft = null;
  var editDay = state.entries[date];
  var editItem = editDay ? editDay.items.find(function(i){ return i.id === id; }) : null;
  state.txnPersonSplitMode = (editItem && editItem.personSplit && editItem.personSplit.length) ? "split" : "single";
  render();
