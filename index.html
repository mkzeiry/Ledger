/* Resolves the Analysis page's selected period. week/month/year are navigable
   via analysisOffset (0 = current, -1 = previous, …), reusing getPeriodBounds so
   titles and bounds match the Home page exactly. custom uses explicit dates. */
/* Same shape as getAnalysisPeriodInfo, for the Transactions page's filter —
   kept separate since Transactions also offers "all time" (a real list of
   everything ever logged), which doesn't make sense for Analysis's charts. */
function getTxnPeriodInfo() {
  var today = todayStr();
  var mode = state.txnPeriodMode || "all";
  var off = state.txnOffset || 0;
  var entryDatesAll = Object.keys(state.entries).sort();
  var naturalStart = entryDatesAll.length ? entryDatesAll[0] : today;
  if (mode === "all") {
    /* "All time" must mean all of it: if any logged entry falls after today
       (e.g. a recurring/split plan that caught up while the device clock was
       ahead, or any other edge case), the upper bound has to stretch to
       cover it too — otherwise this view silently drops entries that Week/
       Month (which use real calendar bounds, not an artificial "up to
       today" cap) would still show, which is exactly the inconsistency that
       made deleted-but-orphaned split entries "disappear" from All while
       still appearing under Week. */
    var latestEntryDate = entryDatesAll.length ? entryDatesAll[entryDatesAll.length-1] : today;
    var endAll = latestEntryDate > today ? latestEntryDate : today;
    return { start: naturalStart, end: endAll, title: "All time", sub: "", isCurrent: true, mode: mode };
  }
  if (mode === "custom") {
    var from = state.txnPeriodFrom || naturalStart;
    var to = state.txnPeriodTo || today;
    if (from > to) { var swap = from; from = to; to = swap; }
    return { start: from, end: to, title: shortLabel(from)+" – "+shortLabel(to), sub: "Custom range", isCurrent: true, mode: mode };
  }
  var per = getPeriodBounds(mode, off, currentWeeklyTarget(), dailyAllowance());
  return { start: per.startStr, end: per.endStr, title: per.title, sub: per.sub, isCurrent: off === 0, mode: mode };
}

function getAnalysisPeriodInfo() {
  var today = todayStr();
  var mode = state.analysisPeriodMode || "month";
  var off = state.analysisOffset || 0;
  if (mode === "custom") {
    var entryDatesAll = Object.keys(state.entries).sort();
    var fallbackStart = entryDatesAll.length ? entryDatesAll[0] : today;
    var from = state.analysisPeriodFrom || fallbackStart;
    var to = state.analysisPeriodTo || today;
    if (from > to) { var swap = from; from = to; to = swap; }
    return { start: from, end: to, title: shortLabel(from)+" – "+shortLabel(to), sub: "Custom range", isCurrent: true, mode: mode, days: daysBetween(from,to)+1 };
  }
  var per = getPeriodBounds(mode, off, currentWeeklyTarget(), dailyAllowance());
  return { start: per.startStr, end: per.endStr, title: per.title, sub: per.sub, isCurrent: off === 0, mode: mode, days: per.days };
}

/* Week/month are short enough to read day-by-day; a year would be 365 bars, so
   it rolls up to months. Custom ranges switch over at roughly two months. */
function analysisGranularity(info) {
  if (info.mode === "year") return "month";
  if (info.mode === "custom") return daysBetween(info.start, info.end) > 62 ? "month" : "day";
  return "day";
}

/* Collapses periodStats rows into chart buckets at the chosen granularity.
   Monthly buckets sum both spend and allowance, so a bucket's own target stays
   correct even when months differ in length. */
/* Whether a transaction item counts as belonging to a given person filter
   value — matches either the single-person field or, for a percentage
   split, anyone included in it (even at a partial share). Shared by the
   Transactions page filter and Analysis's person breakdown so the two
   pages can't define "belongs to this person" differently. Accepts either
   sentinel spelling for the "no one assigned" bucket, since Transactions'
   dropdown uses "__unassigned__" while Analysis's pie slice is labelled
   "Unassigned". */
function itemMatchesPersonFilter(it, filterValue) {
  if (!filterValue) return true;
  if (filterValue === "__unassigned__" || filterValue === "Unassigned") {
    return !it.person && (!it.personSplit || !it.personSplit.length);
  }
  if (it.personSplit && it.personSplit.length) return it.personSplit.some(function(ps){ return ps.person===filterValue; });
  return it.person === filterValue;
}

/* Whether an item falls within the current category-level scope: a specific
   leaf category filter wins if set (most specific); otherwise a drilled-into
   group applies (browsing "Food & Drinks" without having picked one of its
   categories yet still narrows to that group); otherwise unscoped. Shared by
   every section that reads the page's "current category scope" — the bar
   charts, day-of-week, biggest transactions, and the person breakdown's own
   aggregation — so drilling into a group filters the whole page the same
   way picking a specific category already does, not just the category
   section's own pie. */
function itemMatchesCategoryScope(it, catFilter, groupFilter) {
  if (catFilter) return (it.category || "Uncategorised") === catFilter;
  if (groupFilter === "Ungrouped") return !categoryGroupOf(it.category);
  if (groupFilter) return categoryGroupOf(it.category) === groupFilter;
  return true;
}

/* One definition of an expense that belongs in Analysis for the active basis.
   Budget mode excludes categories explicitly marked outside the budget; income
   mode is cash-flow oriented and therefore includes every real expense. */
function itemCountsForAnalysis(it) { return isExpenseItem(it); }

/* The amount to attribute to the current person-filter scope for a given
   item. A person filter matching a split transaction only means that person
   holds SOME share of it — every sum built on top of that boolean match was
   adding the item's FULL amount regardless of share, so a 100 AED purchase
   split 30/70 was counted as a full 100 AED for BOTH people, inflating any
   person-filtered total by everyone else's share too. This returns the
   correct prorated amount: the person's own share when the item is split,
   the full amount for an unsplit item (nothing to prorate), and the full
   amount when there's no active person filter at all (nothing to scope by). */
function personScopedAmount(it, personFilter) {
  if (!personFilter || !it.personSplit || !it.personSplit.length) return it.amount;
  return it.personSplit
    .filter(function(ps){ return ps.person === personFilter; })
    .reduce(function(t,ps){ return t + round2(it.amount * ps.pct/100); }, 0);
}

function buildAnalysisBuckets(rows, granularity, catFilter, personFilter, groupFilter) {
  function keep(it){
    return itemCountsForAnalysis(it) && itemMatchesCategoryScope(it, catFilter, groupFilter) && itemMatchesPersonFilter(it, personFilter);
  }
  function spentOf(r){
    if (!catFilter && !personFilter && !groupFilter) return r.spent;
    return (r.items||[]).reduce(function(t,it){ return keep(it) ? t+personScopedAmount(it, personFilter) : t; }, 0);
  }
  if (granularity !== "month") {
    return rows.map(function(r){
      return { key: r.date, label: shortLabel(r.date), title: dayLabel(r.date), date: r.date,
               dates: [r.date], spent: spentOf(r), allowance: r.allowance, days: 1 };
    });
  }
  var map = {}, order = [];
  rows.forEach(function(r){
    var key = r.date.slice(0,7);
    if (!map[key]) {
      map[key] = { key: key, label: parseD(r.date).toLocaleDateString("en-GB",{month:"short"}),
                   title: parseD(r.date).toLocaleDateString("en-GB",{month:"long",year:"numeric"}),
                   date: r.date, dates: [], spent: 0, allowance: 0, days: 0 };
      order.push(key);
    }
    map[key].spent += spentOf(r);
    map[key].allowance += r.allowance;
    map[key].days += 1;
    map[key].dates.push(r.date);
  });
  return order.map(function(k){ return map[k]; });
}

/* Total already logged by a rule so far — summed per-occurrence rather than
   multiplied, since a split's final day carries a different (remainder)
   amount than the rest. */
function ruleLoggedAmount(rule) {
  var sum = 0;
  for (var i=0; i<(rule.occurrencesLogged||0); i++) sum += ruleOccurrenceAmount(rule, i);
  return round2(sum);
}

function renderPlansBody() {
  var rules = state.settings.recurringRules || [];
  var today = todayStr();
  var horizon = toStr(addDays(parseD(today), 30));
  var activeRules = rules.filter(function(r){ return !ruleIsComplete(r) && r.active; });
  var pausedRules = rules.filter(function(r){ return !ruleIsComplete(r) && !r.active; });
  var doneRules = rules.filter(function(r){ return ruleIsComplete(r); });

  function nextOccurrence(rule) {
    if (!rule.active || ruleIsComplete(rule)) return null;
    var n = rule.occurrencesLogged || 0;
    if (rule.occurrencesTotal != null && n >= rule.occurrencesTotal) return null;
    var due = recurringOccurrenceDate(rule, n);
    if (rule.endDate && due > rule.endDate) return null;
    return { rule:rule, due:due, amount:ruleOccurrenceAmount(rule,n) };
  }
  function next30Totals() {
    var expense=0, income=0;
    activeRules.forEach(function(rule){
      var n=rule.occurrencesLogged||0, guard=0;
      while(guard<60) {
        if(rule.occurrencesTotal!=null && n>=rule.occurrencesTotal) break;
        var due=recurringOccurrenceDate(rule,n);
        if(due>horizon || (rule.endDate && due>rule.endDate)) break;
        if(due>=today) {
          var amt=ruleOccurrenceAmount(rule,n);
          if(rule.entryKind==='income') income+=amt; else expense+=amt;
        }
        n++; guard++;
      }
    });
    return {expense:round2(expense),income:round2(income)};
  }
  function relativeDue(ds) {
    var n=daysBetween(today,ds);
    if(n===0) return 'Today';
    if(n===1) return 'Tomorrow';
    if(n<7) return parseD(ds).toLocaleDateString('en-GB',{weekday:'long'});
    return shortLabel(ds);

/* ---------------- actions ---------------- */
function handleAddTransaction() {
  var dateEl = document.getElementById("entryDateInput");
  var amtEl = document.getElementById("entryAmountInput");
  var noteEl = document.getElementById("entryNoteInput");
  var catEl = document.getElementById("entryCategoryInput");
  var date = dateEl ? dateEl.value : todayStr();
  var timeEl = document.getElementById("entryTimeInput");
  var txnTime = timeEl ? timeEl.value : "";
  var originalAmt = parseFloat(amtEl ? amtEl.value : "");
  if (isNaN(originalAmt) || originalAmt < 0 || !date) return;
  var currencyEl = document.getElementById("entryCurrencyInput");
  var fxRateEl = document.getElementById("entryFxRateInput");
  var fxSourceEl = document.getElementById("entryFxSourceInput");
  var currency = currencyEl ? (currencyEl.value||reportingCurrency()) : reportingCurrency();
  var displayFxRate = currency===reportingCurrency() ? 1 : parseFloat(fxRateEl ? fxRateEl.value : "");
  if (currency!==reportingCurrency() && (!(displayFxRate>0))) { showToast("Add or refresh the exchange rate"); return; }
  /* The form rate is source → reporting currency. Convert that result back to
     the internal AED ledger so changing base currency never mutates history. */
  var reportAmount = currency===reportingCurrency() ? originalAmt : originalAmt*displayFxRate;
  var amt = round2(fromReporting(reportAmount));
  var canonicalFxRate = currency===STORAGE_CURRENCY ? 1 : (amt/originalAmt);
  var fxSource = currency===reportingCurrency() ? "Base currency" : ((fxSourceEl&&fxSourceEl.value)||"Manual");
  var fxMeta = currency===STORAGE_CURRENCY ? { currency:STORAGE_CURRENCY } : { currency:currency, originalAmount:originalAmt, fxRate:canonicalFxRate, fxSource:fxSource, fxDate:date };
  var note = noteEl ? noteEl.value.trim() : "";
  var category = catEl ? catEl.value : "";

  var person = "";
  var personSplit = null;
  var peopleForSave = state.settings.people||[];
  var personSplitModeActive = peopleForSave.length >= 2 && state.txnPersonSplitMode === "split";
  if (personSplitModeActive) {
    var pctSelects = document.querySelectorAll(".split-person-pct");
    var splitEntries = [];
    var totalPct = 0;
    pctSelects.forEach(function(s){
      var pct = parseInt(s.value,10)||0;
      totalPct += pct;
      if (pct > 0) splitEntries.push({ person: s.dataset.person, pct: pct });
    });
    if (totalPct !== 100) { showToast("Split must add up to 100%"); return; }
    personSplit = splitEntries;
  } else {
    var personEl = document.getElementById("entryPersonInput");
    person = personEl ? personEl.value : "";
  }
  var wasEditing = !!(state.editingItemId && state.editingOriginalDate);
  var origItemForKind = null;
  if (wasEditing) {
    var origDayForKind = state.entries[state.editingOriginalDate];
    if (origDayForKind) origItemForKind = origDayForKind.items.find(function(i){ return i.id === state.editingItemId; }) || null;
  }
  var kind = state.txnKind != null ? state.txnKind : (origItemForKind && origItemForKind.kind==="income" ? "income" : "expense");
  var tags = state.entryTagsDraft != null ? normalizeItemTags(state.entryTagsDraft) : normalizeItemTags(origItemForKind && origItemForKind.tags);
  if (kind === "income") category = ""; // income doesn't use the expense category system

  if (!wasEditing && state.txnSplitMode === "split" && kind === "expense") {
    var splitDaysEl = document.getElementById("splitDaysInput");
    var splitDays = parseInt(splitDaysEl ? splitDaysEl.value : "", 10);
    if (isNaN(splitDays) || splitDays < 2) return;
    handleAddSplitTransaction(date, amt, category, note, splitDays, person, personSplit, fxMeta, tags);
    return;
  }

  var txnCloseVisual = captureTxnVisual();
  var nextEntries = Object.assign({}, state.entries);

  if (wasEditing) {
    var origDate = state.editingOriginalDate;
    var origDay = nextEntries[origDate];
    if (origDay) {
      var remaining = origDay.items.filter(function(i){ return i.id !== state.editingItemId; });
      if (remaining.length === 0) delete nextEntries[origDate];
      else nextEntries[origDate] = Object.assign({}, origDay, { items: remaining });
    }
    /* Preserve recurringId/seq metadata when editing an occurrence so deleting
       its plan later can still find and remove that occurrence. */
    var updatedItem = Object.assign({}, origItemForKind || {}, fxMeta, { id: state.editingItemId, amount: amt, note: note, category: category, person: person, personSplit: personSplit, kind: kind, time: txnTime||undefined, tags:tags });
    if(!txnTime) delete updatedItem.time;
    if(!tags.length) delete updatedItem.tags;
    if (currency===STORAGE_CURRENCY) { delete updatedItem.originalAmount; delete updatedItem.fxRate; delete updatedItem.fxDate; updatedItem.fxSource="Base currency"; }
    var destDay = nextEntries[date];
    var nextDest = destDay ? Object.assign({}, destDay, { items: destDay.items.concat([updatedItem]) }) : { allowance: allowanceForDate(date), items: [updatedItem] };
    nextEntries[date] = nextDest;
    state.editingItemId = null;
    state.editingOriginalDate = null;
    state.showAddTxn = false;
    state.txnEntryRestoreScroll = true;
  } else {
    var existing = nextEntries[date];
    var newItem = Object.assign({ id: Date.now()+"-"+Math.random().toString(36).slice(2,7), amount: amt, note: note, category: category, person: person, personSplit: personSplit, kind: kind, time: txnTime||undefined, tags:tags }, fxMeta);
    if(!txnTime) delete newItem.time;
    if(!tags.length) delete newItem.tags;
    nextEntries[date] = existing ? Object.assign({}, existing, { items: existing.items.concat([newItem]) }) : { allowance: allowanceForDate(date), items: [newItem] };
    state.showAddTxn = false;
    state.txnEntryRestoreScroll = true;
  }

  state.entryDate = date;
  state.entryTagsDraft = null;
  persistAll(state.settings, nextEntries, "your entry");
  showToast(wasEditing ? "Record updated" : "Record added");
  render();
  animateTxnCommittedBack(txnCloseVisual);
}

/* Spreads one total across N consecutive days running FORWARD from the chosen
   date, as a tracked plan rather than a pile of pre-written entries. Days that
   have already passed get logged immediately by the shared catch-up engine;
   days still to come are logged as each arrives — which is what makes "how
   much is left / what's coming up" answerable at all. Per-day share is
   floor-rounded with the final day absorbing the leftover cents, so the days
   read evenly while the total stays exact. */
function handleAddSplitTransaction(startDate, totalAmount, category, note, splitDays, person, personSplit, fxMeta, tags) {
  var txnCloseVisual = captureTxnVisual();
  var perDayFloor = Math.floor((totalAmount/splitDays)*100)/100;
  var newRule = {
    id: Date.now()+"-"+Math.random().toString(36).slice(2,7),
    kind: "split",
    amount: perDayFloor,
    splitTotal: totalAmount,
    category: category,
    note: note,
    person: person||"",
    personSplit: personSplit||null,
    tags: normalizeItemTags(tags),
    frequency: "daily",
    startDate: startDate,
    endDate: null,
    occurrencesTotal: splitDays,
    occurrencesLogged: 0,
    active: true,
    currency: fxMeta&&fxMeta.currency ? fxMeta.currency : BASE_CURRENCY,
    fxRate: fxMeta&&fxMeta.fxRate ? fxMeta.fxRate : undefined,
    fxSource: fxMeta&&fxMeta.fxSource ? fxMeta.fxSource : undefined,
    fxDate: fxMeta&&fxMeta.fxDate ? fxMeta.fxDate : undefined
  };
  state.settings = Object.assign({}, state.settings, { recurringRules: (state.settings.recurringRules||[]).concat([newRule]) });
  runRecurringCatchUp();
  state.entryDate = startDate;
  state.showAddTxn = false;
  state.txnEntryRestoreScroll = true;
  state.txnSplitMode = "single";
  state.txnKind = null;
  state.entryTagsDraft = null;
  persistAll(state.settings, state.entries, "your entries");
  showToast("Spread across "+splitDays+" days");
  render();
  animateTxnCommittedBack(txnCloseVisual);
}

/* Mirrors handleApplyBudget: "future" appends a history entry from the start of
   this month so earlier months stay judged against what they actually had;
   "all" collapses history to a single entry. */
function handleApplyIncome(scope) {
  var el = document.getElementById("incomeDraftInput");
  var v = el ? parseFloat(el.value) : NaN;
  if (isNaN(v) || v < 0) return;
  var mode = "monthly"; // income is entered monthly only; legacy daily-mode history still reads correctly
  var monthStart = toStr(startOfMonth(new Date()));
  var hist = (state.settings.incomeHistory || []).slice();
  var label;

  if (scope === "all") {
    hist = [{ from: "1900-01-01", mode: mode, amount: v }];
    label = "Income applied to all periods";
  } else {
    /* On the first forward-only change, preserve whatever income was configured
       before this month as a baseline. Without this, the new record becomes
       hist[0] and can be mistaken for historical income by older app versions. */
    if (!hist.length) {
      hist.push({
        from: "1900-01-01",
        mode: state.settings.incomeMode || "monthly",
        amount: Number(state.settings.incomeAmount) || 0
      });
    }
    hist.push({ from: monthStart, mode: mode, amount: v });
    label = "Income applied from this month onward";
  }
  hist = normalizeIncomeHistory(hist);

  var nextSettings = Object.assign({}, state.settings, {
    incomeHistory: hist,
    incomeMode: mode,
    incomeAmount: v
  });
  persistAll(nextSettings, state.entries, "your income");
  state.incomeDraftMode = null;
  state.incomeDraftAmount = null;
  state.showSettings = false;
  showToast(label);
  render();
}

function handleApplyBudget(scope) {
  var el = document.getElementById("monthlyDraftInput");
  var vShown = el ? parseFloat(el.value) : NaN;
  if (isNaN(vShown) || vShown <= 0) return;
  var v = fromReporting(vShown);
  var month = getPeriodBounds("month", 0, currentWeeklyTarget(), dailyAllowance());
  var hist = (state.settings.monthlyBudgetHistory || []).slice();
  var nextEntries = Object.assign({}, state.entries);
  var label;

  function budgetFromHist(histArr, ds) {
    var found=null;
    for (var i=0;i<histArr.length;i++) { if (histArr[i].from<=ds) found=histArr[i]; else break; }
    return found ? Number(found.monthlyBudget)||0 : null;
  }
  function rewriteLoggedFrom(fromStr, toStr_) {
    Object.keys(nextEntries).forEach(function(d){
      if (d >= fromStr && (!toStr_ || d <= toStr_)) {
        nextEntries[d] = Object.assign({}, nextEntries[d], { allowance: v / daysInMonth(parseD(d)) });
      }
    });
  }

  if (scope === "all") {
    hist = [{ from:"1900-01-01", monthlyBudget:v }];
    rewriteLoggedFrom("1900-01-01", null);
    label = "Monthly budget applied to all periods";
  } else {
    hist.push({ from:month.startStr, monthlyBudget:v });
    hist = normalizeMonthlyBudgetHistory(hist);
    rewriteLoggedFrom(month.startStr, null);
    label = "Monthly budget applied from this month onward";
  }
  hist = normalizeMonthlyBudgetHistory(hist);
  var nextSettings = Object.assign({}, state.settings, {
    monthlyBudgetHistory: hist,
    monthlyBudget: v,
    /* Keep a compatible weekly equivalent for older versions/backups. */
    weeklyTarget: (v / daysInMonth(new Date())) * 7
  });
  persistAll(nextSettings, nextEntries, "your budget");
  showToast(label);
  render();
}

/* render() rebuilds the whole DOM from scratch on every call, including
   whatever's currently on screen in the Add Transaction sheet — so any
   in-place toggle within that sheet (day-split mode, person-split mode,
   category group) needs to stash the sheet's current values into state
   first, or they'd silently reset the moment the toggle re-renders it.
   Called at the top of every such toggle handler, before it touches other
   state and calls render(). */
/* Same root cause as preserveTxnFormDraft, same fix: the Add Recurring
   Payment form's fields have no draft state of their own, so toggling the
   limit-mode segmented control (or pausing/deleting a DIFFERENT rule on the
   same page) rebuilds the DOM and silently erases whatever's been typed
   into this form. Called before any such action mutates state and renders. */
function preserveRecurringFormDraft() {
  var pairs = [
    ["recurringAmountInput","recurringAmountDraft"],
    ["recurringCategoryInput","recurringCategoryDraft"],
    ["recurringPersonInput","recurringPersonDraft"],
    ["recurringNoteInput","recurringNoteDraft"],
    ["recurringFrequencyInput","recurringFrequencyDraft"],
    ["recurringStartDateInput","recurringStartDateDraft"],
    ["recurringCountInput","recurringCountDraft"],
    ["recurringEndDateInput","recurringEndDateDraft"]
  ];
  pairs.forEach(function(p){
    var el = document.getElementById(p[0]);
    if (el) state[p[1]] = el.value;
  });
}

function validateBackupEntries(entries) {
  if (!entries || typeof entries !== "object" || Array.isArray(entries)) return false;
  var dates = Object.keys(entries);
  for (var d=0; d<dates.length; d++) {
    var ds = dates[d];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(ds)) return false;
    var day = entries[ds];
    if (!day || typeof day !== "object" || Array.isArray(day)) return false;
    /* Legacy backups stored one numeric `spent` value instead of item rows. */
    if (!Array.isArray(day.items)) {
      if (typeof day.spent !== "number" || !isFinite(day.spent) || day.spent < 0) return false;
      continue;
    }
    for (var i=0; i<day.items.length; i++) {
      var it = day.items[i];
      if (!it || typeof it !== "object" || Array.isArray(it)) return false;
      if (typeof it.amount !== "number" || !isFinite(it.amount) || it.amount < 0) return false;
      if (it.personSplit != null) {
        if (!Array.isArray(it.personSplit)) return false;
        var pctTotal = 0;
        for (var j=0; j<it.personSplit.length; j++) {
          var ps = it.personSplit[j];
          if (!ps || typeof ps.person !== "string" || typeof ps.pct !== "number" || !isFinite(ps.pct) || ps.pct < 0 || ps.pct > 100) return false;
          pctTotal += ps.pct;
        }
        if (it.personSplit.length && Math.abs(pctTotal - 100) > 0.001) return false;
      }
    }
  }
  return true;
}

function handleRestore() {
  var el = document.getElementById("restoreInput");
  var raw = el ? el.value : "";
  try {
    var parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object" || !validateBackupEntries(parsed.entries)) throw new Error("bad shape");
    var nextSettings = Object.assign({}, DEFAULT_SETTINGS, parsed.settings||{});
    nextSettings.analysisSectionOrder = normalizeAnalysisOrder(nextSettings.analysisSectionOrder);
    nextSettings.analysisHiddenSections = normalizeHiddenSections(nextSettings.analysisHiddenSections);
    if (!nextSettings.analysisForecastV52Visible) {
      nextSettings.analysisHiddenSections = nextSettings.analysisHiddenSections.filter(function(id){ return id !== "forecastedSpend"; });
      nextSettings.analysisForecastV52Visible = true;
    }
    nextSettings.budgetSectionOrder = normalizeBudgetOrder(nextSettings.budgetSectionOrder);
    nextSettings.budgetHiddenSections = normalizeBudgetHiddenSections(nextSettings.budgetHiddenSections);
    nextSettings.homeSectionOrder = normalizeHomeOrder(nextSettings.homeSectionOrder);

  if (e.target && e.target.id === "customAccentInput") {

document.addEventListener("change", function(e) {

  }
  if (e.target && e.target.id === "entryGroupInput") {

       re-render restore it. */

    render();
    return;
  }
  if (e.target && e.target.classList && e.target.classList.contains("split-person-pct")) {

      totalEl.textContent = totalPct + "%";

    }

  }
  if (e.target && e.target.dataset && e.target.dataset.role === "category-group-select") {

    var newGroupVal = e.target.value;
    var nextGroupOf = Object.assign({}, state.settings.categoryGroupOf||{});
    if (newGroupVal) nextGroupOf[catG] = newGroupVal; else delete nextGroupOf[catG];
    persistAll(Object.assign({}, state.settings, { categoryGroupOf: nextGroupOf }), state.entries, "your settings");
    render();

  }
  if (e.target && e.target.id === "entryCurrencyInput") {
    state.entryCurrencyDraft=e.target.value;
    var fromLbl=document.getElementById("entryFxFromLabel"); if(fromLbl) fromLbl.textContent=e.target.value;
    var rateEl=document.getElementById("entryFxRateInput"), srcEl=document.getElementById("entryFxSourceInput");
    if(e.target.value===BASE_CURRENCY){ if(rateEl)rateEl.value="1"; if(srcEl)srcEl.value="Base currency"; state.entryFxRateDraft="1"; state.entryFxSourceDraft="Base currency"; }
    else { var cachedFx=readCachedFxRate(e.target.value,(document.getElementById("entryDateInput")||{}).value||todayStr()); if(cachedFx&&rateEl){rateEl.value=String(cachedFx.rate); if(srcEl)srcEl.value=cachedFx.source||"Frankfurter";} }
    var fxPanel=document.getElementById("entryFxPanel"); if(fxPanel)fxPanel.style.display=e.target.value===BASE_CURRENCY?"none":"block";
    var addBtn=document.getElementById("addTxnBtn"), amtNow=parseFloat((document.getElementById("entryAmountInput")||{}).value||""); if(addBtn&&!state.editingItemId&&!isNaN(amtNow)&&amtNow>0)addBtn.textContent="Add "+fmt(amtNow,2)+" "+e.target.value+" "+((state.txnKind||"expense")==="income"?"income":"expense");
    updateFxConvertedPreview();
    if(e.target.value!==BASE_CURRENCY) refreshEntryFxRate(false);
    return;
  }
  if (e.target && e.target.id === "entryDateInput") { handleQuickDate(e.target.value); var fxCur=document.getElementById("entryCurrencyInput"); if(fxCur&&fxCur.value!==BASE_CURRENCY) refreshEntryFxRate(false); }
  if (e.target && e.target.id === "entryTimeInput") { state.entryTimeDraft=e.target.value; }
  if (e.target && e.target.id === "entryCategoryInput" && e.target.tagName === "SELECT") { state.entryCategoryDraft = e.target.value; }
  if (e.target && e.target.id === "txnGroupFilterSelect") {
    var newTxnGroup = e.target.value;
    var curTxnCat = state.txnCategoryFilter;
    if (curTxnCat) {
      var stillBelongs = curTxnCat === "Uncategorised"
        ? (!newTxnGroup || newTxnGroup === "__ungrouped__")
        : (!newTxnGroup ? true : (newTxnGroup === "__ungrouped__" ? !categoryGroupOf(curTxnCat) : categoryGroupOf(curTxnCat) === newTxnGroup));
      if (!stillBelongs) state.txnCategoryFilter = "";

    state.txnGroupFilter = newTxnGroup;
    render();
    return;
  }
  if (e.target && e.target.id === "subcategoryParentInput") {
    var moveSub = e.target.dataset.cat;
    var moveToGroup = e.target.value || "";
    var movedOf = Object.assign({}, state.settings.categoryGroupOf||{});
    if (moveToGroup) movedOf[moveSub] = moveToGroup; else delete movedOf[moveSub];
    persistAll(Object.assign({}, state.settings, { categoryGroupOf:movedOf }), state.entries, "your categories");
    state.settingsCategorySelected = moveToGroup || "__ungrouped__";
    render();
    return;
  }
  if (e.target && e.target.id === "txnPersonFilterSelect") { state.txnPersonFilter = e.target.value; render(); }
  if (e.target && e.target.id === "txnTagFilterSelect") { state.txnTagFilter = e.target.value; render(); }
  if (e.target && e.target.id === "txnCategoryFilterSelect") { state.txnCategoryFilter = e.target.value; render(); }
  if (e.target && e.target.id === "txnPeriodFromInput") { state.txnPeriodFrom = e.target.value; render(); }
  if (e.target && e.target.id === "txnPeriodToInput") { state.txnPeriodTo = e.target.value; render(); }
  if (e.target && e.target.id === "analysisPeriodFromInput") { state.analysisPeriodFrom = e.target.value; render(); }
  if (e.target && e.target.id === "analysisPeriodToInput") { state.analysisPeriodTo = e.target.value; render(); }
  if (e.target && e.target.id === "categoryGroupColorInput") {
    var parentColorGroup = e.target.dataset.group;
    var parentColorValue = e.target.value;
    setTimeout(function(){
      var parentColorStyles = Object.assign({}, state.settings.categoryGroupStyles||{});
      var parentColorCur = categoryGroupStyle(parentColorGroup);
      parentColorStyles[parentColorGroup] = { icon:parentColorCur.icon, color:parentColorValue };
      persistAll(Object.assign({}, state.settings, { categoryGroupStyles:parentColorStyles }), state.entries, "your categories");
      render();
    },300);
  }
  if (e.target && e.target.id === "groupColorInput") {
    var groupC = e.target.dataset.group;
    var newGroupColor = e.target.value;
    // Same deferred rationale as categoryColorInput below.
    setTimeout(function() {
      var membersC = (state.settings.categories||[]).filter(function(c){ return categoryGroupOf(c)===groupC; });
      var stylesGC = Object.assign({}, state.settings.categoryStyles||{});
      membersC.forEach(function(c){
        var cur = categoryStyle(c);
        stylesGC[c] = { icon: cur.icon, color: newGroupColor };
      });
      persistAll(Object.assign({}, state.settings, { categoryStyles: stylesGC }), state.entries, "your settings");
      showToast("Color applied to "+membersC.length+" categor"+(membersC.length===1?"y":"ies"));
      render();
    }, 300);
  }
  if (e.target && e.target.classList && e.target.classList.contains("txn-tag-color-input")) {
    var tagC=e.target.dataset.tag, newTagColor=e.target.value;
    setTimeout(function(){var nextTagColors=Object.assign({},state.settings.transactionTagColors||{});nextTagColors[tagC]=newTagColor;persistAll(Object.assign({},state.settings,{transactionTagColors:nextTagColors}),state.entries,"your tags");render();},300);
    return;
  }
  if (e.target && e.target.classList && e.target.classList.contains("person-color-input")) {
    var personC = e.target.dataset.person;

    setTimeout(function() {
      var nextPersonColors = Object.assign({}, state.settings.personColors||{});
      nextPersonColors[personC] = newPersonColor;
      persistAll(Object.assign({}, state.settings, { personColors: nextPersonColors }), state.entries, "your settings");
      render();
    }, 300);
  }
  if (e.target && e.target.id === "categoryColorInput") {
    var catC = e.target.dataset.cat;
    var newColorC = e.target.value;
    /* Deferred deliberately: render() replaces the whole page's innerHTML,
       and doing that synchronously inside this handler tears out the <input>
       while iOS's native color picker sheet is still mid-close-animation —
       that DOM-teardown-under-an-active-native-picker race is what was
       crashing the page. A short delay lets the native UI finish first. */
    setTimeout(function() {
      var curC = categoryStyle(catC);
      var nextStylesC = Object.assign({}, state.settings.categoryStyles||{});
      nextStylesC[catC] = { icon: curC.icon, color: newColorC };
      persistAll(Object.assign({}, state.settings, { categoryStyles: nextStylesC }), state.entries, "your settings");
      render();
    }, 300);
  }
});

/* ---------------- init ---------------- */
var stableViewportHeight = 0;
function setViewportHeightVar() {
  var r=document.documentElement.style;
  var vv=window.visualViewport;
  var layoutH=Math.max(window.innerHeight||0, document.documentElement.clientHeight||0);
  var visualH=vv ? Math.max(0, vv.height + Math.max(0,vv.offsetTop)) : 0;
  var candidate=Math.max(layoutH, visualH);
  /* Never learn keyboard-shrunken heights. The value may grow as iOS settles
     its chrome, but it does not shrink during the session. */
  if(!keyboardFieldFocused() && candidate>stableViewportHeight) stableViewportHeight=candidate;
  r.setProperty("--vh100", layoutH + "px");
  if(stableViewportHeight>0) r.setProperty("--stable-vh", Math.round(stableViewportHeight) + "px");
}
setViewportHeightVar();
window.addEventListener("resize", setViewportHeightVar);
window.addEventListener("orientationchange", function(){ stableViewportHeight=0; setViewportHeightVar(); });
window.addEventListener("pageshow", function(){
  [0,60,180,420,900,1600].forEach(function(ms){setTimeout(function(){setViewportHeightVar();updateVisualViewportOffset();},ms);});
});
document.addEventListener("visibilitychange",function(){if(!document.hidden){setViewportHeightVar();updateVisualViewportOffset();}});

/* visualViewport tracking, for two different jobs that both need it:
   --vvb tracks the keyboard gap for modal positioning/legacy calculations.
   Primary tab navigation no longer follows that gap; it hides while the
   software keyboard is visible.
   --vvt/--vvh (top offset + height) pin the modal backdrop to the actual
   visible rectangle, top edge included — needed because iOS doesn't just
   shrink the visual viewport for the keyboard, it can also *pan* it (offsetTop
   != 0), which happens mid-gesture while scrolling inside a focused modal.
   A bottom-gap-only assumption goes wrong exactly then: as offsetTop grows,
   the --vvb formula understates the true gap, and a backdrop anchored with
   top:0 lets its bottom edge sink back down behind the keyboard even though
   the modal never closed. Anchoring top+height to the live rectangle instead
   means the backdrop tracks reality regardless of why the viewport moved. */
function keyboardFieldFocused() {
  var t=document.activeElement;
  if(!t)return false;
  if(t.tagName==='TEXTAREA')return true;
  if(t.tagName!=='INPUT')return false;
  var ty=(t.type||'text').toLowerCase();
  return ['text','search','number','tel','email','url','password','decimal'].indexOf(ty)!==-1;
}
function updateVisualViewportOffset() {
  setViewportHeightVar();
  var vv=window.visualViewport,r=document.documentElement.style;
  if(!vv){r.setProperty('--vvb','0px');r.setProperty('--vvt','0px');r.setProperty('--vvh','100dvh');r.setProperty('--vv-extra-bottom','0px');document.documentElement.classList.toggle('keyboard-open',keyboardFieldFocused());return;}
  var shrink=Math.max(0,window.innerHeight-vv.height),gap=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);
  var keyboardOpen=keyboardFieldFocused() || shrink>160 || vv.height<window.innerHeight*.76;
  var visualExtraBottom=keyboardOpen?0:Math.max(0,(vv.offsetTop+vv.height)-window.innerHeight);
  r.setProperty('--vvb',Math.round(gap)+'px');r.setProperty('--vvt',Math.max(0,Math.round(vv.offsetTop))+'px');r.setProperty('--vvh',Math.round(vv.height)+'px');r.setProperty('--vv-extra-bottom',Math.round(visualExtraBottom)+'px');
  /* offsetTop changes while Safari pans a focused page. It must NOT be used to
     decide whether the keyboard exists, otherwise the tab bar can reappear
     above the keyboard mid-scroll. Focus + viewport shrink are stable signals. */
  document.documentElement.classList.toggle('keyboard-open',keyboardOpen);
}
updateVisualViewportOffset();
if(window.visualViewport){window.visualViewport.addEventListener('resize',updateVisualViewportOffset);window.visualViewport.addEventListener('scroll',function(){var vv=window.visualViewport,r=document.documentElement.style,shrink=Math.max(0,window.innerHeight-vv.height),keyboardOpen=document.documentElement.classList.contains('keyboard-open')||keyboardFieldFocused()||shrink>160||vv.height<window.innerHeight*.76,extra=keyboardOpen?0:Math.max(0,(vv.offsetTop+vv.height)-window.innerHeight);r.setProperty('--vvb',Math.max(0,Math.round(window.innerHeight-vv.height-vv.offsetTop))+'px');r.setProperty('--vvt',Math.max(0,Math.round(vv.offsetTop))+'px');r.setProperty('--vvh',Math.round(vv.height)+'px');r.setProperty('--vv-extra-bottom',Math.round(extra)+'px');/* deliberately do not toggle keyboard-open here */});}
window.addEventListener('resize',updateVisualViewportOffset);window.addEventListener('orientationchange',updateVisualViewportOffset);setTimeout(updateVisualViewportOffset,300);setTimeout(updateVisualViewportOffset,1000);
document.addEventListener('focusin',function(e){var t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))document.documentElement.classList.add('keyboard-open');[30,120,260,420].forEach(function(ms){setTimeout(updateVisualViewportOffset,ms);});});
document.addEventListener('focusout',function(){[50,180,350,500].forEach(function(ms){setTimeout(updateVisualViewportOffset,ms);});});
loadInitial();
render();
</script>
