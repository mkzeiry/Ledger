  if (state.editingItemId && state.editingOriginalDate) {
    var origDay = state.entries[state.editingOriginalDate];
    if (origDay) editingItem = origDay.items.find(function(i){ return i.id === state.editingItemId; }) || null;
  }
  var formDate = state.entryDate || todayStr();
  var todayEntry = state.entries[formDate];
  var cats = state.settings.categories || [];

  var h = '<div class="modal-backdrop" data-action="close-add-txn">';
  h += '<div class="modal-card" data-action="noop">';
  h += '<div class="row between" style="margin-bottom:16px;"><div class="display" style="font-size:18px;">'+(editingItem?"Edit transaction":"Add transaction")+'</div><button data-action="close-add-txn" style="background:none;border:none;color:var(--text-muted);">'+ICONS.x+'</button></div>';
  h += '<input id="entryDateInput" type="date" class="field mono" style="margin-bottom:8px;" value="'+formDate+'" max="'+todayStr()+'" />';
  h += '<div style="position:relative; margin-bottom:8px;"><span class="muted" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:14px; pointer-events:none;">AED</span>';
  h += '<input id="entryAmountInput" type="number" inputmode="decimal" step="0.01" min="0" class="field mono" style="padding-left:44px;" placeholder="Amount" value="'+(editingItem?editingItem.amount:"")+'" /></div>';
  h += '<select id="entryCategoryInput" class="field" style="margin-bottom:8px;">';
  h += '<option value="">No category</option>';
  cats.forEach(function(c){
    h += '<option value="'+esc(c)+'"'+(editingItem && editingItem.category===c?" selected":"")+'>'+esc(c)+'</option>';
  });
  h += '</select>';
  h += '<input id="entryNoteInput" type="text" class="field" style="margin-bottom:12px;" placeholder="What was it for? (optional)" value="'+(editingItem?esc(editingItem.note||""):"")+'" />';
  h += '<button id="addTxnBtn" data-action="add-transaction" class="btn-accent row gap2" style="width:100%; justify-content:center; align-items:center;">'+(editingItem?ICONS.check+" Save":ICONS.plus+" Add")+'</button>';
  h += '<div id="entryHint" class="muted" style="font-size:11px; margin-top:8px;">'+(todayEntry && !editingItem ? (esc(dayLabel(formDate))+" so far: "+todayEntry.items.length+" transaction"+(todayEntry.items.length===1?"":"s")+", "+fmt(sumSpent(todayEntry),2)+" AED total.") : "")+'</div>';
  h += '</div></div>';
  return h;
}

function renderFab() {
  return '<button data-action="open-add-txn" aria-label="Add transaction" style="position:fixed; right:calc(env(safe-area-inset-right,0px) + 18px); bottom:calc(var(--vvb, 0px) + env(safe-area-inset-bottom,0px) + 78px); width:52px; height:52px; border-radius:999px; background:var(--accent); color:var(--accent-ink); border:none; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(0,0,0,0.35); z-index:45;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>';
}

function renderTransactionsBody() {
  var entryDates = Object.keys(state.entries).sort();
  var cumAnchor = state.settings.trackingStartDate || (entryDates.length ? entryDates[0] : todayStr());
  var cs = periodStats(cumAnchor, todayStr());
  var acc = 0;
  var balanceMap = {};
  cs.rows.forEach(function(r){ acc = round2(acc + (r.allowance-r.spent)); balanceMap[r.date] = acc; });

  var filter = state.txnCategoryFilter || "";
  function itemCat(it){ return it.category || "Uncategorised"; }

  var filterOptions = (state.settings.categories||[]).slice();
  filterOptions.push("Uncategorised");

  var filterCount = 0, filterSum = 0;
  entryDates.forEach(function(d){
    state.entries[d].items.forEach(function(it){
      if (!filter || itemCat(it) === filter) { filterCount++; filterSum += it.amount; }
    });
  });

  var h = '<div class="card" style="overflow:hidden; margin-bottom:16px;">';
  h += '<div class="eyebrow" style="padding:16px 16px 4px;">All transactions</div>';
  h += '<div class="muted" style="font-size:11px; padding:0 16px 12px;">Balance is a running total — days between entries you didn\'t log still count, assumed fully saved.</div>';
  h += '<div style="padding:0 16px 12px;"><select id="txnCategoryFilterSelect" class="field" style="font-size:13px;">';
  h += '<option value=""'+(filter===""?" selected":"")+'>All categories</option>';
  filterOptions.forEach(function(c){
    h += '<option value="'+esc(c)+'"'+(filter===c?" selected":"")+'>'+esc(c)+'</option>';
  });
  h += '</select></div>';
  if (filter) {
    h += '<div class="muted" style="font-size:11px; padding:0 16px 12px;">'+filterCount+' transaction'+(filterCount===1?"":"s")+' · '+fmt(filterSum,2)+' AED total in '+esc(filter)+'</div>';
  }

  var datesDesc = entryDates.slice().reverse();
  var dates = filter ? datesDesc.filter(function(d){
    return state.entries[d].items.some(function(it){ return itemCat(it) === filter; });
  }) : datesDesc;

  if (dates.length === 0) {
    h += '<div class="muted" style="padding:0 16px 20px; font-size:14px;">'+(filter ? "No transactions in "+esc(filter)+"." : "Nothing logged yet.")+'</div>';
  } else {
    dates.forEach(function(date, i){
      var day = state.entries[date];
      var spent = sumSpent(day);
      var delta = day.allowance - spent;
      var bal = balanceMap[date];
      var displayItems = filter ? day.items.filter(function(it){ return itemCat(it) === filter; }) : day.items;
      h += '<div style="padding:12px 16px;'+(i===0?"":"border-top:1px solid var(--hairline);")+'">';
      h += '<div class="row between">';
      h += '<div><div style="font-size:14px;">'+esc(dayLabel(date))+'</div>';
      h += '<div class="mono muted" style="font-size:11px; margin-top:2px;">'+day.items.length+' txn'+(day.items.length===1?"":"s")+' · spent '+fmt(spent,2)+' of '+fmt(day.allowance,2)+(filter?' · '+displayItems.length+' match'+(displayItems.length===1?"":"es"):"")+'</div></div>';
      h += '<div style="text-align:right;"><div class="mono" style="font-size:12px; color:'+(delta>=0?"var(--positive)":"var(--rust)")+';">'+(delta>=0?"+":"−")+fmt(Math.abs(delta),2)+'</div>';
      h += '<div class="mono muted" style="font-size:10px;">bal '+fmt(bal,0)+'</div></div>';
      h += '</div>';
      h += '<div style="margin-top:4px;">';
      newestFirst(displayItems).forEach(function(it){
        h += renderTxnRow(date, it);
      });
      h += '</div></div>';
      if (!filter && i < dates.length - 1) {
        var gapDays = daysBetween(dates[i+1], date) - 1;
        if (gapDays > 0) {
          var gapAmount = round2(gapDays * dailyAllowance());
          h += '<div style="padding:6px 16px; text-align:center; font-size:10px; color:var(--text-muted); background:var(--raised); border-top:1px solid var(--hairline); border-bottom:1px solid var(--hairline);">'+gapDays+' unlogged day'+(gapDays===1?"":"s")+' in between · assumed +'+fmt(gapAmount,0)+' AED saved</div>';
        }
      }
    });
  }
  h += '</div>';
  h += '<div style="text-align:center; margin-bottom:16px;"><button data-action="open-reset" style="background:none;border:none;padding:0;color:var(--text-muted);font-size:11px;">Clear all entries</button></div>';
  return h;
}

function legendSwatch(bg, label, fg) {
  return '<div class="row" style="align-items:center; gap:5px;"><span style="width:10px; height:10px; border-radius:3px; background:'+bg+'; display:inline-block;"></span><span style="font-size:10px; color:'+(fg||"var(--text-muted)")+';">'+esc(label)+'</span></div>';
}

/* Shared transaction-row renderer used by both the Transactions page and the
   Calendar day-detail panel, so the two never visually drift apart. */
function renderTxnRow(date, it) {
  var key = date+"|"+it.id;
  if (state.pendingDeleteKey === key) {
    return '<div class="row between" style="background:var(--rust-wash); border-radius:8px; padding:8px 10px; margin-bottom:2px;">'
      + '<span style="font-size:12px;">Delete this?</span>'
      + '<div class="row gap2"><button data-action="delete-txn" data-date="'+date+'" data-id="'+esc(it.id)+'" style="background:var(--rust);border:none;border-radius:5px;padding:4px;color:#fff;" aria-label="Confirm delete">'+ICONS.check+'</button>'
      + '<button data-action="cancel-delete-txn" style="background:none;border:1px solid var(--hairline);border-radius:5px;padding:4px;color:var(--text-muted);" aria-label="Cancel">'+ICONS.x+'</button></div></div>';
  }
  var h = '<div class="row" style="align-items:center; gap:10px; padding:6px 0; margin-bottom:2px;">';
  h += '<button data-action="edit-txn" data-date="'+date+'" data-id="'+esc(it.id)+'" style="background:none;border:none;padding:0;flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;">';
  h += catIconCircle(it.category);
  h += '<span style="min-width:0; flex:1;">';
  h += '<div style="font-size:13px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">'+(it.category?esc(it.category):"Spent")+'</div>';
  if (it.note) h += '<div class="muted" style="font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">'+esc(it.note)+'</div>';
  h += '</span></button>';
  h += '<div class="mono" style="font-size:13px; font-weight:600; color:var(--rust); flex-shrink:0;">−'+fmt(it.amount,2)+' AED</div>';
  h += '<button data-action="ask-delete-txn" data-date="'+date+'" data-id="'+esc(it.id)+'" style="background:none;border:none;padding:4px;color:var(--text-muted);flex-shrink:0;" aria-label="Delete">'+ICONS.trash+'</button>';
  h += '</div>';
  return h;
}

function renderCalendarBody() {
  var base = addMonths(startOfMonth(new Date()), state.calendarOffset);
  var monthStartStr = toStr(base);
  var monthEndStr = toStr(endOfMonth(base));
  var title = base.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
  var da = dailyAllowance();
  var today = todayStr();
  var tsd = state.settings.trackingStartDate;

  var entryDatesAll = Object.keys(state.entries).sort();
  var cumAnchor = tsd || (entryDatesAll.length ? entryDatesAll[0] : today);
  var csAll = periodStats(cumAnchor, today);
  var accAll = 0;
  var balMap = {};
  csAll.rows.forEach(function(r){ accAll = round2(accAll + (r.allowance-r.spent)); balMap[r.date] = accAll; });

  var h = "";
  h += '<div class="card" style="padding:14px; margin-bottom:12px;">';
  h += '<div class="row between" style="margin-bottom:12px;">';
  h += '<button data-action="cal-nav" data-delta="-1" class="icon-btn" style="border-radius:10px;" aria-label="Previous month">'+ICONS.chevronLeft+'</button>';
  h += '<div style="font-size:15px; font-weight:500;">'+esc(title)+'</div>';
  h += '<button data-action="cal-nav" data-delta="1" class="icon-btn" style="border-radius:10px;'+(state.calendarOffset>=0?"opacity:0.3;pointer-events:none;":"")+'" aria-label="Next month">'+ICONS.chevronRight+'</button>';
  h += '</div>';

  h += '<div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:6px;">';
  ["Mo","Tu","We","Th","Fr","Sa","Su"].forEach(function(lbl){ h += '<div class="muted" style="text-align:center; font-size:10px;">'+lbl+'</div>'; });
  h += '</div>';

  var firstDow = base.getDay();
  var leadingBlanks = firstDow===0 ? 6 : firstDow-1;
  h += '<div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px;">';
  for (var i=0;i<leadingBlanks;i++) h += '<div></div>';

  var cur = parseD(monthStartStr);
  while (toStr(cur) <= monthEndStr) {
    var ds = toStr(cur);
    var e = state.entries[ds];
    var logged = !!e;
    var spent = logged ? sumSpent(e) : 0;
    var allowance = logged ? e.allowance : da;
    var isFuture = ds > today;
    var isPreTracking = tsd && ds < tsd;
    var isToday = ds === today;
    var isSelected = state.calendarSelectedDate === ds;

    var bg, fg;
    if (isFuture) { bg = "transparent"; fg = "var(--text-muted)"; }
    else if (isPreTracking) { bg = "var(--raised)"; fg = "var(--text-muted)"; }
    else if (!logged) { bg = "rgba(224,179,104,0.14)"; fg = "var(--text)"; }
    else if (spent <= allowance) { bg = "rgba(224,179,104,0.32)"; fg = "var(--text)"; }
    else { bg = "var(--rust-wash)"; fg = "var(--rust)"; }

    var isTracked = !isFuture && !isPreTracking;
    var border = isToday ? "2px solid var(--accent)" : (isSelected ? "2px solid var(--text)" : "1px solid transparent");
    h += '<button data-action="cal-select" data-date="'+ds+'" style="min-height:64px; border-radius:9px; border:'+border+'; background:'+bg+'; color:'+fg+'; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4px 1px; min-width:0; gap:3px;">';
    h += '<span style="font-size:14px; font-weight:500;">'+cur.getDate()+'</span>';
    var spentText = logged ? fmt(spent,0) : (isTracked ? "0" : "\u00A0");
    h += '<span class="mono" style="font-size:10px; line-height:1;">'+spentText+'</span>';
    var cumForDay = balMap[ds];
    var cumText = "\u00A0", cumClr = fg;
    if (cumForDay !== undefined) {
      cumClr = cumForDay >= 0 ? "var(--positive)" : "var(--rust)";
      cumText = (cumForDay>=0?"+":"−")+fmt(Math.abs(cumForDay),0);
    }
    h += '<span class="mono" style="font-size:10px; line-height:1; color:'+cumClr+';">'+cumText+'</span>';
    h += '</button>';
    cur = addDays(cur,1);
  }
  h += '</div>';
  h += '</div>'; // end grid card

  h += '<div class="row" style="gap:14px; margin-bottom:16px; flex-wrap:wrap;">';
  h += legendSwatch("rgba(224,179,104,0.32)", "Under budget");
  h += legendSwatch("var(--rust-wash)", "Over budget", "var(--rust)");
  h += legendSwatch("rgba(224,179,104,0.14)", "Not logged");
  h += legendSwatch("var(--raised)", "Before tracking");
  h += '</div>';

  if (state.calendarSelectedDate) {
    var sd = state.calendarSelectedDate;
    var sday = state.entries[sd];
    h += '<div class="card" style="padding:16px;">';
    h += '<div class="eyebrow" style="margin-bottom:8px;">'+esc(dayLabel(sd))+'</div>';
    if (sday && sday.items.length) {
      newestFirst(sday.items).forEach(function(it){
        h += renderTxnRow(sd, it);
      });
    } else {
      h += '<div class="muted" style="font-size:13px;">Nothing logged this day.</div>';
    }
    h += '</div>';
  }

  return h;
}

var PIE_COLORS = ["#E0B368","#5EBD8C","#7BA7D4","#D4614A","#B58BD0","#5FC2C2","#E08A5E","#9AAF7A","#C77FA3","#7E8CC4"];

/* Category icons & colors: fixed for the built-in set, hashed to a stable
   fallback color for any custom category the user adds. */
var CAT_ICON_SVGS = {
  fork: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7a2 2 0 0 0 4 0V2M5 2v20M21 15V2a5 5 0 0 0-5 5v6a2 2 0 0 0 2 2h3zm0 0v7"/></svg>',
  basket: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 8h13l-1.5 11.2a2 2 0 0 1-2 1.8H9a2 2 0 0 1-2-1.8z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>',
  car: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17V11l2-5h14l2 5v6"/><path d="M5 17h14"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>',
  bag: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg>',
  bolt: '<svg width="16" height="16" viewBox="0 0 24 24" fill="white" stroke="none"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>',
  heart: '<svg width="16" height="16" viewBox="0 0 24 24" fill="white" stroke="none"><path d="M12 21s-6.7-4.35-9.3-8.1C.8 9.9 1.9 6 5.4 5.1 7.6 4.5 9.8 5.5 12 8c2.2-2.5 4.4-3.5 6.6-2.9 3.5.9 4.6 4.8 2.7 7.8C18.7 16.65 12 21 12 21z"/></svg>',
  film: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="18" rx="2"/><path d="M7 3v18M17 3v18M2 8h5M2 16h5M17 8h5M17 16h5"/></svg>',
  tag: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 12.6 12.6 20.6a2 2 0 0 1-2.83 0L2.6 13.4a2 2 0 0 1 0-2.83l8-8A2 2 0 0 1 12 2h6a2 2 0 0 1 2 2v6a2 2 0 0 1-.4 1.2Z"/><circle cx="16.5" cy="7.5" r="1"/></svg>',
};
var CATEGORY_STYLES = {
  "Food & Dining": { icon:"fork", color:"#D4614A" },
  "Groceries": { icon:"basket", color:"#5EA05E" },
  "Transport": { icon:"car", color:"#7BA7D4" },
  "Shopping": { icon:"bag", color:"#B58BD0" },
  "Bills & Utilities": { icon:"bolt", color:"#C9A227" },
  "Health": { icon:"heart", color:"#E0687A" },
  "Entertainment": { icon:"film", color:"#7E8CC4" },
  "Other": { icon:"tag", color:"#8595B5" },
};
function categoryStyle(name) {
  if (!name) return { icon:"tag", color:"#8595B5" };
  if (CATEGORY_STYLES[name]) return CATEGORY_STYLES[name];
  var hash = 0;
  for (var i=0;i<name.length;i++) hash = (hash*31 + name.charCodeAt(i)) >>> 0;
  return { icon:"tag", color: PIE_COLORS[hash % PIE_COLORS.length] };
}
function catIconCircle(categoryName) {
  var st = categoryStyle(categoryName);
  return '<span style="width:32px; height:32px; border-radius:50%; background:'+st.color+'; display:flex; align-items:center; justify-content:center; flex-shrink:0;">'+CAT_ICON_SVGS[st.icon]+'</span>';
}

function renderPieChart(slices, T) {
  var size = 180, r = 78, cx = size/2, cy = size/2;
  var total = slices.reduce(function(s,x){ return s+x.value; }, 0);
  if (total <= 0) return "";
  var angle = -Math.PI/2;
  var paths = "";
  slices.forEach(function(sl, i){
    var frac = sl.value/total;
    var sweep = frac * Math.PI * 2;
    var end = angle + sweep;
    var color = PIE_COLORS[i % PIE_COLORS.length];
    if (frac >= 0.9999) {
      paths += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+color+'"/>';
    } else {
      var x1 = cx + r*Math.cos(angle), y1 = cy + r*Math.sin(angle);
      var x2 = cx + r*Math.cos(end),   y2 = cy + r*Math.sin(end);
      var large = sweep > Math.PI ? 1 : 0;
      paths += '<path d="M '+cx+' '+cy+' L '+x1+' '+y1+' A '+r+' '+r+' 0 '+large+' 1 '+x2+' '+y2+' Z" fill="'+color+'"/>';
    }
    angle = end;
  });
  paths += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*0.55)+'" fill="'+T.card+'"/>';
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+paths+'</svg>';
}

function renderBarChart(items, T) {
  var w = 340, h = 140, padL = 30, padR = 8, padT = 10, padB = 20;
  var maxVal = Math.max.apply(null, items.map(function(i){ return Math.max(i.spent, i.target); }).concat([1]));
  var plotW = w-padL-padR, plotH = h-padT-padB;
  var n = items.length;
  var slot = plotW/n;
  var barW = Math.min(24, slot*0.55);
  function y(v){ return padT + plotH - (Math.min(v,maxVal)/maxVal)*plotH; }
  var bars = items.map(function(it,i){
    var cx = padL + slot*i + slot/2;
    var barTopY = y(it.spent);
    var barH = Math.max(0, plotH - (barTopY-padT));
    var color = it.spent <= it.target ? T.positive : T.rust;
    var targetY = y(it.target);
    return '<rect x="'+(cx-barW/2)+'" y="'+barTopY+'" width="'+barW+'" height="'+barH+'" fill="'+color+'" rx="2"/>'
      + '<line x1="'+(cx-barW/2-2)+'" x2="'+(cx+barW/2+2)+'" y1="'+targetY+'" y2="'+targetY+'" stroke="'+T.textMuted+'" stroke-dasharray="2,2"/>'
      + '<text x="'+cx+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'" text-anchor="middle">'+esc(it.label)+'</text>';
  }).join("");
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'">'
    + '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="'+T.hairline+'"/>'
    + bars + '</svg>';
}

function renderAnalysisBody(T) {
  var da = dailyAllowance();
  var today = todayStr();
  var tsd = state.settings.trackingStartDate;
  var entryDatesAll = Object.keys(state.entries).sort();
  var cumAnchor = tsd || (entryDatesAll.length ? entryDatesAll[0] : today);
  var cs = periodStats(cumAnchor, today);

  var h = "";
  h += '<div class="eyebrow" style="margin-bottom:4px;">Analysis</div>';
  h += '<div class="muted" style="font-size:11px; margin-bottom:12px;">Since '+esc(parseD(cumAnchor).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}))+'</div>';

  h += '<div class="card" style="padding:16px; margin-bottom:16px;">';
  h += '<div class="stat-grid">';
  h += statBlock("Total spent", fmt(cs.spent,0)+" AED", "var(--text)");
  h += statBlock("Total saved", (cs.net>=0?"+":"−")+fmt(Math.abs(cs.net),0)+" AED", cs.net>=0?"var(--positive)":"var(--rust)");
  h += statBlock("Avg daily spend", fmt(cs.elapsedDays>0?cs.spent/cs.elapsedDays:0,0)+" AED", (cs.elapsedDays>0 && cs.spent/cs.elapsedDays>da)?"var(--rust)":"var(--text)");
  h += statBlock("Days tracked", String(cs.elapsedDays), "var(--text)");
  h += '</div></div>';

  var months = [];
  var mOff = 0;
  while (months.length < 12) {
    var mb = getPeriodBounds("month", mOff, state.settings.weeklyTarget, da);
    if (mb.endStr < cumAnchor) break;
    var ms = periodStats(mb.startStr, mb.endStr);
    months.unshift({ label: parseD(mb.startStr).toLocaleDateString("en-GB",{month:"short"}), spent: ms.spent, target: mb.target });
    mOff--;
    if (mOff < -23) break;
  }
  if (months.length >= 2) {
    h += '<div class="card" style="padding:14px; margin-bottom:16px;">';
    h += '<div class="eyebrow" style="margin-bottom:8px;">Monthly spend vs target</div>';
    h += renderBarChart(months, T);
    h += '<div class="muted" style="font-size:10px; margin-top:4px;">Dashed line marks that month\'s target · red bars ran over</div>';
    h += '</div>';
  }

  var dowSums = [0,0,0,0,0,0,0], dowCounts = [0,0,0,0,0,0,0];
  cs.rows.forEach(function(r){
    var dow = parseD(r.date).getDay();
    var idx = dow===0?6:dow-1;
    dowSums[idx] += r.spent;
    dowCounts[idx] += 1;
  });
  /* Spend by category */
  var catTotals = {};
  cs.rows.forEach(function(r){
    r.items.forEach(function(it){
      var key = it.category || "Uncategorised";
      catTotals[key] = (catTotals[key] || 0) + it.amount;
    });
  });
  var catSlices = Object.keys(catTotals).map(function(k){ return { label:k, value:catTotals[k] }; })
    .sort(function(a,b){ return b.value - a.value; });
  var catTotal = catSlices.reduce(function(s,x){ return s+x.value; }, 0);
  if (catSlices.length) {
    h += '<div class="card" style="padding:16px; margin-bottom:16px;">';
    h += '<div class="eyebrow" style="margin-bottom:10px;">Spend by category</div>';
    h += '<div style="display:flex; justify-content:center; margin-bottom:12px;">'+renderPieChart(catSlices, T)+'</div>';
    catSlices.forEach(function(sl,i){
      var pct = catTotal>0 ? (sl.value/catTotal*100) : 0;
      h += '<div class="row between" style="padding:5px 0;'+(i>0?"border-top:1px solid var(--hairline);":"")+'">';
      h += '<div class="row" style="align-items:center; gap:7px; min-width:0;"><span style="width:10px;height:10px;border-radius:3px;flex-shrink:0;background:'+PIE_COLORS[i % PIE_COLORS.length]+';"></span><span style="font-size:13px;">'+esc(sl.label)+'</span></div>';
      h += '<div class="row" style="align-items:baseline; gap:8px;"><span class="mono" style="font-size:13px;">'+fmt(sl.value,0)+'</span><span class="muted mono" style="font-size:10px; width:34px; text-align:right;">'+pct.toFixed(0)+'%</span></div>';
      h += '</div>';
    });
    h += '</div>';
  }

  var dowLabels = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  var dowAvg = dowSums.map(function(s,i){ return dowCounts[i]>0 ? s/dowCounts[i] : 0; });
  var maxDow = Math.max.apply(null, dowAvg.concat([1]));
  h += '<div class="card" style="padding:16px; margin-bottom:16px;">';
  h += '<div class="eyebrow" style="margin-bottom:10px;">Average spend by day of week</div>';
  dowLabels.forEach(function(lbl,i){
    var pct = maxDow>0 ? Math.round((dowAvg[i]/maxDow)*100) : 0;
    var over = dowAvg[i] > da;
    h += '<div class="row" style="align-items:center; gap:8px; margin-bottom:6px;">';
    h += '<span class="muted" style="font-size:11px; width:26px;">'+lbl+'</span>';
    h += '<div style="flex:1; background:var(--raised); border-radius:4px; height:8px; overflow:hidden;"><div style="width:'+pct+'%; height:100%; background:'+(over?"var(--rust)":"var(--positive)")+';"></div></div>';
    h += '<span class="mono muted" style="font-size:10px; width:40px; text-align:right;">'+fmt(dowAvg[i],0)+'</span>';
    h += '</div>';
  });
  h += '</div>';

  var allItems = [];
  entryDatesAll.forEach(function(d){
    state.entries[d].items.forEach(function(it){ allItems.push({date:d, note:it.note, amount:it.amount}); });
  });
  allItems.sort(function(a,b){ return b.amount - a.amount; });
  var top5 = allItems.slice(0,5);
  h += '<div class="card" style="padding:16px; margin-bottom:16px;">';
  h += '<div class="eyebrow" style="margin-bottom:10px;">Biggest transactions</div>';
  if (top5.length === 0) {
    h += '<div class="muted" style="font-size:13px;">Nothing logged yet.</div>';
  } else {
    top5.forEach(function(it,i){
      h += '<div class="row between" style="padding:6px 0;'+(i>0?"border-top:1px solid var(--hairline);":"")+'">';
      h += '<div><div style="font-size:13px;">'+(it.note?esc(it.note):"Spent")+'</div><div class="muted" style="font-size:10px;">'+esc(dayLabel(it.date))+'</div></div>';
      h += '<div class="mono" style="font-size:13px;">'+fmt(it.amount,2)+' AED</div>';
      h += '</div>';
    });
  }
  h += '</div>';

  return h;
}

function renderBottomNav() {
  var tabs = [
    {id:"home", label:"Home", icon:ICONS.home},
    {id:"transactions", label:"Transactions", icon:ICONS.list},
    {id:"calendar", label:"Calendar", icon:ICONS.calendar},
    {id:"analysis", label:"Analysis", icon:ICONS.chart},
  ];
  var h = '<div style="position:fixed; left:0; right:0; bottom:var(--vvb, 0px); display:flex; background:var(--card); border-top:1px solid var(--hairline); padding:6px 4px calc(env(safe-area-inset-bottom, 0px) + 6px); z-index:40;">';
  tabs.forEach(function(t){
    var active = state.page===t.id;
    h += '<button data-action="go-page" data-page="'+t.id+'" style="flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none; padding:4px 0; color:'+(active?"var(--accent)":"var(--text-muted)")+';">'+t.icon+'<span style="font-size:9px;">'+t.label+'</span></button>';
  });
  h += '</div>';
  return h;
}

function statBlock(label, value, color) {
  return '<div><div class="eyebrow">'+esc(label)+'</div><div class="mono" style="font-size:14px; margin-top:2px; color:'+color+';">'+value+'</div></div>';
}

/* ---------------- actions ---------------- */
function handleAddTransaction() {
  var dateEl = document.getElementById("entryDateInput");
  var amtEl = document.getElementById("entryAmountInput");
  var noteEl = document.getElementById("entryNoteInput");
  var catEl = document.getElementById("entryCategoryInput");
  var date = dateEl ? dateEl.value : todayStr();
  var amt = parseFloat(amtEl ? amtEl.value : "");
  if (isNaN(amt) || amt < 0 || !date) return;
  var note = noteEl ? noteEl.value.trim() : "";
  var category = catEl ? catEl.value : "";
  var nextEntries = Object.assign({}, state.entries);
  var wasEditing = !!(state.editingItemId && state.editingOriginalDate);

  if (wasEditing) {
    var origDate = state.editingOriginalDate;
    var origDay = nextEntries[origDate];
    var carriedAllowance = origDay ? origDay.allowance : dailyAllowance();
    if (origDay) {
      var remaining = origDay.items.filter(function(i){ return i.id !== state.editingItemId; });
      if (remaining.length === 0) delete nextEntries[origDate];
      else nextEntries[origDate] = Object.assign({}, origDay, { items: remaining });
    }
    var updatedItem = { id: state.editingItemId, amount: amt, note: note, category: category };
    var destDay = nextEntries[date];
    var nextDest = destDay ? Object.assign({}, destDay, { items: destDay.items.concat([updatedItem]) }) : { allowance: carriedAllowance, items: [updatedItem] };
    nextEntries[date] = nextDest;
    state.editingItemId = null;
    state.editingOriginalDate = null;
    state.showAddTxn = false;
  } else {
    var existing = nextEntries[date];
    var newItem = { id: Date.now()+"-"+Math.random().toString(36).slice(2,7), amount: amt, note: note, category: category };
    nextEntries[date] = existing ? Object.assign({}, existing, { items: existing.items.concat([newItem]) }) : { allowance: dailyAllowance(), items: [newItem] };
    state.showAddTxn = false;
  }

  state.entryDate = date;
  persistAll(state.settings, nextEntries, "your entry");
  showToast(wasEditing ? "Record updated" : "Record added");
  render();
}

function handleApplyBudget(scope) {
  var wEl = document.getElementById("weeklyDraftInput");
  var v = wEl ? parseFloat(wEl.value) : NaN;
  if (isNaN(v) || v <= 0) return;
  var newDaily = v / 7;
  var wk = getPeriodBounds("week", 0, v, newDaily);
  var hist = (state.settings.rateHistory || []).slice();
  var nextEntries = Object.assign({}, state.entries);
  var label;

  function rewriteLoggedFrom(fromStr, toStr_) {
    Object.keys(nextEntries).forEach(function(d){
      if (d >= fromStr && (!toStr_ || d <= toStr_)) {
        nextEntries[d] = Object.assign({}, nextEntries[d], { allowance: newDaily });
      }
    });
  }

  if (scope === "all") {
    hist = [{ from: "1900-01-01", weeklyTarget: v }];
    rewriteLoggedFrom("1900-01-01", null);
    label = "Applied to all periods";
  } else if (scope === "future") {
    hist.push({ from: wk.startStr, weeklyTarget: v });
    rewriteLoggedFrom(wk.startStr, null);
    label = "Applied from this week onward";
  } else { // thisPeriod
    var prevRate = rateForDate(wk.startStr);
    var dayAfter = toStr(addDays(parseD(wk.endStr), 1));
    hist.push({ from: wk.startStr, weeklyTarget: v });
    hist.push({ from: dayAfter, weeklyTarget: prevRate });
    rewriteLoggedFrom(wk.startStr, wk.endStr);
    label = "Applied to this week only";
  }

  hist = normalizeRateHistory(hist);
  var nextSettings = Object.assign({}, state.settings, { rateHistory: hist });
  nextSettings.weeklyTarget = (function(){
    var r = hist[0].weeklyTarget, t = todayStr();
    for (var i=0;i<hist.length;i++){ if (hist[i].from <= t) r = hist[i].weeklyTarget; else break; }
    return r;
  })();
  persistAll(nextSettings, nextEntries, "your budget");
  state.showSettings = false;
  showToast(label);
  render();
}

function showToast(msg) {
  state.toastMessage = msg;
  setTimeout(function(){ state.toastMessage = null; render(); }, 2200);
}

function handleEditTxn(date, id) {
  state.entryDate = date;
  state.editingItemId = id;
  state.editingOriginalDate = date;
  state.showAddTxn = true;
  state.pendingDeleteKey = null;
  render();
}

function handleCancelEdit() {
  state.editingItemId = null;
  state.editingOriginalDate = null;
  render();
}

function handleDeleteTxn(date, id) {
  var day = state.entries[date];
  if (!day) return;
  var remaining = day.items.filter(function(i){ return i.id !== id; });
  var nextEntries = Object.assign({}, state.entries);
  if (remaining.length === 0) delete nextEntries[date]; else nextEntries[date] = Object.assign({}, day, { items: remaining });
  if (state.editingItemId === id) { state.editingItemId = null; state.editingOriginalDate = null; }
  persistAll(state.settings, nextEntries, "your entry");
  render();
}

function handleQuickDate(date) {
  state.entryDate = date;
  var dateEl = document.getElementById("entryDateInput");
  if (dateEl) dateEl.value = date;
  var hintEl = document.getElementById("entryHint");
  if (hintEl) {
    var day = state.entries[date];
    hintEl.innerHTML = day ? (esc(dayLabel(date))+" so far: "+day.items.length+" transaction"+(day.items.length===1?"":"s")+", "+fmt(sumSpent(day),2)+" AED total.") : "";
  }
}

function handleCopyBackup() {
  var btn = document.getElementById("copyBackupBtn");
  var text = JSON.stringify({settings:state.settings, entries:state.entries}, null, 2);
  function done(msg) { if (btn) { btn.textContent = msg; setTimeout(function(){ if(btn) btn.textContent = "Copy backup"; }, 2500); } }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ done("Copied ✓"); }).catch(function(){ done("Select the text above to copy"); });
  } else {
    done("Select the text above to copy");
  }
}

function handleRestore() {
  var el = document.getElementById("restoreInput");
  var raw = el ? el.value : "";
  try {
    var parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object" || typeof parsed.entries !== "object") throw new Error("bad shape");
    var nextSettings = Object.assign({}, DEFAULT_SETTINGS, parsed.settings||{});
    var nextEntries = migrateEntries(parsed.entries||{}, nextSettings.weeklyTarget/7);
    persistAll(nextSettings, nextEntries, "restored data");
    state.restoreError = null;
    state.showBackup = false;
  } catch(e) {
    state.restoreError = "That doesn't look like a valid backup — paste the exact text you copied earlier.";
  }
  render();
}

/* ---------------- event delegation ---------------- */
document.addEventListener("click", function(e) {
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.dataset.action;
  switch(action) {
    case "open-backup": state.showBackup = true; render(); break;
    case "close-backup": state.showBackup = false; state.restoreError = null; render(); break;
    case "open-settings": state.showSettings = true; render(); break;
    case "close-settings": state.showSettings = false; render(); break;
    case "open-reset": state.showResetConfirm = true; render(); break;
    case "close-reset": state.showResetConfirm = false; render(); break;
    case "toggle-theme":
      persistAll(Object.assign({}, state.settings, { theme: state.settings.theme==="dark"?"light":"dark" }), state.entries, "your settings");
      render();
      break;
    case "switch-view": state.view = el.dataset.view; state.offset = 0; render(); break;
    case "nav-offset":
      var delta = parseInt(el.dataset.delta,10);
      var next = state.offset + delta;
      state.offset = Math.min(0, next);
      render();
      break;
    case "add-transaction": handleAddTransaction(); break;
    case "delete-txn":
      handleDeleteTxn(el.dataset.date, el.dataset.id);
      state.pendingDeleteKey = null;
      break;
    case "ask-delete-txn":
      state.pendingDeleteKey = el.dataset.date+"|"+el.dataset.id;
      render();
      break;
    case "cancel-delete-txn":
      state.pendingDeleteKey = null;
      render();
      break;
    case "edit-txn": handleEditTxn(el.dataset.date, el.dataset.id); break;
    case "cancel-edit": handleCancelEdit(); break;
    case "open-add-txn":
      state.editingItemId = null;
      state.editingOriginalDate = null;
      state.entryDate = todayStr();
      state.showAddTxn = true;
      state.pendingDeleteKey = null;
      render();
      break;
    case "close-add-txn":
      state.showAddTxn = false;
      state.editingItemId = null;
      state.editingOriginalDate = null;
      render();
      break;
    case "go-page":
      state.editingItemId = null;
      state.editingOriginalDate = null;
      state.showAddTxn = false;
      state.pendingDeleteKey = null;
      state.page = el.dataset.page;
      render();
      break;
    case "quick-date": handleQuickDate(el.dataset.date); break;
    case "cal-nav":
      state.calendarOffset += parseInt(el.dataset.delta,10);
      state.calendarSelectedDate = null;
      render();
      break;
    case "cal-select":
      state.calendarSelectedDate = (state.calendarSelectedDate === el.dataset.date) ? null : el.dataset.date;
      render();
      break;
    case "retry-save":
      if (state.saveError) { var se = state.saveError; state.saveError = null; persistAll(se.nextSettings, se.nextEntries, se.label); }
      render();
      break;
    case "settings-tab":
      state.settingsTab = el.dataset.tab;
      render();
      break;
    case "save-tracking":
      var tsEl = document.getElementById("trackingStartInput");
      var trackSettings = Object.assign({}, state.settings, { trackingStartDate: (tsEl && tsEl.value) ? tsEl.value : null });
      persistAll(trackSettings, state.entries, "your settings");
      showToast("Tracking date saved");
      render();
      break;
    case "apply-budget":
      handleApplyBudget(el.dataset.scope);
      break;
    case "add-category":
      var newCatEl = document.getElementById("newCategoryInput");
      var newCat = newCatEl ? newCatEl.value.trim() : "";
      if (newCat && (state.settings.categories||[]).indexOf(newCat) === -1) {
        var withCat = Object.assign({}, state.settings, { categories: (state.settings.categories||[]).concat([newCat]) });
        persistAll(withCat, state.entries, "your settings");
        render();
      }
      break;
    case "remove-category":
      var catToRemove = el.dataset.cat;
      var withoutCat = Object.assign({}, state.settings, { categories: (state.settings.categories||[]).filter(function(c){ return c !== catToRemove; }) });
      persistAll(withoutCat, state.entries, "your settings");
      render();
      break;
    case "move-category":
      var dir = parseInt(el.dataset.dir,10);
      var cats2 = (state.settings.categories||[]).slice();
      var idx = cats2.indexOf(el.dataset.cat);
      var swapIdx = idx + dir;
      if (idx >= 0 && swapIdx >= 0 && swapIdx < cats2.length) {
        var tmp = cats2[idx]; cats2[idx] = cats2[swapIdx]; cats2[swapIdx] = tmp;
        var movedSettings = Object.assign({}, state.settings, { categories: cats2 });
        persistAll(movedSettings, state.entries, "your settings");
        render();
      }
      break;
    case "copy-backup": handleCopyBackup(); break;
    case "restore-backup": handleRestore(); break;
    case "confirm-reset":
      persistAll(state.settings, {}, "reset");
      state.showResetConfirm = false;
      render();
      break;
  }
});

document.addEventListener("change", function(e) {
  if (e.target && e.target.id === "entryDateInput") handleQuickDate(e.target.value);
  if (e.target && e.target.id === "txnCategoryFilterSelect") { state.txnCategoryFilter = e.target.value; render(); }
});

/* ---------------- init ---------------- */
function setViewportHeightVar() {
  document.documentElement.style.setProperty("--vh100", window.innerHeight + "px");
}
setViewportHeightVar();
window.addEventListener("resize", setViewportHeightVar);
window.addEventListener("orientationchange", setViewportHeightVar);

/* visualViewport: corrects position:fixed bottom offset when the browser's own
   chrome (address bar, toolbar) takes up space that CSS position:fixed doesn't
   know about, which iOS Safari/Chrome get wrong specifically on pages that
   don't need to scroll. */
function updateVisualViewportOffset() {
  var vv = window.visualViewport;
  if (!vv) { document.documentElement.style.setProperty("--vvb", "0px"); return; }
  var gap = window.innerHeight - vv.height - vv.offsetTop;
  document.documentElement.style.setProperty("--vvb", Math.max(0, Math.round(gap)) + "px");
}
updateVisualViewportOffset();
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", updateVisualViewportOffset);
  window.visualViewport.addEventListener("scroll", updateVisualViewportOffset);
}
window.addEventListener("resize", updateVisualViewportOffset);
window.addEventListener("orientationchange", updateVisualViewportOffset);
setTimeout(updateVisualViewportOffset, 300);
setTimeout(updateVisualViewportOffset, 1000);

loadInitial();
render();
</script>
