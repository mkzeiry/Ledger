      card.style.transition = "transform 0.2s ease";
      card.style.transform = "";
      if (backdrop) { backdrop.style.transition = "background 0.2s ease"; backdrop.style.background = ""; }
      setTimeout(function(){ card.style.transition = ""; if (backdrop) backdrop.style.transition = ""; }, 220);
    }
  }
  touchLockCard = null; touchLockStartY = null; touchLockStartScrollTop = null;
  sheetDragging = false; sheetDragAnchorY = null; sheetDragDelta = 0;
}, { passive: true });

function render() {
  var root = document.getElementById("root");
  var T = effectivePalette();
  applyTheme(T);

  var anyModalOpen = state.showAddTxn || state.showSettings || state.showBackup || state.showResetConfirm;
  if (anyModalOpen) lockBodyScroll(); else unlockBodyScroll();

  /* root.innerHTML = html below destroys and recreates every element on every
     render, including whichever scrollable container the person is currently
     scrolled through — so without this, expanding a category's icon editor
     (or any other in-place UI change) would silently snap them back to the
     top every single time. Captured here, before the rebuild; restored after
     it, onto the freshly-created element that takes its place. Modal scroll
     and page scroll are mutually exclusive: while a modal is open the body is
     pinned via lockBodyScroll, so only the modal's own scrollTop matters;
     with no modal open, the page's own scroll position is what matters. */
  var modalCardEl = document.querySelector(".modal-card");
  var savedModalScrollTop = modalCardEl ? modalCardEl.scrollTop : 0;
  var savedPageScrollY = modalCardEl ? 0 : (window.scrollY || window.pageYOffset || 0);

  if (state.loading) {
    root.innerHTML = '<div class="row" style="min-height:100vh; align-items:center; justify-content:center;"><div class="muted" style="font-size:14px;">Loading your ledger…</div></div>';
    return;
  }

  var da = dailyReference();
  var html = "";
  html += '<div class="wrap">';

  // header
  html += '<div class="row between" style="align-items:center; margin:8px 0 2px;">';
  html += '<div class="lg-title display">The Ledger</div>';
  html += '<div class="row gap2">';
  html += '<button class="icon-btn press" data-action="toggle-theme" aria-label="Toggle theme">'+(state.settings.theme==="dark"?ICONS.sun:ICONS.moon)+'</button>';
  html += '<button class="icon-btn press" data-action="open-settings" aria-label="Settings">'+ICONS.settings+'</button>';
  html += '</div></div>';
  html += '<div class="muted footnote" style="margin-bottom:16px;">'+fmt(da,0)+' AED a day'+(state.basis==="income"?" income":"")+' · weeks run Mon–Sun</div>';

  // storage warning
  if (state.storageOK === false) {
    html += '<div class="card" style="padding:12px 16px; margin-bottom:12px; display:flex; gap:10px; background:var(--rust-wash); border-color:var(--rust);">';
    html += '<div style="flex-shrink:0; margin-top:1px; color:var(--rust);">'+ICONS.alert+'</div>';
    html += '<div><div style="font-size:12px;">Your browser is blocking local storage (common in Private Browsing).</div>';
    html += '<button data-action="open-backup" style="background:none;border:none;padding:0;text-decoration:underline;color:var(--rust);font-size:12px;margin-top:4px;">Open backup as a safety net</button></div></div>';
  }

  if (state.page === "transactions") html += renderTransactionsBody();
  else if (state.page === "calendar") html += renderCalendarBody();
  else if (state.page === "plans") html += renderPlansBody();
  else if (state.page === "analysis") html += renderAnalysisBody(T);
  else html += renderHomeBody(T, da);

  if (state.saveError) {
    html += '<div style="text-align:center; margin-top:12px; font-size:12px; color:var(--rust);">Couldn\'t save '+esc(state.saveError.label)+' — <button data-action="retry-save" style="background:none;border:none;padding:0;text-decoration:underline;color:var(--rust);font-size:12px;">tap to retry</button>.</div>';
  }

  html += '</div>'; // end wrap
  if (state.page === "home" || state.page === "transactions" || state.page === "calendar") html += renderFab();
  html += renderBottomNav();

  // modals
  if (state.showAddTxn) html += renderAddTxnModal();
  if (state.showSettings) {
    html += renderSettingsModal();
  }

  if (state.showBackup) {
    var backupText = JSON.stringify({settings:state.settings, entries:state.entries}, null, 2);
    html += '<div class="modal-backdrop" data-action="close-backup">';
    html += '<div class="modal-card" data-action="noop">';
    html += '<div class="grabber"></div>';
    html += '<div class="row between" style="margin-bottom:12px;"><div class="display" style="font-size:18px;">Backup & restore</div><button data-action="close-backup" style="background:none;border:none;color:var(--text-muted);">'+ICONS.x+'</button></div>';
    html += '<div class="muted" style="font-size:12px; margin-bottom:8px;">Use this to move data to another device, or as a safety net.</div>';
    html += '<textarea readonly class="field mono" style="height:120px; font-size:11px; margin-bottom:8px; resize:none;" onfocus="this.select()">'+esc(backupText)+'</textarea>';
    html += '<button id="copyBackupBtn" data-action="copy-backup" class="btn-accent" style="width:100%; margin-bottom:20px;">Copy backup</button>';
    html += '<div class="muted" style="font-size:12px; margin-bottom:8px;">Restore from a backup:</div>';
    html += '<textarea id="restoreInput" class="field mono" style="height:90px; font-size:11px; margin-bottom:8px; resize:none;" placeholder="Paste backup text here"></textarea>';
    if (state.restoreError) html += '<div style="color:var(--rust); font-size:12px; margin-bottom:8px;">'+esc(state.restoreError)+'</div>';
    html += '<button data-action="restore-backup" class="btn-outline" style="width:100%;">Restore this backup</button>';
    html += '</div></div>';
  }

  if (state.showResetConfirm) {
    html += '<div class="modal-backdrop" data-action="close-reset" style="padding:0 24px;">';
    html += '<div class="modal-card" style="border-radius:16px;" data-action="noop">';
    html += '<div class="display" style="font-size:18px; margin-bottom:8px;">Clear all entries?</div>';
    html += '<div class="muted" style="font-size:14px; margin-bottom:16px;">Every logged transaction is removed. Your weekly target and theme stay. This can\'t be undone.</div>';
    html += '<div class="row gap2">';
    html += '<button data-action="close-reset" class="btn-outline" style="flex:1;">Cancel</button>';
    html += '<button data-action="confirm-reset" class="btn-rust row gap2" style="flex:1; justify-content:center; align-items:center;">'+ICONS.rotate+' Clear</button>';
    html += '</div></div></div>';
  }

  if (state.toastMessage) {
    html += '<div style="position:fixed; top:calc(env(safe-area-inset-top,0px) + 16px); left:50%; transform:translateX(-50%); background:var(--positive); color:#0C1322; font-size:13px; font-weight:600; padding:9px 18px; border-radius:999px; box-shadow:0 4px 14px rgba(0,0,0,0.35); z-index:60;">'+esc(state.toastMessage)+'</div>';
  }

  root.innerHTML = html;
  var newModalCardEl = document.querySelector(".modal-card");
  if (newModalCardEl) {
    if (savedModalScrollTop) newModalCardEl.scrollTop = savedModalScrollTop;
  } else if (savedPageScrollY) {
    window.scrollTo(0, savedPageScrollY);
  }
  if ((state.page === "home" || state.page === "analysis") && lastChartData) wireBalanceChart(lastChartData);
  if ((state.page === "analysis" || state.page === "home") && lastForecastChartData) wireForecastChart(lastForecastChartData);
}

function renderHomeBody(T, da) {
  lastForecastChartData = null;
  var period = getPeriodBounds(state.view, state.offset, state.settings.weeklyTarget, da);
  var displayed = periodStats(period.startStr, period.endStr);

  var isClosed = period.endStr < todayStr();
  var isCurrent = state.offset === 0;
  var daysLeft = Math.max(0, period.days - displayed.calendarElapsedDays);
  var elapsedTarget = displayed.elapsedDays * da;

  var chartData = displayed.rows.length ? (function(){
    var acc = displayed.opening;
    return displayed.rows.map(function(r){
      var delta = round2(r.allowance-r.spent);
      acc = round2(acc + delta);
      return { label: shortLabel(r.date), date: r.date, balance: acc, delta: delta };
    });
  })() : [];

  var netColor = displayed.net >= 0 ? "var(--positive)" : "var(--rust)";

  var entryDates = Object.keys(state.entries).sort();
  var cumAnchor = state.settings.trackingStartDate || (entryDates.length ? entryDates[0] : todayStr());
  var cumulative = periodStats(cumAnchor, todayStr());
  var cumColor = cumulative.net >= 0 ? "var(--positive)" : "var(--rust)";
  var cumLabel = "Saved since " + parseD(cumAnchor).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
  var todayEntryForCard = state.entries[todayStr()];
  var spentToday = todayEntryForCard ? sumSpentForBasis(todayEntryForCard) : 0;
  var spentTodayColor = spentToday > da ? "var(--rust)" : "var(--text)";
  var todayAllowanceForCard = referenceForDate(todayStr());

  /* Left to spend today: take the tightest of today's own rate, this week's
     pace-adjusted daily left, and this month's — whichever is lowest wins,
     so today's spending stays honest against both horizons at once. Always
     computed against budget, never income — see withBudgetBasis above. */
  var leftToday = withBudgetBasis(function(){
    var todayBudgetAllowance = allowanceForDate(todayStr());
    var weekDBL = computeDailyBudgetLeft("week", spentToday);
    var monthDBL = computeDailyBudgetLeft("month", spentToday);
    var capCandidates = [todayBudgetAllowance];
    if (weekDBL) capCandidates.push(weekDBL.value);
    if (monthDBL) capCandidates.push(monthDBL.value);
    return Math.min.apply(null, capCandidates) - spentToday;
  });
  var leftTodayColor = leftToday < 0 ? "var(--rust)" : "var(--positive)";

  /* Left to spend today (budget): the plain, uncapped daily rate minus what's
     been spent today — unlike "Left to spend today" above, this ignores the
     week/month pace horizons entirely, so it always reads today's own target. */
  var leftTodayBudget = todayAllowanceForCard - spentToday;
  var leftTodayBudgetColor = leftTodayBudget < 0 ? "var(--rust)" : "var(--positive)";

  var h = "";

  /* Basis toggle: budget = the spending cap you set yourself; income = money
     actually earned, accrued day by day. Everything below reads from it. */
  h += '<div class="seg" style="margin-bottom:14px;">';
  [["budget","vs Budget"],["income","vs Income"]].forEach(function(opt){
    var active = state.basis === opt[0];
    h += '<button class="seg-btn" role="tab" aria-selected="'+active+'" data-action="set-basis" data-basis="'+opt[0]+'">'+opt[1]+'</button>';
  });
  h += '</div>';

  if (state.basis === "income" && !incomeIsSet()) {
    h += '<div class="card" style="padding:14px 16px; margin-bottom:12px; background:var(--rust-wash); border-color:var(--rust);">';
    h += '<div style="font-size:13px; margin-bottom:8px;">Set your income to use this view.</div>';
    h += '<button data-action="open-income-settings" class="btn-accent" style="width:100%;">Set income</button>';
    h += '</div>';
    return h;
  }

  h += '<div class="card" style="padding:14px 16px; margin-bottom:12px;">';
  h += '<div class="row between"><span class="eyebrow" style="font-size:10px;">Left to spend today</span><span class="mono" style="font-size:16px; color:'+leftTodayColor+';">'+fmt(leftToday,0)+' AED</span></div>';
  h += '<div class="row between" style="margin-top:10px;"><span class="eyebrow" style="font-size:10px;">Left to spend today ('+basisWord()+')</span><span class="mono" style="font-size:16px; color:'+leftTodayBudgetColor+';">'+fmt(leftTodayBudget,0)+' AED</span></div>';
  h += '<div class="row between" style="margin-top:10px;"><span class="eyebrow" style="font-size:10px;">Spent today</span><span class="mono" style="font-size:16px; color:'+spentTodayColor+';">'+fmt(spentToday,0)+' AED</span></div>';
  h += '<div class="row between" style="margin-top:10px;"><span class="eyebrow" style="font-size:10px;">'+esc(cumLabel)+'</span><span class="mono" style="font-size:16px; color:'+cumColor+';">'+(cumulative.net>=0?"+":"−")+fmt(Math.abs(cumulative.net),0)+' AED</span></div>';
  h += '</div>';

  h += '<div class="seg" style="margin-bottom:14px;">';
  ["week","month","year"].forEach(function(v){
    var active = state.view===v;
    h += '<button class="seg-btn" role="tab" aria-selected="'+active+'" data-action="switch-view" data-view="'+v+'" style="text-transform:capitalize;">'+v+'</button>';
  });
  h += '</div>';

  h += '<div class="card" style="margin-bottom:16px; overflow:hidden;">';
  h += '<div class="row between" style="padding:12px; border-bottom:1px solid var(--hairline);">';
  h += '<button data-action="nav-offset" data-delta="-1" class="icon-btn" style="border-radius:10px;" aria-label="Previous">'+ICONS.chevronLeft+'</button>';
  h += '<div style="text-align:center;"><div style="font-size:14px; font-weight:500;">'+esc(period.title)+'</div>';
  h += '<div class="eyebrow" style="margin-top:2px;">'+esc(period.sub)+(isClosed?" · closed":"")+' · '+basisWordCap()+' '+fmt(period.target,0)+' AED ('+fmt(da,0)+'/day)</div>';
  if (isCurrent) {
    h += '<div class="muted" style="font-size:11px; margin-top:4px;">'+(state.view==="week"?esc(weekdayLong(todayStr()))+" · ":"")+'Day '+displayed.calendarElapsedDays+' of '+period.days+' · '+daysLeft+' day'+(daysLeft===1?"":"s")+' left</div>';
  }
  h += '</div>';
  h += '<button data-action="nav-offset" data-delta="1" class="icon-btn" style="border-radius:10px;'+(isCurrent?"opacity:0.3;pointer-events:none;":"")+'" aria-label="Next">'+ICONS.chevronRight+'</button>';
  h += '</div>';

  h += '<div style="padding:16px 20px 12px;">';
  h += '<div class="eyebrow">'+(isClosed?"Saved this period":"Saved so far")+'</div>';
  h += '<div class="mono" style="font-size:34px; margin-top:4px; color:'+netColor+';">'+(displayed.net>=0?"+":"−")+fmt(Math.abs(displayed.net),0)+' <span class="muted" style="font-size:17px;">AED</span></div>';
  h += '<div class="muted" style="font-size:12px; margin-top:4px;">'+(displayed.elapsedDays===0 ? ("This "+state.view+" hasn't started yet") : (displayed.loggedCount+" of "+displayed.elapsedDays+" elapsed day"+(displayed.elapsedDays===1?"":"s")+" logged"))+'</div>';
  h += '</div>';

  var todayIncluded = displayed.rows.length > 0 && displayed.rows[displayed.rows.length-1].date === todayStr();
  var todaySpent = todayIncluded ? displayed.rows[displayed.rows.length-1].spent : 0;
  var pastDays = todayIncluded ? displayed.elapsedDays - 1 : displayed.elapsedDays;
  var pastSpent = displayed.spent - todaySpent;
  var avgSpentPerDay = pastDays > 0 ? (pastSpent/pastDays) : null;
  var remainingBudget = period.target - displayed.spent;
  var allowedText, allowedTone, planDaysShown;
  if (daysLeft > 0) {
    planDaysShown = daysLeft + 1; // today counts as a fresh, still-available day
    var spentBeforeToday = displayed.spent - spentToday;
    var remainingExclToday = period.target - spentBeforeToday;
    var perDayLeft = remainingExclToday/planDaysShown;
    allowedText = fmt(perDayLeft,0)+" AED";
    allowedTone = perDayLeft < 0 ? "var(--rust)" : "var(--text)";
  } else {
    allowedText = isClosed ? "—" : "Last day";
    allowedTone = "var(--text-muted)";
  }
  h += '<div class="stat-grid hairline-top" style="padding:12px 20px 16px;">';
  h += statBlock("Spent so far", fmt(displayed.spent,0)+" AED", displayed.spent>elapsedTarget?"var(--rust)":"var(--text)");
  h += statBlock(basisWordCap()+" remaining", (remainingBudget>=0?"":"−")+fmt(Math.abs(remainingBudget),0)+" AED", remainingBudget<0?"var(--rust)":"var(--text)");
  h += statBlock("Avg daily spend", avgSpentPerDay===null ? "—" : (fmt(avgSpentPerDay,0)+" AED"), (avgSpentPerDay!==null && avgSpentPerDay>da)?"var(--rust)":"var(--text)");
  h += statBlock("Daily "+basisWord()+" left"+(daysLeft>0?" ("+planDaysShown+"d)":""), allowedText, allowedTone);
  h += '</div>';

  lastChartData = null;
  if (chartData.length >= 1) {
    h += '<div class="hairline-top" style="padding:12px 8px 12px;">';
    h += '<div id="balanceChartWrap" style="position:relative;">';
    h += '<div id="balanceChartTip" class="mono footnote" style="position:absolute; top:0; left:0; background:var(--fill); border-radius:8px; padding:4px 9px; max-width:250px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:0; pointer-events:none; transition:opacity .12s ease; z-index:2;"></div>';
    h += renderChart(chartData, T);
    h += '</div></div>';
    lastChartData = chartData;
  }
  h += '</div>'; // end period card

  /* Forecast: same card, same math, same chart as Analysis's Forecasted
     Spend section — built by the one shared function so the two pages can
     never show conflicting numbers or drift apart visually. */
  if (isCurrent && chartData.length) {
    var periodWordHome = state.view === "week" ? "week" : state.view === "month" ? "month" : "year";
    var chartStartHome = effectiveRangeStart(period.startStr);
    var chartDaysHome = daysBetween(chartStartHome, period.endStr) + 1;
    var compareRowsHome = previousPeriodRows(state.view, state.offset, period.startStr, period.endStr);
    h += buildForecastCard(displayed.rows, chartDaysHome, period.target, chartStartHome, T, basisWordCap(), periodWordHome, compareRowsHome);
  }

  return h;
}

function renderSettingsModal() {
  var tabs = [{id:"budget",label:"Budget"},{id:"income",label:"Income"},{id:"tracking",label:"Tracking"},{id:"categories",label:"Categories"},{id:"people",label:"People"},{id:"theme",label:"Theme"}];
  var h = '<div class="modal-backdrop" data-action="close-settings">';
  h += '<div class="modal-card" data-action="noop">';
  h += '<div class="grabber"></div>';
  h += '<div class="row between" style="margin-bottom:14px;"><div class="display" style="font-size:18px;">Settings</div><button data-action="close-settings" style="background:none;border:none;color:var(--text-muted);">'+ICONS.x+'</button></div>';

  h += '<div class="seg seg-wrap" style="margin-bottom:18px;">';
  tabs.forEach(function(t){
    var active = state.settingsTab === t.id;
    h += '<button class="seg-btn" role="tab" aria-selected="'+active+'" data-action="settings-tab" data-tab="'+t.id+'">'+t.label+'</button>';
  });
  h += '</div>';

  if (state.settingsTab === "budget") {
    var curWeekly = currentWeeklyTarget();
    var wkBounds = getPeriodBounds("week", 0, curWeekly, curWeekly/7);
    h += '<label class="eyebrow">Weekly budget target</label>';
    h += '<div style="position:relative; margin:6px 0 6px;"><span class="muted" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:14px;">AED</span>';
    h += '<input id="weeklyDraftInput" type="number" inputmode="decimal" class="field mono" style="padding-left:44px;" value="'+curWeekly+'" /></div>';
    h += '<div class="muted" id="weeklyPerDayText" style="font-size:12px; margin-bottom:14px;">= '+fmt(curWeekly/7,2)+' AED per day. Choose how far this change should reach:</div>';
    h += '<button data-action="apply-budget" data-scope="future" class="btn-accent" style="width:100%; margin-bottom:8px;">This week onward</button>';
    h += '<div class="muted" style="font-size:11px; margin-bottom:12px;">From '+esc(shortLabel(wkBounds.startStr))+' forward. Earlier weeks keep their old rate — this is usually what you want.</div>';
    h += '<button data-action="apply-budget" data-scope="thisPeriod" class="btn-outline" style="width:100%; margin-bottom:8px;">This week only</button>';
    h += '<div class="muted" style="font-size:11px; margin-bottom:12px;">Just '+esc(shortLabel(wkBounds.startStr))+'–'+esc(shortLabel(wkBounds.endStr))+'. Reverts to the previous rate afterwards.</div>';
    h += '<button data-action="apply-budget" data-scope="all" class="btn-outline" style="width:100%; margin-bottom:8px;">All periods, past and future</button>';
    h += '<div class="muted" style="font-size:11px;">Rewrites your whole history to this rate. Use if you were still dialling the number in and want past weeks re-judged against it.</div>';
  }

  if (state.settingsTab === "tracking") {
    h += '<label class="eyebrow">Tracking start date (optional)</label>';
    h += '<input id="trackingStartInput" type="date" class="field mono" style="margin:6px 0 6px;" value="'+(state.settings.trackingStartDate||"")+'" max="'+todayStr()+'" />';
    h += '<div class="muted" style="font-size:12px; margin-bottom:16px;">Caps how far back Week/Month/Year totals count. Set this to when you actually started using the app so untracked earlier days aren\'t assumed as saved. Leave blank to count from each period\'s natural start.</div>';
    h += '<button data-action="save-tracking" class="btn-accent" style="width:100%; margin-bottom:20px;">Save</button>';
    h += '<div class="hairline-top" style="padding-top:14px;">';
    h += '<label class="eyebrow">Backup & restore</label>';
    h += '<div class="muted" style="font-size:12px; margin:6px 0 10px;">Copy your data out, or paste it back in — also how you move data between devices or browsers.</div>';
    h += '<button data-action="open-backup" class="btn-outline" style="width:100%;">Open backup & restore</button>';
    h += '</div>';
  }

  if (state.settingsTab === "income") {
    var curInc = incomeForDate(todayStr());
    var curAmt = Number(curInc.amount) || 0;
    var dim = daysInMonth(new Date());
    var monthName = new Date().toLocaleDateString("en-GB",{month:"long"});
    var mBounds = getPeriodBounds("month", 0, currentWeeklyTarget(), dailyReference());
    h += '<label class="eyebrow">Monthly income</label>';
    h += '<div style="position:relative; margin:6px 0 6px;"><span class="muted" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:14px;">AED</span>';
    var shownAmt = (state.incomeDraftAmount != null) ? state.incomeDraftAmount : (curAmt || "");
    h += '<input id="incomeDraftInput" type="number" inputmode="decimal" step="0.01" min="0" class="field mono" style="padding-left:44px;" value="'+esc(shownAmt)+'" /></div>';
    /* Everything else derives from this one number, so show the derived
       figures outright rather than making them guess the arithmetic. */
    h += '<div class="muted" id="incomeDerivedText" style="font-size:12px; margin-bottom:6px;">'+incomeDerivedSummary(curAmt)+'</div>';
    h += '<div class="muted" style="font-size:11px; margin-bottom:14px;">Enter what you actually earn in a month. The monthly figure is spread across that month\u2019s real length ('+dim+' days in '+esc(monthName)+'), so Week and Year views derive from it automatically \u2014 and Year counts only from your tracking start date, not the whole calendar year.</div>';
    h += '<button data-action="apply-income" data-scope="future" class="btn-accent" style="width:100%; margin-bottom:8px;">From this month onward</button>';
    h += '<div class="muted" style="font-size:11px; margin-bottom:12px;">From '+esc(shortLabel(mBounds.startStr))+' forward. Earlier months keep the income they were actually judged against — this is usually what you want.</div>';
    h += '<button data-action="apply-income" data-scope="all" class="btn-outline" style="width:100%; margin-bottom:8px;">All periods, past and future</button>';
    h += '<div class="muted" style="font-size:11px;">Rewrites your whole history to this figure. Use if you were just correcting the number.</div>';
  }

  if (state.settingsTab === "theme") {
    var curBg = state.settings.customDarkBg || PALETTES.dark.bg;
    var curAccent = state.settings.customAccent || PALETTES.dark.accent;
    var hasCustom = !!(state.settings.customDarkBg || state.settings.customAccent);
    h += '<label class="eyebrow">Dark mode background</label>';
    h += '<div class="row gap2" style="margin:8px 0 4px; align-items:center;">';
    h += '<input id="customBgInput" type="color" value="'+curBg+'" style="width:48px; height:40px; border:none; border-radius:10px; padding:0; background:none;" />';
    h += '<span class="mono subhead" id="customBgLabel">'+curBg.toUpperCase()+'</span>';
    h += '</div>';
    h += '<div class="muted footnote" style="margin-bottom:18px;">Card, fill and separator colors update to match, so it stays one cohesive theme.</div>';

    h += '<label class="eyebrow">Accent color</label>';
    h += '<div class="row gap2" style="margin:8px 0 4px; align-items:center;">';
    h += '<input id="customAccentInput" type="color" value="'+curAccent+'" style="width:48px; height:40px; border:none; border-radius:10px; padding:0; background:none;" />';
    h += '<span class="mono subhead" id="customAccentLabel">'+curAccent.toUpperCase()+'</span>';
    h += '</div>';
    h += '<div class="muted footnote" style="margin-bottom:18px;">Used for buttons, active tabs, and chart highlights, in either theme.</div>';

    h += '<button data-action="apply-appearance" class="btn-accent" style="width:100%; margin-bottom:8px;">Apply</button>';
    h += '<button data-action="reset-appearance" class="btn-outline" style="width:100%;'+(hasCustom?"":"opacity:0.4;")+'" '+(hasCustom?"":"disabled")+'>Reset to default</button>';
  }

  if (state.settingsTab === "categories") {
    var groupList = state.settings.categoryGroups||[];
    var catListAll = state.settings.categories||[];

    /* Shared row renderer: identical markup whether a category is nested
       under a group or listed under Ungrouped, so the two can't drift apart.
       "siblings" is whichever list this category's up/down arrows should
       move it within — its group's members, or the ungrouped list — NOT
       necessarily the full flat categories array, so the arrows always
       visibly do something relative to what's on screen. */
    function renderCategoryRow(c, localIdx, siblings) {
      var isEditingStyle = state.categoryStyleEditing === c;
      var isRenaming = state.categoryRenameEditing === c;
      var atTop = localIdx === 0, atBottom = localIdx === siblings.length-1;
      var rh = '<div style="background:var(--card); border:1px solid var(--hairline); border-radius:8px; overflow:hidden;">';
      rh += '<div class="row between" style="padding:7px 8px 7px 8px;">';
      if (isRenaming) {
        rh += '<input id="categoryRenameInput" data-cat="'+esc(c)+'" type="text" class="field" style="flex:1; margin-right:8px; font-size:13px; padding:6px 10px;" value="'+esc(c)+'" />';
        rh += '<div class="row gap2" style="flex-shrink:0;">';
        rh += '<button data-action="save-category-rename" data-cat="'+esc(c)+'" class="btn-plain" style="font-size:13px;">Save</button>';
        rh += '<button data-action="cancel-category-rename" style="background:none;border:none;padding:3px;color:var(--text-muted);" aria-label="Cancel">'+ICONS.x+'</button>';
        rh += '</div>';
      } else {
        rh += '<div class="row gap2" style="align-items:center; min-width:0;">';
        rh += '<button data-action="edit-category-style" data-cat="'+esc(c)+'" style="background:none;border:none;padding:0;flex-shrink:0;" aria-label="Change icon and color">'+catIconCircle(c)+'</button>';
        rh += '<span style="font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">'+esc(c)+'</span>';
        rh += '</div>';
        rh += '<div class="row gap2" style="flex-shrink:0;">';
        rh += '<button data-action="edit-category-name" data-cat="'+esc(c)+'" style="background:none;border:none;padding:3px;color:var(--text-muted);" aria-label="Rename">'+ICONS.pencil+'</button>';
        rh += '<button data-action="move-category" data-cat="'+esc(c)+'" data-dir="-1" style="background:none;border:none;padding:3px;color:'+(atTop?"var(--hairline)":"var(--text-muted)")+';" '+(atTop?"disabled":"")+' aria-label="Move up">'+ICONS.chevronUp+'</button>';
        rh += '<button data-action="move-category" data-cat="'+esc(c)+'" data-dir="1" style="background:none;border:none;padding:3px;color:'+(atBottom?"var(--hairline)":"var(--text-muted)")+';" '+(atBottom?"disabled":"")+' aria-label="Move down">'+ICONS.chevronDown+'</button>';
        rh += '<button data-action="remove-category" data-cat="'+esc(c)+'" style="background:none;border:none;padding:3px;color:var(--text-muted);" aria-label="Remove">'+ICONS.trash+'</button>';
        rh += '</div>';
      }
      rh += '</div>';
      if (!isRenaming && groupList.length) {
        rh += '<div style="padding:0 12px 8px;"><select data-role="category-group-select" data-cat="'+esc(c)+'" class="field" style="font-size:12px; padding:6px 10px;">';
        rh += '<option value=""'+(!categoryGroupOf(c)?' selected':'')+'>No group</option>';
        groupList.forEach(function(g){
          rh += '<option value="'+esc(g)+'"'+(categoryGroupOf(c)===g?' selected':'')+'>'+esc(g)+'</option>';
        });
        rh += '</select></div>';
      }
      if (!isRenaming) {
        var isExcluded = categoryExcludedFromBudget(c);
        rh += '<div class="row between" style="padding:0 12px 10px; align-items:center;">';
        rh += '<span class="muted caption" style="min-width:0;">'+(isExcluded ? "Outside the budget \u2014 tracked as an expense only" : "Counts toward the budget")+'</span>';
        rh += '<button data-action="toggle-category-budget" data-cat="'+esc(c)+'" class="btn-plain" style="flex-shrink:0; color:'+(isExcluded?"var(--rust)":"var(--positive)")+';">'+(isExcluded ? "Excluded" : "Included")+'</button>';
        rh += '</div>';
      }
      if (isEditingStyle) {
        var curStyle = categoryStyle(c);
        var hasCustom = !!(state.settings.categoryStyles && state.settings.categoryStyles[c]);
        rh += '<div style="padding:4px 12px 14px;">';
        rh += '<div class="muted caption" style="margin-bottom:8px;">Icon</div>';
        rh += '<div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;">';
        CAT_ICON_ORDER.forEach(function(iconKey){
          var isSel = curStyle.icon === iconKey;
          rh += '<button data-action="set-category-icon" data-cat="'+esc(c)+'" data-icon="'+iconKey+'" style="width:36px; height:36px; border-radius:50%; background:'+curStyle.color+'; border:'+(isSel?"2px solid var(--text)":"2px solid transparent")+'; display:flex; align-items:center; justify-content:center; padding:0;" aria-label="'+iconKey+'">'+CAT_ICON_SVGS[iconKey]+'</button>';
        });
        rh += '</div>';
        rh += '<div class="muted caption" style="margin-bottom:8px;">Color</div>';
        rh += '<div class="row gap2" style="align-items:center; margin-bottom:12px;">';
        rh += '<input id="categoryColorInput" data-cat="'+esc(c)+'" type="color" value="'+curStyle.color+'" style="width:44px; height:36px; border:none; border-radius:8px; padding:0; background:none;" />';
        rh += '<span class="mono subhead">'+curStyle.color.toUpperCase()+'</span>';
        rh += '</div>';
        rh += '<button data-action="reset-category-style" data-cat="'+esc(c)+'" class="btn-plain" style="'+(hasCustom?"":"opacity:0.4;")+'" '+(hasCustom?"":"disabled")+'>Reset to default</button>';
        rh += '</div>';
      }
      rh += '</div>';
      return rh;
    }

    h += '<label class="eyebrow">Categories</label>';
    h += '<div class="muted caption" style="margin:4px 0 10px;">Organize related categories under a group — e.g. Restaurants, Food & Dining, and Groceries under "Food & Drinks" — so Analysis can show either level. Tap a category\u2019s icon to customize it, or a group\u2019s palette icon to style everyone in it at once.</div>';
    h += '<div style="display:flex; flex-direction:column; gap:8px; margin-bottom:10px;">';

    groupList.forEach(function(g,gi){
      var members = catListAll.filter(function(c){ return categoryGroupOf(c)===g; });
      var isStylingGroup = state.groupStyleEditing === g;
      h += '<div style="background:var(--raised); border:1px solid var(--hairline); border-radius:10px; overflow:hidden;">';
      h += '<div class="row between" style="padding:8px 8px 8px 12px;">';
      h += '<div class="row gap2" style="align-items:baseline; min-width:0;"><span style="font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">'+esc(g)+'</span><span class="muted caption">'+members.length+' categor'+(members.length===1?"y":"ies")+'</span></div>';
      h += '<div class="row gap2" style="flex-shrink:0;">';
      h += '<button data-action="edit-group-style" data-group="'+esc(g)+'" style="background:none;border:none;padding:3px;color:'+(isStylingGroup?"var(--accent)":"var(--text-muted)")+';'+(members.length===0?"opacity:0.35;":"")+'" '+(members.length===0?"disabled":"")+' aria-label="Style all categories in this group">'+ICONS.palette+'</button>';
      h += '<button data-action="move-group" data-group="'+esc(g)+'" data-dir="-1" style="background:none;border:none;padding:3px;color:'+(gi===0?"var(--hairline)":"var(--text-muted)")+';" '+(gi===0?"disabled":"")+' aria-label="Move up">'+ICONS.chevronUp+'</button>';
      h += '<button data-action="move-group" data-group="'+esc(g)+'" data-dir="1" style="background:none;border:none;padding:3px;color:'+(gi===groupList.length-1?"var(--hairline)":"var(--text-muted)")+';" '+(gi===groupList.length-1?"disabled":"")+' aria-label="Move down">'+ICONS.chevronDown+'</button>';
      h += '<button data-action="remove-group" data-group="'+esc(g)+'" style="background:none;border:none;padding:3px;color:var(--text-muted);" aria-label="Remove">'+ICONS.trash+'</button>';
      h += '</div></div>';
      if (isStylingGroup) {
        /* Bulk styling: whatever's picked here is written to every category
           in the group at once, overwriting their individual styles. The
           preview swatch uses the first member's current color so the
           starting point reflects reality rather than an arbitrary default. */
        var seedStyle = categoryStyle(members[0]);
        h += '<div style="padding:4px 12px 14px;">';
        h += '<div class="muted caption" style="margin-bottom:8px;">Apply an icon to all '+members.length+' categor'+(members.length===1?"y":"ies")+' in this group</div>';
        h += '<div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;">';
        CAT_ICON_ORDER.forEach(function(iconKey){
          h += '<button data-action="set-group-icon" data-group="'+esc(g)+'" data-icon="'+iconKey+'" style="width:36px; height:36px; border-radius:50%; background:'+seedStyle.color+'; border:2px solid transparent; display:flex; align-items:center; justify-content:center; padding:0;" aria-label="'+iconKey+'">'+CAT_ICON_SVGS[iconKey]+'</button>';
        });
        h += '</div>';
        h += '<div class="muted caption" style="margin-bottom:8px;">Apply a color to all of them</div>';
        h += '<div class="row gap2" style="align-items:center;">';
        h += '<input id="groupColorInput" data-group="'+esc(g)+'" type="color" value="'+seedStyle.color+'" style="width:44px; height:36px; border:none; border-radius:8px; padding:0; background:none;" />';
        h += '<span class="muted caption">Changes every category in the group</span>';
        h += '</div></div>';
      }
      if (members.length) {
        h += '<div style="padding:0 10px 10px 10px;">';
        h += '<div style="padding-left:14px; border-left:2px solid var(--hairline); display:flex; flex-direction:column; gap:6px;">';
        members.forEach(function(c,ci){ h += renderCategoryRow(c, ci, members); });
        h += '</div></div>';
      } else {
        h += '<div style="padding:0 12px 10px;"><span class="muted caption">No categories yet \u2014 assign one below.</span></div>';
      }
      h += '</div>';
    });

    var ungrouped = catListAll.filter(function(c){ return !categoryGroupOf(c); });
    if (groupList.length) {
      if (ungrouped.length) {
        h += '<div><div class="muted caption" style="padding:2px 2px 6px;">Ungrouped</div>';
        h += '<div style="display:flex; flex-direction:column; gap:6px;">';
        ungrouped.forEach(function(c,ci){ h += renderCategoryRow(c, ci, ungrouped); });
        h += '</div></div>';
      }
    } else {
      h += '<div style="display:flex; flex-direction:column; gap:6px;">';
      catListAll.forEach(function(c,ci){ h += renderCategoryRow(c, ci, catListAll); });
      h += '</div>';
    }
    if (!catListAll.length) h += '<span class="muted" style="font-size:12px;">No categories yet.</span>';
    h += '</div>';

    h += '<div class="row gap2" style="margin-bottom:10px;"><input id="newGroupInput" type="text" class="field" placeholder="New group" style="flex:1;" /><button data-action="add-group" class="btn-outline">Add group</button></div>';
    h += '<div class="row gap2"><input id="newCategoryInput" type="text" class="field" placeholder="New category" style="flex:1;" /><button data-action="add-category" class="btn-outline">Add category</button></div>';
  }

  if (state.settingsTab === "people") {
    h += '<label class="eyebrow">People</label>';
    h += '<div class="muted caption" style="margin:4px 0 10px;">Tag transactions with who they were for, then see the breakdown in Analysis.</div>';
    var peopleListForDefault = state.settings.people||[];
    if (peopleListForDefault.length) {
      h += '<label class="eyebrow">Default person</label>';
      h += '<select id="defaultPersonInput" class="field" style="margin:6px 0 16px;">';
      h += '<option value=""'+(!state.settings.defaultPerson?" selected":"")+'>None \u2014 leave blank each time</option>';
      peopleListForDefault.forEach(function(p){
        h += '<option value="'+esc(p)+'"'+(state.settings.defaultPerson===p?" selected":"")+'>'+esc(p)+'</option>';
      });
      h += '</select>';
      h += '<div class="muted caption" style="margin:-10px 0 16px;">Pre-fills this person on every new transaction \u2014 still changeable per transaction.</div>';
    }
    h += '<div style="display:flex; flex-direction:column; gap:6px; margin-bottom:10px;">';
    var peopleList = state.settings.people||[];
    peopleList.forEach(function(p,pi){
      var isRenamingP = state.personRenameEditing === p;
      h += '<div style="background:var(--raised); border:1px solid var(--hairline); border-radius:8px; padding:7px 8px 7px 12px;">';
      h += '<div class="row between">';
      if (isRenamingP) {
        h += '<input id="personRenameInput" data-person="'+esc(p)+'" type="text" class="field" style="flex:1; margin-right:8px; font-size:13px; padding:6px 10px;" value="'+esc(p)+'" />';
        h += '<div class="row gap2" style="flex-shrink:0;">';
        h += '<button data-action="save-person-rename" data-person="'+esc(p)+'" class="btn-plain" style="font-size:13px;">Save</button>';
        h += '<button data-action="cancel-person-rename" style="background:none;border:none;padding:3px;color:var(--text-muted);" aria-label="Cancel">'+ICONS.x+'</button>';
        h += '</div>';
      } else {
        h += '<div class="row gap2" style="align-items:center; min-width:0;">';
        h += '<input class="person-color-input" data-person="'+esc(p)+'" type="color" value="'+personColor(p)+'" style="width:30px; height:26px; border:none; border-radius:6px; padding:0; background:none; flex-shrink:0;" aria-label="Label color for '+esc(p)+'" />';
        h += personChip(p);
        h += '</div>';
        h += '<div class="row gap2" style="flex-shrink:0;">';
        h += '<button data-action="edit-person-name" data-person="'+esc(p)+'" style="background:none;border:none;padding:3px;color:var(--text-muted);" aria-label="Rename">'+ICONS.pencil+'</button>';
        h += '<button data-action="move-person" data-person="'+esc(p)+'" data-dir="-1" style="background:none;border:none;padding:3px;color:'+(pi===0?"var(--hairline)":"var(--text-muted)")+';" '+(pi===0?"disabled":"")+' aria-label="Move up">'+ICONS.chevronUp+'</button>';
        h += '<button data-action="move-person" data-person="'+esc(p)+'" data-dir="1" style="background:none;border:none;padding:3px;color:'+(pi===peopleList.length-1?"var(--hairline)":"var(--text-muted)")+';" '+(pi===peopleList.length-1?"disabled":"")+' aria-label="Move down">'+ICONS.chevronDown+'</button>';
        h += '<button data-action="remove-person" data-person="'+esc(p)+'" style="background:none;border:none;padding:3px;color:var(--text-muted);" aria-label="Remove">'+ICONS.trash+'</button>';
        h += '</div>';
      }
      h += '</div></div>';
    });
    if (!peopleList.length) h += '<span class="muted" style="font-size:12px;">No people yet.</span>';
    h += '</div>';
    h += '<div class="row gap2"><input id="newPersonInput" type="text" class="field" placeholder="New person" style="flex:1;" /><button data-action="add-person" class="btn-outline">Add</button></div>';
  }

  h += '</div></div>';
  return h;
}

function renderAddTxnModal() {
  var editingItem = null;
  if (state.editingItemId && state.editingOriginalDate) {
    var origDay = state.entries[state.editingOriginalDate];
    if (origDay) editingItem = origDay.items.find(function(i){ return i.id === state.editingItemId; }) || null;
  }
  var formDate = state.entryDate || todayStr();
  var todayEntry = state.entries[formDate];
  var cats = state.settings.categories || [];

  var h = '<div class="modal-backdrop" data-action="close-add-txn">';
  h += '<div class="modal-card" data-action="noop">';
  h += '<div class="grabber"></div>';
  h += '<div class="row between" style="margin-bottom:16px;"><div class="display" style="font-size:18px;">'+(editingItem?"Edit transaction":"Add transaction")+'</div><button data-action="close-add-txn" style="background:none;border:none;color:var(--text-muted);">'+ICONS.x+'</button></div>';
  var splitMode = state.txnSplitMode || "single";
  if (!editingItem) {
    h += '<div class="seg" style="margin-bottom:10px;">';
    h += '<button class="seg-btn" role="tab" aria-selected="'+(splitMode==="single")+'" data-action="set-txn-split-mode" data-mode="single">Single day</button>';
    h += '<button class="seg-btn" role="tab" aria-selected="'+(splitMode==="split")+'" data-action="set-txn-split-mode" data-mode="split">Split across days</button>';
    h += '</div>';
  }
  h += '<input id="entryDateInput" type="date" class="field mono" style="margin-bottom:8px;" value="'+formDate+'" max="'+todayStr()+'" />';
  h += '<div style="position:relative; margin-bottom:8px;"><span class="muted" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:14px; pointer-events:none;">AED</span>';
  h += '<input id="entryAmountInput" type="number" inputmode="decimal" step="0.01" min="0" class="field mono" style="padding-left:44px;" placeholder="'+(splitMode==="split"&&!editingItem?"Total amount":"Amount")+'" value="'+(state.entryAmountDraft != null ? esc(state.entryAmountDraft) : (editingItem?editingItem.amount:""))+'" /></div>';
  var groupsForTxn = state.settings.categoryGroups||[];
  var selectedCatForTxn = state.entryCategoryDraft != null ? state.entryCategoryDraft : (editingItem ? (editingItem.category||"") : "");
  /* How many times each category has actually been logged, all-time — used
     to rank categories within their group so the most relevant ones surface
     first instead of whatever order they happen to sit in in Settings. */
  var catUsageCounts = {};
  Object.keys(state.entries).forEach(function(d){
    (state.entries[d].items||[]).forEach(function(it){
      if (it.category) catUsageCounts[it.category] = (catUsageCounts[it.category]||0) + 1;
    });
  });
  function sortCatsByUsage(list) {
    return list.slice().sort(function(a,b){
      var diff = (catUsageCounts[b]||0) - (catUsageCounts[a]||0);
      if (diff !== 0) return diff;
      return list.indexOf(a) - list.indexOf(b); // stable tiebreak: original relative order
    });
  }
  if (groupsForTxn.length) {
    /* Cascading picker: choosing a group narrows the category list to just
       that group's members, so a long flat list never has to be scrolled.
       "Ungrouped" is offered as its own bucket so categories that aren't in
       any group are still reachable. The selected group defaults to whatever
       the editing item's category belongs to, so editing opens on the right
       list rather than resetting. */
    var editCatGroup = editingItem && editingItem.category ? (categoryGroupOf(editingItem.category) || "__ungrouped__") : "";
    var activeTxnGroup = state.txnCategoryGroup != null ? state.txnCategoryGroup : editCatGroup;
    var ungroupedCats = cats.filter(function(c){ return !categoryGroupOf(c); });
    h += '<div class="row gap2" style="margin-bottom:8px;">';
    h += '<select id="entryGroupInput" class="field" style="flex:1; min-width:0;">';
    h += '<option value=""'+(activeTxnGroup===""?" selected":"")+'>All groups</option>';
    groupsForTxn.forEach(function(g){
      h += '<option value="'+esc(g)+'"'+(activeTxnGroup===g?" selected":"")+'>'+esc(g)+'</option>';
    });
    if (ungroupedCats.length) h += '<option value="__ungrouped__"'+(activeTxnGroup==="__ungrouped__"?" selected":"")+'>Ungrouped</option>';
    h += '</select>';
    h += '<select id="entryCategoryInput" class="field" style="flex:1; min-width:0;">';
    h += '<option value="">No category</option>';
    if (!activeTxnGroup) {
      /* "All groups": organize by group (in the user's own established group
         order from Settings), most-used category first within each, then an
         Ungrouped bucket at the end — instead of one flat, unsorted list. */
      groupsForTxn.forEach(function(g){
        var members = sortCatsByUsage(cats.filter(function(c){ return categoryGroupOf(c)===g; }));
        if (!members.length) return;
        h += '<optgroup label="'+esc(g)+'">';
        members.forEach(function(c){
          h += '<option value="'+esc(c)+'"'+(selectedCatForTxn===c?" selected":"")+'>'+esc(c)+'</option>';
        });
        h += '</optgroup>';
      });
      var sortedUngrouped = sortCatsByUsage(ungroupedCats);
      if (sortedUngrouped.length) {
        h += '<optgroup label="Ungrouped">';
        sortedUngrouped.forEach(function(c){
          h += '<option value="'+esc(c)+'"'+(selectedCatForTxn===c?" selected":"")+'>'+esc(c)+'</option>';
        });
        h += '</optgroup>';
      }
    } else {
      var visibleCats = activeTxnGroup === "__ungrouped__" ? ungroupedCats : cats.filter(function(c){ return categoryGroupOf(c)===activeTxnGroup; });
      sortCatsByUsage(visibleCats).forEach(function(c){
        h += '<option value="'+esc(c)+'"'+(selectedCatForTxn===c?" selected":"")+'>'+esc(c)+'</option>';
      });
    }
    h += '</select>';
    h += '</div>';
  } else {
    h += '<select id="entryCategoryInput" class="field" style="margin-bottom:8px;">';
    h += '<option value="">No category</option>';
    sortCatsByUsage(cats).forEach(function(c){
      h += '<option value="'+esc(c)+'"'+(selectedCatForTxn===c?" selected":"")+'>'+esc(c)+'</option>';
    });
    h += '</select>';
  }
  var peopleForTxn = state.settings.people||[];
  if (peopleForTxn.length) {
    var personSplitMode = peopleForTxn.length >= 2 ? (state.txnPersonSplitMode||"single") : "single";
    if (peopleForTxn.length >= 2) {
      h += '<div class="seg" style="margin-bottom:8px;">';
      h += '<button class="seg-btn" role="tab" aria-selected="'+(personSplitMode==="single")+'" data-action="set-txn-person-split-mode" data-mode="single">Single person</button>';
      h += '<button class="seg-btn" role="tab" aria-selected="'+(personSplitMode==="split")+'" data-action="set-txn-person-split-mode" data-mode="split">Split between people</button>';
      h += '</div>';
    }
    if (personSplitMode === "single") {
      var preselectedPerson = state.entryPersonDraft != null ? state.entryPersonDraft : (editingItem ? (editingItem.person||"") : (state.settings.defaultPerson||""));
      h += '<select id="entryPersonInput" class="field" style="margin-bottom:8px;">';
      h += '<option value=""'+(preselectedPerson===""?" selected":"")+'>Who\u2019s this for? (optional)</option>';
      peopleForTxn.forEach(function(p){
        h += '<option value="'+esc(p)+'"'+(preselectedPerson===p?" selected":"")+'>'+esc(p)+'</option>';
      });
      h += '</select>';
    } else {
      /* Percentages, not fixed amounts: the split stays correct even if the
         total amount is edited afterward, and 10% increments keep the
         picker to a plain native <select> (no free-text math to get wrong). */
      var existingSplit = {};
      if (state.entryPersonSplitDraft) {
        Object.keys(state.entryPersonSplitDraft).forEach(function(p){
          existingSplit[p] = parseInt(state.entryPersonSplitDraft[p], 10) || 0;
        });
      } else if (editingItem && editingItem.personSplit) {
        editingItem.personSplit.forEach(function(ps){ existingSplit[ps.person] = ps.pct; });
      }
      var splitInitTotal = 0;
      h += '<div class="card" style="padding:10px 12px; margin-bottom:8px;">';
      peopleForTxn.forEach(function(p){
        var curPct = existingSplit[p] || 0;
        splitInitTotal += curPct;
        h += '<div class="row between" style="padding:5px 0;">';
        h += '<span style="font-size:13px;">'+esc(p)+'</span>';
        h += '<select class="split-person-pct field mono" data-person="'+esc(p)+'" style="width:84px; padding:6px 8px; font-size:13px;">';
        var pctOptions = [];
        for (var pctOpt=0; pctOpt<=100; pctOpt+=10) pctOptions.push(pctOpt);
        if (curPct % 10 !== 0 && pctOptions.indexOf(curPct) === -1) pctOptions.push(curPct);
        pctOptions.sort(function(a,b){ return a-b; });
        pctOptions.forEach(function(opt){
          h += '<option value="'+opt+'"'+(curPct===opt?' selected':'')+'>'+opt+'%</option>';
        });
        h += '</select></div>';
      });
      var splitTotalColor = splitInitTotal===100 ? "var(--positive)" : (splitInitTotal===0 ? "var(--text-muted)" : "var(--rust)");
      h += '<div class="row between hairline-top" style="padding-top:8px; margin-top:2px;">';
      h += '<span class="muted caption">Total</span>';
      h += '<span id="splitPersonTotal" class="mono caption" style="font-weight:600; color:'+splitTotalColor+';">'+splitInitTotal+'%</span>';
      h += '</div></div>';
    }
  }
  h += '<input id="entryNoteInput" type="text" class="field" style="margin-bottom:12px;" placeholder="What was it for? (optional)" value="'+(state.entryNoteDraft != null ? esc(state.entryNoteDraft) : (editingItem?esc(editingItem.note||""):""))+'" />';
  if (!editingItem && splitMode === "split") {
    h += '<input id="splitDaysInput" type="number" inputmode="numeric" min="2" step="1" class="field" style="margin-bottom:8px;" placeholder="Number of days" value="'+(state.entrySplitDaysDraft != null ? esc(state.entrySplitDaysDraft) : "")+'" />';
    h += '<div class="muted caption" style="margin-bottom:12px;">Spreads the total evenly starting from the date above, one share per day. Days still to come are logged as they arrive \u2014 track progress under Plans.</div>';
  }
  h += '<button id="addTxnBtn" data-action="add-transaction" class="btn-accent row gap2" style="width:100%; justify-content:center; align-items:center;">'+(editingItem?ICONS.check+" Save":ICONS.plus+" Add")+'</button>';
  h += '<div id="entryHint" class="muted" style="font-size:11px; margin-top:8px;">'+(todayEntry && !editingItem ? (esc(dayLabel(formDate))+" so far: "+todayEntry.items.length+" transaction"+(todayEntry.items.length===1?"":"s")+", "+fmt(sumSpent(todayEntry),2)+" AED total.") : "")+'</div>';
  h += '</div></div>';
  return h;
}

function renderFab() {
  return '<button data-action="open-add-txn" aria-label="Add transaction" style="position:fixed; right:calc(env(safe-area-inset-right,0px) + 18px); bottom:calc(var(--vvb, 0px) + env(safe-area-inset-bottom,0px) + 78px); width:52px; height:52px; border-radius:999px; background:var(--accent); color:var(--accent-ink); border:none; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(0,0,0,0.35); z-index:45;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>';
}

function renderTransactionsBody() {
  var entryDates = Object.keys(state.entries).sort();
  var cumAnchor = state.settings.trackingStartDate || (entryDates.length ? entryDates[0] : todayStr());
  var cs = periodStats(cumAnchor, todayStr());
  var acc = 0;
  var balanceMap = {};
  cs.rows.forEach(function(r){ acc = round2(acc + (r.allowance-r.spent)); balanceMap[r.date] = acc; });

  var groupFilter = state.txnGroupFilter || "";
  var categoryFilter = state.txnCategoryFilter || "";
  var personFilter = state.txnPersonFilter || "";
  var periodMode = state.txnPeriodMode || "all";
  var periodFrom = state.txnPeriodFrom || "";
  var periodTo = state.txnPeriodTo || "";
  var info = getTxnPeriodInfo();
  function itemCat(it){ return it.category || "Uncategorised"; }
  function inPeriod(d) { return d >= info.start && d <= info.end; }
  function itemMatchesGroup(it) {
    if (!groupFilter) return true;
    if (groupFilter === "__ungrouped__") return !categoryGroupOf(it.category);
    return categoryGroupOf(it.category) === groupFilter;
  }
  /* A person filter matches either the single-person field or, for a
     percentage split, anyone included in that split — being included at
     any share still means the transaction was at least partly for them. */
  function itemMatchesPerson(it) { return itemMatchesPersonFilter(it, personFilter); }
  function itemMatchesFilters(it) {
    return (!categoryFilter || itemCat(it) === categoryFilter) && itemMatchesGroup(it) && itemMatchesPerson(it);
  }
  var periodActive = periodMode !== "all";
  var anyItemFilterActive = !!categoryFilter || !!groupFilter || !!personFilter;
  var anyFilterActive = anyItemFilterActive || periodActive;

  var groupListForFilter = state.settings.categoryGroups||[];
  var ungroupedCatsExist = (state.settings.categories||[]).some(function(c){ return !categoryGroupOf(c); });
  /* Cascading, same pattern as the add-transaction modal: picking a group
     narrows the category list to just its members, so a long flat list
     never has to be scrolled just to filter down to one bucket. */
  var filterOptions = !groupFilter
    ? (state.settings.categories||[]).slice()
    : (groupFilter === "__ungrouped__"
        ? (state.settings.categories||[]).filter(function(c){ return !categoryGroupOf(c); })
        : (state.settings.categories||[]).filter(function(c){ return categoryGroupOf(c)===groupFilter; }));
  if (!groupFilter || groupFilter === "__ungrouped__") filterOptions.push("Uncategorised");

  var filterCount = 0, filterSum = 0;
  entryDates.forEach(function(d){
    if (!inPeriod(d)) return;
    state.entries[d].items.forEach(function(it){
      if (itemMatchesFilters(it)) { filterCount++; filterSum += personScopedAmount(it, personFilter); }
    });
  });

  var h = '<div class="card" style="overflow:hidden; margin-bottom:16px;">';
  h += '<div class="eyebrow" style="padding:16px 16px 4px;">All transactions</div>';
  h += '<div class="muted" style="font-size:11px; padding:0 16px 12px;">Balance is a running total — days between entries you didn\'t log still count, assumed fully saved.</div>';

  if (groupListForFilter.length) {
    h += '<div style="padding:0 16px 8px;"><select id="txnGroupFilterSelect" class="field" style="font-size:13px;">';
    h += '<option value=""'+(groupFilter===""?" selected":"")+'>All groups</option>';
    groupListForFilter.forEach(function(g){
      h += '<option value="'+esc(g)+'"'+(groupFilter===g?" selected":"")+'>'+esc(g)+'</option>';
    });
    if (ungroupedCatsExist) h += '<option value="__ungrouped__"'+(groupFilter==="__ungrouped__"?" selected":"")+'>Ungrouped</option>';
    h += '</select></div>';
  }

  h += '<div style="padding:0 16px 8px;"><select id="txnCategoryFilterSelect" class="field" style="font-size:13px;">';
  h += '<option value=""'+(categoryFilter===""?" selected":"")+'>All categories</option>';
  filterOptions.forEach(function(c){
    h += '<option value="'+esc(c)+'"'+(categoryFilter===c?" selected":"")+'>'+esc(c)+'</option>';
  });
  h += '</select></div>';

  var peopleListForFilter = state.settings.people||[];
  if (peopleListForFilter.length) {
    h += '<div style="padding:0 16px 8px;"><select id="txnPersonFilterSelect" class="field" style="font-size:13px;">';
    h += '<option value=""'+(personFilter===""?" selected":"")+'>All people</option>';
    peopleListForFilter.forEach(function(p){
      h += '<option value="'+esc(p)+'"'+(personFilter===p?" selected":"")+'>'+esc(p)+'</option>';
    });
    h += '<option value="__unassigned__"'+(personFilter==="__unassigned__"?" selected":"")+'>Unassigned</option>';
    h += '</select></div>';
  }

  h += '<div style="padding:0 16px 8px;"><div class="seg">';
  [["all","All"],["week","Week"],["month","Month"],["year","Year"],["custom","Custom"]].forEach(function(opt){
    var active = periodMode === opt[0];
    h += '<button class="seg-btn" role="tab" aria-selected="'+active+'" data-action="set-txn-period" data-mode="'+opt[0]+'">'+opt[1]+'</button>';
  });
  h += '</div></div>';

  if (periodMode === "custom") {
    h += '<div class="row gap2" style="padding:0 16px 8px;">';
    h += '<input id="txnPeriodFromInput" type="date" class="field mono" style="flex:1; font-size:13px;" value="'+esc(periodFrom)+'" max="'+todayStr()+'" />';
    h += '<input id="txnPeriodToInput" type="date" class="field mono" style="flex:1; font-size:13px;" value="'+esc(periodTo)+'" max="'+todayStr()+'" />';
    h += '</div>';
  } else if (periodMode !== "all") {
    h += '<div style="padding:0 16px 8px;"><div class="row between card" style="padding:8px 10px;">';
    h += '<button data-action="txn-nav-offset" data-delta="-1" class="icon-btn" style="border-radius:10px;" aria-label="Previous">'+ICONS.chevronLeft+'</button>';
    h += '<div style="text-align:center; min-width:0;"><div style="font-size:13px; font-weight:500;">'+esc(info.title)+'</div>';
    h += '<div class="eyebrow" style="margin-top:2px;">'+esc(info.sub)+'</div></div>';
    h += '<button data-action="txn-nav-offset" data-delta="1" class="icon-btn" style="border-radius:10px;'+(info.isCurrent?"opacity:0.3;pointer-events:none;":"")+'" aria-label="Next">'+ICONS.chevronRight+'</button>';
    h += '</div></div>';
  }

  if (anyFilterActive) {
    var descParts = [];
    if (groupFilter) descParts.push("in "+(groupFilter==="__ungrouped__"?"Ungrouped":groupFilter));
    if (categoryFilter) descParts.push("in "+categoryFilter);
    if (personFilter) descParts.push("for "+(personFilter==="__unassigned__"?"Unassigned":personFilter));
    if (periodMode === "week") descParts.push("week of "+shortLabel(info.start));
    if (periodMode === "month") descParts.push(parseD(info.start).toLocaleDateString("en-GB",{month:"long",year:"numeric"}));
    if (periodMode === "year") descParts.push(info.title);
    if (periodMode === "custom") descParts.push(shortLabel(info.start)+" – "+shortLabel(info.end));
    h += '<div class="muted" style="font-size:11px; padding:0 16px 12px;">'+filterCount+' transaction'+(filterCount===1?"":"s")+' · '+fmt(filterSum,2)+' AED total'+(descParts.length?" "+esc(descParts.join(", ")):"")+'</div>';
  }

  var datesDesc = entryDates.slice().reverse();
  var dates = datesDesc.filter(function(d){
    if (!inPeriod(d)) return false;
    if (anyItemFilterActive) return state.entries[d].items.some(itemMatchesFilters);
    return true;
  });

  if (dates.length === 0) {
    h += '<div class="muted" style="padding:0 16px 20px; font-size:14px;">'+(anyFilterActive ? "No matching transactions." : "Nothing logged yet.")+'</div>';
  } else {
    dates.forEach(function(date, i){
      var day = state.entries[date];
      var spent = sumSpentForBasis(day);
      var dayRef = referenceForDate(date);
      var delta = dayRef - spent;
      var bal = balanceMap[date];
      var displayItems = anyItemFilterActive ? day.items.filter(itemMatchesFilters) : day.items;
      var dayFilteredSpent = displayItems.reduce(function(s,it){ return s+personScopedAmount(it, personFilter); }, 0);
      h += '<div style="padding:12px 16px;'+(i===0?"":"border-top:1px solid var(--hairline);")+'">';
      h += '<div class="row between">';
      h += '<div><div style="font-size:14px;">'+esc(dayLabel(date))+'</div>';
      h += '<div class="mono muted" style="font-size:11px; margin-top:2px;">'+day.items.length+' txn'+(day.items.length===1?"":"s")+' · spent '+fmt(spent,2)+' of '+fmt(dayRef,2)+(anyItemFilterActive?' · '+displayItems.length+' match'+(displayItems.length===1?"":"es"):"")+'</div></div>';
      if (anyItemFilterActive) {
        h += '<div style="text-align:right;"><div class="mono" style="font-size:12px; color:var(--rust);">−'+fmt(dayFilteredSpent,2)+'</div>';
        h += '<div class="mono muted" style="font-size:10px;">filtered</div></div>';
      } else {
        h += '<div style="text-align:right;"><div class="mono" style="font-size:12px; color:'+(delta>=0?"var(--positive)":"var(--rust)")+';">'+(delta>=0?"+":"−")+fmt(Math.abs(delta),2)+'</div>';
        h += '<div class="mono muted" style="font-size:10px;">bal '+fmt(bal,0)+'</div></div>';
      }
      h += '</div>';
      h += '<div style="margin-top:4px;">';
      newestFirst(displayItems).forEach(function(it){
        h += renderTxnRow(date, it);
      });
      h += '</div></div>';
      if (!anyFilterActive && i < dates.length - 1) {
        var gapDays = daysBetween(dates[i+1], date) - 1;
        if (gapDays > 0) {
          var gapAmount = round2(gapDays * dailyReference());
          h += '<div style="padding:6px 16px; text-align:center; font-size:10px; color:var(--text-muted); background:var(--raised); border-top:1px solid var(--hairline); border-bottom:1px solid var(--hairline);">'+gapDays+' unlogged day'+(gapDays===1?"":"s")+' in between · assumed +'+fmt(gapAmount,0)+' AED saved</div>';
        }
      }
    });
  }
  h += '</div>';
  h += '<div style="text-align:center; margin-bottom:16px;"><button data-action="open-reset" style="background:none;border:none;padding:0;color:var(--text-muted);font-size:11px;">Clear all entries</button></div>';
  return h;
}

function legendSwatch(bg, label, fg) {
  return '<div class="row" style="align-items:center; gap:5px;"><span style="width:10px; height:10px; border-radius:3px; background:'+bg+'; display:inline-block;"></span><span style="font-size:10px; color:'+(fg||"var(--text-muted)")+';">'+esc(label)+'</span></div>';
}

/* Shared transaction-row renderer used by both the Transactions page and the
   Calendar day-detail panel, so the two never visually drift apart. */
function renderTxnRow(date, it) {
  var key = date+"|"+it.id;
  if (state.pendingDeleteKey === key) {
    return '<div class="row between" style="background:var(--rust-wash); border-radius:8px; padding:8px 10px; margin-bottom:2px;">'
      + '<span style="font-size:12px;">Delete this?</span>'
      + '<div class="row gap2"><button data-action="delete-txn" data-date="'+date+'" data-id="'+esc(it.id)+'" style="background:var(--rust);border:none;border-radius:5px;padding:4px;color:#fff;" aria-label="Confirm delete">'+ICONS.check+'</button>'
      + '<button data-action="cancel-delete-txn" style="background:none;border:1px solid var(--hairline);border-radius:5px;padding:4px;color:var(--text-muted);" aria-label="Cancel">'+ICONS.x+'</button></div></div>';
  }
  var h = '<div class="row" style="align-items:center; gap:10px; padding:6px 0; margin-bottom:2px;">';
  h += '<button data-action="edit-txn" data-date="'+date+'" data-id="'+esc(it.id)+'" style="background:none;border:none;padding:0;flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;">';
  h += catIconCircle(it.category);
  h += '<span style="min-width:0; flex:1;">';
  var seqBadge = "";
  if (it.recurringId) {
    seqBadge = (it.seq && it.seqTotal)
      ? '<span class="mono" style="color:var(--text-muted); flex-shrink:0; font-size:10px;">'+it.seq+'/'+it.seqTotal+'</span>'
      : '<span style="color:var(--text-muted); flex-shrink:0;" title="Recurring payment">'+ICONS.repeat+'</span>';
  }
  h += '<div style="font-size:13px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:5px;">'+(it.category?esc(it.category):"Spent")+seqBadge+'</div>';
  if (it.note) h += '<div class="muted" style="font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">'+esc(it.note)+'</div>';
  var chipHtml = "";
  if (it.personSplit && it.personSplit.length) {
    chipHtml = it.personSplit.map(function(ps){
      return personChip(ps.person, "small")+'<span class="muted" style="font-size:10px; margin-left:3px;">'+ps.pct+'%</span>';
    }).join('<span style="display:inline-block; width:6px;"></span>');
  } else if (it.person) {
    chipHtml = personChip(it.person, "small");
  }
  if (chipHtml) h += '<div style="margin-top:3px; display:flex; align-items:center; flex-wrap:wrap; gap:2px;">'+chipHtml+'</div>';
  h += '</span></button>';
  h += '<div class="mono" style="font-size:13px; font-weight:600; color:var(--rust); flex-shrink:0;">−'+fmt(it.amount,2)+' AED</div>';
  h += '<button data-action="ask-delete-txn" data-date="'+date+'" data-id="'+esc(it.id)+'" style="background:none;border:none;padding:4px;color:var(--text-muted);flex-shrink:0;" aria-label="Delete">'+ICONS.trash+'</button>';
  h += '</div>';
  return h;
}

function renderCalendarBody() {
  var base = addMonths(startOfMonth(new Date()), state.calendarOffset);
  var monthStartStr = toStr(base);
  var monthEndStr = toStr(endOfMonth(base));
  var title = base.toLocaleDateString("en-GB",{month:"long",year:"numeric"});
  var da = dailyReference();
  var today = todayStr();
  var tsd = state.settings.trackingStartDate;

  var h = "";
  h += '<div class="card" style="padding:14px; margin-bottom:12px;">';
  h += '<div class="row between" style="margin-bottom:12px;">';
  h += '<button data-action="cal-nav" data-delta="-1" class="icon-btn" style="border-radius:10px;" aria-label="Previous month">'+ICONS.chevronLeft+'</button>';
  h += '<div style="font-size:15px; font-weight:500;">'+esc(title)+'</div>';
  h += '<button data-action="cal-nav" data-delta="1" class="icon-btn" style="border-radius:10px;'+(state.calendarOffset>=0?"opacity:0.3;pointer-events:none;":"")+'" aria-label="Next month">'+ICONS.chevronRight+'</button>';
  h += '</div>';

  h += '<div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:6px;">';
  ["Mo","Tu","We","Th","Fr","Sa","Su"].forEach(function(lbl){ h += '<div class="muted" style="text-align:center; font-size:10px;">'+lbl+'</div>'; });
  h += '</div>';

  var firstDow = base.getDay();
  var leadingBlanks = firstDow===0 ? 6 : firstDow-1;
  h += '<div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px;">';
  for (var i=0;i<leadingBlanks;i++) h += '<div></div>';

  var cur = parseD(monthStartStr);
  while (toStr(cur) <= monthEndStr) {
    var ds = toStr(cur);
    var e = state.entries[ds];
    var logged = !!e;
    var spent = logged ? sumSpentForBasis(e) : 0;
    var allowance = referenceForDate(ds);
    var isFuture = ds > today;
    var isPreTracking = tsd && ds < tsd;
    var isToday = ds === today;
    var isSelected = state.calendarSelectedDate === ds;

    var bg, fg;
    if (isFuture) { bg = "transparent"; fg = "var(--text-muted)"; }
    else if (isPreTracking) { bg = "var(--raised)"; fg = "var(--text-muted)"; }
    else if (!logged) { bg = "rgba(224,179,104,0.14)"; fg = "var(--text)"; }
    else if (spent <= allowance) { bg = "var(--positive-wash)"; fg = "var(--text)"; }
    else { bg = "var(--rust-wash)"; fg = "var(--rust)"; }

    var isTracked = !isFuture && !isPreTracking;
    var border = isToday ? "2px solid var(--accent)" : (isSelected ? "2px solid var(--text)" : "1px solid transparent");
    h += '<button data-action="cal-select" data-date="'+ds+'" style="min-height:64px; border-radius:9px; border:'+border+'; background:'+bg+'; color:'+fg+'; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4px 1px; min-width:0; gap:3px;">';
    h += '<span style="font-size:14px; font-weight:500;">'+cur.getDate()+'</span>';
    var spentText = logged ? fmt(spent,0) : (isTracked ? "0" : "\u00A0");
    h += '<span class="mono" style="font-size:10px; line-height:1;">'+spentText+'</span>';
    var dayDelta = allowance - spent;
    var deltaText = "\u00A0", deltaClr = fg;
    if (isTracked) {
      deltaClr = dayDelta >= 0 ? "var(--positive)" : "var(--rust)";
      deltaText = (dayDelta>=0?"+":"−")+fmt(Math.abs(dayDelta),0);
    }
    h += '<span class="mono" style="font-size:10px; line-height:1; color:'+deltaClr+';">'+deltaText+'</span>';
    h += '</button>';
    cur = addDays(cur,1);
  }
  h += '</div>';
  h += '</div>'; // end grid card

  h += '<div class="row" style="gap:14px; margin-bottom:16px; flex-wrap:wrap;">';
  h += legendSwatch("var(--positive-wash)", "Under budget");
  h += legendSwatch("var(--rust-wash)", "Over budget", "var(--rust)");
  h += legendSwatch("rgba(224,179,104,0.14)", "Not logged");
  h += legendSwatch("var(--raised)", "Before tracking");
  h += '</div>';

  if (state.calendarSelectedDate) {
    var sd = state.calendarSelectedDate;
    var sday = state.entries[sd];
    h += '<div class="card" style="padding:16px;">';
    h += '<div class="eyebrow" style="margin-bottom:8px;">'+esc(dayLabel(sd))+'</div>';
    if (sday && sday.items.length) {
      newestFirst(sday.items).forEach(function(it){
        h += renderTxnRow(sd, it);
      });
    } else {
      h += '<div class="muted" style="font-size:13px;">Nothing logged this day.</div>';
    }
    h += '</div>';
  }

  return h;
}

var PIE_COLORS = ["#E0B368","#5EBD8C","#7BA7D4","#D4614A","#B58BD0","#5FC2C2","#E08A5E","#9AAF7A","#C77FA3","#7E8CC4"];

function categoryStyle(name) {

  if (custom) return { icon: (custom.icon && CAT_ICON_SVGS[custom.icon]) ? custom.icon : "tag", color: custom.color || "#8595B5" };
  if (CATEGORY_STYLES[name]) return CATEGORY_STYLES[name];
  var hash = 0;
  for (var i=0;i<name.length;i++) hash = (hash*31 + name.charCodeAt(i)) >>> 0;
  return { icon:"tag", color: PIE_COLORS[hash % PIE_COLORS.length] };
}
