function handleCancelEdit() {
  state.editingItemId = null;
  state.editingOriginalDate = null;
  render();
}

function handleDeleteTxn(date, id) {
  var day = state.entries[date];
  if (!day) return;
  var remaining = day.items.filter(function(i){ return i.id !== id; });
  var nextEntries = Object.assign({}, state.entries);
  if (remaining.length === 0) delete nextEntries[date]; else nextEntries[date] = Object.assign({}, day, { items: remaining });
  if (state.editingItemId === id) { state.editingItemId = null; state.editingOriginalDate = null; }
  persistAll(state.settings, nextEntries, "your entry");
  render();
}

/* render() rebuilds the whole DOM from scratch on every call, including
   whatever's currently on screen in the Add Transaction sheet — so any
   in-place toggle within that sheet (day-split mode, person-split mode,
   category group) needs to stash the sheet's current values into state
   first, or they'd silently reset the moment the toggle re-renders it.
   Called at the top of every such toggle handler, before it touches other
   state and calls render(). */
/* Same root cause as preserveTxnFormDraft, same fix: the Add Recurring
   Payment form's fields have no draft state of their own, so toggling the
   limit-mode segmented control (or pausing/deleting a DIFFERENT rule on the
   same page) rebuilds the DOM and silently erases whatever's been typed
   into this form. Called before any such action mutates state and renders. */
function preserveRecurringFormDraft() {
  var pairs = [
    ["recurringAmountInput","recurringAmountDraft"],
    ["recurringCategoryInput","recurringCategoryDraft"],
    ["recurringPersonInput","recurringPersonDraft"],
    ["recurringNoteInput","recurringNoteDraft"],
    ["recurringFrequencyInput","recurringFrequencyDraft"],
    ["recurringStartDateInput","recurringStartDateDraft"],
    ["recurringCountInput","recurringCountDraft"],
    ["recurringEndDateInput","recurringEndDateDraft"]
  ];
  pairs.forEach(function(p){
    var el = document.getElementById(p[0]);
    if (el) state[p[1]] = el.value;
  });
}

function preserveTxnFormDraft() {
  var amtEl = document.getElementById("entryAmountInput");
  var noteEl = document.getElementById("entryNoteInput");
  var daysEl = document.getElementById("splitDaysInput");
  var catEl = document.getElementById("entryCategoryInput");
  var personEl = document.getElementById("entryPersonInput");
  if (amtEl) state.entryAmountDraft = amtEl.value;
  if (noteEl) state.entryNoteDraft = noteEl.value;
  if (daysEl) state.entrySplitDaysDraft = daysEl.value;
  if (catEl) state.entryCategoryDraft = catEl.value;
  if (personEl) state.entryPersonDraft = personEl.value;
  var pctSelects = document.querySelectorAll(".split-person-pct");
  if (pctSelects.length) {
    var draft = {};
    pctSelects.forEach(function(s){ draft[s.dataset.person] = s.value; });
    state.entryPersonSplitDraft = draft;
  }
}

function handleQuickDate(date) {
  state.entryDate = date;
  var dateEl = document.getElementById("entryDateInput");
  if (dateEl) dateEl.value = date;
  var hintEl = document.getElementById("entryHint");
  if (hintEl) {
    var day = state.entries[date];
    hintEl.innerHTML = day ? (esc(dayLabel(date))+" so far: "+day.items.length+" transaction"+(day.items.length===1?"":"s")+", "+fmt(sumSpent(day),2)+" AED total.") : "";
  }
}

function handleCopyBackup() {
  var btn = document.getElementById("copyBackupBtn");
  var text = JSON.stringify({settings:state.settings, entries:state.entries}, null, 2);
  function done(msg) { if (btn) { btn.textContent = msg; setTimeout(function(){ if(btn) btn.textContent = "Copy backup"; }, 2500); } }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ done("Copied ✓"); }).catch(function(){ done("Select the text above to copy"); });
  } else {
    done("Select the text above to copy");
  }
}

function validateBackupEntries(entries) {
  if (!entries || typeof entries !== "object" || Array.isArray(entries)) return false;
  var dates = Object.keys(entries);
  for (var d=0; d<dates.length; d++) {
    var ds = dates[d];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(ds)) return false;
    var day = entries[ds];
    if (!day || typeof day !== "object" || Array.isArray(day)) return false;
    /* Legacy backups stored one numeric `spent` value instead of item rows. */
    if (!Array.isArray(day.items)) {
      if (typeof day.spent !== "number" || !isFinite(day.spent) || day.spent < 0) return false;
      continue;
    }
    for (var i=0; i<day.items.length; i++) {
      var it = day.items[i];
      if (!it || typeof it !== "object" || Array.isArray(it)) return false;
      if (typeof it.amount !== "number" || !isFinite(it.amount) || it.amount < 0) return false;
      if (it.personSplit != null) {
        if (!Array.isArray(it.personSplit)) return false;
        var pctTotal = 0;
        for (var j=0; j<it.personSplit.length; j++) {
          var ps = it.personSplit[j];
          if (!ps || typeof ps.person !== "string" || typeof ps.pct !== "number" || !isFinite(ps.pct) || ps.pct < 0 || ps.pct > 100) return false;
          pctTotal += ps.pct;
        }
        if (it.personSplit.length && Math.abs(pctTotal - 100) > 0.001) return false;
      }
    }
  }
  return true;
}

function handleRestore() {
  var el = document.getElementById("restoreInput");
  var raw = el ? el.value : "";
  try {
    var parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object" || !validateBackupEntries(parsed.entries)) throw new Error("bad shape");
    var nextSettings = Object.assign({}, DEFAULT_SETTINGS, parsed.settings||{});
    nextSettings.analysisSectionOrder = normalizeAnalysisOrder(nextSettings.analysisSectionOrder);
    nextSettings.analysisHiddenSections = normalizeHiddenSections(nextSettings.analysisHiddenSections);
    nextSettings.incomeHistory = normalizeIncomeHistory(nextSettings.incomeHistory);
    nextSettings.categoryStyles = normalizeCategoryStyles(nextSettings.categoryStyles, nextSettings.categories);
    nextSettings.categoryGroups = normalizeCategoryGroups(nextSettings.categoryGroups);
    nextSettings.categoryGroupOf = normalizeCategoryGroupOf(nextSettings.categoryGroupOf, nextSettings.categories, nextSettings.categoryGroups);
    nextSettings.people = normalizePeople(nextSettings.people);
    nextSettings.personColors = normalizePersonColors(nextSettings.personColors, nextSettings.people);
    nextSettings.categoryExcludeFromBudget = normalizeCategoryExcludeFromBudget(nextSettings.categoryExcludeFromBudget, nextSettings.categories);
    nextSettings.defaultPerson = normalizeDefaultPerson(nextSettings.defaultPerson, nextSettings.people);
    nextSettings.recurringRules = normalizeRecurringRules(nextSettings.recurringRules);
    var nextEntries = migrateEntries(parsed.entries||{}, nextSettings.weeklyTarget/7);
    state.settings = nextSettings;
    state.entries = nextEntries;
    runRecurringCatchUp();
    persistAll(state.settings, state.entries, "restored data");
    state.restoreError = null;
    state.showBackup = false;
  } catch(e) {
    state.restoreError = "That doesn't look like a valid backup — paste the exact text you copied earlier.";
  }
  render();
}

/* ---------------- event delegation ---------------- */
document.addEventListener("click", function(e) {
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.dataset.action;
  switch(action) {
    case "open-backup": state.showBackup = true; render(); break;
    case "close-backup": state.showBackup = false; state.restoreError = null; render(); break;
    case "open-settings": state.showSettings = true; render(); break;
    case "open-budget-settings": state.settingsTab = "budget"; state.showSettings = true; render(); break;
    case "close-settings": state.showSettings = false; render(); break;
    case "open-reset": state.showResetConfirm = true; render(); break;
    case "close-reset": state.showResetConfirm = false; render(); break;
    case "toggle-theme":
      persistAll(Object.assign({}, state.settings, { theme: state.settings.theme==="dark"?"light":"dark" }), state.entries, "your settings");
      render();
      break;
    case "switch-view": state.view = el.dataset.view; state.offset = 0; render(); break;
    case "nav-offset":
      var delta = parseInt(el.dataset.delta,10);
      var next = state.offset + delta;
      state.offset = Math.min(0, next);
      render();
      break;
    case "add-transaction": handleAddTransaction(); break;
    case "delete-txn":
      handleDeleteTxn(el.dataset.date, el.dataset.id);
      state.pendingDeleteKey = null;
      break;
    case "ask-delete-txn":
      state.pendingDeleteKey = el.dataset.date+"|"+el.dataset.id;
      render();
      break;
    case "cancel-delete-txn":
      state.pendingDeleteKey = null;
      render();
      break;
    case "edit-txn": handleEditTxn(el.dataset.date, el.dataset.id); break;
    case "cancel-edit": handleCancelEdit(); break;
    case "set-txn-kind":
      preserveTxnFormDraft();
      state.txnKind = el.dataset.kind;
      render();
      break;
    case "set-txn-split-mode":
      preserveTxnFormDraft();
      state.txnSplitMode = el.dataset.mode;
      render();
      break;
    case "set-txn-person-split-mode":
      preserveTxnFormDraft();
      state.txnPersonSplitMode = el.dataset.mode;
      render();
      break;
    case "open-add-txn":
      state.editingItemId = null;
      state.editingOriginalDate = null;
      state.entryDate = todayStr();
      state.showAddTxn = true;
      state.pendingDeleteKey = null;
      state.txnSplitMode = "single";
      state.txnKind = null;
      state.txnPersonSplitMode = "single";
      state.txnCategoryGroup = null;
      state.entryAmountDraft = null;
      state.entryNoteDraft = null;
      state.entrySplitDaysDraft = null;
      state.entryPersonSplitDraft = null;
      state.entryCategoryDraft = null;
      state.entryPersonDraft = null;
      render();
      focusAmountInput();
      break;
    case "close-add-txn":
      state.showAddTxn = false;
      state.editingItemId = null;
      state.editingOriginalDate = null;
      state.txnSplitMode = "single";
      state.txnKind = null;
      state.txnPersonSplitMode = "single";
      state.txnCategoryGroup = null;
      state.entryAmountDraft = null;
      state.entryNoteDraft = null;
      state.entrySplitDaysDraft = null;
      state.entryPersonSplitDraft = null;
      state.entryCategoryDraft = null;
      state.entryPersonDraft = null;
      render();
      break;
    case "go-page":
      state.editingItemId = null;
      state.editingOriginalDate = null;
      state.showAddTxn = false;
      state.pendingDeleteKey = null;
      state.page = el.dataset.page;
      render();
      break;
    case "quick-date": handleQuickDate(el.dataset.date); break;
    case "cal-nav":
      state.calendarOffset += parseInt(el.dataset.delta,10);
      state.calendarSelectedDate = null;
      render();
      break;
    case "cal-select":
      state.calendarSelectedDate = (state.calendarSelectedDate === el.dataset.date) ? null : el.dataset.date;
      render();
      break;
    case "retry-save":
      if (state.saveError) { var se = state.saveError; state.saveError = null; persistAll(se.nextSettings, se.nextEntries, se.label); }
      render();
      break;
    case "settings-tab":
      state.settingsTab = el.dataset.tab;
      render();
      break;
    case "save-tracking":
      var tsEl = document.getElementById("trackingStartInput");
      var trackSettings = Object.assign({}, state.settings, { trackingStartDate: (tsEl && tsEl.value) ? tsEl.value : null });
      persistAll(trackSettings, state.entries, "your settings");
      showToast("Tracking date saved");
      render();
      break;
    case "apply-budget":
      handleApplyBudget(el.dataset.scope);
      break;
    case "add-category-scoped":
      var scopedGroup = el.dataset.group || "";
      var scopedInput = document.querySelector('.new-category-input[data-group="'+scopedGroup.replace(/"/g,'\\"')+'"]');
      var scopedName = scopedInput ? scopedInput.value.trim() : "";
      if (scopedName && (state.settings.categories||[]).indexOf(scopedName) === -1) {
        var nextCatsScoped = (state.settings.categories||[]).concat([scopedName]);
        var nextGroupOfScoped = Object.assign({}, state.settings.categoryGroupOf||{});
        var nextStylesScoped = Object.assign({}, state.settings.categoryStyles||{});
        if (scopedGroup) {
          nextGroupOfScoped[scopedName] = scopedGroup;
          nextStylesScoped[scopedName] = { icon: "tag", color: groupThemeColor(scopedGroup) };
        }
        persistAll(Object.assign({}, state.settings, { categories: nextCatsScoped, categoryGroupOf: nextGroupOfScoped, categoryStyles: nextStylesScoped }), state.entries, "your settings");
        render();
      }
      break;
    case "add-category":
      var newCatEl = document.getElementById("newCategoryInput");
      var newCat = newCatEl ? newCatEl.value.trim() : "";
      if (newCat && (state.settings.categories||[]).indexOf(newCat) === -1) {
        var withCat = Object.assign({}, state.settings, { categories: (state.settings.categories||[]).concat([newCat]) });
        persistAll(withCat, state.entries, "your settings");
        render();
      }
      break;
    case "set-recurring-kind":
      preserveRecurringFormDraft();
      state.recurringKindDraft = el.dataset.kind;
      render();
      break;
    case "set-recurring-limit-mode":
      preserveRecurringFormDraft();
      state.recurringLimitMode = el.dataset.mode;
      render();
      break;
    case "add-recurring":
      var recAmountEl = document.getElementById("recurringAmountInput");
      var recAmount = parseFloat(recAmountEl ? recAmountEl.value : "");
      var recStartEl = document.getElementById("recurringStartDateInput");
      var recStart = recStartEl ? recStartEl.value : "";
      if (isNaN(recAmount) || recAmount < 0 || !recStart) break;
      var recKindForRule = state.recurringKindDraft || "expense";
      var recLimitMode = state.recurringLimitMode || "ongoing";
      var recCount = null;
      var recEndDate = null;
      if (recLimitMode === "count") {
        var recCountEl = document.getElementById("recurringCountInput");
        var parsedCount = parseInt(recCountEl ? recCountEl.value : "", 10);
        if (isNaN(parsedCount) || parsedCount < 1) break;
        recCount = parsedCount;
      } else if (recLimitMode === "until") {
        var recEndEl = document.getElementById("recurringEndDateInput");
        recEndDate = (recEndEl && recEndEl.value) ? recEndEl.value : null;
        if (!recEndDate || recEndDate < recStart) break;
      }
      var recCategoryEl = document.getElementById("recurringCategoryInput");
      var recPersonEl = document.getElementById("recurringPersonInput");
      var recNoteEl = document.getElementById("recurringNoteInput");
      var recFreqEl = document.getElementById("recurringFrequencyInput");
      var newRule = {
        id: Date.now()+"-"+Math.random().toString(36).slice(2,7),
        kind: "recurring",
        entryKind: recKindForRule,
        amount: recAmount,
        splitTotal: null,
        category: recKindForRule === "income" ? "" : (recCategoryEl ? recCategoryEl.value : ""),
        person: recPersonEl ? recPersonEl.value : "",
        note: recNoteEl ? recNoteEl.value.trim() : "",
        frequency: (recFreqEl && recFreqEl.value === "monthly") ? "monthly" : "weekly",
        startDate: recStart,
        endDate: recEndDate,
        occurrencesTotal: recCount,
        occurrencesLogged: 0,
        active: true
      };
      state.settings = Object.assign({}, state.settings, { recurringRules: (state.settings.recurringRules||[]).concat([newRule]) });
      runRecurringCatchUp();
      persistAll(state.settings, state.entries, "your settings");
      state.recurringLimitMode = "ongoing";
      state.recurringAmountDraft = null;
      state.recurringCategoryDraft = null;
      state.recurringPersonDraft = null;
      state.recurringNoteDraft = null;
      state.recurringFrequencyDraft = null;
      state.recurringStartDateDraft = null;
      state.recurringCountDraft = null;
      state.recurringEndDateDraft = null;
      showToast(recKindForRule === "income" ? "Recurring income added" : "Recurring payment added");
      state.recurringKindDraft = "expense";
      render();
      break;
    case "toggle-recurring-active":
      preserveRecurringFormDraft();
      var toggleId = el.dataset.id;
      state.settings = Object.assign({}, state.settings, { recurringRules: (state.settings.recurringRules||[]).map(function(r){
        return r.id === toggleId ? Object.assign({}, r, { active: !r.active }) : r;
      }) });
      runRecurringCatchUp();
      persistAll(state.settings, state.entries, "your settings");
      render();
      break;
    case "delete-recurring":
      preserveRecurringFormDraft();
      var deleteId = el.dataset.id;
      var remainingRules = (state.settings.recurringRules||[]).filter(function(r){ return r.id !== deleteId; });
      /* Deleting a plan undoes everything it already logged, not just the
         rule itself — otherwise every day it already wrote to `entries`
         (each tagged with this recurringId) lingers behind forever, still
         showing up on Home/Transactions/Calendar/Analysis even though the
         plan that "owns" it is gone. A day that ends up with zero items
         after stripping is removed entirely, same as a normal delete. */
      var entriesAfterDelete = Object.assign({}, state.entries);
      Object.keys(entriesAfterDelete).forEach(function(d){
        var day = entriesAfterDelete[d];
        if (!day || !Array.isArray(day.items)) return;
        var stripped = day.items.filter(function(it){ return it.recurringId !== deleteId; });
        if (stripped.length !== day.items.length) {
          if (stripped.length === 0) delete entriesAfterDelete[d];
          else entriesAfterDelete[d] = Object.assign({}, day, { items: stripped });
        }
      });
      persistAll(Object.assign({}, state.settings, { recurringRules: remainingRules }), entriesAfterDelete, "your settings");
      render();
      break;
    case "toggle-category-budget":
      var catToToggle = el.dataset.cat;
      var nextExcludeMap = Object.assign({}, state.settings.categoryExcludeFromBudget||{});
      if (nextExcludeMap[catToToggle]) delete nextExcludeMap[catToToggle];
      else nextExcludeMap[catToToggle] = true;
      persistAll(Object.assign({}, state.settings, { categoryExcludeFromBudget: nextExcludeMap }), state.entries, "your settings");
      showToast(nextExcludeMap[catToToggle] ? catToToggle+" excluded from budget" : catToToggle+" counts toward budget");
      render();
      break;
    case "remove-category":
      var catToRemove = el.dataset.cat;
      var nextCatsAfterRemove = (state.settings.categories||[]).filter(function(c){ return c !== catToRemove; });
      var stylesAfterRemove = Object.assign({}, state.settings.categoryStyles||{});
      delete stylesAfterRemove[catToRemove];
      var groupOfAfterRemoveCat = Object.assign({}, state.settings.categoryGroupOf||{});
      delete groupOfAfterRemoveCat[catToRemove];
      var excludeAfterRemove = Object.assign({}, state.settings.categoryExcludeFromBudget||{});
      delete excludeAfterRemove[catToRemove];
      var withoutCat = Object.assign({}, state.settings, { categories: nextCatsAfterRemove, categoryStyles: stylesAfterRemove, categoryGroupOf: groupOfAfterRemoveCat, categoryExcludeFromBudget: excludeAfterRemove });
      if (state.categoryStyleEditing === catToRemove) state.categoryStyleEditing = null;
      if (state.categoryRenameEditing === catToRemove) state.categoryRenameEditing = null;
      persistAll(withoutCat, state.entries, "your settings");
      render();
      break;
    case "add-group":
      var newGroupEl = document.getElementById("newGroupInput");
      var newGroup = newGroupEl ? newGroupEl.value.trim() : "";
      if (newGroup && (state.settings.categoryGroups||[]).indexOf(newGroup) === -1) {
        var withGroup = Object.assign({}, state.settings, { categoryGroups: (state.settings.categoryGroups||[]).concat([newGroup]) });
        persistAll(withGroup, state.entries, "your settings");
        render();
      }
      break;
    case "remove-group":
      var groupToRemove = el.dataset.group;
      var nextGroups = (state.settings.categoryGroups||[]).filter(function(g){ return g !== groupToRemove; });
      var groupOfAfterRemoveGroup = Object.assign({}, state.settings.categoryGroupOf||{});
      Object.keys(groupOfAfterRemoveGroup).forEach(function(c){
        if (groupOfAfterRemoveGroup[c] === groupToRemove) delete groupOfAfterRemoveGroup[c];
      });
      persistAll(Object.assign({}, state.settings, { categoryGroups: nextGroups, categoryGroupOf: groupOfAfterRemoveGroup }), state.entries, "your settings");
      if (state.analysisSelectedGroup === groupToRemove) state.analysisSelectedGroup = null;
      render();
      break;
    case "move-group":
      var dirG = parseInt(el.dataset.dir,10);
      var groups2 = (state.settings.categoryGroups||[]).slice();
      var idxG = groups2.indexOf(el.dataset.group);
      var swapIdxG = idxG + dirG;
      if (idxG >= 0 && swapIdxG >= 0 && swapIdxG < groups2.length) {
        var tmpG = groups2[idxG]; groups2[idxG] = groups2[swapIdxG]; groups2[swapIdxG] = tmpG;
        persistAll(Object.assign({}, state.settings, { categoryGroups: groups2 }), state.entries, "your settings");
        render();
      }
      break;
    case "add-person":
      var newPersonEl = document.getElementById("newPersonInput");
      var newPerson = newPersonEl ? newPersonEl.value.trim() : "";
      if (newPerson && (state.settings.people||[]).indexOf(newPerson) === -1) {
        persistAll(Object.assign({}, state.settings, { people: (state.settings.people||[]).concat([newPerson]) }), state.entries, "your settings");
        render();
      }
      break;
    case "remove-person":
      var personToRemove = el.dataset.person;
      var nextPeople = (state.settings.people||[]).filter(function(p){ return p !== personToRemove; });
      if (state.personRenameEditing === personToRemove) state.personRenameEditing = null;
      var nextDefaultPerson = state.settings.defaultPerson === personToRemove ? null : state.settings.defaultPerson;
      persistAll(Object.assign({}, state.settings, { people: nextPeople, defaultPerson: nextDefaultPerson }), state.entries, "your settings");
      render();
      break;
    case "move-person":
      var dirP = parseInt(el.dataset.dir,10);
      var people2 = (state.settings.people||[]).slice();
      var idxP = people2.indexOf(el.dataset.person);
      var swapIdxP = idxP + dirP;
      if (idxP >= 0 && swapIdxP >= 0 && swapIdxP < people2.length) {
        var tmpP = people2[idxP]; people2[idxP] = people2[swapIdxP]; people2[swapIdxP] = tmpP;
        persistAll(Object.assign({}, state.settings, { people: people2 }), state.entries, "your settings");
        render();
      }
      break;
    case "edit-person-name":
      state.personRenameEditing = (state.personRenameEditing === el.dataset.person) ? null : el.dataset.person;
      render();
      break;
    case "cancel-person-rename":
      state.personRenameEditing = null;
      render();
      break;
    case "save-person-rename":
      var personRenameInput = document.getElementById("personRenameInput");
      var newPersonName = personRenameInput ? personRenameInput.value.trim() : "";
      var oldPersonName = el.dataset.person;
      if (newPersonName && newPersonName !== oldPersonName) {
        var personWasMerge = renameTag("person", oldPersonName, newPersonName);
        showToast(personWasMerge ? "Merged into "+newPersonName : "Renamed to "+newPersonName);
      }
      state.personRenameEditing = null;
      render();
      break;
    case "drill-analysis-group":
      state.analysisSelectedGroup = el.dataset.group;
      state.analysisSelectedBucket = null;
      render();
      break;
    case "clear-analysis-group":
      state.analysisSelectedGroup = null;
      render();
      break;
    case "edit-group-style":
      state.groupStyleEditing = (state.groupStyleEditing === el.dataset.group) ? null : el.dataset.group;
      state.categoryStyleEditing = null;
      state.categoryRenameEditing = null;
      render();
      break;
    case "set-group-icon":
      var groupI = el.dataset.group;
      var iconI = el.dataset.icon;
      var membersI = (state.settings.categories||[]).filter(function(c){ return categoryGroupOf(c)===groupI; });
      var stylesGI = Object.assign({}, state.settings.categoryStyles||{});
      membersI.forEach(function(c){
        var cur = categoryStyle(c);
        stylesGI[c] = { icon: iconI, color: cur.color };
      });
      persistAll(Object.assign({}, state.settings, { categoryStyles: stylesGI }), state.entries, "your settings");
      showToast("Icon applied to "+membersI.length+" categor"+(membersI.length===1?"y":"ies"));
      render();
      break;
    case "edit-category-style":
      state.categoryStyleEditing = (state.categoryStyleEditing === el.dataset.cat) ? null : el.dataset.cat;
      state.categoryRenameEditing = null;
      render();
      break;
    case "edit-category-name":
      state.categoryRenameEditing = (state.categoryRenameEditing === el.dataset.cat) ? null : el.dataset.cat;
      state.categoryStyleEditing = null;
      render();
      break;
    case "cancel-category-rename":
      state.categoryRenameEditing = null;
      render();
      break;
    case "save-category-rename":
      var catRenameInput = document.getElementById("categoryRenameInput");
      var newCatNameVal = catRenameInput ? catRenameInput.value.trim() : "";
      var oldCatNameVal = el.dataset.cat;
      if (newCatNameVal && newCatNameVal !== oldCatNameVal) {
        var catWasMerge = renameTag("category", oldCatNameVal, newCatNameVal);
        showToast(catWasMerge ? "Merged into "+newCatNameVal : "Renamed to "+newCatNameVal);
      }
      state.categoryRenameEditing = null;
      render();
      break;
    case "set-category-icon":
      var catI = el.dataset.cat;
      var curI = categoryStyle(catI);
      var nextStylesI = Object.assign({}, state.settings.categoryStyles||{});
      nextStylesI[catI] = { icon: el.dataset.icon, color: curI.color };
      persistAll(Object.assign({}, state.settings, { categoryStyles: nextStylesI }), state.entries, "your settings");
      render();
      break;
    case "reset-category-style":
      var catR = el.dataset.cat;
      var nextStylesR = Object.assign({}, state.settings.categoryStyles||{});
      delete nextStylesR[catR];
      persistAll(Object.assign({}, state.settings, { categoryStyles: nextStylesR }), state.entries, "your settings");
      render();
      break;
    case "move-category":
      var dir = parseInt(el.dataset.dir,10);
      var catToMove = el.dataset.cat;
      var cats2 = (state.settings.categories||[]).slice();
      var myGroupForMove = categoryGroupOf(catToMove);
      var siblingsForMove = cats2.filter(function(c){ return categoryGroupOf(c) === myGroupForMove; });
      var sibIdx = siblingsForMove.indexOf(catToMove);
      var sibSwapIdx = sibIdx + dir;
      if (sibIdx >= 0 && sibSwapIdx >= 0 && sibSwapIdx < siblingsForMove.length) {
        var neighborCat = siblingsForMove[sibSwapIdx];
        var idx = cats2.indexOf(catToMove);
        var swapIdx = cats2.indexOf(neighborCat);
        var tmp = cats2[idx]; cats2[idx] = cats2[swapIdx]; cats2[swapIdx] = tmp;
        var movedSettings = Object.assign({}, state.settings, { categories: cats2 });
        persistAll(movedSettings, state.entries, "your settings");
        render();
      }
      break;
    case "toggle-analysis-reorder":
      state.analysisReorderMode = !state.analysisReorderMode;
      render();
      break;
    case "set-analysis-period":
      state.analysisPeriodMode = el.dataset.mode;
      state.analysisOffset = 0;
      state.analysisSelectedBucket = null;
      state.analysisSelectedGroup = null;
      render();
      break;
    case "select-bucket":
      state.analysisSelectedBucket = (state.analysisSelectedBucket === el.dataset.key) ? null : el.dataset.key;
      render();
      break;
    case "clear-bucket":
      state.analysisSelectedBucket = null;
      render();
      break;
    case "filter-analysis-category":
      state.analysisCategoryFilter = (state.analysisCategoryFilter === el.dataset.cat) ? "" : el.dataset.cat;
      state.analysisSelectedBucket = null;
      render();
      break;
    case "clear-analysis-category":
      state.analysisCategoryFilter = "";
      state.analysisSelectedBucket = null;
      render();
      break;
    case "filter-analysis-person":
      state.analysisPersonFilter = (state.analysisPersonFilter === el.dataset.person) ? "" : el.dataset.person;
      state.analysisSelectedBucket = null;
      render();
      break;
    case "clear-analysis-person":
      state.analysisPersonFilter = "";
      state.analysisSelectedBucket = null;
      render();
      break;
    case "set-basis":
      state.analysisSelectedBucket = null;
      render();
      break;
    case "set-forecast-compare":
      state.forecastCompareMode = el.dataset.mode;
      render();
      break;
    case "open-income-settings":
      state.settingsTab = "income";
      state.incomeDraftMode = null;
      state.incomeDraftAmount = null;
      state.showSettings = true;
      render();
      break;
    case "apply-income":
      handleApplyIncome(el.dataset.scope);
      break;
    case "apply-appearance":
      var bgEl = document.getElementById("customBgInput");
      var accEl = document.getElementById("customAccentInput");
      var nextAppearance = Object.assign({}, state.settings, {
        customDarkBg: bgEl ? bgEl.value : state.settings.customDarkBg,
        customAccent: accEl ? accEl.value : state.settings.customAccent
      });
      persistAll(nextAppearance, state.entries, "your settings");
      state.showSettings = false;
      showToast("Appearance updated");
      render();
      break;
    case "reset-appearance":
      var resetAppearance = Object.assign({}, state.settings, { customDarkBg: null, customAccent: null });
      persistAll(resetAppearance, state.entries, "your settings");
      showToast("Appearance reset");
      render();
      break;
    case "analysis-nav-offset":
      state.analysisOffset = Math.min(0, (state.analysisOffset||0) + parseInt(el.dataset.delta,10));
      state.analysisSelectedBucket = null;
      render();
      break;
    case "set-txn-period":
      state.txnPeriodMode = el.dataset.mode;
      state.txnOffset = 0;
      render();
      break;
    case "txn-nav-offset":
      state.txnOffset = Math.min(0, (state.txnOffset||0) + parseInt(el.dataset.delta,10));
      render();
      break;
    case "move-analysis-section":
      var dirA = parseInt(el.dataset.dir,10);
      var orderA = normalizeAnalysisOrder(state.settings.analysisSectionOrder);
      var idxA = orderA.indexOf(el.dataset.section);
      var swapA = idxA + dirA;
      if (idxA >= 0 && swapA >= 0 && swapA < orderA.length) {
        var tmpA = orderA[idxA]; orderA[idxA] = orderA[swapA]; orderA[swapA] = tmpA;
        persistAll(Object.assign({}, state.settings, { analysisSectionOrder: orderA }), state.entries, "your settings");
        render();
      }
      break;
    case "toggle-analysis-hidden":
      var hiddenH = normalizeHiddenSections(state.settings.analysisHiddenSections);
      var secH = el.dataset.section;
      var nextHidden = hiddenH.indexOf(secH) !== -1 ? hiddenH.filter(function(x){ return x!==secH; }) : hiddenH.concat([secH]);
      persistAll(Object.assign({}, state.settings, { analysisHiddenSections: nextHidden }), state.entries, "your settings");
      render();
      break;
    case "copy-backup": handleCopyBackup(); break;
    case "restore-backup": handleRestore(); break;
    case "confirm-reset":
      persistAll(state.settings, {}, "reset");
      state.showResetConfirm = false;
      render();
      break;
  }
});

/* Live preview for the theme color pickers: recolors the whole UI the instant
   a color is picked, without waiting for Apply or a full re-render (which
   would rebuild the sheet mid-pick and could interrupt the native picker). */
document.addEventListener("input", function(e) {
  if (e.target && e.target.id === "incomeDraftInput") {
    var derivedEl = document.getElementById("incomeDerivedText");
    if (derivedEl) derivedEl.textContent = incomeDerivedSummary(parseFloat(e.target.value));
  }
  if (e.target && e.target.id === "weeklyDraftInput") {
    var v = parseFloat(e.target.value);
    var perDayEl = document.getElementById("weeklyPerDayText");
    if (perDayEl) {
      var perDay = (!isNaN(v) && v >= 0) ? v/7 : 0;
      perDayEl.textContent = "= " + fmt(perDay, 2) + " AED per day. Choose how far this change should reach:";
    }
  }
  if (e.target && e.target.id === "customBgInput") {
    var tones = deriveDarkTones(e.target.value);
    var r = document.documentElement.style;
    r.setProperty("--bg", tones.bg); r.setProperty("--card", tones.card); r.setProperty("--raised", tones.raised);
    r.setProperty("--fill", tones.fill); r.setProperty("--sep", tones.sep); r.setProperty("--hairline", tones.hairline);
    var metaBg = document.querySelector('meta[name="theme-color"]');
    if (metaBg) metaBg.setAttribute("content", tones.bg);
    var lbl = document.getElementById("customBgLabel");
    if (lbl) lbl.textContent = e.target.value.toUpperCase();
  }
  if (e.target && e.target.id === "customAccentInput") {
    var r2 = document.documentElement.style;
    r2.setProperty("--accent", e.target.value);
    r2.setProperty("--accent-ink", readableInk(e.target.value));
    var lbl2 = document.getElementById("customAccentLabel");
    if (lbl2) lbl2.textContent = e.target.value.toUpperCase();
  }
});

document.addEventListener("change", function(e) {
  if (e.target && e.target.id === "defaultPersonInput") {
    persistAll(Object.assign({}, state.settings, { defaultPerson: e.target.value||null }), state.entries, "your settings");
    render();
    return;
  }
  if (e.target && e.target.id === "entryGroupInput") {
    /* render() rebuilds the sheet from scratch, which would wipe whatever's
       already been entered — so stash it all into state first and let the
       re-render restore it. */
    preserveTxnFormDraft();
    state.txnCategoryGroup = e.target.value;
    render();
    return;
  }
  if (e.target && e.target.classList && e.target.classList.contains("split-person-pct")) {
    var pctSelects = document.querySelectorAll(".split-person-pct");
    var totalPct = 0;
    pctSelects.forEach(function(s){ totalPct += parseInt(s.value,10)||0; });
    var totalEl = document.getElementById("splitPersonTotal");
    if (totalEl) {
      totalEl.textContent = totalPct + "%";
      totalEl.style.color = totalPct===100 ? "var(--positive)" : (totalPct===0 ? "var(--text-muted)" : "var(--rust)");
    }
    return;
  }
  if (e.target && e.target.dataset && e.target.dataset.role === "category-group-select") {
    var catG = e.target.dataset.cat;
    var newGroupVal = e.target.value;
    var nextGroupOf = Object.assign({}, state.settings.categoryGroupOf||{});
    if (newGroupVal) nextGroupOf[catG] = newGroupVal; else delete nextGroupOf[catG];
    persistAll(Object.assign({}, state.settings, { categoryGroupOf: nextGroupOf }), state.entries, "your settings");
    render();
    return;
  }
  if (e.target && e.target.id === "entryDateInput") handleQuickDate(e.target.value);
  if (e.target && e.target.id === "txnGroupFilterSelect") {
    var newTxnGroup = e.target.value;
    var curTxnCat = state.txnCategoryFilter;
    if (curTxnCat) {
      var stillBelongs = curTxnCat === "Uncategorised"
        ? (!newTxnGroup || newTxnGroup === "__ungrouped__")
        : (!newTxnGroup ? true : (newTxnGroup === "__ungrouped__" ? !categoryGroupOf(curTxnCat) : categoryGroupOf(curTxnCat) === newTxnGroup));
      if (!stillBelongs) state.txnCategoryFilter = "";
    }
    state.txnGroupFilter = newTxnGroup;
    render();
    return;
  }
  if (e.target && e.target.id === "txnPersonFilterSelect") { state.txnPersonFilter = e.target.value; render(); }
  if (e.target && e.target.id === "txnCategoryFilterSelect") { state.txnCategoryFilter = e.target.value; render(); }
  if (e.target && e.target.id === "txnPeriodFromInput") { state.txnPeriodFrom = e.target.value; render(); }
  if (e.target && e.target.id === "txnPeriodToInput") { state.txnPeriodTo = e.target.value; render(); }
  if (e.target && e.target.id === "analysisPeriodFromInput") { state.analysisPeriodFrom = e.target.value; render(); }
  if (e.target && e.target.id === "analysisPeriodToInput") { state.analysisPeriodTo = e.target.value; render(); }
  if (e.target && e.target.id === "groupColorInput") {
    var groupC = e.target.dataset.group;
    var newGroupColor = e.target.value;
    // Same deferred rationale as categoryColorInput below.
    setTimeout(function() {
      var membersC = (state.settings.categories||[]).filter(function(c){ return categoryGroupOf(c)===groupC; });
      var stylesGC = Object.assign({}, state.settings.categoryStyles||{});
      membersC.forEach(function(c){
        var cur = categoryStyle(c);
        stylesGC[c] = { icon: cur.icon, color: newGroupColor };
      });
      persistAll(Object.assign({}, state.settings, { categoryStyles: stylesGC }), state.entries, "your settings");
      showToast("Color applied to "+membersC.length+" categor"+(membersC.length===1?"y":"ies"));
      render();
    }, 300);
  }
  if (e.target && e.target.classList && e.target.classList.contains("person-color-input")) {
    var personC = e.target.dataset.person;
    var newPersonColor = e.target.value;
    // Same deferred rationale as categoryColorInput below.
    setTimeout(function() {
      var nextPersonColors = Object.assign({}, state.settings.personColors||{});
      nextPersonColors[personC] = newPersonColor;
      persistAll(Object.assign({}, state.settings, { personColors: nextPersonColors }), state.entries, "your settings");
      render();
    }, 300);
  }
  if (e.target && e.target.id === "categoryColorInput") {
    var catC = e.target.dataset.cat;
    var newColorC = e.target.value;
    /* Deferred deliberately: render() replaces the whole page's innerHTML,
       and doing that synchronously inside this handler tears out the <input>
       while iOS's native color picker sheet is still mid-close-animation —
       that DOM-teardown-under-an-active-native-picker race is what was
       crashing the page. A short delay lets the native UI finish first. */
    setTimeout(function() {
      var curC = categoryStyle(catC);
      var nextStylesC = Object.assign({}, state.settings.categoryStyles||{});
      nextStylesC[catC] = { icon: curC.icon, color: newColorC };
      persistAll(Object.assign({}, state.settings, { categoryStyles: nextStylesC }), state.entries, "your settings");
      render();
    }, 300);
  }
});

/* ---------------- init ---------------- */
function setViewportHeightVar() {
  document.documentElement.style.setProperty("--vh100", window.innerHeight + "px");
}
setViewportHeightVar();
window.addEventListener("resize", setViewportHeightVar);
window.addEventListener("orientationchange", setViewportHeightVar);

/* visualViewport tracking, for two different jobs that both need it:
   --vvb (bottom gap) is what the tab bar/FAB use, assuming the viewport's top
   stays put and only its bottom shrinks for the keyboard.
   --vvt/--vvh (top offset + height) pin the modal backdrop to the actual
   visible rectangle, top edge included — needed because iOS doesn't just
   shrink the visual viewport for the keyboard, it can also *pan* it (offsetTop
   != 0), which happens mid-gesture while scrolling inside a focused modal.
   A bottom-gap-only assumption goes wrong exactly then: as offsetTop grows,
   the --vvb formula understates the true gap, and a backdrop anchored with
   top:0 lets its bottom edge sink back down behind the keyboard even though
   the modal never closed. Anchoring top+height to the live rectangle instead
   means the backdrop tracks reality regardless of why the viewport moved. */
function updateVisualViewportOffset() {
  var vv = window.visualViewport;
  var r = document.documentElement.style;
  if (!vv) {
    r.setProperty("--vvb", "0px");
    r.setProperty("--vvt", "0px");
    r.setProperty("--vvh", "100dvh");
    return;
  }
  var gap = window.innerHeight - vv.height - vv.offsetTop;
  r.setProperty("--vvb", Math.max(0, Math.round(gap)) + "px");
  r.setProperty("--vvt", Math.round(vv.offsetTop) + "px");
  r.setProperty("--vvh", Math.round(vv.height) + "px");
}
updateVisualViewportOffset();
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", updateVisualViewportOffset);
  window.visualViewport.addEventListener("scroll", updateVisualViewportOffset);
}
window.addEventListener("resize", updateVisualViewportOffset);
window.addEventListener("orientationchange", updateVisualViewportOffset);
setTimeout(updateVisualViewportOffset, 300);
setTimeout(updateVisualViewportOffset, 1000);

document.addEventListener("focusin", function(e) {
  var t = e.target;
  if (!t || !t.closest(".modal-card")) return;
  if (t.tagName !== "INPUT" && t.tagName !== "SELECT" && t.tagName !== "TEXTAREA") return;
  [50, 150, 300, 450].forEach(function(ms){ setTimeout(updateVisualViewportOffset, ms); });
});
document.addEventListener("focusout", function(e) {
  var t = e.target;
  if (!t || !t.closest(".modal-card")) return;
  if (t.tagName !== "INPUT" && t.tagName !== "SELECT" && t.tagName !== "TEXTAREA") return;
  /* Closing the keyboard needs the same re-checks as opening it — otherwise
     the viewport offset can stay stuck at whatever it was while the
     keyboard was open, leaving the backdrop positioned too low and showing
     a strip of the page behind it above the modal's own header. */
  [50, 150, 300, 450].forEach(function(ms){ setTimeout(updateVisualViewportOffset, ms); });
});
loadInitial();
render();
</script>
