<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0C1322" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>The Ledger</title>
<style>
  :root {
    --bg:#0C1322; --card:#131C31; --raised:#0C1322; --hairline:#26314D;
    --text:#E8EDF7; --text-muted:#8595B5; --accent:#E0B368; --accent-ink:#0C1322;
    --rust:#D4614A; --rust-wash: rgba(212,97,74,0.10);
    --f-display: 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    --f-mono: 'SF Mono', Menlo, Consolas, monospace;
    --f-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; overscroll-behavior-y: none; background: var(--bg); }
  body { font-family: var(--f-ui); color: var(--text); -webkit-tap-highlight-color: transparent; }
  #root { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; min-height: var(--vh100, 100dvh); }
  .wrap { flex: 1 0 auto; max-width: 420px; width: 100%; margin: 0 auto; box-sizing: border-box; padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px calc(env(safe-area-inset-bottom, 0px) + 84px); }
  .row { display: flex; align-items: center; }
  .between { justify-content: space-between; }
  .col { display: flex; flex-direction: column; }
  .gap2 { gap: 8px; }
  .display { font-family: var(--f-display); }
  .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); }
  .muted { color: var(--text-muted); }
  .card { background: var(--card); border: 1px solid var(--hairline); border-radius: 16px; }
  .icon-btn { padding: 8px; border-radius: 999px; background: var(--card); border: 1px solid var(--hairline); display:flex; align-items:center; justify-content:center; }
  button { font-family: inherit; cursor: pointer; color: inherit; }
  input, textarea { font-family: inherit; color: var(--text); }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.65); }
  .field { -webkit-appearance:none; appearance:none; width:100%; box-sizing:border-box; display:block; border-radius:10px; padding:10px 12px; background: var(--raised); border:1px solid var(--hairline); font-size:14px; }
  .field:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-accent { background: var(--accent); color: var(--accent-ink); font-weight:600; border:none; border-radius:10px; padding:10px 16px; }
  .btn-accent:disabled { opacity:0.4; }
  .btn-outline { background: transparent; border:1px solid var(--hairline); color: var(--text); border-radius:10px; padding:9px 16px; }
  .btn-rust { background: var(--rust); color:#fff; font-weight:600; border:none; border-radius:10px; padding:9px 16px; }
  .stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .hairline-top { border-top: 1px solid var(--hairline); }
  .hairline-bottom { border-bottom: 1px solid var(--hairline); }
  .modal-backdrop { position:fixed; inset:0; background:rgba(6,10,20,0.55); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  @media (min-width: 480px) { .modal-backdrop { align-items:center; } }
  .modal-card { width:100%; max-width:420px; max-height:85vh; overflow-y:auto; background:var(--card); border:1px solid var(--hairline); border-radius:20px 20px 0 0; padding:20px; }
  @media (min-width: 480px) { .modal-card { border-radius:20px; } }
  .day-row { width:100%; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; text-align:left; background:none; border:none; }
  .txn-line { display:flex; align-items:center; justify-content:space-between; padding:4px 0 4px 8px; border-left:2px solid var(--hairline); }
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";

/* ---------------- constants & helpers ---------------- */
var STORAGE_KEY = "ledger-data";
var TEST_KEY = "ledger-selftest";
var DEFAULT_SETTINGS = { weeklyTarget: 1800, theme: "dark", trackingStartDate: null, categories: ["Food & Dining","Groceries","Transport","Shopping","Bills & Utilities","Health","Entertainment","Other"], rateHistory: null };
var PALETTES = {
  dark:  { bg:"#0C1322", card:"#131C31", raised:"#0C1322", hairline:"#26314D", text:"#E8EDF7", textMuted:"#8595B5", accent:"#E0B368", accentInk:"#0C1322", rust:"#D4614A", rustWash:"rgba(212,97,74,0.10)", positive:"#5EBD8C" },
  light: { bg:"#F4F6FB", card:"#FFFFFF", raised:"#F4F6FB", hairline:"#E1E6F1", text:"#16203A", textMuted:"#66748F", accent:"#B07F2A", accentInk:"#FFFFFF", rust:"#C0442B", rustWash:"rgba(192,68,43,0.08)", positive:"#1E8E5A" },
};

function toStr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseD(s){ return new Date(s+"T00:00:00"); }
function todayStr(){ return toStr(new Date()); }
function minStr(a,b){ return a<b?a:b; }
function round2(n){ return Math.round(n*100)/100; }
function startOfWeek(d){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); var day=x.getDay(); var back=day===0?6:day-1; x.setDate(x.getDate()-back); return x; }
function addDays(d,n){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function addMonths(d,n){ return new Date(d.getFullYear(), d.getMonth()+n, 1); }
function endOfMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0); }
function daysInMonth(d){ return endOfMonth(d).getDate(); }
function daysBetween(aStr,bStr){ return Math.round((parseD(bStr)-parseD(aStr))/86400000); }
function fmt(n, dp){ dp = dp || 0; return (Number(n)||0).toLocaleString("en-US",{minimumFractionDigits:dp, maximumFractionDigits:dp}); }
function dayLabel(s){ return parseD(s).toLocaleDateString("en-GB",{weekday:"short", day:"numeric", month:"short"}); }
function shortLabel(s){ return parseD(s).toLocaleDateString("en-GB",{day:"numeric", month:"short"}); }
function weekdayLong(s){ return parseD(s).toLocaleDateString("en-GB",{weekday:"long"}); }
function sumSpent(e){ return (e && Array.isArray(e.items)) ? e.items.reduce(function(s,i){ return s+i.amount; },0) : 0; }
function itemTimeKey(it){ var n = parseInt(String(it.id).split("-")[0], 10); return isNaN(n) ? 0 : n; }
function newestFirst(items){ return items.slice().sort(function(a,b){ return itemTimeKey(b) - itemTimeKey(a); }); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function getPeriodBounds(viewType, off, weeklyTarget, dailyAllowanceVal) {
  var now = new Date();
  var tsd = state.settings.trackingStartDate;
  /* Sum the per-day allowance actually in effect on each day, so a past period is
     measured against the rate that applied then rather than today's rate. */
  function clippedTarget(startStr, endStr, fullTarget) {
    var s = (tsd && tsd > startStr) ? tsd : startStr;
    if (s > endStr) return 0;
    var sum = 0;
    var cur = parseD(s);
    while (toStr(cur) <= endStr) { sum += allowanceForDate(toStr(cur)); cur = addDays(cur,1); }
    return sum;
  }
  if (viewType === "week") {
    var start = addDays(startOfWeek(now), off*7);
    var end = addDays(start, 6);
    var title = (start.getMonth()===end.getMonth())
      ? (start.getDate()+"–"+end.getDate()+" "+end.toLocaleDateString("en-GB",{month:"long",year:"numeric"}))
      : (shortLabel(toStr(start))+" – "+shortLabel(toStr(end)));
    return { startStr: toStr(start), endStr: toStr(end), days: 7, target: clippedTarget(toStr(start), toStr(end), weeklyTarget), title: title,
      sub: off===0 ? "This week" : off===-1 ? "Last week" : (Math.abs(off)+" weeks ago") };
  }
  if (viewType === "month") {
    var mstart = addMonths(startOfMonth(now), off);
    var mend = endOfMonth(mstart);
    var dim = daysInMonth(mstart);
    return { startStr: toStr(mstart), endStr: toStr(mend), days: dim, target: clippedTarget(toStr(mstart), toStr(mend), dailyAllowanceVal*dim),
      title: mstart.toLocaleDateString("en-GB",{month:"long",year:"numeric"}),
      sub: off===0 ? "This month" : off===-1 ? "Last month" : (Math.abs(off)+" months ago") };
  }
  // year
  var y = now.getFullYear() + off;
  var ystart = new Date(y,0,1);
  var yend = new Date(y,11,31);
  var ydays = Math.round((yend-ystart)/86400000)+1;
  return { startStr: toStr(ystart), endStr: toStr(yend), days: ydays, target: clippedTarget(toStr(ystart), toStr(yend), dailyAllowanceVal*ydays),
    title: String(y),
    sub: off===0 ? "This year" : off===-1 ? "Last year" : (Math.abs(off)+" years ago") };
}

function migrateEntries(raw, fallbackAllowance) {
  var out = {};
  for (var date in (raw||{})) {
    var e = raw[date];
    if (e && Array.isArray(e.items)) out[date] = e;
    else if (e && typeof e.spent === "number") out[date] = { allowance: (e.allowance==null?fallbackAllowance:e.allowance), items: [{ id:"legacy-"+date, amount:e.spent, note:"" }] };
  }
  return out;
}

/* ---------------- app state (single source of truth) ---------------- */
var state = {
  settings: DEFAULT_SETTINGS,
  entries: {},
  loading: true,
  saveError: null,
  storageOK: null,
  view: "week",
  offset: 0,
  showSettings: false,
  showBackup: false,
  showResetConfirm: false,
  restoreError: null,
  page: "home",
  calendarOffset: 0,
  calendarSelectedDate: null,
  editingItemId: null,
  editingOriginalDate: null,
  showAddTxn: false,
  toastMessage: null,
  settingsTab: "budget",
  pendingDeleteKey: null,
  txnCategoryFilter: "",
};

/* Rate history: records what the weekly target was over time, so past periods are
   judged against the rate that was actually in effect then, not today's rate. */
function rateForDate(ds) {
  var hist = state.settings.rateHistory;
  if (!hist || !hist.length) return state.settings.weeklyTarget;
  var rate = hist[0].weeklyTarget;
  for (var i=0;i<hist.length;i++) {
    if (hist[i].from <= ds) rate = hist[i].weeklyTarget; else break;
  }
  return rate;
}
function currentWeeklyTarget(){ return rateForDate(todayStr()); }
function dailyAllowance(){ return currentWeeklyTarget()/7; }
/* A logged day keeps whatever rate it was saved at; unlogged days fall back to
   whatever rate history says applied on that date. */
function allowanceForDate(ds) {
  var e = state.entries[ds];
  if (e && typeof e.allowance === "number") return e.allowance;
  return rateForDate(ds)/7;
}
function normalizeRateHistory(hist) {
  var out = (hist||[]).slice().sort(function(a,b){ return a.from < b.from ? -1 : a.from > b.from ? 1 : 0; });
  var dedup = [];
  for (var i=0;i<out.length;i++) {
    if (dedup.length && dedup[dedup.length-1].from === out[i].from) dedup[dedup.length-1] = out[i];
    else if (dedup.length && dedup[dedup.length-1].weeklyTarget === out[i].weeklyTarget) continue;
    else dedup.push(out[i]);
  }
  return dedup;
}

/* ---------------- persistence ---------------- */
function loadInitial() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      state.settings = Object.assign({}, DEFAULT_SETTINGS, parsed.settings||{});
      if (!state.settings.rateHistory || !state.settings.rateHistory.length) {
        state.settings.rateHistory = [{ from: "1900-01-01", weeklyTarget: state.settings.weeklyTarget }];
      }
      state.entries = migrateEntries(parsed.entries||{}, dailyAllowance());
    }
  } catch(e) { /* first run */ }
  if (!state.settings.rateHistory || !state.settings.rateHistory.length) {
    state.settings.rateHistory = [{ from: "1900-01-01", weeklyTarget: state.settings.weeklyTarget }];
  }
  state.loading = false;
  try {
    localStorage.setItem(TEST_KEY, "1");
    var ok = localStorage.getItem(TEST_KEY) === "1";
    localStorage.removeItem(TEST_KEY);
    state.storageOK = ok;
  } catch(e) { state.storageOK = false; }
}

function persistAll(nextSettings, nextEntries, label) {
  state.settings = nextSettings;
  state.entries = nextEntries;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ settings: nextSettings, entries: nextEntries }));
    state.saveError = null;
  } catch(e) {
    state.saveError = { nextSettings: nextSettings, nextEntries: nextEntries, label: label };
  }
}

/* ---------------- period math ---------------- */
function periodStats(startStr, endStrRaw) {
  var endStr = minStr(endStrRaw, todayStr());
  var opening = 0; // each period is self-contained: always starts fresh at 0

  var tsd = state.settings.trackingStartDate;
  var effectiveStart = (tsd && tsd > startStr) ? tsd : startStr;

  var rows = [];
  if (effectiveStart <= endStr) {
    var cur = parseD(effectiveStart);
    while (toStr(cur) <= endStr) {
      var ds = toStr(cur);
      var e = state.entries[ds];
      rows.push({ date: ds, logged: !!e, items: e ? e.items : [], spent: e ? sumSpent(e) : 0, allowance: allowanceForDate(ds) });
      cur = addDays(cur, 1);
    }
  }
  var net = round2(rows.reduce(function(s,r){ return s+(r.allowance-r.spent); },0));
  var closing = round2(opening+net);
  var calendarElapsedDays = (startStr <= endStr) ? (daysBetween(startStr, endStr) + 1) : 0;
  return { opening:opening, net:net, closing:closing, rows:rows, elapsedDays: rows.length, calendarElapsedDays: calendarElapsedDays,
    loggedCount: rows.filter(function(r){return r.logged;}).length, spent: rows.reduce(function(s,r){return s+r.spent;},0) };
}

/* Daily budget left for the CURRENT (live) instance of a given view type,
   treating today as a fresh, still-available day rather than one already
   partly spent. Returns null when there are no days left to plan for. */
function computeDailyBudgetLeft(viewType, spentTodayVal) {
  var da_ = dailyAllowance();
  var per = getPeriodBounds(viewType, 0, currentWeeklyTarget(), da_);
  var stats = periodStats(per.startStr, per.endStr);
  var daysLeftLocal = Math.max(0, per.days - stats.calendarElapsedDays);
  if (daysLeftLocal <= 0) return null;
  var planDaysLocal = daysLeftLocal + 1;
  var spentBeforeTodayLocal = stats.spent - spentTodayVal;
  var remainingExclToday = per.target - spentBeforeTodayLocal;
  return { value: remainingExclToday/planDaysLocal, planDays: planDaysLocal, daysLeft: daysLeftLocal };
}

/* ---------------- chart (plain SVG string) ---------------- */
function renderChart(data, T) {
  var w=340,h=230,padL=40,padR=8,padT=12,padB=22;
  var values = data.map(function(d){return d.balance;});
  var min = Math.min.apply(null,[0].concat(values)), max = Math.max.apply(null,[0].concat(values));
  var range = (max-min)||1;
  var plotW=w-padL-padR, plotH=h-padT-padB;
  function x(i){ return padL + (data.length>1 ? (i/(data.length-1))*plotW : plotW/2); }
  function y(v){ return padT + plotH - ((v-min)/range)*plotH; }
  var linePts = data.map(function(d,i){ return x(i)+","+y(d.balance); }).join(" ");
  var areaPts = x(0)+","+y(0)+" "+linePts+" "+x(data.length-1)+","+y(0);
  var ticksSet = {}; [max,min,0].forEach(function(t){ ticksSet[Math.round(t)] = true; });
  var ticks = Object.keys(ticksSet).map(Number);
  var tickSvg = ticks.map(function(t){
    return '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="'+T.hairline+'" stroke-dasharray="3,3"/>'
      + '<text x="2" y="'+(y(t)+3)+'" font-size="9" fill="'+T.textMuted+'" font-family="var(--f-mono)">'+fmt(t)+'</text>';
  }).join("");
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none">'
    + tickSvg
    + '<polygon points="'+areaPts+'" fill="'+T.accent+'" fill-opacity="0.18"/>'
    + '<polyline points="'+linePts+'" fill="none" stroke="'+T.accent+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    + '<text x="'+x(0)+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'">'+esc(data[0].label)+'</text>'
    + '<text x="'+x(data.length-1)+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'" text-anchor="end">'+esc(data[data.length-1].label)+'</text>'
    + '</svg>';
}

/* ---------------- tiny inline icons ---------------- */
var ICONS = {
  plus: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  trash: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>',
  settings: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  x: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  chevronLeft: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
  chevronRight: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
  chevronUp: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>',
  chevronDown: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>',
  sun: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg>',
  moon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
  save: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>',
  alert: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  rotate: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>',
  home: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',

/* ---------------- rendering ---------------- */
function applyTheme(T) {
  var r = document.documentElement.style;
  r.setProperty("--bg", T.bg); r.setProperty("--card", T.card); r.setProperty("--raised", T.raised);
  r.setProperty("--hairline", T.hairline); r.setProperty("--text", T.text); r.setProperty("--text-muted", T.textMuted);
  r.setProperty("--accent", T.accent); r.setProperty("--accent-ink", T.accentInk);
  r.setProperty("--rust", T.rust); r.setProperty("--rust-wash", T.rustWash);
  r.setProperty("--positive", T.positive);
}

/* Body scroll lock: while any modal is open, pin the underlying page in place
   so touch-scrolling inside the modal can't bleed through and scroll the page
   behind it (a known iOS quirk with position:fixed overlays). The modal's own
   .modal-card keeps its internal overflow-y:auto scroll regardless. */
var bodyScrollLocked = false;
var lockedScrollY = 0;
function lockBodyScroll() {
  if (bodyScrollLocked) return;
  lockedScrollY = window.scrollY || window.pageYOffset || 0;
  document.body.style.position = "fixed";
  document.body.style.top = (-lockedScrollY) + "px";
  document.body.style.left = "0";
  document.body.style.right = "0";
  document.body.style.width = "100%";
  bodyScrollLocked = true;
}
function unlockBodyScroll() {
  if (!bodyScrollLocked) return;
  document.body.style.position = "";
  document.body.style.top = "";
  document.body.style.left = "";
  document.body.style.right = "";
  document.body.style.width = "";
  bodyScrollLocked = false;
  window.scrollTo(0, lockedScrollY);
}

function render() {
  var root = document.getElementById("root");
  var T = PALETTES[state.settings.theme] || PALETTES.dark;
  applyTheme(T);

  var anyModalOpen = state.showAddTxn || state.showSettings || state.showBackup || state.showResetConfirm;
  if (anyModalOpen) lockBodyScroll(); else unlockBodyScroll();

  if (state.loading) {
    root.innerHTML = '<div class="row" style="min-height:100vh; align-items:center; justify-content:center;"><div class="muted" style="font-size:14px;">Loading your ledger…</div></div>';
    return;
  }

  var da = dailyAllowance();
  var html = "";
  html += '<div class="wrap">';

  // header
  html += '<div class="row between" style="align-items:flex-start; margin-bottom:16px;">';
  html += '<div><div class="display" style="font-size:22px;">The Ledger</div><div class="muted" style="font-size:12px; margin-top:2px;">'+fmt(da,0)+' AED a day · weeks run Mon–Sun</div></div>';
  html += '<div class="row gap2">';
  html += '<button class="icon-btn" data-action="toggle-theme" aria-label="Toggle theme">'+(state.settings.theme==="dark"?ICONS.sun:ICONS.moon)+'</button>';
  html += '<button class="icon-btn" data-action="open-settings" aria-label="Settings">'+ICONS.settings+'</button>';
  html += '</div></div>';

  // storage warning
  if (state.storageOK === false) {
    html += '<div class="card" style="padding:12px 16px; margin-bottom:12px; display:flex; gap:10px; background:var(--rust-wash); border-color:var(--rust);">';
    html += '<div style="flex-shrink:0; margin-top:1px; color:var(--rust);">'+ICONS.alert+'</div>';
    html += '<div><div style="font-size:12px;">Your browser is blocking local storage (common in Private Browsing).</div>';
    html += '<button data-action="open-backup" style="background:none;border:none;padding:0;text-decoration:underline;color:var(--rust);font-size:12px;margin-top:4px;">Open backup as a safety net</button></div></div>';
  }

  if (state.page === "transactions") html += renderTransactionsBody();
  else if (state.page === "calendar") html += renderCalendarBody();
  else if (state.page === "analysis") html += renderAnalysisBody(T);
  else html += renderHomeBody(T, da);

  if (state.saveError) {
    html += '<div style="text-align:center; margin-top:12px; font-size:12px; color:var(--rust);">Couldn\'t save '+esc(state.saveError.label)+' — <button data-action="retry-save" style="background:none;border:none;padding:0;text-decoration:underline;color:var(--rust);font-size:12px;">tap to retry</button>.</div>';
  }

  html += '</div>'; // end wrap
  if (state.page === "home" || state.page === "transactions" || state.page === "calendar") html += renderFab();
  html += renderBottomNav();

  // modals
  if (state.showAddTxn) html += renderAddTxnModal();
  if (state.showSettings) {
    html += renderSettingsModal();
  }

  if (state.showBackup) {
    var backupText = JSON.stringify({settings:state.settings, entries:state.entries}, null, 2);
    html += '<div class="modal-backdrop" data-action="close-backup">';
    html += '<div class="modal-card" data-action="noop">';
    html += '<div class="row between" style="margin-bottom:12px;"><div class="display" style="font-size:18px;">Backup & restore</div><button data-action="close-backup" style="background:none;border:none;color:var(--text-muted);">'+ICONS.x+'</button></div>';
    html += '<div class="muted" style="font-size:12px; margin-bottom:8px;">Use this to move data to another device, or as a safety net.</div>';
    html += '<textarea readonly class="field mono" style="height:120px; font-size:11px; margin-bottom:8px; resize:none;" onfocus="this.select()">'+esc(backupText)+'</textarea>';
    html += '<button id="copyBackupBtn" data-action="copy-backup" class="btn-accent" style="width:100%; margin-bottom:20px;">Copy backup</button>';
    html += '<div class="muted" style="font-size:12px; margin-bottom:8px;">Restore from a backup:</div>';
    html += '<textarea id="restoreInput" class="field mono" style="height:90px; font-size:11px; margin-bottom:8px; resize:none;" placeholder="Paste backup text here"></textarea>';
    if (state.restoreError) html += '<div style="color:var(--rust); font-size:12px; margin-bottom:8px;">'+esc(state.restoreError)+'</div>';
    html += '<button data-action="restore-backup" class="btn-outline" style="width:100%;">Restore this backup</button>';
    html += '</div></div>';
  }

  if (state.showResetConfirm) {
    html += '<div class="modal-backdrop" data-action="close-reset" style="padding:0 24px;">';
    html += '<div class="modal-card" style="border-radius:20px;" data-action="noop">';
    html += '<div class="display" style="font-size:18px; margin-bottom:8px;">Clear all entries?</div>';
    html += '<div class="muted" style="font-size:14px; margin-bottom:16px;">Every logged transaction is removed. Your weekly target and theme stay. This can\'t be undone.</div>';
    html += '<div class="row gap2">';
    html += '<button data-action="close-reset" class="btn-outline" style="flex:1;">Cancel</button>';
    html += '<button data-action="confirm-reset" class="btn-rust row gap2" style="flex:1; justify-content:center; align-items:center;">'+ICONS.rotate+' Clear</button>';
    html += '</div></div></div>';
  }

  if (state.toastMessage) {
    html += '<div style="position:fixed; top:calc(env(safe-area-inset-top,0px) + 16px); left:50%; transform:translateX(-50%); background:var(--positive); color:#0C1322; font-size:13px; font-weight:600; padding:9px 18px; border-radius:999px; box-shadow:0 4px 14px rgba(0,0,0,0.35); z-index:60;">'+esc(state.toastMessage)+'</div>';
  }

  root.innerHTML = html;
}

function renderHomeBody(T, da) {
  var period = getPeriodBounds(state.view, state.offset, state.settings.weeklyTarget, da);
  var displayed = periodStats(period.startStr, period.endStr);

  var isClosed = period.endStr < todayStr();
  var isCurrent = state.offset === 0;
  var daysLeft = Math.max(0, period.days - displayed.calendarElapsedDays);
  var elapsedTarget = displayed.elapsedDays * da;

  var chartData = displayed.rows.length ? (function(){
    var acc = displayed.opening;
    return displayed.rows.map(function(r){ acc = round2(acc + (r.allowance-r.spent)); return { label: shortLabel(r.date), balance: acc }; });
  })() : [];

  var netColor = displayed.net >= 0 ? "var(--positive)" : "var(--rust)";

  var entryDates = Object.keys(state.entries).sort();
  var cumAnchor = state.settings.trackingStartDate || (entryDates.length ? entryDates[0] : todayStr());
  var cumulative = periodStats(cumAnchor, todayStr());
  var cumColor = cumulative.net >= 0 ? "var(--positive)" : "var(--rust)";
  var cumLabel = "Saved since " + parseD(cumAnchor).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
  var todayEntryForCard = state.entries[todayStr()];
  var spentToday = todayEntryForCard ? sumSpent(todayEntryForCard) : 0;
  var spentTodayColor = spentToday > da ? "var(--rust)" : "var(--text)";
  var todayAllowanceForCard = allowanceForDate(todayStr());

  /* Left to spend today: take the tightest of today's own rate, this week's
     pace-adjusted daily left, and this month's — whichever is lowest wins,
     so today's spending stays honest against both horizons at once. */
  var weekDBL = computeDailyBudgetLeft("week", spentToday);
  var monthDBL = computeDailyBudgetLeft("month", spentToday);
  var capCandidates = [todayAllowanceForCard];
  if (weekDBL) capCandidates.push(weekDBL.value);
  if (monthDBL) capCandidates.push(monthDBL.value);
  var effectiveDailyCap = Math.min.apply(null, capCandidates);
  var leftToday = effectiveDailyCap - spentToday;
  var leftTodayColor = leftToday < 0 ? "var(--rust)" : "var(--positive)";

  /* Left to spend today (budget): the plain, uncapped daily rate minus what's
     been spent today — unlike "Left to spend today" above, this ignores the
     week/month pace horizons entirely, so it always reads today's own target. */
  var leftTodayBudget = todayAllowanceForCard - spentToday;
  var leftTodayBudgetColor = leftTodayBudget < 0 ? "var(--rust)" : "var(--positive)";

  var h = "";
  h += '<div class="card" style="padding:14px 16px; margin-bottom:12px;">';
  h += '<div class="row between"><span class="eyebrow" style="font-size:10px;">Left to spend today</span><span class="mono" style="font-size:16px; color:'+leftTodayColor+';">'+fmt(leftToday,2)+' AED</span></div>';
  h += '<div class="row between" style="margin-top:10px;"><span class="eyebrow" style="font-size:10px;">Left to spend today (budget)</span><span class="mono" style="font-size:16px; color:'+leftTodayBudgetColor+';">'+fmt(leftTodayBudget,2)+' AED</span></div>';
  h += '<div class="row between" style="margin-top:10px;"><span class="eyebrow" style="font-size:10px;">Spent today</span><span class="mono" style="font-size:16px; color:'+spentTodayColor+';">'+fmt(spentToday,2)+' AED</span></div>';
  h += '<div class="row between" style="margin-top:10px;"><span class="eyebrow" style="font-size:10px;">'+esc(cumLabel)+'</span><span class="mono" style="font-size:16px; color:'+cumColor+';">'+(cumulative.net>=0?"+":"−")+fmt(Math.abs(cumulative.net),0)+' AED</span></div>';
  h += '</div>';

  h += '<div class="row card" style="padding:4px; margin-bottom:12px;">';
  ["week","month","year"].forEach(function(v){
    var active = state.view===v;
    h += '<button data-action="switch-view" data-view="'+v+'" style="flex:1; border:none; border-radius:10px; padding:6px 0; font-size:14px; text-transform:capitalize; background:'+(active?"var(--accent)":"transparent")+'; color:'+(active?"var(--accent-ink)":"var(--text-muted)")+'; font-weight:'+(active?600:400)+';">'+v+'</button>';
  });
  h += '</div>';

  h += '<div class="card" style="margin-bottom:16px; overflow:hidden;">';
  h += '<div class="row between" style="padding:12px; border-bottom:1px solid var(--hairline);">';
  h += '<button data-action="nav-offset" data-delta="-1" class="icon-btn" style="border-radius:10px;" aria-label="Previous">'+ICONS.chevronLeft+'</button>';
  h += '<div style="text-align:center;"><div style="font-size:14px; font-weight:500;">'+esc(period.title)+'</div>';
  h += '<div class="eyebrow" style="margin-top:2px;">'+esc(period.sub)+(isClosed?" · closed":"")+'</div>';
  if (isCurrent) {
    h += '<div class="muted" style="font-size:11px; margin-top:4px;">'+(state.view==="week"?esc(weekdayLong(todayStr()))+" · ":"")+'Day '+displayed.calendarElapsedDays+' of '+period.days+' · '+daysLeft+' day'+(daysLeft===1?"":"s")+' left</div>';
  }
  h += '</div>';
  h += '<button data-action="nav-offset" data-delta="1" class="icon-btn" style="border-radius:10px;'+(isCurrent?"opacity:0.3;pointer-events:none;":"")+'" aria-label="Next">'+ICONS.chevronRight+'</button>';
  h += '</div>';

  h += '<div style="padding:16px 20px 12px;">';
  h += '<div class="eyebrow">'+(isClosed?"Saved this period":"Saved so far")+'</div>';
  h += '<div class="mono" style="font-size:34px; margin-top:4px; color:'+netColor+';">'+(displayed.net>=0?"+":"−")+fmt(Math.abs(displayed.net),0)+' <span class="muted" style="font-size:17px;">AED</span></div>';
  h += '<div class="muted" style="font-size:12px; margin-top:4px;">'+(displayed.elapsedDays===0 ? ("This "+state.view+" hasn't started yet") : (displayed.loggedCount+" of "+displayed.elapsedDays+" elapsed day"+(displayed.elapsedDays===1?"":"s")+" logged"))+'</div>';
  h += '</div>';

  var todayIncluded = displayed.rows.length > 0 && displayed.rows[displayed.rows.length-1].date === todayStr();
  var todaySpent = todayIncluded ? displayed.rows[displayed.rows.length-1].spent : 0;
  var pastDays = todayIncluded ? displayed.elapsedDays - 1 : displayed.elapsedDays;
  var pastSpent = displayed.spent - todaySpent;
  var avgSpentPerDay = pastDays > 0 ? (pastSpent/pastDays) : null;
  var remainingBudget = period.target - displayed.spent;
  var allowedText, allowedTone, planDaysShown;
  if (daysLeft > 0) {
    planDaysShown = daysLeft + 1; // today counts as a fresh, still-available day
    var spentBeforeToday = displayed.spent - spentToday;
    var remainingExclToday = period.target - spentBeforeToday;
    var perDayLeft = remainingExclToday/planDaysShown;
    allowedText = fmt(perDayLeft,0)+" AED";
    allowedTone = perDayLeft < 0 ? "var(--rust)" : "var(--text)";
  } else {
    allowedText = isClosed ? "—" : "Last day";
    allowedTone = "var(--text-muted)";
  }
  h += '<div class="stat-grid hairline-top" style="padding:12px 20px 16px;">';
  h += statBlock("Spent so far", fmt(displayed.spent,0)+" AED", displayed.spent>elapsedTarget?"var(--rust)":"var(--text)");
  h += statBlock((state.view==="week"?"Weekly":state.view==="month"?"Monthly":"Yearly")+" target", fmt(period.target,0)+" AED", "var(--text)");
  h += statBlock("Avg daily spend", avgSpentPerDay===null ? "—" : (fmt(avgSpentPerDay,0)+" AED"), (avgSpentPerDay!==null && avgSpentPerDay>da)?"var(--rust)":"var(--text)");
  h += statBlock("Daily budget left"+(daysLeft>0?" ("+planDaysShown+"d)":""), allowedText, allowedTone);
  h += statBlock("Left to spend today", fmt(leftToday,0)+" AED", leftToday<0?"var(--rust)":"var(--text)");
  h += statBlock("Budget remaining", (remainingBudget>=0?"":"−")+fmt(Math.abs(remainingBudget),0)+" AED", remainingBudget<0?"var(--rust)":"var(--text)");
  h += '</div>';

  if (chartData.length >= 2) {
    h += '<div class="hairline-top" style="padding:12px 8px 12px;">'+renderChart(chartData, T)+'</div>';
  }
  h += '</div>'; // end period card

  /* Forecast: project where this period lands if spending continues at the
     current pace. Uses the same "Avg daily spend" figure shown above (which
     excludes today, since today isn't finished yet) for consistency. */
  if (isCurrent && daysLeft > 0 && avgSpentPerDay !== null) {
    var pacePerDay = avgSpentPerDay;
    var projectedSpend = displayed.spent + pacePerDay * daysLeft;
    var projectedSaved = period.target - projectedSpend;
    var onTrack = projectedSaved >= 0;
    h += '<div class="card" style="padding:16px; margin-bottom:16px;">';
    h += '<div class="eyebrow" style="margin-bottom:2px;">Forecast at '+(state.view==="week"?"week":state.view==="month"?"month":"year")+' close</div>';
    h += '<div class="muted" style="font-size:11px; margin-bottom:12px;">Based on your '+fmt(pacePerDay,0)+' AED/day average, for the remaining '+daysLeft+' day'+(daysLeft===1?"":"s")+'</div>';
    h += '<div class="stat-grid">';
    h += statBlock("Projected spend", fmt(projectedSpend,0)+" AED", projectedSpend>period.target?"var(--rust)":"var(--text)");
    h += statBlock("Projected saved", (projectedSaved>=0?"+":"−")+fmt(Math.abs(projectedSaved),0)+" AED", onTrack?"var(--positive)":"var(--rust)");
    h += '</div>';
    h += '<div style="margin-top:10px; font-size:12px; color:'+(onTrack?"var(--positive)":"var(--rust)")+';">'+(onTrack?"On track to finish under budget":"On track to overshoot — ease off to recover")+'</div>';
    h += '</div>';
  }

  return h;
}

function renderSettingsModal() {
  var tabs = [{id:"budget",label:"Budget"},{id:"tracking",label:"Tracking"},{id:"categories",label:"Categories"}];
  var h = '<div class="modal-backdrop" data-action="close-settings">';
  h += '<div class="modal-card" data-action="noop">';
  h += '<div class="row between" style="margin-bottom:14px;"><div class="display" style="font-size:18px;">Settings</div><button data-action="close-settings" style="background:none;border:none;color:var(--text-muted);">'+ICONS.x+'</button></div>';

  h += '<div class="row" style="background:var(--raised); border:1px solid var(--hairline); border-radius:10px; padding:3px; margin-bottom:16px;">';
  tabs.forEach(function(t){
    var active = state.settingsTab === t.id;
    h += '<button data-action="settings-tab" data-tab="'+t.id+'" style="flex:1; border:none; border-radius:8px; padding:6px 0; font-size:13px; background:'+(active?"var(--accent)":"transparent")+'; color:'+(active?"var(--accent-ink)":"var(--text-muted)")+'; font-weight:'+(active?600:400)+';">'+t.label+'</button>';
  });
  h += '</div>';

  if (state.settingsTab === "budget") {
    var curWeekly = currentWeeklyTarget();
    var wkBounds = getPeriodBounds("week", 0, curWeekly, curWeekly/7);
    h += '<label class="eyebrow">Weekly budget target</label>';
    h += '<div style="position:relative; margin:6px 0 6px;"><span class="muted" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:14px;">AED</span>';
    h += '<input id="weeklyDraftInput" type="number" inputmode="decimal" class="field mono" style="padding-left:44px;" value="'+curWeekly+'" /></div>';
    h += '<div class="muted" style="font-size:12px; margin-bottom:14px;">= '+fmt(curWeekly/7,2)+' AED per day. Choose how far this change should reach:</div>';
    h += '<button data-action="apply-budget" data-scope="future" class="btn-accent" style="width:100%; margin-bottom:8px;">This week onward</button>';
    h += '<div class="muted" style="font-size:11px; margin-bottom:12px;">From '+esc(shortLabel(wkBounds.startStr))+' forward. Earlier weeks keep their old rate — this is usually what you want.</div>';
    h += '<button data-action="apply-budget" data-scope="thisPeriod" class="btn-outline" style="width:100%; margin-bottom:8px;">This week only</button>';
    h += '<div class="muted" style="font-size:11px; margin-bottom:12px;">Just '+esc(shortLabel(wkBounds.startStr))+'–'+esc(shortLabel(wkBounds.endStr))+'. Reverts to the previous rate afterwards.</div>';
    h += '<button data-action="apply-budget" data-scope="all" class="btn-outline" style="width:100%; margin-bottom:8px;">All periods, past and future</button>';
    h += '<div class="muted" style="font-size:11px;">Rewrites your whole history to this rate. Use if you were still dialling the number in and want past weeks re-judged against it.</div>';
  }

  if (state.settingsTab === "tracking") {
    h += '<label class="eyebrow">Tracking start date (optional)</label>';
    h += '<input id="trackingStartInput" type="date" class="field mono" style="margin:6px 0 6px;" value="'+(state.settings.trackingStartDate||"")+'" max="'+todayStr()+'" />';
    h += '<div class="muted" style="font-size:12px; margin-bottom:16px;">Caps how far back Week/Month/Year totals count. Set this to when you actually started using the app so untracked earlier days aren\'t assumed as saved. Leave blank to count from each period\'s natural start.</div>';
    h += '<button data-action="save-tracking" class="btn-accent" style="width:100%; margin-bottom:20px;">Save</button>';
    h += '<div class="hairline-top" style="padding-top:14px;">';
    h += '<label class="eyebrow">Backup & restore</label>';
    h += '<div class="muted" style="font-size:12px; margin:6px 0 10px;">Copy your data out, or paste it back in — also how you move data between devices or browsers.</div>';
    h += '<button data-action="open-backup" class="btn-outline" style="width:100%;">Open backup & restore</button>';
    h += '</div>';
  }

  if (state.settingsTab === "categories") {
    h += '<label class="eyebrow">Categories</label>';
    h += '<div style="display:flex; flex-direction:column; gap:6px; margin:8px 0 10px;">';
    var catList = state.settings.categories||[];
    catList.forEach(function(c,ci){
      h += '<div class="row between" style="background:var(--raised); border:1px solid var(--hairline); border-radius:8px; padding:7px 8px 7px 12px;">';
      h += '<span style="font-size:13px;">'+esc(c)+'</span>';
      h += '<div class="row gap2">';
      h += '<button data-action="move-category" data-cat="'+esc(c)+'" data-dir="-1" style="background:none;border:none;padding:3px;color:'+(ci===0?"var(--hairline)":"var(--text-muted)")+';" '+(ci===0?"disabled":"")+' aria-label="Move up">'+ICONS.chevronUp+'</button>';
      h += '<button data-action="move-category" data-cat="'+esc(c)+'" data-dir="1" style="background:none;border:none;padding:3px;color:'+(ci===catList.length-1?"var(--hairline)":"var(--text-muted)")+';" '+(ci===catList.length-1?"disabled":"")+' aria-label="Move down">'+ICONS.chevronDown+'</button>';
      h += '<button data-action="remove-category" data-cat="'+esc(c)+'" style="background:none;border:none;padding:3px;color:var(--text-muted);" aria-label="Remove">'+ICONS.trash+'</button>';
      h += '</div></div>';
    });
    if (!catList.length) h += '<span class="muted" style="font-size:12px;">No categories yet.</span>';
    h += '</div>';
    h += '<div class="row gap2"><input id="newCategoryInput" type="text" class="field" placeholder="New category" style="flex:1;" /><button data-action="add-category" class="btn-outline">Add</button></div>';
  }

  h += '</div></div>';
  return h;
}

function renderAddTxnModal() {
