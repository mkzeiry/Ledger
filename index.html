var CAT_ICON_ORDER = ["tag","fork","basket","bag","house","car","bolt","heart","film","book","gift","plane"];  
var CATEGORY_STYLES = {  
  "Food & Dining": { icon:"fork", color:"#D4614A" },  
  "Groceries": { icon:"basket", color:"#5EA05E" },  
  "Transport": { icon:"car", color:"#7BA7D4" },  
  "Shopping": { icon:"bag", color:"#B58BD0" },  
  "Bills & Utilities": { icon:"bolt", color:"#C9A227" },  
  "Health": { icon:"heart", color:"#E0687A" },  
  "Entertainment": { icon:"film", color:"#7E8CC4" },  
  "Other": { icon:"tag", color:"#8595B5" },  
};  
function categoryStyle(name) {  
  if (!name) return { icon:"tag", color:"#8595B5" };  
  var custom = state.settings.categoryStyles && state.settings.categoryStyles[name];  
  if (custom) return { icon: (custom.icon && CAT_ICON_SVGS[custom.icon]) ? custom.icon : "tag", color: custom.color || "#8595B5" };  
  if (CATEGORY_STYLES[name]) return CATEGORY_STYLES[name];  
  var hash = 0;  
  for (var i=0;i<name.length;i++) hash = (hash*31 + name.charCodeAt(i)) >>> 0;  
  return { icon:"tag", color: PIE_COLORS[hash % PIE_COLORS.length] };  
}  
function catIconCircle(categoryName) {  
  var st = categoryStyle(categoryName);  
  return '<span style="width:32px; height:32px; border-radius:50%; background:'+st.color+'; display:flex; align-items:center; justify-content:center; flex-shrink:0;">'+CAT_ICON_SVGS[st.icon]+'</span>';  
}  

function renderPieChart(slices, T, selectedLabel, centerLabel, centerValue, tapAction, tapDataKey) {  
  var size = 240, rOuter = 104, rInner = rOuter*0.55, cx = size/2, cy = size/2;  
  var total = slices.reduce(function(s,x){ return s+x.value; }, 0);  
  if (total <= 0) return "";  
  var angle = -Math.PI/2;  
  var paths = "";  
  slices.forEach(function(sl, i){  
    var frac = sl.value/total;  
    var sweep = frac * Math.PI * 2;  
    var end = angle + sweep;  
    var color = PIE_COLORS[i % PIE_COLORS.length];  
    var isSel = selectedLabel != null && sl.label === selectedLabel;  
    var op = (selectedLabel != null && !isSel) ? ' opacity="0.3"' : '';  
    var tap = (tapAction === "none") ? '' : (' class="chart-hit" data-action="'+(tapAction||"filter-analysis-category")+'" data-'+(tapDataKey||"cat")+'="'+esc(sl.label)+'"');  
    var d;  
    if (frac >= 0.9999) {  
      d = 'M '+(cx+rOuter)+' '+cy+' A '+rOuter+' '+rOuter+' 0 1 1 '+(cx-rOuter)+' '+cy+' A '+rOuter+' '+rOuter+' 0 1 1 '+(cx+rOuter)+' '+cy+' Z'  
        + ' M '+(cx+rInner)+' '+cy+' A '+rInner+' '+rInner+' 0 1 0 '+(cx-rInner)+' '+cy+' A '+rInner+' '+rInner+' 0 1 0 '+(cx+rInner)+' '+cy+' Z';  
      paths += '<path d="'+d+'" fill="'+color+'" fill-rule="evenodd"'+op+tap+'/>';  
    } else {  
      var ox1 = cx + rOuter*Math.cos(angle), oy1 = cy + rOuter*Math.sin(angle);  
      var ox2 = cx + rOuter*Math.cos(end),   oy2 = cy + rOuter*Math.sin(end);  
      var ix1 = cx + rInner*Math.cos(end),   iy1 = cy + rInner*Math.sin(end);  
      var ix2 = cx + rInner*Math.cos(angle), iy2 = cy + rInner*Math.sin(angle);  
      var large = sweep > Math.PI ? 1 : 0;  
      d = 'M '+ox1+' '+oy1+' A '+rOuter+' '+rOuter+' 0 '+large+' 1 '+ox2+' '+oy2+' L '+ix1+' '+iy1+' A '+rInner+' '+rInner+' 0 '+large+' 0 '+ix2+' '+iy2+' Z';  
      paths += '<path d="'+d+'" fill="'+color+'" stroke="'+T.card+'" stroke-width="3.5" stroke-linejoin="round"'+op+tap+'/>';  
    }  
    angle = end;  
  });  
  var selSlice = selectedLabel != null ? slices.filter(function(s){ return s.label===selectedLabel; })[0] : null;  
  var nameRaw = selSlice ? selSlice.label : (centerLabel || "All");  
  var name = nameRaw.length > 16 ? nameRaw.slice(0,15)+"…" : nameRaw;  
  var valueForCenter = selSlice ? selSlice.value : (centerValue || 0);  
  var centerSvg = '<text x="'+cx+'" y="'+(cy-8)+'" font-size="15" fill="'+T.textMuted+'" text-anchor="middle">'+esc(name)+'</text>'  
    + '<text x="'+cx+'" y="'+(cy+21)+'" font-size="22" font-weight="700" fill="'+T.text+'" text-anchor="middle" font-family="var(--f-num)">'+fmt(Math.round(valueForCenter),0)+' AED</text>';  
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+paths+centerSvg+'</svg>';  
}  

function renderDailyBarChart(buckets, getValue, getColor, T, refLine, selectedKey, chartId) {  
  if (!buckets.length) return '<div class="muted" style="font-size:12px;">No data in this period.</div>';  
  var w = 340, h = 156, padL = 30, padR = 8, padB = 20;  
  var n = buckets.length;  
  var plotW = w-padL-padR;  
  var slot = plotW/n;  
  var barW = Math.max(1, Math.min(20, slot*0.7));  
  var labelMode = slot >= 20 ? "h" : (slot >= 7 ? "v" : "none");  
  var padT = labelMode === "v" ? 40 : 18;  
  var values = buckets.map(getValue);  
  var maxVal = Math.max.apply(null, values.concat([0, refLine==null?0:refLine]));  
  var minVal = Math.min.apply(null, values.concat([0]));  
  var range = (maxVal - minVal) || 1;  
  var plotH = h-padT-padB;  
  function y(v){ return padT + plotH - ((v-minVal)/range)*plotH; }  
  var zeroY = y(0);  
  var bars = buckets.map(function(b,i){  
    var v = getValue(b);  
    var cx = padL + slot*i + slot/2;  
    var top = v>=0 ? y(v) : zeroY;  
    var barH = Math.max(0.5, Math.abs(y(v)-zeroY));  
    var hitKey = (chartId||"c")+"|"+b.key;  
    var isSel = selectedKey != null && hitKey === selectedKey;  
    var dim = (selectedKey != null && !isSel) ? ' opacity="0.38"' : '';  
    var svg = '<rect x="'+(cx-barW/2)+'" y="'+top+'" width="'+barW+'" height="'+barH+'" fill="'+getColor(b,v)+'" rx="2"'+dim+'/>';  
    if (isSel) {  
      svg += '<rect x="'+(cx-barW/2-1.5)+'" y="'+(top-1.5)+'" width="'+(barW+3)+'" height="'+(barH+3)+'" fill="none" stroke="'+T.text+'" stroke-width="1.5" rx="3"/>';  
    }  
    if (labelMode !== "none" && Math.round(v) !== 0) {  
      var roundedV = Math.round(v);  
      var labelStr = roundedV < 0 ? ("−"+fmt(Math.abs(roundedV),0)) : fmt(roundedV,0);  
      var labelFill = isSel ? T.text : T.textMuted;  
      if (labelMode === "h") {  
        var labelY = v>=0 ? Math.max(9, top-3) : (top+barH+9);  
        svg += '<text x="'+cx+'" y="'+labelY+'" font-size="8" fill="'+labelFill+'" text-anchor="middle">'+labelStr+'</text>';  
      } else {  
        if (v>=0) {  
          svg += '<text x="0" y="0" font-size="7" fill="'+labelFill+'" text-anchor="start" transform="translate('+cx+','+Math.max(10,top-3)+') rotate(-90)">'+labelStr+'</text>';  
        } else {  
          svg += '<text x="0" y="0" font-size="7" fill="'+labelFill+'" text-anchor="start" transform="translate('+cx+','+(top+barH+3)+') rotate(90)">'+labelStr+'</text>';  
        }  
      }  
    }  
    svg += '<rect class="chart-hit" data-action="select-bucket" data-key="'+esc(hitKey)+'" x="'+(padL+slot*i)+'" y="'+padT+'" width="'+slot+'" height="'+plotH+'" fill="transparent"/>';  
    return svg;  
  }).join("");  
  var refSvg = "";  
  if (refLine != null) {  
    var ry = y(refLine);  
    refSvg = '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+ry+'" y2="'+ry+'" stroke="'+T.textMuted+'" stroke-dasharray="3,3"/>'  
      + '<text x="2" y="'+(ry+3)+'" font-size="8" fill="'+T.textMuted+'">'+fmt(Math.round(refLine),0)+'</text>';  
  }  
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'">'  
    + refSvg  
    + '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+zeroY+'" y2="'+zeroY+'" stroke="'+T.hairline+'"/>'  
    + bars  
    + '<text x="'+padL+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'">'+esc(buckets[0].label)+'</text>'  
    + '<text x="'+(w-padR)+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'" text-anchor="end">'+esc(buckets[buckets.length-1].label)+'</text>'  
    + '</svg>';  
}  

function forecastChartGeom(rows, totalDays, target, projectedSpend, compareValues, pastDays) {  
  var w=340, h=190, padL=44, padR=8, padT=24, padB=20;  
  var plotW=w-padL-padR, plotH=h-padT-padB;  
  var n = Math.max(totalDays, 2);  
  function xAt(i){ return padL + (i/(n-1))*plotW; }  
  var actualVals = []; var acc = 0;  
  rows.forEach(function(r){ acc += r.spent; actualVals.push(acc); });  
  var compareMax = (compareValues && compareValues.length) ? Math.max.apply(null, compareValues) : 0;  
  var maxY = Math.max(target, projectedSpend, actualVals.length ? Math.max.apply(null, actualVals) : 0, compareMax, 1);  
  function yAt(v){ return padT + plotH - (v/maxY)*plotH; }  
  var lastIdx = actualVals.length - 1;  
  var lastVal = actualVals.length ? actualVals[actualVals.length-1] : 0;  
  var pd = pastDays || 0;  
  var knownIdx = pd > 0 ? pd - 1 : 0;  
  var knownVal = pd > 0 ? actualVals[pd-1] : 0;  
  return { w:w, h:h, padL:padL, padR:padR, padT:padT, padB:padB, plotW:plotW, plotH:plotH,  
           n:n, xAt:xAt, yAt:yAt, maxY:maxY, actualVals:actualVals, lastIdx:lastIdx, lastVal:lastVal,  
           knownIdx:knownIdx, knownVal:knownVal };  
}  
function forecastValueAt(g, idx, projectedSpend) {  
  if (idx <= g.lastIdx && g.actualVals.length) return g.actualVals[Math.max(0,idx)];  
  if (g.n-1 === g.knownIdx) return g.knownVal;  
  var frac = (idx - g.knownIdx) / ((g.n-1) - g.knownIdx);  
  return g.knownVal + (projectedSpend - g.knownVal) * frac;  
}  

function renderForecastChart(rows, totalDays, target, projectedSpend, T, refLabel, compareValues, pastDays, hasForecast) {  
  var g = forecastChartGeom(rows, totalDays, target, projectedSpend, compareValues, pastDays);  
  var w=g.w, h=g.h, padL=g.padL, padR=g.padR, padT=g.padT, padB=g.padB, plotW=g.plotW, plotH=g.plotH, n=g.n;  
  var xAt=g.xAt, yAt=g.yAt, maxY=g.maxY, actualVals=g.actualVals, lastIdx=g.lastIdx, lastVal=g.lastVal;  
  
  var actualPts = actualVals.map(function(v,i){ return [xAt(i), yAt(v)]; });  
  var curveD = actualPts.length >= 2 ? smoothPathD(actualPts) : (actualPts.length===1 ? ("M "+actualPts[0][0]+","+actualPts[0][1]) : "");  
  var areaD = curveD ? (curveD+" L "+xAt(Math.max(0,lastIdx))+","+yAt(0)+" L "+xAt(0)+","+yAt(0)+" Z") : "";  
  
  var forecastD = "";  
  var todayMarker = "";  
  var daysToEstimateLocal = totalDays - (pastDays||0);  
  if (rows.length > 0 && daysToEstimateLocal > 0) {  
    if (hasForecast) forecastD = 'M '+xAt(g.knownIdx)+','+yAt(g.knownVal)+' L '+xAt(n-1)+','+yAt(projectedSpend);  
    todayMarker = '<line x1="'+xAt(lastIdx)+'" x2="'+xAt(lastIdx)+'" y1="'+padT+'" y2="'+(h-padB)+'" stroke="'+T.hairline+'" stroke-dasharray="2,2"/>'  
      + '<text x="'+xAt(lastIdx)+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'" text-anchor="middle">Today</text>';  
  }  
  
  var compareD = "";  
  if (compareValues && compareValues.length >= 2) {  
    var comparePts = compareValues.map(function(v,i){ return [xAt(i), yAt(v)]; });  
    compareD = smoothPathD(comparePts);  
  } else if (compareValues && compareValues.length === 1) {  
    compareD = "M "+xAt(0)+","+yAt(compareValues[0]);  
  }  
  
  var budgetY = yAt(target);  
  var ticksSet = {}; [0, Math.round(maxY/2), Math.round(maxY)].forEach(function(t){ ticksSet[t]=true; });  
  var tickSvg = Object.keys(ticksSet).map(Number).map(function(t){  
    return '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+yAt(t)+'" y2="'+yAt(t)+'" stroke="'+T.sep+'" stroke-dasharray="2,2"/>'  
      + '<text x="2" y="'+(yAt(t)+3)+'" font-size="9" fill="'+T.textMuted+'">'+fmt(t,0)+'</text>';  
  }).join("");  
  
  return '<svg id="forecastChartSvg" viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'">'  
    + tickSvg  
    + '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+budgetY+'" y2="'+budgetY+'" stroke="'+T.text+'" stroke-width="1.5" stroke-dasharray="4,3"/>'  
    + '<text x="'+padL+'" y="'+(budgetY-5)+'" font-size="9" font-weight="600" fill="'+T.text+'">'+esc(refLabel||"Budget")+' – '+fmt(target,0)+' AED</text>'  
    + (compareD ? '<path d="'+compareD+'" fill="none" stroke="'+T.textMuted+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5,4"/>' : "")  
    + (areaD ? '<path d="'+areaD+'" fill="'+T.positive+'" fill-opacity="0.16" stroke="none"/>' : "")  
    + (curveD ? '<path d="'+curveD+'" fill="none" stroke="'+T.positive+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' : "")  
    + (forecastD ? '<path d="'+forecastD+'" fill="none" stroke="'+T.accent+'" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1,5"/>' : "")  
    + todayMarker  
    + '<line id="forecastChartCrosshair" x1="0" x2="0" y1="'+padT+'" y2="'+(h-padB)+'" stroke="'+T.text+'" stroke-width="1" opacity="0"/>'  
    + '<circle id="forecastChartDot" r="4.5" fill="'+T.accent+'" stroke="'+T.bg+'" stroke-width="2" opacity="0"/>'  
    + '<rect id="forecastChartHit" x="0" y="0" width="'+w+'" height="'+h+'" fill="transparent" style="touch-action:none;"/>'  
    + '</svg>';  
}  

function wireForecastChart(data) {  
  var svg = document.getElementById("forecastChartSvg");  
  var hit = document.getElementById("forecastChartHit");  
  var crosshair = document.getElementById("forecastChartCrosshair");  
  var dot = document.getElementById("forecastChartDot");  
  var tip = document.getElementById("forecastChartTip");  
  if (!svg || !hit || !crosshair || !dot || !tip || !data) return;  
  var g = forecastChartGeom(data.rows, data.totalDays, data.target, data.projectedSpend, data.compareValues, data.pastDays);  
  if (g.n < 2) return;  
  
  function indexAt(clientX) {  
    var rect = svg.getBoundingClientRect();  
    if (!rect.width) return 0;  
    var frac = Math.max(0, Math.min(1, (clientX-rect.left)/rect.width));  
    var vbX = frac * g.w;  
    var idx = Math.round(((vbX-g.padL)/g.plotW) * (g.n-1));  
    return Math.max(0, Math.min(g.n-1, idx));  
  }  
  function showAt(idx) {  
    var val = forecastValueAt(g, idx, data.projectedSpend);  
    var px = g.xAt(idx), py = g.yAt(val);  
    crosshair.setAttribute("x1", px); crosshair.setAttribute("x2", px); crosshair.setAttribute("opacity", "1");  
    dot.setAttribute("cx", px); dot.setAttribute("cy", py); dot.setAttribute("opacity", "1");  
    var dateStr = shortLabel(toStr(addDays(parseD(data.start), idx)));  
    var isProjected = idx > g.lastIdx;  
    var lineStyle = 'white-space:nowrap; overflow:hidden; text-overflow:ellipsis;';  
    var tipHtml = '<div style="'+lineStyle+'"><span class="muted">'+esc(dateStr)+(isProjected?" (projected)":"")+'</span> <span style="color:var(--text); font-weight:600;">'+fmt(Math.round(val),0)+' AED</span></div>';  
    if (data.compareValues && data.compareValues.length > idx) {  
      tipHtml += '<div style="'+lineStyle+' margin-top:2px;"><span class="muted">'+esc(data.compareLabel||"Compare")+' </span><span style="color:var(--text-muted); font-weight:600;">'+fmt(Math.round(data.compareValues[idx]),0)+' AED</span></div>';  
    }  
    tip.innerHTML = tipHtml;  
    positionChartTooltip(tip, svg, px, g.w);  
    tip.style.opacity = "1";  
  }  
  function hide() {  
    crosshair.setAttribute("opacity", "0");  
    dot.setAttribute("opacity", "0");  
    tip.style.opacity = "0";  
  }  
  function move(clientX) { showAt(indexAt(clientX)); }  
  
  hit.addEventListener("touchstart", function(e){ move(e.touches[0].clientX); }, {passive:true});  
  hit.addEventListener("touchmove", function(e){ move(e.touches[0].clientX); e.preventDefault(); }, {passive:false});  
  hit.addEventListener("touchend", hide);  
  hit.addEventListener("touchcancel", hide);  
  hit.addEventListener("mousedown", function(e){ move(e.clientX); });  
  hit.addEventListener("mousemove", function(e){ if (e.buttons===1) move(e.clientX); });  
  hit.addEventListener("mouseleave", hide);  
  hit.addEventListener("mouseup", hide);  
}  

function computeForecastNumbers(rows, totalDays, periodStart) {  
  if (!rows.length) return null;  
  var today = todayStr();  
  var todayIncluded = rows[rows.length-1].date === today;  
  var todayRow = todayIncluded ? rows[rows.length-1] : null;  
  var pastRows = todayIncluded ? rows.slice(0, rows.length-1) : rows.slice();  
  var pastDays = pastRows.length;  
  var pastSpent = pastRows.reduce(function(s,r){ return s+r.spent; }, 0);  
  var pastDiscretionary = discretionarySpentInRows(pastRows);  
  var todayScheduledSpent = todayRow ? (todayRow.items||[]).reduce(function(s,it){ return it.recurringId ? s+it.amount : s; }, 0) : 0;  
  var actualSpentSoFar = pastSpent + (todayRow ? todayRow.spent : 0);  
  var knownSpent = pastSpent + todayScheduledSpent;  
  var historicalAvg = overallAvgDailySpend();  
  var BLEND_K = historicalAvg !== null ? 3 : 0;  
  var blendDenom = pastDays + BLEND_K;  
  var avgSpentPerDay = blendDenom > 0 ? ((pastDiscretionary + (historicalAvg !== null ? historicalAvg*BLEND_K : 0)) / blendDenom) : null;  
  var stillBlending = historicalAvg !== null && pastDays < BLEND_K;  
  var daysToEstimate = Math.max(0, totalDays - pastDays);  
  var periodEnd = toStr(addDays(parseD(periodStart), totalDays-1));  
  var scheduledUpcoming = daysToEstimate > 0 ? scheduledAmountInRange(toStr(addDays(parseD(today), -1)), periodEnd) : 0;  
  var hasForecast = daysToEstimate > 0 && (avgSpentPerDay !== null || scheduledUpcoming > 0);  
  var projectedSpend = hasForecast  
    ? (knownSpent + (avgSpentPerDay || 0) * daysToEstimate + scheduledUpcoming)  
    : actualSpentSoFar;  
  return {  
    todayIncluded: todayIncluded, pastDays: pastDays, pastSpent: pastSpent,  
    pastDiscretionary: pastDiscretionary, actualSpentSoFar: actualSpentSoFar,  
    knownSpent: knownSpent, avgSpentPerDay: avgSpentPerDay, stillBlending: stillBlending,  
    daysToEstimate: daysToEstimate, scheduledUpcoming: scheduledUpcoming,  
    hasForecast: hasForecast, projectedSpend: projectedSpend  
  };  
}  

function buildForecastCard(rows, totalDays, target, periodStart, T, refLabel, periodWord, compareRows) {  
  if (!rows.length) return "";  
  var fc = computeForecastNumbers(rows, totalDays, periodStart);  
  var todayIncluded = fc.todayIncluded, pastDays = fc.pastDays, pastDiscretionary = fc.pastDiscretionary,  
      avgSpentPerDay = fc.avgSpentPerDay, stillBlending = fc.stillBlending, daysToEstimate = fc.daysToEstimate,  
      scheduledUpcoming = fc.scheduledUpcoming, hasForecast = fc.hasForecast, projectedSpend = fc.projectedSpend;  
  var projectedSaved = target - projectedSpend;  
  var favorable = projectedSaved >= 0;  
  var vsBudgetPct = target > 0 ? Math.round(((projectedSpend-target)/target)*100) : 0;  
  
  var compareMode = state.forecastCompareMode === "average" ? "average" : "previous";  
  var compareLabel = compareMode === "average" ? "Average pace" : (periodWord === "period" ? "Previous period" : ("Last "+periodWord));  
  var compareValues = null;  
  var compareUnavailableNote = null;  
  if (compareMode === "previous") {  
    if (compareRows && compareRows.length) {  
      var cAcc = 0;  
      compareValues = compareRows.slice(0, totalDays).map(function(r){ cAcc += r.spent; return cAcc; });  
    } else {  
      compareUnavailableNote = "No " + compareLabel.toLowerCase() + " logged yet to compare against.";  
    }  
  } else if (avgSpentPerDay !== null) {  
    compareValues = [];  
    for (var ci=0; ci<totalDays; ci++) compareValues.push(avgSpentPerDay * ci);  
  } else {  
    compareUnavailableNote = "Not enough history yet to show an average pace.";  
  }  
  
  var s = '<div class="card card-pad" style="margin-bottom:16px;">';  
  s += '<div class="eyebrow" style="margin-bottom:10px;">Forecasted spend</div>';  
  s += '<div class="row between" style="align-items:flex-start; margin-bottom:14px;">';  
  s += '<div><div class="muted caption">THIS '+esc(periodWord.toUpperCase())+'</div><div class="mono" style="font-size:22px; font-weight:700; margin-top:2px;">'+fmt(projectedSpend,0)+' AED</div></div>';  
  s += '<div style="text-align:right;"><div class="muted caption">VS '+esc(refLabel.toUpperCase())+'</div>';  
  s += '<div class="chip" style="margin-top:4px; background:'+(favorable?"var(--positive)":"var(--rust)")+'; color:#fff; font-weight:700;">'+(vsBudgetPct>=0?"+":"")+vsBudgetPct+'%</div>';  
  s += '<div class="mono footnote" style="margin-top:4px; color:'+(favorable?"var(--positive)":"var(--rust)")+';">'+(projectedSaved>=0?"+":"−")+fmt(Math.abs(projectedSaved),0)+' AED</div>';  
  s += '</div></div>';  
  s += '<div class="seg" style="margin-bottom:12px;">';  
  [["previous", periodWord === "period" ? "vs Previous period" : ("vs Last "+periodWord)], ["average","vs Average pace"]].forEach(function(opt){  
    var active = compareMode === opt[0];  
    s += '<button class="seg-btn" role="tab" aria-selected="'+active+'" data-action="set-forecast-compare" data-mode="'+opt[0]+'">'+opt[1]+'</button>';  
  });  
  s += '</div>';  
  s += '<div id="forecastChartWrap" style="position:relative;">';  
  s += '<div id="forecastChartTip" class="mono footnote" style="position:absolute; top:0; left:0; background:var(--fill); border-radius:8px; padding:4px 9px; max-width:250px; opacity:0; pointer-events:none; transition:opacity .12s ease; z-index:2;"></div>';  
  s += renderForecastChart(rows, totalDays, target, projectedSpend, T, refLabel, compareValues, pastDays, hasForecast);  
  s += '</div>';  
  if (compareValues) {  
    s += '<div class="row gap2" style="margin-top:10px; flex-wrap:wrap;">';  
    s += legendSwatch(T.positive, "Actual");  
    s += legendSwatch(T.accent, "Projected");  
    s += legendSwatch(T.textMuted, compareLabel);  
    s += '</div>';  
  }  
  var notes = [];  
  if (compareUnavailableNote) notes.push(compareUnavailableNote);  
  if (!hasForecast) {  
    notes.push(daysToEstimate<=0 ? "Period is complete — nothing left to forecast." : "Log a few days to start forecasting.");  
  } else {  
    if (todayIncluded) notes.push("Today isn't finished yet, so it's estimated from your pace.");  
    if (scheduledUpcoming > 0) notes.push("Includes "+fmt(scheduledUpcoming,0)+" AED of scheduled payments still to come.");  
    if (stillBlending) notes.push(pastDiscretionary>0 ? "Day-to-day pace is blended with your overall average." : "Pace blended from your overall average.");  
  }  
  notes.forEach(function(n){ s += '<div class="muted caption" style="margin-top:8px;">'+esc(n)+'</div>'; });  
  s += '</div>';  
  lastForecastChartData = { rows: rows, totalDays: totalDays, target: target, projectedSpend: projectedSpend, start: periodStart, compareValues: compareValues, compareLabel: compareLabel, pastDays: pastDays };  
  return s;  
}  

function renderTrendBarChart(items, refTarget, T, refLabel) {  
  var w=340, h=150, padL=34, padR=8, padT=22, padB=20;  
  var plotW=w-padL-padR, plotH=h-padT-padB;  
  var maxVal = Math.max.apply(null, items.map(function(i){ return i.spent; }).concat([refTarget, 1]));  
  var n = items.length;  
  var slot = plotW/n;  
  var barW = Math.min(30, slot*0.6);  
  function y(v){ return padT + plotH - (Math.min(v,maxVal)/maxVal)*plotH; }  
  var colorFor = { positive: T.positive, amber: T.amber, rust: T.rust };  
  var bars = items.map(function(it,i){  
    var cx = padL + slot*i + slot/2;  
    var topY = y(it.spent);  
    var barH = Math.max(0, plotH - (topY-padT));  
    var labelSvg = it.spent > 0 ? '<text x="'+cx+'" y="'+Math.max(9,topY-4)+'" font-size="8" fill="'+T.textMuted+'" text-anchor="middle">'+fmt(Math.round(it.spent),0)+'</text>' : '';  
    return '<rect x="'+(cx-barW/2)+'" y="'+topY+'" width="'+barW+'" height="'+barH+'" fill="'+(colorFor[it.status]||T.positive)+'" rx="3"/>'  
      + labelSvg  
      + '<text x="'+cx+'" y="'+(h-4)+'" font-size="9" fill="'+T.textMuted+'" text-anchor="middle">'+esc(it.label)+'</text>';  
  }).join("");  
  var refY = y(refTarget);  
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'">'  
    + '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+refY+'" y2="'+refY+'" stroke="'+T.text+'" stroke-width="1.5" stroke-dasharray="4,3"/>'  
    + '<text x="'+padL+'" y="'+(refY-5)+'" font-size="9" font-weight="600" fill="'+T.text+'">'+esc(refLabel||"Budget")+'</text>'  
    + bars + '</svg>';  
}  

function getTxnPeriodInfo() {  
  var today = todayStr();  
  var mode = state.txnPeriodMode || "all";  
  var off = state.txnOffset || 0;  
  var entryDatesAll = Object.keys(state.entries).sort();  
  var naturalStart = state.settings.trackingStartDate || (entryDatesAll.length ? entryDatesAll[0] : today);  
  if (mode === "all") {  
    var latestEntryDate = entryDatesAll.length ? entryDatesAll[entryDatesAll.length-1] : today;  
    var endAll = latestEntryDate > today ? latestEntryDate : today;  
    return { start: naturalStart, end: endAll, title: "All time", sub: "", isCurrent: true, mode: mode };  
  }  
  if (mode === "custom") {  
    var from = state.txnPeriodFrom || naturalStart;  
    var to = state.txnPeriodTo || today;  
    if (from > to) { var swap = from; from = to; to = swap; }  
    return { start: from, end: to, title: shortLabel(from)+" – "+shortLabel(to), sub: "Custom range", isCurrent: true, mode: mode };  
  }  
  var per = getPeriodBounds(mode, off, currentWeeklyTarget(), dailyReference());  
  return { start: per.startStr, end: per.endStr, title: per.title, sub: per.sub, isCurrent: off === 0, mode: mode };  
}  
  
function getAnalysisPeriodInfo() {  
  var today = todayStr();  
  var mode = state.analysisPeriodMode || "month";  
  var off = state.analysisOffset || 0;  
  if (mode === "custom") {  
    var entryDatesAll = Object.keys(state.entries).sort();  
    var fallbackStart = state.settings.trackingStartDate || (entryDatesAll.length ? entryDatesAll[0] : today);  
    var from = state.analysisPeriodFrom || fallbackStart;  
    var to = state.analysisPeriodTo || today;  
    if (from > to) { var swap = from; from = to; to = swap; }  
    return { start: from, end: to, title: shortLabel(from)+" – "+shortLabel(to), sub: "Custom range", isCurrent: true, mode: mode, days: daysBetween(from,to)+1 };  
  }  
  var per = getPeriodBounds(mode, off, currentWeeklyTarget(), dailyReference());  
  return { start: per.startStr, end: per.endStr, title: per.title, sub: per.sub, isCurrent: off === 0, mode: mode, days: per.days };  
}  

function analysisGranularity(info) {  
  if (info.mode === "year") return "month";  
  if (info.mode === "custom") return daysBetween(info.start, info.end) > 62 ? "month" : "day";  
  return "day";  
}  

function buildAnalysisBuckets(rows, granularity, catFilter) {  
  function keep(it){ return !catFilter || (it.category || "Uncategorised") === catFilter; }  
  function spentOf(r){  
    if (!catFilter) return r.spent;  
    return (r.items||[]).reduce(function(t,it){ return keep(it) ? t+it.amount : t; }, 0);  
  }  
  if (granularity !== "month") {  
    return rows.map(function(r){  
      return { key: r.date, label: shortLabel(r.date), title: dayLabel(r.date), date: r.date,  
               dates: [r.date], spent: spentOf(r), allowance: r.allowance, days: 1 };  
    });  
  }  
  var map = {}, order = [];  
  rows.forEach(function(r){  
    var key = r.date.slice(0,7);  
    if (!map[key]) {  
      map[key] = { key: key, label: parseD(r.date).toLocaleDateString("en-GB",{month:"short"}),  
                   title: parseD(r.date).toLocaleDateString("en-GB",{month:"long",year:"numeric"}),  
                   date: r.date, dates: [], spent: 0, allowance: 0, days: 0 };  
      order.push(key);  
    }  
    map[key].spent += spentOf(r);  
    map[key].allowance += r.allowance;  
    map[key].days += 1;  
    map[key].dates.push(r.date);  
  });  
  return order.map(function(k){ return map[k]; });  
}

  sectionHtml.category = function(){

      } else {

        catSlices.forEach(function(sl,i){

          s += '<span class="row" style="align-items:center; gap:9px; min-width:0;"><span style="width:11px;height:11px;border-radius:3px;flex-shrink:0;background:'+PIE_COLORS[i % PIE_COLORS.length]+';"></span><span class="subhead"'+(isSel?' style="font-weight:600;"':'')+'>'+esc(sl.label)+'</span></span>';  
          s += '<span class="row" style="align-items:baseline; gap:10px;"><span class="mono subhead">'+fmt(sl.value,0)+'</span><span class="muted mono caption" style="width:36px; text-align:right;">'+pct.toFixed(0)+'%</span></span>';  
          s += '</button>';  
        });

  };  
  
  sectionHtml.person = function(){  
    if (!(state.settings.people||[]).length) return "";

    cs.rows.forEach(function(r){  
      (r.items||[]).forEach(function(it){  
        if (!keepItem(it)) return;

          personTotals["Unassigned"] = (personTotals["Unassigned"] || 0) + it.amount;
        } else {

          });

    slices.forEach(function(sl,i){  
      var pct = total>0 ? (sl.value/total*100) : 0;

      s += '<span class="row" style="align-items:center; gap:9px; min-width:0;"><span style="width:11px;height:11px;border-radius:3px;flex-shrink:0;background:'+swatch+';"></span><span class="subhead">'+esc(sl.label)+'</span></span>';

  sectionHtml.dow = function(){

    cs.rows.forEach(function(r){  
      var dow = parseD(r.date).getDay();

      dowSums[idx] += (r.items||[]).reduce(function(t,it){ return keepItem(it) ? t+it.amount : t; }, 0);  
      dowCounts[idx] += 1;

    var dowLabels = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];  
    var dowAvg = dowSums.map(function(s2,i){ return dowCounts[i]>0 ? s2/dowCounts[i] : 0; });

      top5.forEach(function(it,i){

        s += '<div class="mono subhead" style="flex-shrink:0;">'+fmt(it.amount,2)+' AED</div>';  
        s += '</div>';  
      });  
    }  
    s += '</div>';  
    return s;  
  };  
  
  var order = normalizeAnalysisOrder(state.settings.analysisSectionOrder);

    }  
    h += '<div class="row between" style="padding:0 2px 6px; align-items:center;'+(isHidden?"opacity:0.55;":"")+'">';  
    h += '<span class="muted" style="font-size:11px;">'+esc(ANALYSIS_SECTION_LABELS[id]||id)+(isHidden?" · hidden":"")+'</span>';  
    h += '<div class="row gap2">';  
    h += '<button data-action="toggle-analysis-hidden" data-section="'+id+'" style="background:none;border:none;padding:3px;color:var(--text-muted);" aria-label="'+(isHidden?"Show":"Hide")+' section">'+(isHidden?ICONS.eyeOff:ICONS.eye)+'</button>';  
    h += '<button data-action="move-analysis-section" data-section="'+id+'" data-dir="-1" style="background:none;border:none;padding:3px;color:'+(idx===0?"var(--hairline)":"var(--text-muted)")+';" '+(idx===0?"disabled":"")+' aria-label="Move up">'+ICONS.chevronUp+'</button>';  
    h += '<button data-action="move-analysis-section" data-section="'+id+'" data-dir="1" style="background:none;border:none;padding:3px;color:'+(idx===order.length-1?"var(--hairline)":"var(--text-muted)")+';" '+(idx===order.length-1?"disabled":"")+' aria-label="Move down">'+ICONS.chevronDown+'</button>';

function ruleLoggedAmount(rule) {  
  var sum = 0;  
  for (var i=0; i<(rule.occurrencesLogged||0); i++) sum += ruleOccurrenceAmount(rule, i);  
  return round2(sum);  
}  

function renderPlansBody() {  
  var rules = state.settings.recurringRules || [];  
  var today = todayStr();  
  var h = "";  
  h += '<div class="eyebrow" style="margin-bottom:4px;">Plans</div>';  
  h += '<div class="muted caption" style="margin-bottom:14px;">Recurring payments and spread-out costs.</div>';  
  
  function ruleCard(rule) {  
    var complete = ruleIsComplete(rule);  
    var paused = !rule.active && !complete;  
    var freqLabel = rule.frequency === "daily" ? "Daily" : rule.frequency === "weekly" ? "Every week" : "Every month";  
    var logged = rule.occurrencesLogged || 0;  
    var s = '<div class="card card-pad" style="margin-bottom:8px;'+(paused?" opacity:0.6;":"")+'">';  
    s += '<div class="row between" style="align-items:flex-start;">';  
    s += '<div class="row gap2" style="align-items:center; min-width:0;">';  
    s += catIconCircle(rule.category);  
    s += '<div style="min-width:0;">';  
    s += '<div style="font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">'+esc(rule.note || rule.category || (rule.kind==="split"?"Spread":"Recurring payment"))+'</div>';  
    var metaBits = [];  
    if (rule.kind === "split") metaBits.push("Spread over "+rule.occurrencesTotal+" days");  
    else metaBits.push(freqLabel);  
    metaBits.push(fmt(rule.amount,2)+" AED"+(rule.kind==="split"?"/day":""));  
    s += '<div class="muted caption" style="margin-top:2px;">'+esc(metaBits.join(" \u00b7 "))+'</div>';  
    s += '</div></div>';  
    s += '<div class="row gap2" style="flex-shrink:0;">';  
    if (!complete) s += '<button data-action="toggle-recurring-active" data-id="'+esc(rule.id)+'" style="background:none;border:none;padding:5px;color:var(--text-muted);" aria-label="'+(rule.active?"Pause":"Resume")+'">'+(rule.active?ICONS.pause:ICONS.play)+'</button>';  
    s += '<button data-action="delete-recurring" data-id="'+esc(rule.id)+'" style="background:none;border:none;padding:5px;color:var(--text-muted);" aria-label="Delete">'+ICONS.trash+'</button>';  
    s += '</div></div>';  
  
    s += '<div class="hairline-top" style="margin-top:10px; padding-top:10px;">';  
    if (rule.occurrencesTotal != null) {  
      var pct = Math.round((logged/rule.occurrencesTotal)*100);  
      s += '<div class="row between" style="margin-bottom:6px;"><span class="muted caption">'+logged+' of '+rule.occurrencesTotal+' logged</span>';  
      if (rule.kind === "split") {  
        var remaining = round2(rule.splitTotal - ruleLoggedAmount(rule));  
        s += '<span class="mono caption">'+fmt(remaining,2)+' AED left</span>';  
      }  
      s += '</div>';  
      s += '<div style="background:var(--fill); border-radius:999px; height:6px; overflow:hidden;"><div style="width:'+pct+'%; height:100%; background:'+(complete?"var(--positive)":"var(--accent)")+';"></div></div>';  
    } else {  
      s += '<div class="muted caption">'+logged+' logged so far \u00b7 ongoing</div>';  
    }  
    var statusLine;  
    if (complete) statusLine = rule.occurrencesTotal != null ? "Finished" : "Ended "+shortLabel(rule.endDate);  
    else if (paused) statusLine = "Paused";  
    else {  
      var nextDue = recurringOccurrenceDate(rule, logged);  
      statusLine = (nextDue <= today ? "Due now" : "Next on "+shortLabel(nextDue));  
      if (rule.endDate) statusLine += " \u00b7 until "+shortLabel(rule.endDate);  
    }  
    s += '<div class="caption" style="margin-top:8px; color:'+(complete?"var(--positive)":(paused?"var(--text-muted)":"var(--accent)"))+';">'+esc(statusLine)+'</div>';  
    s += '</div></div>';  
    return s;  
  }  
  
  var activeRules = rules.filter(function(r){ return !ruleIsComplete(r); });  
  var doneRules = rules.filter(function(r){ return ruleIsComplete(r); });  
  
  if (!rules.length) {  
    h += '<div class="card card-pad" style="margin-bottom:16px;"><div class="muted" style="font-size:13px;">Nothing scheduled yet.</div></div>';  
  }  
  if (activeRules.length) {  
    h += '<div class="eyebrow" style="margin-bottom:8px;">Active</div>';  
    activeRules.forEach(function(r){ h += ruleCard(r); });  
  }  
  if (doneRules.length) {  
    h += '<div class="eyebrow" style="margin:16px 0 8px;">Finished</div>';  
    doneRules.forEach(function(r){ h += ruleCard(r); });  
  }  
  
  h += '<div class="card card-pad" style="margin-top:16px; margin-bottom:16px;">';  
  h += '<div class="eyebrow" style="margin-bottom:10px;">Add recurring payment</div>';  
  h += '<div style="position:relative; margin-bottom:8px;"><span class="muted" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:14px;">AED</span>';  
  h += '<input id="recurringAmountInput" type="number" inputmode="decimal" step="0.01" min="0" class="field mono" style="padding-left:44px;" placeholder="Amount" /></div>';  
  h += '<select id="recurringCategoryInput" class="field" style="margin-bottom:8px;"><option value="">No category</option>';  
  (state.settings.categories||[]).forEach(function(c){ h += '<option value="'+esc(c)+'">'+esc(c)+'</option>'; });  
  h += '</select>';  
  if ((state.settings.people||[]).length) {  
    h += '<select id="recurringPersonInput" class="field" style="margin-bottom:8px;"><option value="">Who\u2019s this for? (optional)</option>';  
    (state.settings.people||[]).forEach(function(p){ h += '<option value="'+esc(p)+'">'+esc(p)+'</option>'; });  
    h += '</select>';  
  }  
  h += '<input id="recurringNoteInput" type="text" class="field" style="margin-bottom:8px;" placeholder="What\u2019s it for? (e.g. Rent)" />';  
  h += '<div class="row gap2" style="margin-bottom:8px;">';  
  h += '<select id="recurringFrequencyInput" class="field" style="flex:1;"><option value="weekly">Every week</option><option value="monthly">Every month</option></select>';  
  h += '<input id="recurringStartDateInput" type="date" class="field mono" style="flex:1;" value="'+today+'" />';  
  h += '</div>';  
  h += '<div class="muted caption" style="margin-bottom:10px;">Starts on that date, then repeats on the same day each week or month.</div>';  
  var limitMode = state.recurringLimitMode || "ongoing";  
  h += '<div class="seg" style="margin-bottom:8px;">';  
  [["ongoing","Ongoing"],["count","Set number"],["until","Until date"]].forEach(function(opt){  
    h += '<button class="seg-btn" role="tab" aria-selected="'+(limitMode===opt[0])+'" data-action="set-recurring-limit-mode" data-mode="'+opt[0]+'">'+opt[1]+'</button>';  
  });  
  h += '</div>';  
  if (limitMode === "count") {  
    h += '<input id="recurringCountInput" type="number" inputmode="numeric" min="1" step="1" class="field" style="margin-bottom:8px;" placeholder="Number of times" />';  
  } else if (limitMode === "until") {  
    h += '<input id="recurringEndDateInput" type="date" class="field mono" style="margin-bottom:8px;" />';  
  }  
  h += '<button data-action="add-recurring" class="btn-accent" style="width:100%;">Add recurring payment</button>';  
  h += '</div>';  
  return h;  
}

function handleAddTransaction() {  
  var dateEl = document.getElementById("entryDateInput");  
  var amtEl = document.getElementById("entryAmountInput");  
  var noteEl = document.getElementById("entryNoteInput");  
  var catEl = document.getElementById("entryCategoryInput");  
  var date = dateEl ? dateEl.value : todayStr();  
  var amt = parseFloat(amtEl ? amtEl.value : "");  
  if (isNaN(amt) || amt < 0 || !date) return;  
  var note = noteEl ? noteEl.value.trim() : "";  
  var category = catEl ? catEl.value : "";  
  var wasEditing = !!(state.editingItemId && state.editingOriginalDate);  
  var splits = state.activeSplits || [];
  var singlePerson = splits.length === 1 ? splits[0].name : "";

  if (!wasEditing && state.txnSplitMode === "split") {  
    var splitDaysEl = document.getElementById("splitDaysInput");  
    var splitDays = parseInt(splitDaysEl ? splitDaysEl.value : "", 10);  
    if (isNaN(splitDays) || splitDays < 2) return;  
    handleAddSplitTransaction(date, amt, category, note, splitDays, splits);  
    return;  
  }  
  
  var nextEntries = Object.assign({}, state.entries);  
  
  if (wasEditing) {  
    var origDate = state.editingOriginalDate;  
    var origDay = nextEntries[origDate];  
    var carriedAllowance = origDay ? origDay.allowance : dailyAllowance();  
    if (origDay) {  
      var remaining = origDay.items.filter(function(i){ return i.id !== state.editingItemId; });  
      if (remaining.length === 0) delete nextEntries[origDate];  
      else nextEntries[origDate] = Object.assign({}, origDay, { items: remaining });  
    }  
    var updatedItem = { id: state.editingItemId, amount: amt, note: note, category: category, person: singlePerson, splits: splits };  
    var destDay = nextEntries[date];  
    var nextDest = destDay ? Object.assign({}, destDay, { items: destDay.items.concat([updatedItem]) }) : { allowance: carriedAllowance, items: [updatedItem] };  
    nextEntries[date] = nextDest;  
    state.editingItemId = null;  
    state.editingOriginalDate = null;  
    state.showAddTxn = false;  
  } else {  
    var existing = nextEntries[date];  
    var newItem = { id: Date.now()+"-"+Math.random().toString(36).slice(2,7), amount: amt, note: note, category: category, person: singlePerson, splits: splits };  
    nextEntries[date] = existing ? Object.assign({}, existing, { items: existing.items.concat([newItem]) }) : { allowance: dailyAllowance(), items: [newItem] };  
    state.showAddTxn = false;  
  }  
  
  state.entryDate = date;  
  persistAll(state.settings, nextEntries, "your entry");  
  showToast(wasEditing ? "Record updated" : "Record added");  
  render();  
}  

function handleAddSplitTransaction(startDate, totalAmount, category, note, splitDays, splits) {  
  var perDayFloor = Math.floor((totalAmount/splitDays)*100)/100;  
  var newRule = {  
    id: Date.now()+"-"+Math.random().toString(36).slice(2,7),  
    kind: "split",  
    amount: perDayFloor,  
    splitTotal: totalAmount,  
    category: category,  
    note: note,  
    person: splits.length === 1 ? splits[0].name : "",  
    splits: splits,
    frequency: "daily",  
    startDate: startDate,  
    endDate: null,  
    occurrencesTotal: splitDays,  
    occurrencesLogged: 0,

  };  
  state.settings = Object.assign({}, state.settings, { recurringRules: (state.settings.recurringRules||[]).concat([newRule]) });  
  runRecurringCatchUp();  
  state.entryDate = startDate;  
  state.showAddTxn = false;

function handleApplyIncome(scope) {  
  var el = document.getElementById("incomeDraftInput");  
  var v = el ? parseFloat(el.value) : NaN;  
  if (isNaN(v) || v < 0) return;  
  var mode = state.incomeDraftMode || incomeForDate(todayStr()).mode || "monthly";  
  var monthStart = toStr(startOfMonth(new Date()));  
  var hist = (state.settings.incomeHistory || []).slice();  
  var label;  
  
  if (scope === "all") {  
    hist = [{ from: "1900-01-01", mode: mode, amount: v }];  
    label = "Income applied to all periods";  
  } else {  
    hist.push({ from: monthStart, mode: mode, amount: v });  
    label = "Income applied from this month onward";  
  }  
  hist = normalizeIncomeHistory(hist);  
  
  var nextSettings = Object.assign({}, state.settings, {  
    incomeHistory: hist,  
    incomeMode: mode,  
    incomeAmount: v  
  });  
  persistAll(nextSettings, state.entries, "your income");  
  state.incomeDraftMode = null;  
  state.incomeDraftAmount = null;  
  state.showSettings = false;  
  showToast(label);  
  render();  
}  

function handleApplyBudget(scope) {  
  var wEl = document.getElementById("weeklyDraftInput");  
  var v = wEl ? parseFloat(wEl.value) : NaN;  
  if (isNaN(v) || v <= 0) return;  
  var newDaily = v / 7;  
  var wk = getPeriodBounds("week", 0, v, newDaily);  
  var hist = (state.settings.rateHistory || []).slice();  
  var nextEntries = Object.assign({}, state.entries);  
  var label;  
  
  function rewriteLoggedFrom(fromStr, toStr_) {  
    Object.keys(nextEntries).forEach(function(d){  
      if (d >= fromStr && (!toStr_ || d <= toStr_)) {  
        nextEntries[d] = Object.assign({}, nextEntries[d], { allowance: newDaily });  
      }  
    });  
  }  
  
  if (scope === "all") {  
    hist = [{ from: "1900-01-01", weeklyTarget: v }];  
    rewriteLoggedFrom("1900-01-01", null);  
    label = "Applied to all periods";  
  } else if (scope === "future") {  
    hist.push({ from: wk.startStr, weeklyTarget: v });  
    rewriteLoggedFrom(wk.startStr, null);  
    label = "Applied from this week onward";  
  } else {  
    var prevRate = rateForDate(wk.startStr);  
    var dayAfter = toStr(addDays(parseD(wk.endStr), 1));  
    hist.push({ from: wk.startStr, weeklyTarget: v });  
    hist.push({ from: dayAfter, weeklyTarget: prevRate });  
    rewriteLoggedFrom(wk.startStr, wk.endStr);  
    label = "Applied to this week only";  
  }  
  
  hist = normalizeRateHistory(hist);  
  var nextSettings = Object.assign({}, state.settings, { rateHistory: hist });  
  nextSettings.weeklyTarget = (function(){  
    var r = hist[0].weeklyTarget, t = todayStr();  
    for (var i=0;i<hist.length;i++){ if (hist[i].from <= t) r = hist[i].weeklyTarget; else break; }  
    return r;  
  })();  
  persistAll(nextSettings, nextEntries, "your budget");  
  state.showSettings = false;  
  showToast(label);  
  render();  
}

function handleDeleteTxn(date, id) {  
  var day = state.entries[date];  
  if (!day) return;  
  var remaining = day.items.filter(function(i){ return i.id !== id; });  
  var nextEntries = Object.assign({}, state.entries);  
  if (remaining.length === 0) delete nextEntries[date]; else nextEntries[date] = Object.assign({}, day, { items: remaining });  
  if (state.editingItemId === id) { state.editingItemId = null; state.editingOriginalDate = null; }  
  persistAll(state.settings, nextEntries, "your entry");  
  render();  
}
