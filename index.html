function budgetForecastEvidenceHtml(x, protectedMode) {
  var details=(x&&x.details)||[];
  if(!details.length) return '';
  var out='';
  details.forEach(function(d){
    if(!d)return;
    var p=d.profile||{};
    if(d.kind==='cadence'||d.kind==='lumpy'){
      var pct=displayProbabilityPct(d.probability);
      var likely=round2(d.likelyAmount||0), expected=round2(d.expectedAmount||0), bits=[];
      var expectedCount=Number(d.expectedCount)||0;
      var isMonthly=p.mode==='monthly',isYearly=p.mode==='yearly';
      bits.push('<span style="font-weight:700;color:var(--text);">'+(isMonthly?'Monthly bill':(isYearly?'Yearly bill':pct+'% chance'+(d.kind==='cadence'&&expectedCount>1.05?' of ≥1':'')))+'</span>');
      if(d.kind==='cadence'&&expectedCount>1.05&&!isMonthly&&!isYearly) bits.push('≈ '+expectedCount.toFixed(1)+' events expected');
      if(expected>0) bits.push((isMonthly||isYearly?'':'≈ ')+fmt(expected,0)+' AED expected');
      if(likely>0) bits.push((isMonthly?'typical bill ':(isYearly?'annual bill ':'likely '+(d.kind==='lumpy'?'event':'txn')+' '))+fmt(likely,0)+' AED');
      if(p.confidence) bits.push(p.confidence+' confidence');
      out+='<div class="muted caption" style="margin-top:4px;line-height:1.35;white-space:normal;">'+bits.join(' · ')+'</div>';
      var cadence=[];
      if(d.kind==='cadence'&&p.mode==='monthly') cadence.push((p.monthlyActiveMonths&&p.monthlyActiveMonths[todayStr().slice(0,7)])?'paid this month':('usually around day '+Math.round(p.monthlyBillDay||1)));
      else if(d.kind==='cadence'&&p.mode==='yearly'){
        var yy=parseD(todayStr()).getFullYear(),paid=!!(p.yearlyActiveYears&&p.yearlyActiveYears[yy]);
        cadence.push(paid?'paid this year':('due '+shortLabel(toStr(new Date(yy,(p.yearlyDueMonth||1)-1,Math.min(p.yearlyDueDay||1,new Date(yy,p.yearlyDueMonth||1,0).getDate()))))));
      } else if(d.kind==='cadence'&&p.eventGap!=null) cadence.push('event ~every '+Number(p.eventGap).toFixed(1)+' days');
      if(p.lastDate) cadence.push('last '+(p.lastDate===todayStr()?'Today':shortLabel(p.lastDate)));
      if(d.kind==='cadence'&&p.mode!=='monthly'&&p.mode!=='yearly'&&p.lastDate&&p.eventGap!=null) cadence.push('next ~'+shortLabel(toStr(addDays(parseD(p.lastDate),Math.max(1,Math.round(p.eventGap))))));
      if(cadence.length) out+='<div class="muted caption" style="margin-top:1px;line-height:1.3;white-space:normal;">'+cadence.join(' · ')+'</div>';
    } else if(d.kind==='annual'){
      out+='<div class="muted caption" style="margin-top:4px;line-height:1.35;white-space:normal;"><span style="font-weight:700;color:var(--text);">Yearly bill reserve</span> · '+fmt(d.expectedAmount||0,0)+' AED protected in this horizon</div>';
    } else if(d.kind==='frequent'){
      var fp=p, bits=['Frequent'];
      if(fp.txnCount!=null) bits.push(fp.txnCount+' txn'+(fp.txnCount===1?'':'s'));
      if(fp.occurrenceGap!=null) bits.push(occurrenceFrequencyText(fp.occurrenceGap,true));
      if(fp.confidence) bits.push(fp.confidence+' confidence');
      out+='<div class="muted caption" style="margin-top:4px;line-height:1.35;white-space:normal;">'+bits.join(' · ')+'</div>';
    } else if(d.kind==='scheduled'){
      out+='<div class="muted caption" style="margin-top:4px;line-height:1.35;white-space:normal;"><span style="font-weight:700;color:var(--text);">100% scheduled</span> · '+fmt(d.expectedAmount||0,0)+' AED expected</div>';
    }
  });

}

    h += '<button data-action="restore-backup" class="btn-outline" style="width:100%;">Restore this backup</button></div>';
  }
  h += '</div></div></div>';

function renderTxnCategoryPickerPage() {
  var cats=(state.settings.categories||[]).slice();
  var groups=state.settings.categoryGroups||[];
  var selected=state.entryCategoryDraft||"";
  var q=String(state.txnCategoryPickerSearch||"").trim().toLowerCase();
  function matches(c){ return !q || c.toLowerCase().indexOf(q)!==-1 || String(categoryGroupOf(c)||"").toLowerCase().indexOf(q)!==-1; }
  function rows(list){
    var out="";
    list.filter(matches).forEach(function(c){
      var sel=selected===c;
      out+='<button class="category-picker-row" data-action="choose-txn-category" data-cat="'+esc(c)+'">'+catIconCircle(c)+'<span style="flex:1;min-width:0;"><span style="display:block;font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(c)+'</span></span><span style="display:flex;color:'+(sel?'var(--accent)':'var(--text-muted)')+';">'+(sel?ICONS.check:ICONS.chevronRight)+'</span></button>';
    });
    return out;
  }
  var h='<div class="txn-category-picker-page"><div class="txn-entry-shell">';
  h+='<div class="txn-entry-header"><button data-action="close-txn-category-picker" class="txn-entry-back" aria-label="Back">'+ICONS.chevronLeft+'</button><div class="txn-entry-header-title">Choose category</div><span></span></div>';
  h+='<div class="txn-entry-content">';
  h+='<div style="position:relative;margin:8px 0 8px;"><span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-muted);display:flex;">'+ICONS.search+'</span><input id="txnCategoryPickerSearchInput" type="search" class="field" placeholder="Search categories" value="'+esc(state.txnCategoryPickerSearch||"")+'" style="width:100%;padding-left:41px;" /></div>';
  if(!q){
    h+='<div class="category-picker-group-title">General</div><div class="category-picker-list"><button class="category-picker-row" data-action="choose-txn-category" data-cat=""><span style="width:32px;height:32px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--text-muted);">'+ICONS.x+'</span><span style="flex:1;font-size:16px;font-weight:650;">No category</span><span style="display:flex;color:'+(selected?'var(--text-muted)':'var(--accent)')+';">'+(!selected?ICONS.check:ICONS.chevronRight)+'</span></button></div>';
  }
  var any=false;
  groups.forEach(function(g){
    var members=cats.filter(function(c){return categoryGroupOf(c)===g && matches(c);});
    if(!members.length)return;
    any=true;
    h+='<div class="category-picker-group-title">'+esc(g)+'</div><div class="category-picker-list">'+rows(members)+'</div>';
  });
  var ungrouped=cats.filter(function(c){return !categoryGroupOf(c)&&matches(c);});
  if(ungrouped.length){ any=true; h+='<div class="category-picker-group-title">Other</div><div class="category-picker-list">'+rows(ungrouped)+'</div>'; }
  if(q&&!any) h+='<div class="muted" style="text-align:center;padding:42px 16px;">No categories match “'+esc(state.txnCategoryPickerSearch||"")+'”.</div>';
  h+='</div></div></div>';
  return h;
}

  }
  var formDate = state.entryDate || todayStr();
  var selectedTime = state.entryTimeDraft != null ? state.entryTimeDraft : (editingItem ? (editingItem.time||"") : currentTimeStr());
  var cats = state.settings.categories || [];
  var txnKind = state.txnKind != null ? state.txnKind : (editingItem && editingItem.kind === "income" ? "income" : "expense");
  
  var splitMode = state.txnSplitMode === "tabby" ? "tabby" : "single";
  var selectedCat = state.entryCategoryDraft != null ? state.entryCategoryDraft : (editingItem ? (editingItem.category||"") : "");
  var people = state.settings.people || [];
  var txnTags = state.settings.transactionTags || [];
  var selectedTxnTags = state.entryTagsDraft != null ? normalizeItemTags(state.entryTagsDraft) : (editingItem ? normalizeItemTags(editingItem.tags) : []);
  var selectedPerson = state.entryPersonDraft != null ? state.entryPersonDraft : (editingItem ? (editingItem.person||"") : (state.settings.defaultPerson||""));
  var personSplitMode = people.length >= 2 ? (state.txnPersonSplitMode||"single") : "single";
  var selectedCurrency = state.entryCurrencyDraft != null ? state.entryCurrencyDraft : (editingItem && editingItem.currency ? editingItem.currency : reportingCurrency());
  var amountShown = state.entryAmountDraft != null ? state.entryAmountDraft : (editingItem ? ((editingItem.originalAmount!=null && editingItem.currency)?editingItem.originalAmount:editingItem.amount) : "");

  function sortedCats(list){

    }
  }

  /* Date + time are both first-class transaction fields. Date gets the wider
     share because it carries more information on mobile. */
  h += '<div class="txn-date-time-row" style="display:grid;grid-template-columns:minmax(0,7fr) minmax(0,3fr);gap:10px;margin-bottom:10px;align-items:end;">';

  h += '<label style="display:block;min-width:0;"><span class="eyebrow" style="display:block;margin-bottom:6px;">Time</span><input id="entryTimeInput" type="time" class="field mono" style="width:100%;font-size:13px;padding-left:9px;padding-right:7px;" value="'+esc(selectedTime)+'" /></label>';
  h += '</div>';

  if (txnKind === "expense") {
    h += '<div class="row between" style="margin-bottom:6px;"><span class="eyebrow">Subcategory</span>'+(selectedCat?'<span class="muted caption">'+esc(categoryGroupOf(selectedCat)||"Ungrouped")+'</span>':'')+'</div>';
    h += '<div class="txn-hscroll" style="gap:8px;margin:0 -8px 7px;padding:1px 8px 2px;">';
    quickCats.forEach(function(c){
      var sel=selectedCat===c;
      h += '<button data-action="select-txn-category" data-cat="'+esc(c)+'" style="flex:0 0 auto;min-width:86px;max-width:116px;background:'+(sel?'var(--accent)':'var(--fill)')+';color:'+(sel?'var(--accent-ink)':'var(--text)')+';border:none;border-radius:12px;padding:9px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;">'+catIconCircle(c)+'<span style="font-size:11px;font-weight:'+(sel?'700':'500')+';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;">'+esc(c)+'</span></button>';
    });
    h += '<button data-action="open-txn-category-picker" style="flex:0 0 auto;min-width:70px;background:var(--fill);border:none;border-radius:12px;padding:9px 10px;color:var(--text-muted);font-size:12px;font-weight:650;">More</button>';
    h += '</div>';
    h += '<input id="entryCategoryInput" type="hidden" value="'+esc(selectedCat)+'" />';
  } else {
    h += '<input id="entryCategoryInput" type="hidden" value="" />';
  }

  if (people.length) {
    h += '<div class="eyebrow" style="margin:0 0 6px;">For</div>';
    h += '<div class="txn-hscroll" style="gap:8px;margin:0 -8px 8px;padding:0 8px 2px;">';
    var unassignedSel=personSplitMode==="single" && !selectedPerson;
    h += '<button data-action="select-txn-person" data-person="" style="flex:0 0 auto;border:none;border-radius:999px;padding:8px 12px;background:'+(unassignedSel?'var(--accent)':'var(--fill)')+';color:'+(unassignedSel?'var(--accent-ink)':'var(--text)')+';font-size:13px;font-weight:'+(unassignedSel?'600':'500')+';">Unassigned'+(unassignedSel?' ✓':'')+'</button>';
    people.forEach(function(p){
      var sel=personSplitMode==="single" && selectedPerson===p;

    });
    if (people.length>=2) {
      var sharedSel=personSplitMode==="split";
      h += '<button data-action="set-txn-person-split-mode" data-mode="split" style="flex:0 0 auto;border:none;border-radius:999px;padding:8px 12px;background:'+(sharedSel?'var(--accent)':'var(--fill)')+';color:'+(sharedSel?'var(--accent-ink)':'var(--text)')+';font-size:13px;font-weight:'+(sharedSel?'600':'500')+';">Shared'+(sharedSel?' ✓':'')+'</button>';
    }
    h += '</div>';

    if (personSplitMode === "single") {
      h += '<input id="entryPersonInput" type="hidden" value="'+esc(selectedPerson)+'" />';
    } else {
      h += '<input id="entryPersonInput" type="hidden" value="" />';
      var existingSplit={};
      if (state.entryPersonSplitDraft) Object.keys(state.entryPersonSplitDraft).forEach(function(p){existingSplit[p]=parseInt(state.entryPersonSplitDraft[p],10)||0;});
      else if (editingItem && editingItem.personSplit) editingItem.personSplit.forEach(function(ps){existingSplit[ps.person]=ps.pct;});
      var splitTotal=0;
      h += '<div class="card" style="padding:10px 12px;margin-bottom:12px;">';
      people.forEach(function(p){
        var cur=existingSplit[p]||0; splitTotal+=cur;
        h += '<div class="row between" style="padding:5px 0;"><span style="font-size:13px;">'+esc(p)+'</span><select class="split-person-pct field mono" data-person="'+esc(p)+'" style="width:84px;padding:6px 8px;font-size:13px;">';
        var opts=[]; for(var q=0;q<=100;q+=10)opts.push(q); if(cur%10!==0&&opts.indexOf(cur)===-1)opts.push(cur); opts.sort(function(a,b){return a-b;});
        opts.forEach(function(q){h+='<option value="'+q+'"'+(q===cur?' selected':'')+'>'+q+'%</option>';});
        h += '</select></div>';
      });
      h += '<div class="row between hairline-top" style="padding-top:8px;margin-top:2px;"><span class="muted caption">Total</span><span id="splitPersonTotal" class="mono caption" style="font-weight:600;color:'+(splitTotal===100?'var(--positive)':splitTotal===0?'var(--text-muted)':'var(--rust)')+';">'+splitTotal+'%</span></div></div>';
    }
  } else {
    h += '<input id="entryPersonInput" type="hidden" value="" />';
  }

  if (txnTags.length) {
    h += '<div class="eyebrow" style="margin:0 0 6px;">Tags</div><div class="txn-hscroll" style="gap:7px;margin:0 -8px 8px;padding:0 8px 2px;">';
    txnTags.forEach(function(tag){var sel=selectedTxnTags.indexOf(tag)!==-1;h+='<button data-action="toggle-txn-tag" data-tag="'+esc(tag)+'" style="flex:0 0 auto;border:none;border-radius:999px;padding:8px 11px;background:'+(sel?transactionTagColor(tag):'var(--fill)')+';color:'+(sel?'#fff':'var(--text)')+';font-size:12px;font-weight:'+(sel?'650':'500')+';">'+esc(tag)+(sel?' ✓':'')+'</button>';});
    h += '</div>';
  }

  h += '<div class="eyebrow" style="margin-bottom:5px;">Note</div>';
  h += '<input id="entryNoteInput" type="text" class="field" style="margin-bottom:10px;" placeholder="Merchant or what it was for" value="'+(state.entryNoteDraft!=null?esc(state.entryNoteDraft):(editingItem?esc(editingItem.note||""):""))+'" />';



  var saveLabel;
  if (editingItem) saveLabel='Save changes';
  else if (txnKind==='expense' && splitMode==='tabby' && !isNaN(parsedShown) && parsedShown>0) saveLabel='Create Tabby plan · 4 × '+fmt(round2(parsedShown/4),2)+' '+selectedCurrency;
  else if (!isNaN(parsedShown) && parsedShown>0) saveLabel='Add '+fmt(parsedShown,2)+' '+selectedCurrency+' '+(txnKind==='income'?'income':'expense');
  else if (txnKind==='expense' && splitMode==='tabby') saveLabel='Create Tabby plan';
  else saveLabel='Add '+(txnKind==='income'?'income':'expense');
  h += '<button id="addTxnBtn" data-action="add-transaction" class="btn-accent txn-entry-save" style="width:100%;justify-content:center;align-items:center;">'+saveLabel+'</button>';
  if(editingItem) h += '<button data-action="ask-delete-txn" data-date="'+state.editingOriginalDate+'" data-id="'+esc(editingItem.id)+'" class="btn-outline row gap2" style="width:100%;margin-top:10px;justify-content:center;align-items:center;color:var(--rust);border-color:color-mix(in srgb, var(--rust) 40%, transparent);">'+ICONS.trash+' Delete transaction</button>';
  h += '</div>';
  if (state.toastMessage) h += '<div style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);background:var(--positive);color:#0C1322;font-size:13px;font-weight:650;padding:9px 16px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,0.35);z-index:80;white-space:nowrap;">'+esc(state.toastMessage)+'</div>';
  h += '</div></div>';
  return h;
}

function renderTransactionsBody() {
  var entryDates=Object.keys(state.entries).sort();
  var groupFilter=state.txnGroupFilter||"";
  var categoryFilter=state.txnCategoryFilter||"";
  var personFilter=state.txnPersonFilter||"";
  var tagFilter=state.txnTagFilter||"";
  var typeFilter=state.txnTypeFilter||"all";
  var budgetScopeFilter=state.txnBudgetScopeFilter||"all";
  var search=(state.txnSearch||"").trim().toLowerCase();
  var periodMode=state.txnPeriodMode||"month";
  var periodFrom=state.txnPeriodFrom||"", periodTo=state.txnPeriodTo||"";
  var info=getTxnPeriodInfo();
  var people=state.settings.people||[];
  var groups=state.settings.categoryGroups||[];
  var protectedTxnMap=currentProtectedCategoryMap(todayStr());
  function itemCat(it){return it.category||"Uncategorised";}
  function inPeriod(d){return d>=info.start&&d<=info.end;}
  function matchesGroup(it){if(!groupFilter)return true;if(groupFilter==="__ungrouped__")return !categoryGroupOf(it.category);return categoryGroupOf(it.category)===groupFilter;}
  function matchesBudgetScope(it){
    if(budgetScopeFilter==="all")return true;
    if(!isExpenseItem(it))return false;
    if(budgetScopeFilter==="budget")return itemCountsTowardBudget(it);
    if(budgetScopeFilter==="excluded")return !itemCountsTowardBudget(it);
    var protectionClass=transactionBudgetProtectionClass(it,protectedTxnMap);
    if(budgetScopeFilter==="protected")return protectionClass==="protected";
    if(budgetScopeFilter==="unprotected")return protectionClass==="unprotected";
    return true;
  }
  function matchesSearch(it){
    if(!search)return true;
    var persons=(it.personSplit&&it.personSplit.length)?it.personSplit.map(function(ps){return ps.person;}).join(" "):(it.person||"");
    var blob=[it.note||"",it.category||"",categoryGroupOf(it.category)||"",persons,(it.tags||[]).join(" "),isIncomeItem(it)?"income":"expense",String(it.amount||"")].join(" ").toLowerCase();
    return blob.indexOf(search)!==-1;
  }
  function matches(it){
    if(typeFilter==="expense"&&!isExpenseItem(it))return false;
    if(typeFilter==="income"&&!isIncomeItem(it))return false;
    if(!matchesBudgetScope(it))return false;
    if(isIncomeItem(it)&&(categoryFilter||groupFilter))return false;
    return (!categoryFilter||itemCat(it)===categoryFilter)&&matchesGroup(it)&&itemMatchesPersonFilter(it,personFilter)&&(!tagFilter||normalizeItemTags(it.tags).indexOf(tagFilter)!==-1)&&matchesSearch(it);
  }
  var itemFilterActive=!!categoryFilter||!!groupFilter||!!personFilter||!!tagFilter||typeFilter!=="all"||budgetScopeFilter!=="all"||!!search;

  var allPeriodItems=[];
  entryDates.forEach(function(d){if(!inPeriod(d))return;(state.entries[d].items||[]).forEach(function(it){if(matches(it))allPeriodItems.push({date:d,it:it});});});
  var totalExpense=allPeriodItems.reduce(function(t,x){return t+(isExpenseItem(x.it)?personScopedAmount(x.it,personFilter):0);},0);
  var totalIncome=allPeriodItems.reduce(function(t,x){return t+(isIncomeItem(x.it)?x.it.amount:0);},0);
  
  var avgStart=info.start,avgEnd=info.end>todayStr()?todayStr():info.end,trackingStart=state.settings.trackingStartDate;
  if(trackingStart&&trackingStart>avgStart)avgStart=trackingStart;
  var avgDays=avgStart<=avgEnd?Math.max(1,daysBetween(avgStart,avgEnd)+1):0;
  var summaryIsIncome=typeFilter==="income", summaryTotal=summaryIsIncome?totalIncome:totalExpense;
  var dailyAvg=avgDays>0?summaryTotal/avgDays:0;

  var h='';
  h+='<div class="row between page-heading-row"><div class="title2">Activity</div><button data-action="go-page" data-page="calendar" class="icon-btn page-icon-action" aria-label="Calendar">'+ICONS.calendar+'</button></div>';
  h+='<div class="card card-pad" style="margin-bottom:12px;">';
  h+='<div class="row between" style="gap:18px;align-items:flex-start;"><div><div class="eyebrow">'+(summaryIsIncome?'Received':'Spent')+'</div><div class="mono" style="font-size:30px;font-weight:700;margin-top:2px;color:'+(summaryIsIncome?'var(--positive)':'var(--text)')+';">'+fmt(summaryTotal,0)+' <span class="muted" style="font-size:15px;">AED</span></div></div><div style="text-align:right;flex-shrink:0;padding-top:1px;"><div class="eyebrow">Daily avg</div><div class="mono" style="font-size:18px;font-weight:720;margin-top:4px;">'+fmt(dailyAvg,0)+' <span class="muted" style="font-size:11px;">AED/day</span></div></div></div>';
  if(periodMode==="week"||periodMode==="month"||periodMode==="year") h+='<div class="row between hairline-top" style="margin-top:12px;padding-top:10px;"><button data-action="txn-nav-offset" data-delta="-1" class="icon-btn" style="padding:6px;">'+ICONS.chevronLeft+'</button><div style="text-align:center;"><div class="subhead" style="font-weight:600;">'+esc(info.title)+'</div><div class="muted caption">'+esc(info.sub)+'</div></div><button data-action="txn-nav-offset" data-delta="1" class="icon-btn" style="padding:6px;'+(info.isCurrent?'opacity:.3;pointer-events:none;':'')+'">'+ICONS.chevronRight+'</button></div>';
  else if(periodMode==="last7"||periodMode==="last30") h+='<div class="hairline-top" style="margin-top:12px;padding-top:10px;text-align:center;"><div class="subhead" style="font-weight:600;">'+esc(info.title)+'</div><div class="muted caption">'+esc(info.sub)+'</div></div>';
  h+='</div>';

  var extraFilters=!!groupFilter||!!categoryFilter||!!personFilter||!!tagFilter||periodMode!=="month"||budgetScopeFilter!=="all"||typeFilter!=="all";
  h+='<div class="card activity-toolbar">';
  h+='<div class="activity-search-row"><div style="position:relative;"><span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);display:flex;">'+ICONS.search+'</span><input id="txnSearchInput" type="search" class="field" placeholder="Search activity" value="'+esc(state.txnSearch||"")+'" style="padding-left:40px;" /></div><button data-action="toggle-txn-filters" class="btn-outline activity-filter-trigger" style="'+(extraFilters?'color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card))!important;':'')+'">'+(state.txnFiltersOpen?'Done':'Filters')+(extraFilters?' •':'')+'</button></div>';
  if(state.txnFiltersOpen){
    h+='<div class="activity-filter-panel">';
    h+='<div class="activity-filter-section"><div class="row between"><div class="eyebrow">Period</div><button data-action="set-txn-period" data-mode="all" class="btn-plain" style="font-size:12px;">'+(periodMode==='all'?'All time ✓':'All time')+'</button></div><div class="seg">';
    [["week","Week"],["month","Month"],["year","Year"],["custom","Custom"]].forEach(function(opt){h+='<button class="seg-btn" role="tab" aria-selected="'+(periodMode===opt[0])+'" data-action="set-txn-period" data-mode="'+opt[0]+'">'+opt[1]+'</button>';});
    h+='</div><div class="activity-filter-scroll" style="margin-top:7px;">';
    [["last7","Last 7 days"],["last30","Last 30 days"]].forEach(function(opt){var sel=periodMode===opt[0];h+='<button data-action="set-txn-period" data-mode="'+opt[0]+'" class="chip" style="flex:0 0 auto;background:'+(sel?'var(--accent)':'var(--fill)')+';color:'+(sel?'var(--accent-ink)':'var(--text)')+';font-weight:'+(sel?'600':'500')+';">'+opt[1]+'</button>';});
    h+='</div>';
    if(periodMode==='custom') h+='<div class="row gap2" style="margin-top:8px;"><input id="txnPeriodFromInput" type="date" class="field mono" style="flex:1;font-size:13px;text-align:center;" value="'+esc(periodFrom)+'" max="'+todayStr()+'"/><input id="txnPeriodToInput" type="date" class="field mono" style="flex:1;font-size:13px;text-align:center;" value="'+esc(periodTo)+'" max="'+todayStr()+'"/></div>';
    h+='</div>';
    h+='<div class="activity-filter-section"><div class="eyebrow">Type</div><div class="activity-filter-scroll">';
    [["all","All"],["expense","Spent"],["income","Income"]].forEach(function(opt){var sel=typeFilter===opt[0];h+='<button data-action="set-txn-type-filter" data-type="'+opt[0]+'" class="chip" style="flex:0 0 auto;background:'+(sel?'var(--accent)':'var(--fill)')+';color:'+(sel?'var(--accent-ink)':'var(--text)')+';font-weight:'+(sel?'600':'500')+';">'+opt[1]+'</button>';});
    h+='</div></div>';
    if(typeFilter!=="income"){
      h+='<div class="activity-filter-section"><div class="eyebrow">Scope</div><div class="activity-filter-scroll">';
      [["all","All"],["protected","Protected"],["unprotected","Unprotected"],["excluded","Outside"]].forEach(function(opt){var sel=budgetScopeFilter===opt[0];h+='<button data-action="set-txn-budget-scope" data-scope="'+opt[0]+'" class="chip" style="flex:0 0 auto;background:'+(sel?'var(--accent)':'var(--fill)')+';color:'+(sel?'var(--accent-ink)':'var(--text)')+';font-weight:'+(sel?'600':'500')+';">'+opt[1]+'</button>';});
      h+='</div></div>';
    }
    h+='<div class="activity-filter-section"><div class="eyebrow">Details</div>';
    if(groups.length){h+='<select id="txnGroupFilterSelect" class="field" style="font-size:13px;margin-bottom:8px;"><option value="">All categories</option>';groups.forEach(function(g){h+='<option value="'+esc(g)+'"'+(groupFilter===g?' selected':'')+'>'+esc(g)+'</option>';});if((state.settings.categories||[]).some(function(c){return !categoryGroupOf(c);}))h+='<option value="__ungrouped__"'+(groupFilter==='__ungrouped__'?' selected':'')+'>Uncategorized</option>';h+='</select>';}

function legendSwatch(bg, label, fg) {

/* Shared transaction-row renderer used by both the Transactions page and the
   Calendar day-detail panel, so the two never visually drift apart. */
function renderTxnRow(date, it) {
  var income=isIncomeItem(it);
  var primary=it.note||(income?"Income":(it.category||"Expense"));
  var secondary=[];
  if(it.time) secondary.push(formatTxnTime(it.time));
  if(it.note&&it.category)secondary.push(it.category);
  if(!income&&it.category&&categoryGroupOf(it.category))secondary.push(categoryGroupOf(it.category));
  if(income&&!it.note)secondary.push("Money received");
  var personText="";
  if(it.personSplit&&it.personSplit.length)personText=it.personSplit.map(function(ps){return ps.person+" "+ps.pct+"%";}).join(" · ");

  h+=income?'<span style="width:34px;height:34px;border-radius:50%;background:var(--positive);color:white;display:flex;align-items:center;justify-content:center;flex-shrink:0;">'+ICONS.plus+'</span>':catIconCircle(it.category);
  h+='<span style="min-width:0;flex:1;"><span style="display:block;font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(primary)+'</span>';
  if(secondary.length||seq)h+='<span class="muted" style="display:block;font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(secondary.join(" · "))+esc(seq)+'</span>';
  if(normalizeItemTags(it.tags).length)h+='<span style="display:flex;align-items:center;gap:4px;margin-top:4px;overflow:hidden;">'+transactionTagChipsHtml(it.tags,3)+'</span>';
  h+='</span></button>';

  return h;
}

function categoryStyle(name) {
  if (!name) return { icon:"tag", color:"#8595B5" };
  var custom = state.settings.categoryStyles && state.settings.categoryStyles[name];
  if (custom) return { icon: (custom.icon && CAT_ICON_SVGS[custom.icon]) ? custom.icon : "tag", color: custom.color || "#8595B5" };
  if (CATEGORY_STYLES[name]) return CATEGORY_STYLES[name];
  var hash = 0;
  for (var i=0;i<name.length;i++) hash = (hash*31 + name.charCodeAt(i)) >>> 0;
  return { icon:"tag", color: PIE_COLORS[hash % PIE_COLORS.length] };
}
/* A group's "theme color" for the purpose of seeding a newly-added category:
   whatever its existing members currently share, so a new category visually
   joins the group it was added to instead of getting an unrelated color. A
   group with no members yet has no real color to borrow, so it falls back
   to a stable hash of the group's own name — the same trick an uncustomized
   category already uses — so the group still has a consistent identity from
   the very first category added to it onward. */
function groupThemeColor(groupName) {
  var members = (state.settings.categories||[]).filter(function(c){ return categoryGroupOf(c)===groupName; });
  if (members.length) return categoryStyle(members[0]).color;
  var hash = 0;
  for (var i=0;i<groupName.length;i++) hash = (hash*31 + groupName.charCodeAt(i)) >>> 0;
  return PIE_COLORS[hash % PIE_COLORS.length];
}
function categoryGroupStyle(groupName) {
  if (!groupName || groupName === "__ungrouped__") return { icon:"tag", color:"#8595B5" };
  var custom = state.settings.categoryGroupStyles && state.settings.categoryGroupStyles[groupName];
  if (custom) return { icon:(custom.icon && CAT_ICON_SVGS[custom.icon]) ? custom.icon : "tag", color:custom.color || groupThemeColor(groupName) };
  var members = (state.settings.categories||[]).filter(function(c){ return categoryGroupOf(c)===groupName; });
  if (members.length) { var first = categoryStyle(members[0]); return { icon:first.icon, color:first.color }; }
  return { icon:"tag", color:groupThemeColor(groupName) };
}
/* A drill-down pie uses graded versions of its parent Category color. The
   shade is tied to the configured subcategory order, not current spend rank,
   so the same subcategory keeps the same shade across periods. */
function subcategoryShade(groupName, subcategoryName) {
  if (!groupName || groupName === "Ungrouped" || groupName === "__ungrouped__") return categoryStyle(subcategoryName).color;
  var members = (state.settings.categories||[]).filter(function(c){ return categoryGroupOf(c)===groupName; });
  var idx = Math.max(0, members.indexOf(subcategoryName));
  var count = Math.max(1, members.length);
  var base = categoryGroupStyle(groupName).color;
  if (count === 1) return base;
  var hsl = hexToHsl(base);
  var span = Math.min(30, 12 + count*3);
  var low = Math.max(20, hsl[2] - span/2);
  var high = Math.min(80, hsl[2] + span/2);
  if (high-low < 12) { low=Math.max(14,hsl[2]-8); high=Math.min(86,hsl[2]+8); }

function categoryGroupIconCircle(groupName) {

}
function renameCategoryGroup(oldName, newName) {
  newName = (newName||"").trim();
  if (!newName || newName === oldName) return false;
  var groups = (state.settings.categoryGroups||[]).slice();
  if (groups.indexOf(newName) !== -1) return false;
  var idx = groups.indexOf(oldName);
  if (idx < 0) return false;
  groups[idx] = newName;
  var groupOf = Object.assign({}, state.settings.categoryGroupOf||{});
  Object.keys(groupOf).forEach(function(c){ if (groupOf[c] === oldName) groupOf[c] = newName; });
  var styles = Object.assign({}, state.settings.categoryGroupStyles||{});
  if (styles[oldName]) { styles[newName] = styles[oldName]; delete styles[oldName]; }
  if (state.analysisSelectedGroup === oldName) state.analysisSelectedGroup = newName;
  if (state.budgetSelectedGroup === oldName) state.budgetSelectedGroup = newName;
  if (state.txnGroupFilter === oldName) state.txnGroupFilter = newName;
  if (state.analysisFrequencySelectedGroup === oldName) state.analysisFrequencySelectedGroup = newName;

function renderPieChart(slices, T, selectedLabel, centerLabel, centerValue, tapAction, tapDataKey) {
  var size = 240, rOuter = 104, rInner = rOuter*0.55, cx = size/2, cy = size/2;
  var total = slices.reduce(function(s,x){ return s+x.value; }, 0);
  if (total <= 0) return "";
  var angle = -Math.PI/2;
  var paths = "";
  slices.forEach(function(sl, i){
    var frac = sl.value/total;
    var sweep = frac * Math.PI * 2;
    var end = angle + sweep;
    var color = sl.color || PIE_COLORS[i % PIE_COLORS.length];
    var isSel = selectedLabel != null && sl.label === selectedLabel;
    /* Keep category/person colors exact. Selection is communicated by the
       center label and list state rather than washing the other slices out. */
    var op = '';
    var tap = (tapAction === "none") ? '' : (' class="chart-hit" data-action="'+(tapAction||"filter-analysis-category")+'" data-'+(tapDataKey||"cat")+'="'+esc(sl.label)+'"');
    var d;
    if (frac >= 0.9999) {
      // A single category holding 100%: draw the ring as outer circle minus
      // inner circle via evenodd, since there's no adjoining slice to arc against.
      d = 'M '+(cx+rOuter)+' '+cy+' A '+rOuter+' '+rOuter+' 0 1 1 '+(cx-rOuter)+' '+cy+' A '+rOuter+' '+rOuter+' 0 1 1 '+(cx+rOuter)+' '+cy+' Z'
        + ' M '+(cx+rInner)+' '+cy+' A '+rInner+' '+rInner+' 0 1 0 '+(cx-rInner)+' '+cy+' A '+rInner+' '+rInner+' 0 1 0 '+(cx+rInner)+' '+cy+' Z';
      paths += '<path d="'+d+'" fill="'+color+'" fill-rule="evenodd"'+op+tap+'/>';
    } else {
      var ox1 = cx + rOuter*Math.cos(angle), oy1 = cy + rOuter*Math.sin(angle);
      var ox2 = cx + rOuter*Math.cos(end),   oy2 = cy + rOuter*Math.sin(end);
      var ix1 = cx + rInner*Math.cos(end),   iy1 = cy + rInner*Math.sin(end);
      var ix2 = cx + rInner*Math.cos(angle), iy2 = cy + rInner*Math.sin(angle);
      var large = sweep > Math.PI ? 1 : 0;
      d = 'M '+ox1+' '+oy1+' A '+rOuter+' '+rOuter+' 0 '+large+' 1 '+ox2+' '+oy2+' L '+ix1+' '+iy1+' A '+rInner+' '+rInner+' 0 '+large+' 0 '+ix2+' '+iy2+' Z';
      paths += '<path d="'+d+'" fill="'+color+'" stroke="'+T.card+'" stroke-width="3.5" stroke-linejoin="round"'+op+tap+'/>';
    }
    angle = end;
  });
  var selSlice = selectedLabel != null ? slices.filter(function(s){ return s.label===selectedLabel; })[0] : null;
  var nameRaw = selSlice ? selSlice.label : (centerLabel || "All");
  var name = nameRaw.length > 16 ? nameRaw.slice(0,15)+"…" : nameRaw;
  var valueForCenter = selSlice ? selSlice.value : (centerValue || 0);
  var centerValueText = fmt(Math.round(valueForCenter),0)+' AED';
  /* Keep large five/six-digit totals comfortably inside the donut hole. */
  var valueFontSize = centerValueText.length >= 11 ? 15 : centerValueText.length >= 10 ? 17 : centerValueText.length >= 9 ? 19 : 22;
  var centerSvg = '<text x="'+cx+'" y="'+(cy-8)+'" font-size="15" fill="'+T.textMuted+'" text-anchor="middle">'+esc(name)+'</text>'
    + '<text x="'+cx+'" y="'+(cy+20)+'" font-size="'+valueFontSize+'" font-weight="700" fill="'+T.text+'" text-anchor="middle" font-family="var(--f-num)">'+centerValueText+'</text>';
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+paths+centerSvg+'</svg>';

/* Generic bucketed bar chart: one bar per bucket, value from getValue(), color

   without overlapping; refLine (optional) draws a labelled dashed marker, e.g.

/* Cumulative value at any index along the chart, actual portion or

function buildAnalysisForecastCard(info, cs, T, scope) {

/* Allocate the pooled fallback forecast back to the unmodeled
   subcategories that created that pace. This is for explainability only; the
   total fallback forecast remains exactly the same. */

/* Single source of truth for the forecast. Actual spend remains exact;
   deterministic plans remain exact; variable spending is forecast primarily
   as likely subcategory EVENTS (learned repeat interval × typical amount).
   New/very-frequent subcategories fall back to the robust adaptive-EWMA pace
   model, so the engine degrades gracefully when history is sparse. */

function forecastCategoryProfiles(scope, asOfDate) {
  scope=scope||"overall"; asOfDate=asOfDate||todayStr();

  var allDates=Object.keys(state.entries).sort(), first=allDates.length?allDates[0]:asOfDate;
  var natural=scope==="overall"?first:(state.settings.trackingStartDate||first);
  var floor=toStr(addDays(parseD(asOfDate),-364));
  var start=natural>floor?natural:floor, maps={};
  Object.keys(state.entries).forEach(function(ds){
    if(ds<start||ds>asOfDate) return;
    (state.entries[ds].items||[]).forEach(function(it){
      if(!expenseCountsForScope(it,scope)||it.recurringId||itemIsPlannedPeriodicCash(ds,it,periodicTimingRules)) return;
      var k=subcategoryKey(it);
      if(!maps[k]) maps[k]={daily:{},txnCount:0,timedCount:0,txnAmounts:[]};
      maps[k].daily[ds]=(maps[k].daily[ds]||0)+it.amount;
      maps[k].txnCount++;
      maps[k].txnAmounts.push(Number(it.amount)||0);
      if(it.time) maps[k].timedCount++;
    });
  });
  (state.settings.categories||[]).forEach(function(c){
    if(categoryForecastBehavior(c)==="yearly"&&!maps[c])maps[c]={daily:{},txnCount:0,timedCount:0,txnAmounts:[]};
  });
  var out={};
  Object.keys(maps).forEach(function(k){
    var m=maps[k], dates=Object.keys(m.daily).sort(), gaps=[];
    for(var i=1;i<dates.length;i++){var g=daysBetween(dates[i-1],dates[i]);if(g>0)gaps.push(g);}
    var interarrivalGap=medianNumber(gaps);
    var span=Math.max(0.001,observedExposureDays(start,asOfDate));
    
    var occurrenceGap=observedOccurrenceInterval(span,m.txnCount);
    var eventGap=observedOccurrenceInterval(span,dates.length);
    var activeRate=dates.length/span, txnRate=m.txnCount/span;

    var gapMad=interarrivalGap==null?null:medianNumber(gaps.map(function(g){return Math.abs(g-interarrivalGap);}));

    var amountDev=amountMad==null?null:amountMad*1.4826;

    /* Frequent categories are forecast from AED/day pace. Cadence categories
       are repeat-type active-day events. Everything with real history that is
       neither becomes Lumpy instead of being silently forecast at zero. */
    var autoFrequent=dates.length>=6 && (activeRate>=0.30 || txnRate>=0.55);
    var autoCadence=!autoFrequent && dates.length>=3 && eventGap!=null && eventGap>=2.0 && typicalAmount>0;
    var autoLumpy=!autoFrequent && !autoCadence && dates.length>=1 && typicalAmount>0;
    var behavior=categoryForecastBehavior(k);
    var yearlyCfg=behavior==="yearly"?yearlyBillConfigForCategory(k):null;
    var frequent=behavior==="frequent" || (behavior==="auto"&&autoFrequent);
    var monthly=behavior==="monthly" && dates.length>=1 && typicalTxnAmount>0;
    var yearly=behavior==="yearly" && yearlyCfg && yearlyCfg.amount>0;
    var cadence=behavior==="cadence" || (behavior==="auto"&&autoCadence);
    if(monthly||yearly){frequent=false;cadence=false;}
    var lumpy=behavior==="lumpy" || (behavior==="auto"&&autoLumpy);
    if(monthly||yearly||cadence||frequent)lumpy=false;

    var cadenceGapCv=(gapDev!=null&&eventGap>0)?gapDev/eventGap:null;
    var cadenceAmountCv=(amountDev!=null&&typicalAmount>0)?amountDev/typicalAmount:null;
    var timingConsistency=cadenceGapCv==null?.78:Math.max(.45,Math.min(1,1-cadenceGapCv*.28));
    var amountConsistency=cadenceAmountCv==null?.82:Math.max(.50,Math.min(1,1-cadenceAmountCv*.22));
    var confidence=evidence>=10?"High":(evidence>=5?"Medium":"Low");
    
    if(cadence){
      var nEvents=dates.length;
      if(nEvents>=8 && (cadenceGapCv==null||cadenceGapCv<=.35) && (cadenceAmountCv==null||cadenceAmountCv<=.30)) confidence="High";
      else if(nEvents>=4 && (cadenceGapCv==null||cadenceGapCv<=.55) && (cadenceAmountCv==null||cadenceAmountCv<=.45)) confidence="Medium";

function trendPeriodLabel(per, mode) {
  if (mode === 'week') {
    var a=parseD(per.startStr), b=parseD(per.endStr);
    if (a.getMonth()===b.getMonth()) return a.getDate()+'–'+b.getDate()+' '+b.toLocaleDateString('en-GB',{month:'short'});
    return a.getDate()+' '+a.toLocaleDateString('en-GB',{month:'short'})+'–'+b.getDate()+' '+b.toLocaleDateString('en-GB',{month:'short'});
  }
  if (mode === 'year') return per.title;
  return parseD(per.startStr).toLocaleDateString('en-GB',{month:'short'});
}

function buildBudgetTrendCard(view, baseOffset, T) {
  var N=5,items=[];
  for(var j=-(N-1);j<=0;j++){
    var off=(baseOffset||0)+j, per=getPeriodBounds(view,off,currentWeeklyTarget(),dailyAllowance());
    if(view==="year"&&state.settings.trackingStartDate&&per.endStr<state.settings.trackingStartDate)continue;
    var st=periodStatsBudget(per.startStr,per.endStr);
    var isLive=off===0 && per.endStr>=todayStr(), projected=st.spent;
    var trendTarget=per.target;
    if(isLive){var ei=currentEffectiveBudgetInfo();trendTarget=effectiveBudgetTargetForRange(per.startStr,per.endStr,ei);}
    if(isLive&&st.rows.length){var start=effectiveRangeStart(per.startStr),days=daysBetween(start,per.endStr)+1,fc=computeForecastNumbers(st.rows,days,start,'budget');if(fc)projected=fc.projectedSpend;}
    var status=(st.spent>trendTarget)?'rust':(isLive&&projected>trendTarget?'amber':'positive');
    items.push({label:trendPeriodLabel(per,view),actual:st.spent,displayTotal:isLive?projected:st.spent,target:trendTarget,status:status,current:isLive});
  }
  var cur=items[items.length-1], diff=round2(cur.target-cur.displayTotal), statusText=cur.status==='rust'?'Over budget':cur.status==='amber'?'Trending over':'On track';

  s+='<div class="row between" style="margin-top:10px;"><span class="muted subhead">'+(cur.current?'Projected close':'Closed at')+'</span><span class="mono subhead" style="font-weight:600;">'+fmt(cur.displayTotal,0)+' AED</span></div>';
  s+='<div class="row between" style="margin-top:6px;"><span class="muted subhead">'+(cur.current?'Effective budget':'Budget')+'</span><span class="mono subhead">'+fmt(cur.target,0)+' AED</span></div>';
  s+='<div class="row between" style="margin-top:6px;"><span class="muted subhead">'+(diff>=0?'Projected saving':'Projected over')+'</span><span class="mono subhead" style="font-weight:600;color:'+(diff>=0?'var(--positive)':'var(--rust)')+';">'+fmt(Math.abs(diff),0)+' AED</span></div>';
  s+='<div id="budgetTrendChartWrap" class="chart-shell" style="position:relative;margin-top:10px;padding:4px 4px 0;"><div id="budgetTrendChartTip" class="footnote" style="position:absolute;top:0;left:0;background:var(--fill);border-radius:9px;padding:6px 9px;max-width:260px;opacity:0;pointer-events:none;z-index:3;box-shadow:0 3px 10px rgba(0,0,0,.2);"></div>'+renderBudgetTrendChart(items,T)+'</div>';
  s+='<div class="row" style="gap:12px;justify-content:center;flex-wrap:wrap;margin-top:4px;"><span class="caption" style="color:var(--positive);">● On track</span><span class="caption" style="color:var(--amber);">● Trending over</span><span class="caption" style="color:var(--rust);">● Over budget</span></div></div>';

/* Analysis cash-balance line. There is one absolute cash timeline:
   Starting cash balance at Tracking Start + logged income - logged expenses.
   The 30-day option is only a zoom window and carries the earlier balance
   forward instead of restarting the chart at zero. */
function renderCashBalanceLineChart(rows, info, T) {
  if (!rows || !rows.length) return "";
  var w=340,h=205,padL=42,padR=8,padT=14,padB=24,plotW=w-padL-padR,plotH=h-padT-padB;
  var totalDays=Math.max(1, daysBetween(info.start, info.end)+1);
  var acc=round2(Number(info.openingBalance)||0), pts=[];
  rows.forEach(function(r){
    var dayNet=round2((Number(r.income)||0)-(Number(r.spent)||0));
    acc=round2(acc + dayNet);
    var dayIndex=Math.max(0, daysBetween(info.start, r.date));
    pts.push({date:r.date,label:shortLabel(r.date),balance:acc,dayNet:dayNet,idx:dayIndex});
  });
  if (!pts.length) return "";
  var vals=pts.map(function(p){return p.balance;}).concat([Number(info.openingBalance)||0]);
  var rawMin=Math.min.apply(null,vals),rawMax=Math.max.apply(null,vals);
  var min=rawMin<0?rawMin:0, max=Math.max(0,rawMax);
  if (max===min) { max=min+1; }
  var margin=(max-min)*0.08;
  max+=margin;
  if(min<0) min-=margin*0.25;
  function xIdx(i){ return padL + (totalDays<=1 ? plotW/2 : (i/(totalDays-1))*plotW); }
  function y(v){ return padT + plotH - ((v-min)/(max-min))*plotH; }
  function tick(v){ var a=Math.abs(v); return a>=1000 ? ((v/1000).toFixed(a>=10000?0:1)+"K") : fmt(Math.round(v),0); }
  var grid="";
  [0,.25,.5,.75,1].forEach(function(fr){
    var v=min+(max-min)*fr, yy=y(v),isZero=Math.abs(v)<Math.max(1,(max-min)*.005);
    grid+='<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+yy+'" y2="'+yy+'" stroke="'+(isZero?T.textMuted:T.hairline)+'" stroke-opacity="'+(isZero?'.65':'.72')+'" stroke-width="'+(isZero?'1.2':'1')+'" stroke-dasharray="'+(isZero?'':'3,4')+'"/>';
    grid+='<text x="'+(padL-5)+'" y="'+(yy+3)+'" font-size="8" fill="'+T.textMuted+'" text-anchor="end">'+tick(v)+'</text>';
  });
  if (min<0 && max>0) grid+='<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="'+T.textMuted+'" stroke-opacity=".65" stroke-width="1.2"/>';
  var xy=pts.map(function(p){return[xIdx(p.idx),y(p.balance)];});
  var curveD=xy.length>=2?smoothPathD(xy):"";
  var baselineY=y(0);
  var areaD=xy.length>=2?(curveD+' L '+xy[xy.length-1][0]+','+baselineY+' L '+xy[0][0]+','+baselineY+' Z'):"";
  var lineColor=acc>=0?T.positive:T.rust;
  var line="";
  if (xy.length>=2) line='<path d="'+areaD+'" fill="url(#cashAreaGrad)" stroke="none"/><path d="'+curveD+'" fill="none" stroke="'+lineColor+'" stroke-width="2.65" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+xy[xy.length-1][0]+'" cy="'+xy[xy.length-1][1]+'" r="3.8" fill="'+lineColor+'" stroke="'+T.card+'" stroke-width="2"/>';
  else line='<circle cx="'+xy[0][0]+'" cy="'+xy[0][1]+'" r="4" fill="'+lineColor+'"/>';
  var axis="",labelCount=Math.min(5,totalDays),seen={};
  for(var i=0;i<labelCount;i++){
    var idx=labelCount===1?0:Math.round((i/(labelCount-1))*(totalDays-1));
    if(seen[idx])continue;seen[idx]=true;
    var ds=toStr(addDays(parseD(info.start),idx));
    axis+='<text x="'+xIdx(idx)+'" y="'+(h-5)+'" font-size="8" fill="'+T.textMuted+'" text-anchor="'+(idx===0?'start':(idx===totalDays-1?'end':'middle'))+'">'+esc(shortLabel(ds))+'</text>';
  }
  var todayMark="";
  if(info.start<=todayStr() && todayStr()<=info.end){
    var ti=daysBetween(info.start,todayStr()),tx=xIdx(ti);
    todayMark='<line x1="'+tx+'" x2="'+tx+'" y1="'+padT+'" y2="'+(h-padB)+'" stroke="'+T.hairline+'" stroke-dasharray="2,3"/><text x="'+tx+'" y="'+(padT+9)+'" font-size="8" fill="'+T.textMuted+'" text-anchor="middle">Today</text>';
  }
  lastCashBalanceChartData={points:pts,w:w,h:h,padL:padL,padR:padR,padT:padT,padB:padB,plotW:plotW,plotH:plotH,totalDays:totalDays,min:min,max:max,lineColor:lineColor};
  return '<svg id="cashBalanceChartSvg" viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none"><defs><linearGradient id="cashAreaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+lineColor+'" stop-opacity=".20"/><stop offset="100%" stop-color="'+lineColor+'" stop-opacity=".025"/></linearGradient></defs>'+grid+todayMark+line+axis
    +'<line id="cashBalanceCrosshair" x1="0" x2="0" y1="'+padT+'" y2="'+(h-padB)+'" stroke="'+T.text+'" stroke-width="1" stroke-dasharray="2,2" opacity="0"/>'
    +'<circle id="cashBalanceDot" r="4.5" fill="'+lineColor+'" stroke="'+T.bg+'" stroke-width="2" opacity="0"/>'
    +'<rect id="cashBalanceChartHit" x="0" y="0" width="'+w+'" height="'+h+'" fill="transparent" style="touch-action:none;"/>'
    +'</svg>';
}

function cashBalanceIndependentInfo() {
  var end=todayStr(), dates=Object.keys(state.entries||{}).sort();
  var natural=state.settings.trackingStartDate || (dates.length?dates[0]:end);
  if(natural>end) natural=end;
  var mode=state.analysisCashRange==='30d'?'30d':'tracking';
  var thirty=toStr(addDays(parseD(end),-29));
  var start=mode==='30d' ? (natural>thirty?natural:thirty) : natural;
  var starting=round2(isFinite(Number(state.settings.startingCashBalance))?Number(state.settings.startingCashBalance):0);
  var opening=starting;
  if(start>natural){
    var priorEnd=toStr(addDays(parseD(start),-1));
    opening=round2(starting + periodStatsOverall(natural,priorEnd).net);
  }
  var full=periodStatsOverall(natural,end);
  var current=round2(starting + full.net);
  return {start:start,end:end,mode:mode,title:mode==='30d'?'Last 30 days':'Since tracking',trackingStart:natural,startingBalance:starting,openingBalance:opening,currentBalance:current};
}

  s+='<div class="seg" style="width:168px;flex:0 0 168px;"><button class="seg-btn" role="tab" aria-selected="'+(info.mode==='tracking')+'" data-action="set-cash-balance-range" data-range="tracking">Since start</button><button class="seg-btn" role="tab" aria-selected="'+(info.mode==='30d')+'" data-action="set-cash-balance-range" data-range="30d">30 days</button></div></div>';

    if(isLive&&st.rows.length){var liveStart=st.rows[0].date,days=daysBetween(liveStart,per.endStr)+1,fc=computeForecastNumbers(st.rows,days,liveStart,scope);if(fc)projected=fc.projectedSpend;}
    items.push({label:trendPeriodLabel(per,info.mode),actual:st.spent,displayTotal:isLive?projected:st.spent,current:isLive});
  }

  if(cur.current&&cur.displayTotal!==cur.actual)s+='<div class="row between hairline-top" style="margin-top:12px;padding-top:10px;"><span class="muted subhead">Projected close</span><span class="mono subhead" style="font-weight:600;">'+fmt(cur.displayTotal,0)+' AED</span></div>';

/* Hover/touch scrub for the Analysis cash-balance line. Desktop users can
   simply hover; on touch screens a tap or drag selects the nearest day. */
function wireCashBalanceChart(data) {
  var svg=document.getElementById('cashBalanceChartSvg'),hit=document.getElementById('cashBalanceChartHit'),cross=document.getElementById('cashBalanceCrosshair'),dot=document.getElementById('cashBalanceDot'),tip=document.getElementById('cashBalanceChartTip');
  if(!svg||!hit||!cross||!dot||!tip||!data||!data.points||!data.points.length)return;
  function xFor(p){return data.padL+(data.totalDays<=1?data.plotW/2:(p.idx/(data.totalDays-1))*data.plotW);}
  function yFor(v){return data.padT+data.plotH-((v-data.min)/(data.max-data.min))*data.plotH;}
  function nearest(clientX){
    var r=svg.getBoundingClientRect(); if(!r.width)return 0;
    var frac=Math.max(0,Math.min(1,(clientX-r.left)/r.width)),vbX=frac*data.w,best=0,bestD=Infinity;
    data.points.forEach(function(p,i){var d=Math.abs(xFor(p)-vbX);if(d<bestD){bestD=d;best=i;}}); return best;
  }
  function show(i){
    var p=data.points[i],x=xFor(p),y=yFor(p.balance),date=parseD(p.date).toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'});
    cross.setAttribute('x1',x);cross.setAttribute('x2',x);cross.setAttribute('opacity','1');
    dot.setAttribute('cx',x);dot.setAttribute('cy',y);dot.setAttribute('opacity','1');
    tip.innerHTML='<span class="mono" style="font-weight:700;">'+(p.balance<0?'−':'')+fmt(Math.abs(p.balance),2)+' AED</span><span class="muted"> · '+esc(date)+'</span>';
    positionChartTooltip(tip,svg,x,data.w);tip.style.opacity='1';
  }
  function hide(){cross.setAttribute('opacity','0');dot.setAttribute('opacity','0');tip.style.opacity='0';}
  function move(x){show(nearest(x));}
  hit.addEventListener('mousemove',function(e){move(e.clientX);});
  hit.addEventListener('mouseenter',function(e){move(e.clientX);});
  hit.addEventListener('mouseleave',hide);
  hit.addEventListener('touchstart',function(e){move(e.touches[0].clientX);},{passive:true});
  hit.addEventListener('touchmove',function(e){move(e.touches[0].clientX);e.preventDefault();},{passive:false});
  hit.addEventListener('touchcancel',hide);
}

/* Shared hover/touch interaction for the Budget and Overall spend-trend bars.
   A vertical guide selects the nearest period and the tooltip reports the
   values that matter for that chart. */
function wirePeriodTrendChart(kind,data){
  var prefix=kind==='budget'?'budgetTrend':'overallTrend';

/* Resolves the Analysis page's selected period. week/month/year are navigable
   via analysisOffset (0 = current, -1 = previous, …), reusing getPeriodBounds so

/* Same shape as getAnalysisPeriodInfo, for the Transactions page's filter —
   kept separate since Transactions also offers "all time" (a real list of
   everything ever logged), which doesn't make sense for Analysis's charts. */
function getTxnPeriodInfo() {
  var today = todayStr();

  var off = state.txnOffset || 0;
  var entryDatesAll = Object.keys(state.entries).sort();
  var naturalStart = entryDatesAll.length ? entryDatesAll[0] : today;
  if (mode === "all") {
    var latestEntryDate = entryDatesAll.length ? entryDatesAll[entryDatesAll.length-1] : today;
    var endAll = latestEntryDate > today ? latestEntryDate : today;
    return { start: naturalStart, end: endAll, title: "All time", sub: "", isCurrent: true, mode: mode };
  }
  if (mode === "last7" || mode === "last30") {
    /* Rolling diagnostic windows deliberately use completed days only so the
       Transactions page can audit the same 7/30-day averages shown on Home. */
    var days = mode === "last7" ? 7 : 30;
    var endRolling = toStr(addDays(parseD(today), -1));

    return { start:startRolling, end:endRolling, title:shortLabel(startRolling)+" – "+shortLabel(endRolling), sub:"Last "+days+" completed days", isCurrent:true, mode:mode };
  }

    var to = state.txnPeriodTo || today;

    return { start: from, end: to, title: shortLabel(from)+" – "+shortLabel(to), sub: "Custom range", isCurrent: true, mode: mode };
  }

function getAnalysisPeriodInfo() {

/* Week/month are short enough to read day-by-day; a year would be 365 bars, so
   it rolls up to months. Custom ranges switch over at roughly two months. */
function analysisGranularity(info) {
  if (info.mode === "year") return "month";
  if (info.mode === "custom") return daysBetween(info.start, info.end) > 62 ? "month" : "day";
  return "day";
}

/* Collapses periodStats rows into chart buckets at the chosen granularity.
   Monthly buckets sum both spend and allowance, so a bucket's own target stays
   correct even when months differ in length. */
/* Whether a transaction item counts as belonging to a given person filter
   value — matches either the single-person field or, for a percentage
   split, anyone included in it (even at a partial share). Shared by the
   Transactions page filter and Analysis's person breakdown so the two
   pages can't define "belongs to this person" differently. Accepts either
   sentinel spelling for the "no one assigned" bucket, since Transactions'
   dropdown uses "__unassigned__" while Analysis's pie slice is labelled
   "Unassigned". */
function itemMatchesPersonFilter(it, filterValue) {
  if (!filterValue) return true;
  if (filterValue === "__unassigned__" || filterValue === "Unassigned") {
    return !it.person && (!it.personSplit || !it.personSplit.length);
  }
  if (it.personSplit && it.personSplit.length) return it.personSplit.some(function(ps){ return ps.person===filterValue; });
  return it.person === filterValue;
}

/* Whether an item falls within the current category-level scope: a specific
   leaf category filter wins if set (most specific); otherwise a drilled-into
   group applies (browsing "Food & Drinks" without having picked one of its
   categories yet still narrows to that group); otherwise unscoped. Shared by
   every section that reads the page's "current category scope" — the bar
   charts, day-of-week, biggest transactions, and the person breakdown's own
   aggregation — so drilling into a group filters the whole page the same
   way picking a specific category already does, not just the category
   section's own pie. */
function itemMatchesCategoryScope(it, catFilter, groupFilter) {
  if (catFilter) return (it.category || "Uncategorised") === catFilter;
  if (groupFilter === "Ungrouped") return !categoryGroupOf(it.category);
  if (groupFilter) return categoryGroupOf(it.category) === groupFilter;
  return true;
}

/* One definition of an expense that belongs in Analysis for the active basis.
   Budget mode excludes categories explicitly marked outside the budget; income
   mode is cash-flow oriented and therefore includes every real expense. */
function itemCountsForAnalysis(it) { return isExpenseItem(it); }

/* The amount to attribute to the current person-filter scope for a given
   item. A person filter matching a split transaction only means that person
   holds SOME share of it — every sum built on top of that boolean match was
   adding the item's FULL amount regardless of share, so a 100 AED purchase
   split 30/70 was counted as a full 100 AED for BOTH people, inflating any
   person-filtered total by everyone else's share too. This returns the
   correct prorated amount: the person's own share when the item is split,
   the full amount for an unsplit item (nothing to prorate), and the full
   amount when there's no active person filter at all (nothing to scope by). */
function personScopedAmount(it, personFilter) {
  if (!personFilter || !it.personSplit || !it.personSplit.length) return it.amount;
  return it.personSplit
    .filter(function(ps){ return ps.person === personFilter; })
    .reduce(function(t,ps){ return t + round2(it.amount * ps.pct/100); }, 0);
}

function buildAnalysisBuckets(rows, granularity, catFilter, personFilter, groupFilter) {

  }

    });

/* Total already logged by a rule so far — summed per-occurrence rather than
   multiplied, since a split's final day carries a different (remainder)
   amount than the rest. */
function ruleLoggedAmount(rule) {
  var sum = 0;
  for (var i=0; i<(rule.occurrencesLogged||0); i++) sum += ruleOccurrenceAmount(rule, i);
  return round2(sum);
}

function recurringNormalizedPreviewText(amountShown,frequency){
  var shown=Number(amountShown), base=isFinite(shown)?Math.max(0,fromReporting(shown)):0;
  if(!(base>0))return "Cash is recorded on the real due date; affordability is normalized automatically.";
  var rule={amount:base,frequency:frequency||"monthly",entryKind:"expense"}, monthly=monthlyEquivalentForRecurringRule(rule);
  if(frequency==="quarterly"||frequency==="semiannual"||frequency==="yearly")return "≈ "+fmt(toReporting(monthly),0)+" "+reportingCurrency()+"/month for affordability · cash only on the real due date";
  return "≈ "+fmt(toReporting(monthly),0)+" "+reportingCurrency()+"/month normalized";
}

function renderPlansBody() {
  var rules = state.settings.recurringRules || [];
  var today = todayStr();
  var horizon = toStr(addDays(parseD(today), 30));
  var activeRules = rules.filter(function(r){ return !ruleIsComplete(r) && r.active; });
  var pausedRules = rules.filter(function(r){ return !ruleIsComplete(r) && !r.active; });
  var doneRules = rules.filter(function(r){ return ruleIsComplete(r); });

  function nextOccurrence(rule) {
    if (!rule.active || ruleIsComplete(rule)) return null;
    var n = rule.occurrencesLogged || 0;
    if (rule.occurrencesTotal != null && n >= rule.occurrencesTotal) return null;
    var due = recurringOccurrenceDate(rule, n);
    if (rule.endDate && due > rule.endDate) return null;
    return { rule:rule, due:due, amount:ruleOccurrenceAmount(rule,n) };
  }
  function next30Totals() {
    var expense=0, income=0;
    activeRules.forEach(function(rule){
      var n=rule.occurrencesLogged||0, guard=0;
      while(guard<60) {
        if(rule.occurrencesTotal!=null && n>=rule.occurrencesTotal) break;
        var due=recurringOccurrenceDate(rule,n);
        if(due>horizon || (rule.endDate && due>rule.endDate)) break;
        if(due>=today) {
          var amt=ruleOccurrenceAmount(rule,n);
          if(rule.entryKind==='income') income+=amt; else expense+=amt;
        }
        n++; guard++;
      }
    });
    return {expense:round2(expense),income:round2(income)};
  }
  function relativeDue(ds) {
    var n=daysBetween(today,ds);
    if(n===0) return 'Today';
    if(n===1) return 'Tomorrow';
    if(n<7) return parseD(ds).toLocaleDateString('en-GB',{weekday:'long'});
    return shortLabel(ds);
  }
  function planName(rule) { return rule.note || rule.category || (rule.paymentPlanType==='tabby'?'Tabby purchase':(rule.kind==='split'?'Spread cost':(rule.entryKind==='income'?'Recurring income':'Recurring expense'))); }
  function planMeta(rule) {
    var bits=[];
    if(rule.paymentPlanType==='tabby') bits.push('Tabby · 4 monthly payments');
    else if(rule.kind==='split') bits.push('Legacy spread · '+rule.occurrencesTotal+' days');
    else bits.push(recurringFrequencyLabel(rule.frequency));
    if(rule.category) {
      var parent=categoryGroupOf(rule.category);
      bits.push(parent ? parent+' · '+rule.category : rule.category);
    }

/* ---------------- actions ---------------- */
function handleAddTransaction() {
  var dateEl = document.getElementById("entryDateInput");
  var amtEl = document.getElementById("entryAmountInput");
  var noteEl = document.getElementById("entryNoteInput");
  var catEl = document.getElementById("entryCategoryInput");
  var date = dateEl ? dateEl.value : todayStr();
  var timeEl = document.getElementById("entryTimeInput");
  var txnTime = timeEl ? timeEl.value : "";
  var originalAmt = parseFloat(amtEl ? amtEl.value : "");
  if (isNaN(originalAmt) || !(originalAmt > 0) || !date) { showToast("Enter an amount greater than zero"); return; }
  var currencyEl = document.getElementById("entryCurrencyInput");
  var fxRateEl = document.getElementById("entryFxRateInput");
  var fxSourceEl = document.getElementById("entryFxSourceInput");
  var currency = currencyEl ? (currencyEl.value||reportingCurrency()) : reportingCurrency();
  var displayFxRate = currency===reportingCurrency() ? 1 : parseFloat(fxRateEl ? fxRateEl.value : "");
  if (currency!==reportingCurrency() && (!(displayFxRate>0))) { showToast("Add or refresh the exchange rate"); return; }
  /* The form rate is source → reporting currency. Convert that result back to
     the internal AED ledger so changing base currency never mutates history. */
  var reportAmount = currency===reportingCurrency() ? originalAmt : originalAmt*displayFxRate;
  var amt = round2(fromReporting(reportAmount));
  var canonicalFxRate = currency===STORAGE_CURRENCY ? 1 : (amt/originalAmt);
  var fxSource = currency===reportingCurrency() ? "Base currency" : ((fxSourceEl&&fxSourceEl.value)||"Manual");
  var fxMeta = currency===STORAGE_CURRENCY ? { currency:STORAGE_CURRENCY } : { currency:currency, originalAmount:originalAmt, fxRate:canonicalFxRate, fxSource:fxSource, fxDate:date };
  var note = noteEl ? noteEl.value.trim() : "";
  var category = catEl ? catEl.value : "";

  var person = "";
  var personSplit = null;
  var peopleForSave = state.settings.people||[];
  var personSplitModeActive = peopleForSave.length >= 2 && state.txnPersonSplitMode === "split";
  if (personSplitModeActive) {
    var pctSelects = document.querySelectorAll(".split-person-pct");
    var splitEntries = [];
    var totalPct = 0;
    pctSelects.forEach(function(s){
      var pct = parseInt(s.value,10)||0;
      totalPct += pct;
      if (pct > 0) splitEntries.push({ person: s.dataset.person, pct: pct });
    });
    if (totalPct !== 100) { showToast("Split must add up to 100%"); return; }
    personSplit = splitEntries;
  } else {
    var personEl = document.getElementById("entryPersonInput");
    person = personEl ? personEl.value : "";
  }
  var wasEditing = !!(state.editingItemId && state.editingOriginalDate);
  var origItemForKind = null;
  if (wasEditing) {
    var origDayForKind = state.entries[state.editingOriginalDate];
    if (origDayForKind) origItemForKind = origDayForKind.items.find(function(i){ return i.id === state.editingItemId; }) || null;
  }
  var kind = state.txnKind != null ? state.txnKind : (origItemForKind && origItemForKind.kind==="income" ? "income" : "expense");
  var tags = state.entryTagsDraft != null ? normalizeItemTags(state.entryTagsDraft) : normalizeItemTags(origItemForKind && origItemForKind.tags);
  if (kind === "income") category = ""; // income doesn't use the expense category system

  if (!wasEditing && state.txnSplitMode === "tabby" && kind === "expense") {
    if(!(amt>0)){ showToast("Enter the full Tabby purchase amount"); return; }
    handleAddTabbyTransaction(date, amt, category, note, person, personSplit, fxMeta, tags);
    return;
  }

  var txnCloseVisual = captureTxnVisual();
  var nextEntries = Object.assign({}, state.entries);

  if (wasEditing) {
    var origDate = state.editingOriginalDate;
    var origDay = nextEntries[origDate];
    if (origDay) {
      var remaining = origDay.items.filter(function(i){ return i.id !== state.editingItemId; });
      if (remaining.length === 0) delete nextEntries[origDate];
      else nextEntries[origDate] = Object.assign({}, origDay, { items: remaining });
    }
    /* Preserve recurringId/seq metadata when editing an occurrence so deleting
       its plan later can still find and remove that occurrence. */
    var updatedItem = Object.assign({}, origItemForKind || {}, fxMeta, { id: state.editingItemId, amount: amt, note: note, category: category, person: person, personSplit: personSplit, kind: kind, time: txnTime||undefined, tags:tags });
    if(!txnTime) delete updatedItem.time;
    if(!tags.length) delete updatedItem.tags;
    if (currency===STORAGE_CURRENCY) { delete updatedItem.originalAmount; delete updatedItem.fxRate; delete updatedItem.fxDate; updatedItem.fxSource="Base currency"; }
    var destDay = nextEntries[date];
    var nextDest = destDay ? Object.assign({}, destDay, { items: destDay.items.concat([updatedItem]) }) : { allowance: allowanceForDate(date), items: [updatedItem] };
    nextEntries[date] = nextDest;
    state.editingItemId = null;
    state.editingOriginalDate = null;
    state.showAddTxn = false;
    state.txnEntryRestoreScroll = true;
  } else {
    var existing = nextEntries[date];
    var newItem = Object.assign({ id: Date.now()+"-"+Math.random().toString(36).slice(2,7), amount: amt, note: note, category: category, person: person, personSplit: personSplit, kind: kind, time: txnTime||undefined, tags:tags }, fxMeta);
    if(!txnTime) delete newItem.time;
    if(!tags.length) delete newItem.tags;
    nextEntries[date] = existing ? Object.assign({}, existing, { items: existing.items.concat([newItem]) }) : { allowance: allowanceForDate(date), items: [newItem] };
    state.showAddTxn = false;
    state.txnEntryRestoreScroll = true;
  }

  state.entryDate = date;
  state.entryTagsDraft = null;
  persistAll(state.settings, nextEntries, "your entry");
  showToast(wasEditing ? "Record updated" : "Record added");
  render();
  animateTxnCommittedBack(txnCloseVisual);
}

function handleAddTabbyTransaction(startDate, totalAmount, category, note, person, personSplit, fxMeta, tags) {
  var txnCloseVisual = captureTxnVisual();
  var count=4, perPaymentFloor=Math.floor((totalAmount/count)*100)/100;
  var newRule={
    id:Date.now()+"-"+Math.random().toString(36).slice(2,7),
    kind:"recurring", paymentPlanType:"tabby", entryKind:"expense",
    amount:perPaymentFloor, splitTotal:round2(totalAmount),
    category:category, note:note, person:person||"", personSplit:personSplit||null,
    tags:normalizeItemTags(tags), frequency:"monthly", startDate:startDate,
    endDate:null, occurrencesTotal:count, occurrencesLogged:0, active:true,
    currency:fxMeta&&fxMeta.currency?fxMeta.currency:BASE_CURRENCY,
    fxRate:fxMeta&&fxMeta.fxRate?fxMeta.fxRate:undefined,
    fxSource:fxMeta&&fxMeta.fxSource?fxMeta.fxSource:undefined,
    fxDate:fxMeta&&fxMeta.fxDate?fxMeta.fxDate:undefined
  };
  state.settings=Object.assign({},state.settings,{recurringRules:(state.settings.recurringRules||[]).concat([newRule])});
  runRecurringCatchUp();
  state.entryDate=startDate;
  state.showAddTxn=false;
  state.txnEntryRestoreScroll=true;
  state.txnSplitMode="single";
  state.txnKind=null;
  state.entryTagsDraft=null;
  persistAll(state.settings,state.entries,"your Tabby plan");
  showToast("Tabby · 4 monthly payments created");
  render();
  animateTxnCommittedBack(txnCloseVisual);
}

/* Legacy compatibility only: spreads one total across N consecutive days running FORWARD from the chosen
   date, as a tracked plan rather than a pile of pre-written entries. Days that
   have already passed get logged immediately by the shared catch-up engine;
   days still to come are logged as each arrives — which is what makes "how
   much is left / what's coming up" answerable at all. Per-day share is
   floor-rounded with the final day absorbing the leftover cents, so the days
   read evenly while the total stays exact. */

/* Mirrors handleApplyBudget: "future" appends a history entry from the start of
   this month so earlier months stay judged against what they actually had;
   "all" collapses history to a single entry. */

function handleApplyBudget(scope) {
  var el = document.getElementById("monthlyDraftInput");
  var vShown = el ? parseFloat(el.value) : NaN;
  if (isNaN(vShown) || vShown <= 0) return;
  var v = fromReporting(vShown);
  var month = getPeriodBounds("month", 0, currentWeeklyTarget(), dailyAllowance());
  var hist = (state.settings.monthlyBudgetHistory || []).slice();
  var nextEntries = Object.assign({}, state.entries);
  var label;

  function rewriteLoggedFrom(fromStr, toStr_) {
    Object.keys(nextEntries).forEach(function(d){
      if (d >= fromStr && (!toStr_ || d <= toStr_)) {
        nextEntries[d] = Object.assign({}, nextEntries[d], { allowance: v / daysInMonth(parseD(d)) });
      }
    });
  }

  if (scope === "all") {
    hist = [{ from:"1900-01-01", monthlyBudget:v }];
    rewriteLoggedFrom("1900-01-01", null);
    label = "Monthly budget applied to all periods";
  } else {

function validateBackupEntries(entries) {
  if (!entries || typeof entries !== "object" || Array.isArray(entries)) return false;
  var dates = Object.keys(entries);
  for (var d=0; d<dates.length; d++) {
    var ds = dates[d];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(ds)) return false;
    var day = entries[ds];
    if (!day || typeof day !== "object" || Array.isArray(day)) return false;
    /* Legacy backups stored one numeric `spent` value instead of item rows. */
    if (!Array.isArray(day.items)) {
      if (typeof day.spent !== "number" || !isFinite(day.spent) || day.spent < 0) return false;
      continue;
    }
    for (var i=0; i<day.items.length; i++) {
      var it = day.items[i];
      if (!it || typeof it !== "object" || Array.isArray(it)) return false;
      if (typeof it.amount !== "number" || !isFinite(it.amount) || it.amount < 0) return false;
      if (it.personSplit != null) {
        if (!Array.isArray(it.personSplit)) return false;
        var pctTotal = 0;
        for (var j=0; j<it.personSplit.length; j++) {
          var ps = it.personSplit[j];
          if (!ps || typeof ps.person !== "string" || typeof ps.pct !== "number" || !isFinite(ps.pct) || ps.pct < 0 || ps.pct > 100) return false;
          pctTotal += ps.pct;
        }
        if (it.personSplit.length && Math.abs(pctTotal - 100) > 0.001) return false;
      }
    }
  }
  return true;
}

    var nextEntries = migrateEntries(parsed.entries||{}, restoreFallback);
